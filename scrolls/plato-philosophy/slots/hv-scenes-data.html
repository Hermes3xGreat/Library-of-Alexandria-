rus’s ancient god; Pausanias’s two Loves; the doctor’s cosmic harmony.", "st": "178a"}, {"r": "189a–197e", "t": "Aristophanes and Agathon", "w": "the couches", "s": "The split spheres seeking their halves; the poet’s gorgeous, empty praise.", "st": "189a"}, {"r": "198a–212c", "t": "Diotima", "w": "the couches", "s": "Love as the between; the ladder from one beautiful body to Beauty itself.", "st": "198a"}, {"r": "212d–end", "t": "Alcibiades", "w": "the doors burst open", "s": "Drunk, garlanded, truthful: the praise of Socrates — the satyr full of golden images.", "st": "215a"}], "rep": [{"r": "I", "t": "What is justice?", "w": "the Piraeus, Cephalus’s house", "s": "Old age, debts repaid — and Thrasymachus’s wolf-argument: justice is the stronger’s advantage.", "st": "327a"}, {"r": "II", "t": "The challenge", "w": "the house", "s": "Gyges’s ring; the perfectly unjust man; the city founded in speech to see justice writ large.", "st": "357a"}, {"r": "III", "t": "The guardians’ education", "w": "the city in speech", "s": "Purged poetry, right music and gymnastic; the noble lie and the metals.", "st": "386a"}, {"r": "IV", "t": "Justice found", "w": "the city in speech", "s": "Three parts of city and soul; justice as each doing its own.", "st": "427c"}, {"r": "V", "t": "The three waves", "w": "the city in speech", "s": "Women guardians, the community of families — and the greatest wave: philosopher kings.", "st": "449a"}, {"r": "VI", "t": "The philosopher and the Good", "w": "the city in speech", "s": "The ship of state; the divided line; the Good beyond being.", "st": "471c"}, {"r": "VII", "t": "The cave", "w": "the city in speech", "s": "The prisoners, the ascent, the return — and the education that turns the soul around.", "st": "514a"}, {"r": "VIII", "t": "The declining regimes", "w": "the city in speech", "s": "Timocracy to oligarchy to democracy to the tyrant’s birth from excess of freedom.", "st": "543c"}, {"r": "IX", "t": "The tyrant’s soul", "w": "the city in spe
