<script id="hv-changelog" type="application/json">[{"version":"5.22","date":"November 2026","items":[{"t":"On the website every work’s page now carries the whole text, with a contents list and links to the author’s other works"}]},{"version":"5.21","date":"November 2026","items":[{"t":"The Egyptian Book of the Dead, the Chapters of Coming Forth by Day, in the translation of Renouf and Naville (1904), with 264 vignettes from the papyri of Ani, Hunefer and others set at the head of their chapters, a colour Weighing of the Heart, and the hieroglyphs in the notes","keys":["book-of-the-dead"]}]},{"version":"5.20z","date":"November 2026","items":[{"t":"When a guide asks for one book or one life out of a longer work, the step now opens that part on its own, with a button for the whole work: Republic Book VII in the Liberal Arts guide, Plutarch’s Lives one at a time in History"}]},{"version":"5.20x","date":"November 2026","items":[{"t":"Super Philosophy Smack Down 0.30: a Survival mode (one life, one round a bout, your health carries over), a results screen that fits a phone, and a Main Menu button after every match"},{"t":"An author’s shelf opens with a round back button at the top left"},{"t":"On the website, Smack Down moves to the top row of links and the Downloads tab is gone: the Install menu has the apps and the whole library in one zip"}]},{"version":"5.20v","date":"November 2026","items":[{"t":"Pictures for the liberal arts texts: six diagrams of the tetrachord and its genera in Aristoxenus, a chart of the letters in Dionysius Thrax, and in Donatus the Tower of Knowledge woodcut with the declensions and the verb lego set out as tables","keys":["aristoxenus-harmonics","dionysius-thrax-grammar","donatus-ars-minor"]},{"t":"The Seven Liberal Arts guide opens with the Tower of Knowledge woodcut"}]},{"version":"5.20u","date":"November 2026","items":[{"t":"Three schoolbooks of antiquity: Aristoxenus’ Elements of Harmony, the Art of Grammar of Dionysius Thrax, and Donatus’ Ars Minor with its Latin","keys":["aristoxenus-harmonics","dionysius-thrax-grammar","donatus-ars-minor"]}]},{"version":"5.20p","date":"November 2026","items":[{"t":"Demosthenes complete: Against Meidias and the other speeches 21–26, the private orations, the Funeral Speech, the Exordia and the Letters; and Isocrates complete with Evagoras, Helen, Busiris and the Letters — all with the Greek","keys":["demosthenes-orations-2","demosthenes-private-1","demosthenes-private-2","demosthenes-private-3","demosthenes-minor","isocrates-orations-3"]}]},{"version":"5.20o","date":"November 2026","items":[{"t":"New orators: Lysias’ thirty-four speeches, Demosthenes (the Olynthiacs, the Philippics, On the Crown, On the False Embassy), Aeschines, and six more speeches of Isocrates — each with its Greek","keys":["lysias-speeches","isocrates-orations-1","isocrates-orations-2","demosthenes-orations-1","demosthenes-crown","demosthenes-embassy","aeschines-speeches"]},{"t":"New Roman historians: Caesar’s Gallic War and Civil War, Sallust’s Catiline and Jugurtha, Appian’s Roman History and Civil Wars, and Cassius Dio’s Roman History in nine volumes","keys":["caesar-gallic-war","caesar-civil-war","sallust-catiline","sallust-jugurtha","appian-foreign-wars-1","appian-foreign-wars-2","appian-civil-wars-1","appian-civil-wars-2","dio-roman-history-1","dio-roman-history-2","dio-roman-history-3","dio-roman-history-4","dio-roman-history-5","dio-roman-history-6","dio-roman-history-7","dio-roman-history-8","dio-roman-history-9"]},{"t":"New: Josephus complete in Whiston’s translation — the Antiquities, the Jewish War, the Life and Against Apion, with the Greek","keys":["josephus-antiquities-1","josephus-antiquities-2","josephus-antiquities-3","josephus-antiquities-4","josephus-antiquities-5","josephus-antiquities-6","josephus-war-1","josephus-war-2","josephus-war-3","josephus-life","josephus-against-apion"]},{"t":"New: Diodorus Siculus’ Historical Library in George Booth’s translation of 1700, and Strabo’s Geography in seventeen books","keys":["diodorus-library-1","diodorus-library-2","diodorus-library-3","diodorus-library-4","diodorus-library-5","diodorus-library-6","diodorus-library-7","strabo-geography-1","strabo-geography-2","strabo-geography-3","strabo-geography-4","strabo-geography-5"]},{"t":"New: Pliny the Elder’s Natural History in twelve volumes, Pliny the Younger’s Letters, and Quintilian’s Institutes of Oratory, each with its Latin","keys":["pliny-natural-history-1","pliny-natural-history-2","pliny-natural-history-3","pliny-natural-history-4","pliny-natural-history-5","pliny-natural-history-6","pliny-natural-history-7","pliny-natural-history-8","pliny-natural-history-9","pliny-natural-history-10","pliny-natural-history-11","pliny-natural-history-12","quintilian-institutes-1","quintilian-institutes-2","quintilian-institutes-3","quintilian-institutes-4","pliny-letters-1","pliny-letters-2"]}]},{"version":"5.20m","date":"November 2026","items":[{"t":"Saved, a page of its own beside Continue: every bookmark, highlight and note as a card with the passage, searchable, sorted by date, work or author; bookmark any paragraph from its ✎ menu or the selection bar; labels, notes and export to Markdown"},{"t":"Empedocles' Fragments rebuilt from Leonard's 1908 print — all 154 fragments (the old scan had lost the first sixteen and run many together) — and its audiobook re-recorded","keys":["empedocles-fragments"]},{"t":"Section breakdowns: open Explain in any work (403 of them) and the section you are in comes first — its title, a summary, the key ideas and terms — with Previous / Next and “Go to this section”"},{"t":"Explain now covers every English work, not only the Platonists"},{"t":"Encyclopedia: a timeline of every dated person, school, work and event; Back returns to exactly where you were; 592 entries lengthened"},{"t":"New in the library: Al-Farabi’s The Virtuous City, Pico della Mirandola’s Platonick Discourse upon Love, Synesius’ Essays and Hymns, and the fragments of Zeno of Citium and Cleanthes (with the Hymn to Zeus)","keys":["farabi-virtuous-city","pico-platonick-discourse","synesius-essays-hymns","zeno-fragments","cleanthes-fragments"]},{"t":"New audiobooks: Marcus Aurelius’ Meditations, Epictetus’ Discourses and Enchiridion, Boethius’ Consolation and Tractates, Epicurus’ Letters, all five works of Pseudo-Dionysius, Seneca’s Letters and Essays, Sextus Empiricus, and Xenophon’s Apology, Symposium, Memorabilia, Oeconomicus and Hiero","keys":["meditations","epictetus-enchiridion","boethius-consolation","seneca-epistles","memorabilia"]},{"t":"Corrected texts: Iamblichus’ Protrepticus chapter XXI completed; the Agesilaus and Lycurgus sayings restored to Plutarch’s Moralia; verses restored in Philo and Diogenes Laertius; stray note numbers removed from Porphyry, the Life of Pythagoras and Philo; about 80 typo fixes across the historians","keys":["iamb-protrepticus","plut-moralia-2"]},{"t":"Fixes: a Search button for the concordance; genealogy trees no longer lose the names that have entries; the Contents sheet stops listing every Stephanus page twice, and picking a place in it moves a playing recording too; Search every passage shows its results again"},{"t":"Shorter, clearer descriptions for the 94 longest work cards"}]},{"version":"5.20l","date":"October 2026","items":[{"t":"The Encyclopedia grows by 32 figures — Euripides, Thucydides, Tacitus, Sappho, Pindar, Archimedes, Galen, the Vedas and the Upanishads among them — and every library author now has an entry","keys":[]},{"t":"The app look everywhere: the library hall as a still picture under the opening scene, a top bar that scrolls away and comes back at the top, no frosted glass and no era strip, larger touch targets, and a labelled Library button in the reader"},{"t":"Continue, a page of its own beside Library: where you left off reading and listening, as cards"},{"t":"Back up everything / Restore a backup live at the foot of the notes panel"},{"t":"Audiobooks: a recording whose stream failed could play the previous book's downloaded copy; fixed"},{"t":"plato-scroll.com rebuilt as one site: a home page, a page for every work, author and Encyclopedia entry (all 644, readable without the app), the catalogue, downloads and what's new from one template","keys":[]}]},{"version":"5.20k","date":"October 2026","items":[{"t":"Tap any Greek word — in the Greek editions, under the Ω toggle, or in parallel reading — for its dictionary form, grammatical parse (Morpheus) and a short definition, with the full Liddell–Scott–Jones article a tap further; 304,000 word forms, 98.8% of every Greek word in the library, work offline","keys":["symp-e","rep-e","phdr-e"]},{"t":"The Greek Lexicon's lemma pages show the LSJ gloss and entry"}]},{"version":"5.20j","date":"October 2026","items":[{"t":"Thirty-nine more audiobooks, about 170 hours: Plutarch's Parallel Lives (all five volumes) and Moralia I; Porphyry's ten works; Proclus's Elements of Theology, commentaries, hymns and treatises, with Marinus's Life; Olympiodorus on the First Alcibiades and the Life of Plato; Alcinous, Numenius, Apuleius, Plethon; Damascius's First Principles, Simplicius on the Enchiridion, Hierocles on the Golden Verses, and the Dissertations of Maximus of Tyre — each with the words lit as they are read","keys":["plut-lives-1","proclus-eltheo","porph-abstinence","dam-principles"]}]},{"version":"5.20i","date":"October 2026","items":[{"t":"The Laws re-recorded in both translations: the Athenian Stranger now speaks with Socrates' voice (Socrates is absent from the Laws); the Epinomis likewise","keys":["laws","laws-b","epin"]},{"t":"The editors' bracketed notes and cross-references are no longer read aloud; the earlier recordings have been trimmed"}]},{"version":"5.20h","date":"October 2026","items":[{"t":"Plato's complete works in Benjamin Jowett's translation as read-along audiobooks: twenty-nine dialogues, about 65 hours, with the same cast of voices as the Horan recordings — switch translations in any dialogue and press the headphones","keys":["rep-b","symp-b","phae-b","apol-b"]},{"t":"The Audiobooks list names the translator where a dialogue is recorded in both translations"}]},{"version":"5.20g","date":"October 2026","items":[{"t":"Thirty more audiobooks: all of Cicero's philosophical works, the Iliad, the Odyssey, the Homeric Hymns, the Aeneid, Eclogues and Georgics, the Orphic Hymns and Theogony, and the fragments of Parmenides, Heraclitus, Empedocles, Xenophanes, Philolaus and Solon — about 90 hours, with the words lit as they are read","keys":["cic-republic","homer-iliad","homer-odyssey","virgil-aeneid"]},{"t":"The Encyclopedia redesigned: tabs for concepts, people, gods, myth, works, places, schools and history; entries shelved in their groups; portraits of the philosophers; a header and previous/next for every article; readable in the dark theme","keys":[]},{"t":"A new top bar on every page of the site with search, the Install menu and tabs; the home page is half as long, with an era strip to jump by; a What's new page; a Continue reading line; the main search reaches the passages of every text","keys":[]},{"t":"Faster: the site's page is a third of its old size, and the Encyclopedia loads only when it is opened","keys":[]},{"t":"Fixes: one Back leaves a book after switching translations; the concordance closes with Escape; the font-size steps return to the default; gold labels are easier to read","keys":[]}]},{"version":"5.20","date":"October 2026","items":[{"t":"Read-along audiobooks: a headphones button in the reader plays the work and lights each word as it is spoken; the page follows the voice, a tap on any passage jumps the recording there, and the next book plays on by itself","keys":[]},{"t":"Plato in David Horan's translation as a full-cast recording: a voice for every speaker, Socrates as an older man, the narrated dialogues with each character speaking his own lines","keys":["alc1","alc2"]},{"t":"Audiobooks are easy to find: an Audiobooks shelf at the top of the library, a headphones mark and length on every recorded work, and Continue listening to pick up where you stopped","keys":[]},{"t":"Save any recorded work for offline listening in the Android, iPhone and desktop apps (Contents → Save for offline); on iPhone, listening now carries on with the screen locked","keys":[]},{"t":"Aristotle's works follow, read by one voice; newly finished recordings appear in the app without an update","keys":[]}]},{"version":"5.19y","date":"October 2026","items":[{"t":"Every AI-translated work was read against its source by an independent reviewer: 299 corrections in Damascius, Nonnus, Aratus, Iamblichus, Nicomachus, Hierocles, Philolaus, Archytas, the Hermetica, Ficino, Bruno and Archimedes — mistranslations, misplaced lines, leaked workflow notes","keys":["dam-principles","nonnus-dionysiaca","aratus-phaenomena","iamb-nicomachus","iamb-dcms","nicomachus-arithmetic","hierocles-golden-verses","philolaus-fragments","archytas-fragments","hermes-asclepius","hermes-stobaeus","ficino-de-amore","bruno-infinite-universe","archimedes-sand-reckoner"]},{"t":"Plethon's Hymns translated afresh from the Greek of the 1858 Alexandre edition, line for line, with the Greek names of the gods throughout","keys":["plethon-hymns"]},{"t":"Damascius, On First Principles ch. 7: the page of Kopp's edition that had been bridged by a paraphrase is now translated; Bruno, On the Infinite Universe: the close of the fifth dialogue, which the first version had composed, is now translated from the 1888 Lagarde text","keys":["dam-principles","bruno-infinite-universe"]},{"t":"Origen's Letters now credit their translator, Frederick Crombie (1885)","keys":["origen-letters"]},{"t":"Highlights made in the corrected passages move with the text","keys":[]}]},{"version":"5.19x","date":"October 2026","items":[{"t":"Fix: in the Android app the per-book PDF and EPUB downloads did nothing. Every outside link in the phone apps (PDF, EPUB, the whole library, the downloads page, the app installers) now opens in the phone's browser, where the file downloads; the book stays open in the app","keys":[]},{"t":"iOS project: outside links open in Safari instead of doing nothing or loading inside the app","keys":[]}]},{"version":"5.19w","date":"October 2026","items":[{"t":"Every author on the library page has a wide decorative card: portrait medallion, the name in Greek or Latin, a gold frame with a meander band, and three of the works. Plato's card leads, across the whole row","keys":[]},{"t":"Authors with no known portrait show a gold coin with their name instead of a mix of scrolls, initials and symbols; their book covers keep the scroll picture","keys":[]},{"t":"Work cards match: a gold frame and meander band, the Greek title in gold, and a short description of the work under it. Plato's two reading orders (Iamblichus' curriculum, Thrasyllus' tetralogies) are framed plates","keys":[]}]},{"version":"5.19v","date":"October 2026","items":[{"t":"Threads are no longer a numbered path. Each thread now groups its passages by aspect, the question each one answers (the Forms: what they are, how things can share in them, how we come to know them, what gives them their being, how they combine), and a passage opened from the text shows which question it answers","keys":[]},{"t":"The thread index is grouped by subject: Socrates, the soul, being and knowing, virtue and the city, reading Plato","keys":[]},{"t":"Fix: the library background no longer blanks for a moment at start-up. When the 3D hall settles into a still picture, the picture is now decoded and laid over the hall before the hall is taken away; and on devices without 3D the School of Athens backdrop no longer vanishes a moment after opening","keys":[]}]},{"version":"5.19u","date":"October 2026","items":[{"t":"New thread, the divine craftsman: Phaedo 97c, Cratylus 388e (the name-maker looks to the form like the carpenter to the shuttle), Republic 596b, Sophist 265b, Statesman 269c, Timaeus 27d and 41a, Philebus 26e and Laws 902e — nine passages, each checked against the text","keys":[]}]},{"version":"5.19t","date":"October 2026","items":[{"t":"Threads: 15 paths through Plato’s dialogues — recollection, the Forms, the immortality of the soul, myths of judgment, the ascent of love, the parts of the soul, whether virtue can be taught, three cities, the last days of Socrates, the divine sign, the Iamblichean course and more — 74 passages, each checked against the text","keys":[]},{"t":"A small gold link on a passage’s reference line (beside its Stephanus number, never in the text) opens the thread: each stop in order, what the passage does, a short quotation, and a button to open it — in the same translation you are reading where there is one","keys":[]},{"t":"Fix: the persons of the dialogue were listed twice in eleven of Taylor’s translations","keys":[]}]},{"version":"5.19s","date":"October 2026","items":[{"t":"Explain now works in 56 more books: Greek tragedy (Aeschylus, Sophocles, Euripides), Homer and Hesiod, and the Roman historians (Livy, Tacitus, Suetonius)","keys":[]},{"t":"1,443 new cards (minor heroes and gods, Theban and Trojan legend, consuls, emperors, legions, Roman places and peoples) and 1,500 existing cards extended to these books, each checked for people of the same name and fact-checked by an independent reviewer; cards say how the name figures there (“In Greek tragedy”, “In Homer and Hesiod”, “In the Roman historians”)","keys":[]}]},{"version":"5.19r","date":"October 2026","items":[{"t":"Explain now works in 87 more books: Diogenes Laertius, Xenophon, the Platonist shelf (Julian, Sallustius, Alcinous, Maximus of Tyre, Apuleius, Plethon, Ficino, Pseudo-Dionysius, the Hermetica), the historians (Herodotus, Thucydides, Polybius, Arrian) and Aristotle, including his technical terms (actuality, substance, the syllogism, the mean, catharsis…)","keys":[]},{"t":"1,873 new cards and 1,700 existing cards extended to these books, each checked for people of the same name (Cyrus the Younger in the Anabasis, the Great in the Cyropaedia) and fact-checked by an independent reviewer; cards say how the name figures in each group (“In Xenophon”, “In the historians”…), the book’s own group first","keys":[]},{"t":"Bug fixes: ordinary words no longer open cards (“fortune”, “the sun”, “the king”); a long selection looks at its first 120 words instead of finding nothing; no Explain button in the Greek and Latin companions, where the cards cannot match; the card index is prepared before the first tap","keys":[]}]},{"version":"5.19q","date":"October 2026","items":[{"t":"Explain now works in Plutarch’s Parallel Lives and Moralia (all nine volumes): 1,508 new cards — Roman and Greek statesmen, generals, places, gods and institutions — and 558 existing cards extended to his books, each checked by an independent reviewer. Cards opened in Plutarch say where the name comes in his works (“In Plutarch”) first","keys":[]}]},{"version":"5.19p","date":"October 2026","items":[{"t":"Aristotle: the Bekker numbers in the 19 Greek texts were typed into the text (sometimes splitting a word); they are references at the left now, and jump-to finds them (184a, 1447b, 402b16)","keys":[]},{"t":"Explain now also works in Porphyry, Damascius and Olympiodorus: 103 new cards and 217 cards extended to their books, each checked by an independent reviewer","keys":[]},{"t":"García Bacca’s Spanish Plato: 1,734 OCR errors corrected across the 43 dialogues (his own spellings and coinages kept)","keys":[]}]},{"version":"5.19o","date":"October 2026","items":[{"t":"Explain now works in the books of Plotinus, Proclus and Iamblichus: highlight a name or a term (the One, Intellect, henads, theurgy, Syrianus…) for a card on who or what it is","keys":[]},{"t":"The Explain cards on Plato had a second, independent fact-check; 33 corrections","keys":[]},{"t":"Stephanus references inside Taylor’s long paragraphs now stand on their own line at the left, like Horan’s, at the start of a sentence","keys":[]},{"t":"Gorgias: references through the closing myth (523a–527e) in Horan, Jowett and Taylor; Rival Lovers, Hipparchus, Minos and Epinomis: section numbers that sat in the text as “[133c]” are proper references now","keys":[]},{"t":"Taylor’s Additional Notes are headed by the Stephanus place they comment on, a link to it, instead of his 1804 page; the Taylor PDFs and EPUBs were regenerated to match","keys":[]}]},{"version":"5.19n","date":"October 2026","items":[{"t":"Explain: Escape closes only the panel; a lookup closed early no longer reopens; long selections work; the panel closes when you leave the book; on wide screens the text stays usable beside it","keys":[]},{"t":"Explain: books without Stephanus places (Rival Lovers in Taylor) show the notes on the whole dialogue; About cards no longer come up for ordinary words such as “on account of” or “thou art”","keys":[]},{"t":"Highlights made in Taylor’s Plato before 5.19m stay on the same words; quotes and citations leave out the Stephanus markers","keys":[]},{"t":"Find in book finds phrases that run across a Stephanus marker","keys":[]},{"t":"Parallel view: Taylor’s Plato aligned per edition by whichever method matches better; Taylor’s Stephanus references corrected near page ends and in the Epistles","keys":[]}]},{"version":"5.19m","date":"October 2026","items":[{"t":"Thomas Taylor’s and Floyer Sydenham’s Plato now carry Stephanus references (added by aligning them with the marked editions), so jump-to, Explain and the parallel view work in them; Taylor’s 1804 page numbers are gone from the text","keys":[]},{"t":"Explain: ‹ › step through the dialogue section by section; the commentators’ own words stand out","keys":[]},{"t":"Notes & Highlights shows the words you highlighted, and highlighted text can be selected and highlighted again","keys":[]},{"t":"Find in book: every result is brought into view and highlighted","keys":[]}]},{"version":"5.19l","date":"October 2026","items":[{"t":"Explain: highlight a name, place, god or term in any Plato dialogue and an About card tells you who or what it is, where it comes up in Plato, and where else the name occurs (1,031 cards, fact-checked)","keys":[]},{"t":"On these words: notes on the exact words you highlight from Proclus, Olympiodorus, Ficino, Plutarch and Thomas Taylor, with the commentator's own sentences quoted (2,624 notes)","keys":[]},{"t":"Commentary on a passage: every mapped commentary on the stretch you select, by era, opening at the right paragraph, with a way back","keys":[]},{"t":"New: Marsilio Ficino, On Love (De amore), his commentary on the Symposium, in English with the Latin","keys":["ficino-de-amore"]},{"t":"The library's 3D background settles into a still picture after start-up, so scrolling stays smooth","keys":[]}]},{"version":"5.19k","date":"October 2026","items":[{"t":"Share a translation: in a work with more than one edition, the Share button links to the one you are reading (Jowett, Loeb, Taylor, the Greek or Latin, the Spanish), and the link opens that edition","keys":[]},{"t":"Shared links name their edition in the preview, e.g. “Republic — Plato · Greek text”","keys":[]}]},{"version":"5.19j","date":"October 2026","items":[{"t":"New: Thomas Taylor’s Works of Plato (1804) — all fifty-five dialogues and the twelve Epistles, nine of them in Floyer Sydenham’s version, with the translators’ notes — as a translation of its own (“Taylor”) in every work of Plato","keys":["alc1-g","rep-g","laws-g","epin-g","tim-g","crit-g","parm-g","soph-g","phdr-g","hippmaj-g","symp-g","tht-g","stm-g","minos-g","apol-g","crito-g","phae-g","gorg-g","phil-g","alc2-g","euth-g","meno-g","prot-g","theages-g","lach-g","lysis-g","chrm-g","hippmin-g","euthy-g","hipparch-g","rivals-g","menex-g","clit-g","ion-g","crat-g","epist-g"]},{"t":"New under Thomas Taylor: his Introductions to the dialogues (two volumes), the Additional Notes drawn from Proclus and Damasci
