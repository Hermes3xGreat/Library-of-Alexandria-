rue}},{"meta": {"key": "taylor-plato-intro","en": "Introduction to the Philosophy and Writings of Plato","kind": "treatise","gr": "","color": "#6a4a30","author": "Thomas Taylor","form": "TREATISE","pdf": "pdfs/Thomas-Taylor/Introduction-to-the-Philosophy-and-Writings-of-Plato.pdf","blurb": "Thomas Taylor’s general introduction to his 1804 Plato, laying out the Neoplatonic reading of the dialogues — the One, the gods, the soul’s descent and return — that governs his whole translation."},"text": {"title": "Introduction to the Philosophy and Writings of Plato","translator": "Thomas Taylor (1804)","noSpeakerLabels": true}},{"meta": {"key": "taylor-platonic-terms","en": "Explanation of Certain Platonic Terms","kind": "treatise","gr": "","color": "#6a4a30","author": "Thomas Taylor","form": "TREATISE","pdf": "pdfs/Thomas-Taylor/Explanation-of-Certain-Platonic-Terms.pdf","blurb": "Taylor's glossary of the unusual words of Greek origin he used in translating Plato — anagogic, demiurgus, dianoëtic, hyparxis and the rest — each with its Greek and its meaning in the Platonic philosophy, printed in the first volume of his Works of Plato (1804). From a newly typed text, read twice against the original."},"text": {"title": "Explanation of Certain Platonic Terms","translator": "Thomas Taylor (1804)","noSpeakerLabels": true,"subtitle": "From The Works of Plato, London 1804 · newly typed text"}},{"meta": {"key": "taylor-plato-introductions-1","en": "Introductions to the Dialogues of Plato (Volumes I–II)","kind": "treatise","gr": "","color": "#6a4a30","author": "Thomas Taylor","form": "TREATISE","pdf": "pdfs/Thomas-Taylor/Introductions-to-the-Dialogues-of-Plato-Volumes-I-II.pdf","blurb": "The introductions Thomas Taylor wrote for the dialogues of the first two volumes of his Works of Plato (1804): the First Alcibiades, the Republic — with the Apology for the Fables of Homer — the Laws, the Epinomis, the Timæus and the Critias. Much of each is Taylor's translation of Proclus and other Greek commentators."},"text": {"title": "Introductions to the Dialogues of Plato (Volumes I–II)","translator": "Thomas Taylor (1804)","noSpeakerLabels": true,"subtitle": "From The Works of Plato, London 1804 · newly typed text"}},{"meta": {"key": "taylor-plato-introductions-2","en": "Introductions to the Dialogues of Plato (Volumes III–V)","kind": "treatise","gr": "","color": "#6a4a30","author": "Thomas Taylor","form": "TREATISE","pdf": "pdfs/Thomas-Taylor/Introductions-to-the-Dialogues-of-Plato-Volumes-III-V.pdf","blurb": "Thomas Taylor's introductions to the dialogues of the last three volumes of his Works of Plato (1804): the Parmenides — the longest, a summary of the Neoplatonic reading of its hypotheses — the Sophista, Phædrus, Banquet, Theætetus, Phædo, Philebus, Cratylus and the rest. His footnotes are kept. From a newly typed text."},"text": {"title": "Introductions to the Dialogues of Plato (Volumes III–V)","translator": "Thomas Taylor (1804)","noSpeakerLabels": true,"subtitle": "From The Works of Plato, London 1804 · newly typed text"}},{"meta": {"key": "taylor-plato-notes-1","en": "Additional Notes on the Dialogues of Plato (Volumes I–II)","kind": "treatise","gr": "","color": "#6a4a30","author": "Thomas Taylor","form": "COMMENTARY","pdf": "pdfs/Thomas-Taylor/Additional-Notes-on-the-Dialogues-of-Plato-Volumes-I-II.pdf","blurb": "The Additional Notes Taylor printed at the end of the first two volumes of his Works of Plato (1804): on the First Alcibiades and the Republic, translated mostly from the then unpublished manuscript commentaries of Proclus, and on the Timæus, from Proclus' commentary on that dialogue. From a newly typed text of the 1804 edition."},"text": {"title": "Additional Notes on the Dialogues of Plato (Volumes I–II)","translator": "Thomas Taylor (1804)","noSpeakerLabels": true,"subtitle": "From The Works of Plato, London 1804 · newly typed text"}},{"meta": {"key": "taylor-plato-notes-2","en": "Additional Notes on the Dialogues of Plato (Volumes III–V)","kind": "treatise","gr": "","color": "#6a4a30","author": "Thomas Taylor","form": "COMMENTARY","pdf": "pdfs/Thomas-Taylor/Additional-Notes-on-the-Dialogues-of-Plato-Volumes-III-V.pdf","blurb": "The Additional Notes at the end of the third and fifth volumes of Taylor's Works of Plato (1804): on the Parmenides, from Proclus and Damascius; on the Phædrus, from Proclus' Platonic Theology; and on the Cratylus, from Proclus' scholia — the fullest Neoplatonic commentary on Plato then available in English. From a newly typed text."},"text": {"title": "Additional Notes on the Dialogues of Plato (Volumes III–V)","translator": "Thomas Taylor (1804)","noSpeakerLabels": true,"subtitle": "From The Works of Plato, London 1804 · newly typed text"}},{"meta": {"key": "theoarith","en": "Theoretic Arithmetic","kind": "treatise","gr": "ΑΡΙΘΜΗΤΙΚΗ","color": "#356a7a","author": "Iamblichus","form": "MATHEMATICS","pdf": "pdfs/Iamblichus/Theoretic-Arithmetic.pdf","blurb": "Thomas Taylor’s 1816 exposition of Pythagorean number theory, drawn from Nicomachus, Theon, Iamblichus and Boethius: odd and even, figured numbers, proportions, and the theological meaning the ancients found in them."},"text": {"title": "Theoretic Arithmetic","translator": "Thomas Taylor (1816)","noSpeakerLabels": true}},{"meta": {"key": "numenius-fragments","en": "The Extant Fragments","kind": "treatise","gr": "ΑΠΟΣΠΑΣΜΑΤΑ","color": "#7a5230","author": "Numenius","form": "FRAGMENTS","pdf": "pdfs/Numenius/The-Extant-Fragments.pdf","blurb": "The surviving fragments of Numenius of Apamea, a second-century Pythagorean Platonist preserved chiefly by Eusebius, on the first and second gods, matter, and his famous saying that Plato is Moses speaking Attic."},"text": {"title": "The Extant Fragments","translator": "Kenneth Sylvan Guthrie (1917)","noSpeakerLabels": true}},{"meta": {"key": "olymp-alc1","en": "Commentary on the First Alcibiades","kind": "treatise","gr": "ΕΙΣ ΤΟΝ ΠΛΑΤΩΝΟΣ ΑΛΚΙΒΙΑΔΗΝ","color": "#3f5a73","author": "Olympiodorus","form": "COMMENTARY","pdf": "pdfs/Olympiodorus/Commentary-on-the-First-Alcibiades.pdf","blurb": "Twenty-eight lectures from sixth-century Alexandria on Plato’s Alcibiades I, the first dialogue of the Neoplatonic curriculum, explaining why self-knowledge is the beginning of philosophy."},"text": {"title": "Commentary on the First Alcibiades","greek": "ΕΙΣ ΤΟΝ ΠΛΑΤΩΝΟΣ ΠΡΩΤΟΝ ΑΛΚΙΒΙΑΔΗΝ","subtitle": "Twenty-eight lectures · trans. Michael Griffin (2015–16) · CC BY-NC-ND 4.0","translator": "Michael Griffin","noSpeakerLabels": true,"reference": {"label": "Westerink page","abbr": "W.","placeholder": "e.g. 42"}}},{"meta": {"key": "olymp-life-plato","en": "Life of Plato","kind": "prose","gr": "ΒΙΟΣ ΠΛΑΤΩΝΟΣ","color": "#4a6a63","author": "Olympiodorus","form": "BIOGRAPHY","pdf": "pdfs/Olympiodorus/Life-of-Plato.pdf","blurb": "Olympiodorus’s short Alexandrian life of Plato, opening his lectures on the Alcibiades: the philosopher’s birth, teachers, travels, writings, and the legends that gathered around them."},"text": {"title": "Life of Plato","greek": "ΒΙΟΣ ΠΛΑΤΩΝΟΣ","subtitle": "The Alexandrian life of the philosopher · trans. Michael Griffin (2015) · CC BY-NC-ND 4.0","translator": "Michael Griffin","noSpeakerLabels": true,"transPair": {"a": "olymp-life-plato","g": "olymp-life-plato-g"},"transSelf": "a","lang": "eng","short": "Griffin"}},{"meta": {"key": "olymp-life-plato-g","en": "Life of Plato","kind": "prose","gr": "ΒΙΟΣ ΠΛΑΤΩΝΟΣ","color": "#4a6a63","author": "Olympiodorus","hidden": true,"form": "BIOGRAPHY","pdf": "pdfs/Olympiodorus/Life-of-Plato-Taylor.pdf"},"text": {"title": "The Life of Plato","greek": "ΒΙΟΣ ΠΛΑΤΩΝΟΣ","translator": "Thomas Taylor (1804)","noSpeakerLabels": true,"transPair": {"a": "olymp-life-plato","g": "olymp-life-plato-g"},"transSelf": "g","lang": "eng","short": "Taylor"}},{"meta": {"key": "dam-principles","en": "Problems & Solutions Concerning the First Principles","kind": "treatise","gr": "ΠΕΡΙ ΑΡΧΩΝ","color": "#473a6b","aut omplete exposition of Epicurean physics that survives, and one of the supreme Latin poems: six books from a hymn to Venus to the plague at Athens. Everything is atoms and void, the soul is mortal and death nothing to us. Leonard’s 1916 verse translation, with the Latin line by line."},"text": {"title": "On the Nature of Things","greek": "De rerum natura","subtitle": "Six books, 7,415 hexameters — the physics and ethics of Epicurus in Latin verse","translator": "William Ellery Leonard (1916)","lang": "eng","short": "Leonard","noSpeakerLabels": true,"transPair": {"a": "lucretius-nature","b": "lucretius-nature-b"},"transSelf": "a","reference": {"label": "Book and line","abbr": "","placeholder": "e.g. 3.830"}}},{"meta": {"key": "lucretius-nature-b","en": "On the Nature of Things","kind": "poem","gr": "De rerum natura","color": "#3a3128","author": "Lucretius","hidden": true,"transPair": {"a": "lucretius-nature","b": "lucretius-nature-b"},"transSelf": "b","form": "EPIC","pdf": "pdfs/Lucretius/De-rerum-natura.pdf"},"text": {"title": "De rerum natura","greek": "De rerum natura","translator": "Latin text","lang": "lat","short": "Latin","noSpeakerLabels": true,"transPair": {"a": "lucretius-nature","b": "lucretius-nature-b"},"transSelf": "b","reference": {"label": "Book and line","abbr": "","placeholder": "e.g. 3.830"}}},{"meta": {"key": "plot-e1","en": "The First Ennead","color": "#5a3d8a","author": "Plotinus","kind": "treatise","pdf": "pdfs/Plotinus/The-First-Ennead.pdf","blurb": "The ethical Ennead: treatises on virtue, beauty, the true nature of the human being, well-being, and the problem of evil."},"text": {"title": "The First Ennead","translator": "Stephen MacKenna","transPair": {"a": "plot-e1","b": "plot-e1-b"},"transSelf": "a","lang": "eng","short": "MacKenna"}},{"meta": {"key": "plot-e1-b","en": "The First Ennead","gr": "Εννεάς Αʹ","color": "#5a3d8a","author": "Plotinus","kind": "treatise","hidden": true,"pdf": "pdfs/Plotinus/The-First-Ennead-Greek.pdf"},"text": {"ti oSpeakerLabels": true,"transPair": {"a": "heraclitus-fragments","b": "heraclitus-fragments-b"},"transSelf": "b","lang": "eng","short": "Jones"}},{"meta": {"key": "ocellus-universe","en": "On the Nature of the Universe","gr": "ΠΕΡΙ ΤΗΣ ΤΟΥ ΠΑΝΤΟΣ ΦΥΣΕΩΣ","color": "#2f6f63","author": "Ocellus Lucanus","kind": "treatise","form": "TREATISE","pdf": "pdfs/Ocellus-Lucanus/On-the-Nature-of-the-Universe.pdf","blurb": "A Pythagorean treatise arguing that the universe is ungenerated and indestructible, then turning to the four elements and their changes and to the right ordering of marriage and the family."},"text": {"title": "On the Nature of the Universe","greek": "ΠΕΡΙ ΤΗΣ ΤΟΥ ΠΑΝΤΟΣ ΦΥΣΕΩΣ","subtitle": "A Pythagorean Treatise","translator": "Thomas Taylor","noSpeakerLabels": true}},{"meta": {"key": "empedocles-fragments","en": "Fragments","gr": "ΠΕΡΙ ΦΥΣΕΩΣ","color": "#1f6b5e","author": "Empedocles","kind": "verse","pdf": "pdfs/Empedocles/Fragments.pdf","blurb": "The verse fragments of the Sicilian philosopher-poet: the four roots of all things, the cosmic cycle of Love and Strife, and the soul's fall, wandering, and purification."},"text": {"title": "Fragments","greek": "ΠΕΡΙ ΦΥΣΕΩΣ","subtitle": "On Nature & The Purifications","translator": "William Ellery Leonard","noSpeakerLabels": true}},{"meta": {"key": "orphic-theogony","en": "The Orphic Theogony","gr": "ΟΡΦΙΚΗ ΘΕΟΓΟΝΙΑ","color": "#5b2c5f","author": "Orpheus","kind": "treatise","pdf": "pdfs/Orpheus/The-Orphic-Theogony.pdf","blurb": "A connected modern retelling of the Orphic cosmogony, drawn from the fragments preserved in Damascius, Proclus, and Olympiodorus: Phanes, Night, Heaven, Saturn, Jove who swallows Phanes — and the mystery of Zagreus-Bacchus through whom souls are released from the wheel of birth."},"text": {"title": "The Orphic Theogony","greek": "ΟΡΦΙΚΗ ΘΕΟΓΟΝΙΑ","subtitle": "the five kingships · a modern reconstruction from the Neoplatonic fragments","translator": "Thomas Taylor (1792)"}},{"meta": {"key": "orphic-hymns","en": "The Orphic Hymns","gr": "ΟΡΦΙΚΟΙ ΥΜΝΟΙ","color": "#7a3a7e","author": "Orpheus","kind": "verse","pdf": "pdfs/Orpheus/The-Orphic-Hymns.pdf","blurb": "Eighty-seven Greek hymns invoking the gods of the Orphic mystery rite, from Hecate at the threshold to Death at the close. Rendered into English heroic couplets by Thomas Taylor the Platonist (1792)."},"text": {"title": "The Orphic Hymns","greek": "ΟΡΦΙΚΟΙ ΥΜΝΟΙ","translator": "Thomas Taylor (1792)","subtitle": "eighty-seven hymns in heroic couplets · the Orphic mystery rite"}},{"meta": {"key": "delphic-maxims","en": "The Delphic Maxims","gr": "ΔΕΛΦΙΚΑ ΠΑΡΑΓΓΕΛΜΑΤΑ","color": "#b8862d","author": "Apollo","kind": "maxims","pdf": "pdfs/Apollo/The-Delphic-Maxims.pdf","blurb": "The moral precepts inscribed in letters of gold at the Temple of Apollo at Delphi: the three sayings that stood at the entrance — know thyself, nothing in excess, and pledge a surety, and ruin is near — followed by the 147 aphorisms of the Seven Sages preserved by Stobaeus."},"text": {"title": "The Delphic Maxims","greek": "ΔΕΛΦΙΚΑ ΠΑΡΑΓΓΕΛΜΑΤΑ","translator": "as preserved by Stobaeus","subtitle": "the three inscriptions and the 147 sayings of the Seven Sages"}},{"meta": {"key": "anaxagoras-fragments","en": "Fragments","gr": "ΑΝΑΞΑΓΟΡΑΣ","color": "#6b5e2e","author": "Anaxagoras","kind": "treatise","pdf": "pdfs/Anaxagoras/Fragments.pdf","blurb": "The surviving fragments of Anaxagoras of Klazomenae (c. 500–428 BCE), the first philosopher to teach at Athens and the master of Pericles, gathered with the ancient testimonia of Plato, Aristotle, and the doxographers. He taught that there is a portion of everything in everything, and that Mind (Nous) sets the cosmic mixture in order — the doctrine Plato and Aristotle admired yet faulted as incomplete."},"text": {"title": "Fragments","greek": "ΑΝΑΞΑΓΟΡΑΣ","subtitle": "the fragments · with the ancient testimonia","translator": "Arthur Fairbanks (1898)","noSpeakerLabels": true}},{"meta": {"key": "philolaus-fragments","en": "The Fragments of Philolaus","kind": "fragments","gr": "ΦΙΛΟΛΑΟΥ ΑΠΟΣΠΑΣΜΑΤΑ","color": "#5b3a2e","author": "Philolaus","form": "FRAGMENTS","pdf": "pdfs/Philolaus/The-Fragments-of-Philolaus.pdf","blurb": "What survives of the first Pythagorean book: the fragments of Philolaus of Croton as Diels collected them, each with the ancient author who quotes it. The cosmos fitted together from limiting and unlimited things; number as the condition of knowledge; the central hearth. A new English translation, with the Doric Greek as companion.","transPair": {"a": "philolaus-fragments","e": "philolaus-fragments-e"},"transSelf": "a"},"text": {"title": "The Fragments of Philolaus","greek": "ΦΙΛΟΛΑΟΥ ΑΠΟΣΠΑΣΜΑΤΑ","subtitle": "The fragments in Diels’ collection, with their sources · a new translation","translator": "Claude AI","lang": "eng","short": "English","noSpeakerLabels": true,"transPair": {"a": "philolaus-fragments","e": "philolaus-fragments-e"},"transSelf": "a","reference": {"label": "Fragment","abbr": "fr.","placeholder": "e.g. 6"},"parMirror": "philolaus-fragments"}},{"meta": {"key": "philolaus-fragments-e","en": "The Fragments of Philolaus","kind": "fragments","gr": "ΦΙΛΟΛΑΟΥ ΑΠΟΣΠΑΣΜΑΤΑ","color": "#5b3a2e","author": "Philolaus","hidden": true,"form": "FRAGMENTS","pdf": "pdfs/Philolaus/The-Fragments-of-Philolaus-Greek.pdf","transPair": {"a": "philolaus-fragments","e": "philolaus-fragments-e"},"transSelf": "e"},"text": {"title": "Φιλολάου ἀποσπάσματα","greek": "ΦΙΛΟΛΑΟΥ ΑΠΟΣΠΑΣΜΑΤΑ","translator": "Greek text (Diels)","lang": "grc","short": "Greek","noSpeakerLabels": true,"transPair": {"a": "philolaus-fragments","e": "philolaus-fragments-e"},"transSelf": "e","parMirror": "philolaus-fragments","reference": {"label": "Fragment","abbr": "fr.","placeholder": "e.g. 6"}}},{"meta": {"key": "archytas-fragments","en": "The Fragments of Archytas","kind": "fragments","gr": "ΑΡΧΥΤΟΥ ΑΠΟΣΠΑΣΜΑΤΑ","color": "#2f5a52","author": "Archytas","form": "FRAGMENTS","pdf": "pdfs/Archytas/The-Fragments-of-Archytas.pdf","blurb": "The fragments of Archytas of Tarentum, Plato's Pythagorean friend, as Diels collected them, each with the words of the ancient author who quotes it: the opening of his Harmonics; the three means; and the praise of calculation, which makes concord in a city. A new English translation, with the Doric Greek as companion.","transPair": {"a": "archytas-fragments","e": "archytas-fragments-e"},"transSelf": "a"},"text": {"title": "The Fragments of Archytas","greek": "ΑΡΧΥΤΟΥ ΑΠΟΣΠΑΣΜΑΤΑ","subtitle": "The fragments in Diels’ collection, with their sources · a new translation","translator": "Claude AI","lang": "eng","short": "English","noSpeakerLabels": true,"transPair": {"a": "archytas-fragments","e": "archytas-fragments-e"},"transSelf": "a","reference": {"label": "Fragment","abbr": "fr.","placeholder": "e.g. 1"},"parMirror": "archytas-fragments"}},{"meta": {"key": "archytas-fragments-e","en": "The Fragments of Archytas","kind": "fragments","gr": "ΑΡΧΥΤΟΥ ΑΠΟΣΠΑΣΜΑΤΑ","color": "#2f5a52","author": "Archytas","hidden": true,"form": "FRAGMENTS","pdf": "pdfs/Archytas/The-Fragments-of-Archytas-Greek.pdf","transPair": {"a": "archytas-fragments","e": "archytas-fragments-e"},"transSelf": "e"},"text": {"title": "Ἀρχύτου ἀποσπάσματα","greek": "ΑΡΧΥΤΟΥ ΑΠΟΣΠΑΣΜΑΤΑ","translator": "Greek text (Diels)","lang": "grc","short": "Greek","noSpeakerLabels": true,"transPair": {"a": "archytas-fragments","e": "archytas-fragments-e"},"transSelf": "e","parMirror": "archytas-fragments","reference": {"label": "Fragment","abbr": "fr.","placeholder": "e.g. 1"}}},{"meta": {"key": "pythagorean-ethical-fragments","en": "Fragments of the Ethical Writings of Certain Pythagoreans","gr": "ΑΠΟΣΠΑΣΜΑΤΑ ΗΘΙΚΑ","color": "#3e3a52","author": "Pythagoreans","form": "TREATISE","pdf": "pdfs/Pythagoreans/Fragments-of-the-Ethical-Writings-of-Certain-Pythagoreans.pdf","blurb": "Sixteen pieces of Pythagorean moral philosophy, translated from the Doric treatises preserved in Stobæus and Iamblichus under the names of Hippodamus, Euryphamus, Hipparchus, Archytas, Theages, Metopus, Clinias, Crito and Polus: on felicity, the harmony of the soul, the virtues and justice. Thomas Taylor’s translation of 1818, with his footnotes; no Greek companion.","transPair": {"a": "pythagorean-ethical-fragments"},"transSelf": "a","kind": "treatise"},"text": {"title": "Fragments of the Ethical Writings of Certain Pythagoreans","greek": "ΠΥΘΑΓΟΡΕΙΩΝ ΑΠΟΣΠΑΣΜΑΤΑ ΗΘΙΚΑ","subtitle": "Pythagoreiōn apospasmata ēthika · sixteen fragments of Pythagorean ethical treatises, from Stobæus and Iamblichus · trans. Taylor","translator": "Thomas Taylor (1818)","lang": "eng","short": "Taylor","transPair": {"a": "pythagorean-ethical-fragments"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Piece","abbr": "","placeholder": "e.g. 7","note": "The margin number is the running number of the piece (1–16) in the order in which Taylor prints them."}}},{"meta": {"key": "pythagoric-sentences","en": "Pythagoric Sentences","gr": "ΓΝΩΜΑΙ ΠΥΘΑΓΟΡΙΚΑΙ","color": "#4a3b33","author": "Pythagoreans","form": "TREATISE","pdf": "pdfs/Pythagoreans/Pythagoric-Sentences.pdf","blurb": "Four small collections of Pythagorean maxims, printed by Thomas Taylor in 1818 after his Life of Pythagoras: the ethical sentences quoted by Stobæus, two extracts from Clement of Alexandria, Taylor’s selection from the Sentences of Sextus, and the sentences from the Protreptics of Iamblichus. With Taylor’s footnotes; no Greek companion.","transPair": {"a": "pythagoric-sentences"},"transSelf": "a","kind": "treatise"},"text": {"title": "Pythagoric Sentences","greek": "ΠΥΘΑΓΟΡΕΙΩΝ ΓΝΩΜΑΙ","subtitle": "Gnōmai Pythagorikai · Pythagorean maxims from Stobæus, Clement, Sextus and the Protreptics of Iamblichus · trans. Taylor","translator": "Thomas Taylor (1818)","lang": "eng","short": "Taylor","transPair": {"a": "pythagoric-sentences"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Collection.sentence","abbr": "","placeholder": "e.g. S.12","letters": {"E": "Pythagoric Ethical Sentences from Stobæus","C": "Two Extracts from Clemens Alexandrinus","S": "Select Sentences of Sextus the Pythagorean","I": "Pythagoric Sentences, from the Protreptics of Iamblichus"},"note": "A collection letter and the running number of the sentence within that collection: E = Pythagoric Ethical Sentences from Stobæus (E.1–E.54), C = the two extracts from Clemens Alexandrinus (C.1–C.2), S = Select Sentences of Sextus the Pythagorean (S.1–S.104), I = Pythagoric Sentences from the Protreptics of Iamblichus (I.1–I.15). Taylor does not number the sentences; the numbers count them in the order in which he prints them."}}},{"meta": {"key": "xenophanes-fragments","en": "Xenophanes of Colophon","gr": "ΞΕΝΟΦΑΝΗΣ","color": "#3a5560","author": "Xenophanes","kind": "treatise","pdf": "pdfs/Xenophanes/Xenophanes-of-Colophon.pdf","blurb": "The surviving fragments of Xenophanes of Colophon (c. 570–c. 478 BCE), wandering rhapsode and founder of the Eleatic school. His verses contain the earliest sustained Greek critique of anthropomorphic religion — if oxen and lions had hands, they would paint their gods like oxen and lions — and the first statement of a single god supreme among gods and men. Translated by Arthur Fairbanks, 1898."},"text": {"title": "Xenophanes of Colophon","greek": "ΞΕΝΟΦΑΝΗΣ","translator": "Arthur Fairbanks (1898)","subtitle": "the fragments · founder of the Eleatic school"}},{"meta": {"key": "apuleius-on-plato","en": "On Plato & His Doctrine","gr": "De Platone et eius Dogmate","color": "#356b64","author": "Apuleius","kind": "treatise","form": "TREATISE","pdf": "pdfs/Apuleius/On-Plato-His-Doctrine.pdf","blurb": "A Latin summary of Plato’s philosophy in two books, natural and moral, with a third on logic: Apuleius’s handbook of Middle Platonism, in Thomas Taylor’s translation."},"text": {"title": "On Plato and His Doctrine","greek": "De Platone et eius Dogmate","subtitle": "Natural & Moral Philosophy · On Interpretation","translator": "Thomas Taylor","noSpeakerLabels": true}},{"meta": {"key": "apuleius-god-of-socrates","en": "On the God of Socrates","gr": "De Deo Socratis","color": "#7a5a2e","author": "Apuleius","kind": "treatise","form": "ORATIONS","pdf": "pdfs/Apuleius/On-the-God-of-Socrates.pdf","blurb": "An oration on the daemons who stand between gods and men, explaining the divine sign of Socrates and arguing that each person has a guardian spirit worth cultivating."},"text": {"title": "On the God of Socrates","greek": "De Deo Socratis","subtitle": "On the Nature of Daemons","translator": "Thomas Taylor","noSpeakerLabels": true}},{"meta": {"key": "chaldaean-oracles","en": "The Chaldaean Oracles","gr": "Χαλδαϊκὰ Λόγια","color": "#a8521e","author": "Zoroaster","kind": "prose","form": "ORACLES","pdf": "pdfs/Zoroaster/The-Chaldaean-Oracles.pdf","blurb": "The fragments of the hexameter oracles the Neoplatonists held as scripture, on the Father, the Intellect, the Iynges and the soul’s ascent, with G. R. S. Mead’s commentary."},"text": {"title": "The Chaldaean Oracles","greek": "Χαλδαϊκὰ Λόγια","subtitle": "Fragments & Comments — The Gnosis of the Fire","translator": "G. R. S. Mead","noSpeakerLabels": true}},{"meta": {"key": "cicero-dream-of-scipio","en": "The Dream of Scipio","gr": "Somnium Scipionis","color": "#2b2f63","author": "Cicero","kind": "prose","form": "DIALOGUE","pdf": "pdfs/Cicero/The-Dream-of-Scipio.pdf","blurb": "The close of Cicero’s Republic, in which the younger Scipio dreams of his grandfather and sees from the heavens the smallness of Rome, the music of the spheres and the soul’s immortality."},"text": {"title": "The Dream of Scipio","greek": "Somnium Scipionis","subtitle": "Somnium Scipionis · the close of Cicero’s Republic · trans. W. D. Pearman (1883)","translator": "W. D. Pearman","noSpeakerLabels": true}},{"meta": {"key": "cic-republic","en": "On the Republic","gr": "De Re Publica","color": "#2b2f63","author": "Cicero","kind": "dialogue","pdf": "pdfs/Cicero/On-the-Republic.pdf","blurb": "Cicero's dialogue on the best form of state, set on Scipio's estate — monarchy, aristocracy, and democracy weighed, closing with the cosmic vision of the Dream of Scipio."},"text": {"title": "On the Republic","greek": "De Re Publica","subtitle": "De Re Publica · trans. C. D. Yonge","translator": "C. D. Yonge","noSpeakerLabels": true}},{"meta": {"key": "cic-legibus","en": "On the Laws","gr": "De Legibus","color": "#2b2f63","author": "Cicero","kind": "dialogue","pdf": "pdfs/Cicero/On-the-Laws.pdf","blurb": "The companion to the Republic: natural law as the ground of all justice, and the religious and civil laws of the ideal commonwealth, in dialogue with Quintus and Atticus."},"text": {"title": "On the Laws","greek": "De Legibus","subtitle": "De Legibus · trans. Francis Barham","translator": "Francis Barham","noSpeakerLabels": true}},{"meta": {"key": "cic-paradoxa","en": "Stoic Paradoxes","gr": "Paradoxa Stoicorum","color": "#2b2f63","author": "Cicero","kind": "treatise","pdf": "pdfs/Cicero/Stoic-Paradoxes.pdf","blurb": "Six rhetorical showpieces defending the Stoic paradoxes — that virtue alone is good, that all sins are equal, that only the wise man is rich and free."},"text": {"title": "Stoic Paradoxes","greek": "Paradoxa Stoicorum","subtitle": "Paradoxa Stoicorum · trans. C. R. Edmonds","translator": "C. R. Edmonds","noSpeakerLabels": true}},{"meta": {"key": "cic-academica","en": "The Academics","gr": "Academica","color": "#2b2f63","author": "Cicero","kind": "dialogue","pdf": "pdfs/Cicero/The-Academics.pdf","blurb": "Cicero's defence of Academic scepticism — Lucullus argues for certainty, Cicero for the suspension of assent and the guidance of the probable."},"text": {"title": "The Academics","greek": "Academica","subtitle": "Academica · trans. C. D. Yonge","translator": "C. D. Yonge","noSpeakerLabels": true}},{"meta": {"key": "cic-finibus","en": "On the Ends of Goods and Evils","gr": "De Finibus Bonorum et Malorum","color": "#2b2f63","author": "Cicero","kind": "dialogue","pdf": "pdfs/Cicero/On-the-Ends-of-Goods-and-Evils.pdf","blurb": "Five books on the highest good: the Epicurean pleasure, the Stoic virtue, and the Old Academy's composite ideal, each stated and answered in turn."},"text": {"title": "On the Ends of Goods and Evils","greek": "De Finibus Bonorum et Malorum","subtitle": "De Finibus Bonorum et Malorum · trans. H. Rackham","translator": "H. Rackham","noSpeakerLabels": true}},{"meta": {"key": "cic-tusculan","en": "Tusculan Disputations","gr": "Tusculanae Disputationes","color": "#2b2f63","author": "Cicero","kind": "dialogue","pdf": "pdfs/Cicero/Tusculan-Disputations.pdf","blurb": "Five days of discussion at Cicero's Tusculan villa — on death, pain, grief, the passions, and whether virtue alone suffices for the happy life."},"text": {"title": "Tusculan Disputations","greek": "Tusculanae Disputationes","subtitle": "Tusculanae Disputationes · trans. C. D. Yonge","translator": "C. D. Yonge","noSpeakerLabels": true}},{"meta": {"key": "cic-natdeorum","en": "On the Nature of the Gods","gr": "De Natura Deorum","color": "#2b2f63","author": "Cicero","kind": "dialogue","pdf": "pdfs/Cicero/On-the-Nature-of-the-Gods.pdf","blurb": "The fullest surviving survey of ancient theology: Epicurean, Stoic, and Academic accounts of the gods set against one another in dialogue."},"text": {"title": "On the Nature of the Gods","greek": "De Natura Deorum","subtitle": "De Natura Deorum · trans. C. D. Yonge","translator": "C. D. Yonge","noSpeakerLabels": true}},{"meta": {"key": "cic-divinatione","en": "On Divination","gr": "De Divinatione","color": "#2b2f63","author": "Cicero","kind": "dialogue","pdf": "pdfs/Cicero/On-Divination.pdf","blurb": "Quintus defends augury, dreams, and oracles with the lore of the ages; Cicero answers with one of antiquity's great sceptical examinations of prophecy."},"text": {"title": "On Divination","greek": "De Divinatione","subtitle": "De Divinatione · trans. W. A. Falconer","translator": "W. A. Falconer","noSpeakerLabels": true}},{"meta": {"key": "cic-senectute","en": "On Old Age","gr": "Cato Maior de Senectute","color": "#2b2f63","author": "Cicero","kind": "dialogue","pdf": "pdfs/Cicero/On-Old-Age.pdf","blurb": "Cato the Elder, at eighty-four, answers the four charges against old age — and closes with the soul's hope of immortality. A favourite of readers for two millennia."},"text": {"title": "On Old Age","greek": "Cato Maior de Senectute","subtitle": "Cato Maior de Senectute · trans. E. S. Shuckburgh","translator": "E. S. Shuckburgh","noSpeakerLabels": true}},{"meta": {"key": "cic-amicitia","en": "On Friendship","gr": "Laelius de Amicitia","color": "#2b2f63","author": "Cicero","kind": "dialogue","pdf": "pdfs/Cicero/On-Friendship.pdf","blurb": "Laelius, mourning Scipio, discourses on friendship — possible only between the good, grounded in virtue, and the fairest possession of a human life."},"text": {"title": "On Friendship","greek": "Laelius de Amicitia","subtitle": "Laelius de Amicitia · trans. E. S. Shuckburgh","translator": "E. S. Shuckburgh","noSpeakerLabels": true}},{"meta": {"key": "cic-officiis","en": "On Duties","gr": "De Officiis","color": "#2b2f63","author": "Cicero","kind": "treatise","pdf": "pdfs/Cicero/On-Duties.pdf","blurb": "Cicero's last philosophical work, addressed to his son: on the honourable, the expedient, and their apparent conflicts. For centuries the moral handbook of the West."},"text": {"title": "On Duties","greek": "De Officiis","subtitle": "De Officiis · trans. Walter Miller","translator": "Walter Miller","noSpeakerLabels": true}},{"meta": {"key": "maximus-dissertations","en": "The Dissertations","gr": "ΔΙΑΛΕΞΕΙΣ","color": "#6b5325","author": "Maximus of Tyre","kind": "treatise","form": "ORATIONS","pdf": "pdfs/Maximus-of-Tyre/The-Dissertations.pdf","transPair": {"a": "maximus-dissertations","e": "maximus-dissertations-e"},"transSelf": "a","blu n the Creation","greek": "","translator": "Greek text (Cohn–Wendland)","noSpeakerLabels": true,"transPair": {"a": "philo-on-the-creation","b": "philo-on-the-creation-b"},"transSelf": "b","lang": "grc","short": "Cohn–Wendland"}},{"meta": {"key": "philo-allegorical-interpretation-i","en": "Allegorical Interpretation, I","kind": "treatise","gr": "","color": "#3a6a78","author": "Philo of Alexandria","form": "COMMENTARY","pdf": "pdfs/Philo-of-Alexandria/Allegorical-Interpretation-I.pdf","transPair": {"a": "philo-allegorical-interpretation-i","e": "philo-allegorical-interpretation-i-e"},"transSelf": "a","blurb": "The first book of Philo’s allegorical commentary on Genesis 2, reading the garden, its rivers and the planting of Eden as the virtues and faculties of the soul."},"text": {"title": "Allegorical Interpretation, I","greek": "","translator": "C. D. Yonge translation","noSpeakerLabels": true,"transPair": {"a": "philo-allegorical-interpretation-i","e": "philo-allegorical-interpretation-i-e"},"transSelf": "a","lang": "eng","short": "Yonge","parMirror": "philo-allegorical-interpretation-i"}},{"meta": {"key": "philo-allegorical-interpretation-i-e","en": "Allegorical Interpretation, I","kind": "treatise","gr": "Νόμων ἱερῶν ἀλληγορίας Α","color": "#3a6a78","author": "Philo of Alexandria","hidden": true,"transPair": {"a": "philo-allegorical-interpretation-i","e": "philo-allegorical-interpretation-i-e"},"transSelf": "e","pdf": "pdfs/Philo-of-Alexandria/Allegorical-Interpretation-I-Greek.pdf","form": "COMMENTARY"},"text": {"title": "Νόμων ἱερῶν ἀλληγορίας Α","greek": "Νόμων ἱερῶν ἀλληγορίας Α","translator": "Greek text (Cohn–Wendland)","lang": "grc","short": "Greek","noSpeakerLabels": true,"transPair": {"a": "philo-allegorical-interpretation-i","e": "philo-allegorical-interpretation-i-e"},"transSelf": "e","parMirror": "philo-allegorical-interpretation-i"}},{"meta": {"key": "philo-allegorical-interpretation-ii","en": "Allegorical Interpretation, II","kind": "treatise","gr": "","color": "#3a6a78","author": "Philo of Alexandria","form": "COMMENTARY","pdf": "pdfs/Philo-of-Alexandria/Allegorical-Interpretation-II.pdf","transPair": {"a": "philo-allegorical-interpretation-ii","e": "philo-allegorical-interpretation-ii-e"},"transSelf": "a","blurb": "Philo continues the allegory of Genesis 2–3: the making of woman as sense-perception, the serpent as pleasure, and the nakedness of the mind stripped of virtue."},"text": {"title": "Allegorical Interpretation, II","greek": "","translator": "C. D. Yonge translation","noSpeakerLabels": true,"transPair": {"a": "philo-allegorical-interpretation-ii","e": "philo-allegorical-interpretation-ii-e"},"transSelf": "a","lang": "eng","short": "Yonge","parMirror": "philo-allegorical-interpretation-ii"}},{"meta": {"key": "philo-allegorical-interpretation-ii-e","en": "Allegorical Interpretation, II","kind": "treatise","gr": "Νόμων ἱερῶν ἀλληγορίας Β","color": "#3a6a78","author": "Philo of Alexandria","hidden": true,"transPair": {"a": "philo-allegorical-interpretation-ii","e": "philo-allegorical-interpretation-ii-e"},"transSelf": "e","pdf": "pdfs/Philo-of-Alexandria/Allegorical-Interpretation-II-Greek.pdf","form": "COMMENTARY"},"text": {"title": "Νόμων ἱερῶν ἀλληγορίας Β","greek": "Νόμων ἱερῶν ἀλληγορίας Β","translator": "Greek text (Cohn–Wendland)","lang": "grc","short": "Greek","noSpeakerLabels": true,"transPair": {"a": "philo-allegorical-interpretation-ii","e": "philo-allegorical-interpretation-ii-e"},"transSelf": "e","parMirror": "philo-allegorical-interpretation-ii"}},{"meta": {"key": "philo-allegorical-interpretation-iii","en": "Allegorical Interpretation, III","kind": "treatise","gr": "","color": "#3a6a78","author": "Philo of Alexandria","form": "COMMENTARY","pdf": "pdfs/Philo-of-Alexandria/Allegorical-Interpretation-III.pdf","transPair": {"a": "philo-allegorical-interpretation-iii","e": "philo-allegorical-interpretation-iii-e"},"transSelf": "a","blurb": "The third book of the allegory, on Genesis 3: the hiding of Adam, the curse on the serpent and the woman, and the soul’s expulsion from the garden of virtue."},"text": {"title": "Allegorical Interpretation, III","greek": "","translator": "C. D. Yonge translation","noSpeakerLabels": true,"transPair": {"a": "philo-allegorical-interpretation-iii","e": "philo-allegorical-interpretation-iii-e"},"transSelf": "a","lang": "eng","short": "Yonge","parMirror": "philo-allegorical-interpretation-iii"}},{"meta": {"key": "philo-allegorical-interpretation-iii-e","en": "Allegorical Interpretation, III","kind": "treatise","gr": "Νόμων ἱερῶν ἀλληγορίας Γ","color": "#3a6a78","author": "Philo of Alexandria","hidden": true,"transPair": {"a": "philo-allegorical-interpretation-iii","e": "philo-allegorical-interpretation-iii-e"},"transSelf": "e","pdf": "pdfs/Philo-of-Alexandria/Allegorical-Interpretation-III-Greek.pdf","form": "COMMENTARY"},"text": {"title": "Νόμων ἱερῶν ἀλληγορίας Γ","greek": "Νόμων ἱερῶν ἀλληγορίας Γ","translator": "Greek text (Cohn–Wendland)","lang": "grc","short": "Greek","noSpeakerLabels": true,"transPair": {"a": "philo-allegorical-interpretation-iii","e": "philo-allegorical-interpretation-iii-e"},"transSelf": "e","parMirror": "philo-allegorical-interpretation-iii"}},{"meta": {"key": "philo-on-the-cherubim","en": "On the Cherubim","kind": "treatise","gr": "","color": "#3a6a78","author": "Philo of Alexandria","form": "TREATISE","pdf": "pdfs/Philo-of-Alexandria/On-the-Cherubim.pdf","blurb": "On Genesis 3–4: the cherubim and flaming sword at Eden as God’s goodness and sovereignty with the Logos between them, and Cain as the mind that claims all for itself."},"text": {"title": "On the Cherubim","greek": "","translator": "C. D. Yonge translation","noSpeakerLabels": true,"transPair": {"a": "philo-on-the-cherubim","b": "philo-on-the-cherubim-b"},"transSelf": "a","lang": "eng","short": "Yonge"}},{"meta": {"key": "philo-on-the-cherubim-b","en": "On the Cherubim","kind": "treatise","gr": "","color": "#3a6a78","author": "Philo of Alexandria","hidden": true,"pdf": "pdfs/Philo-of-Alexandria/On-the-Cherubim-Greek.pdf"},"text": {"title": "On the Cherubim","greek": "","translator": "Greek text (Cohn–Wendland)","noSpeakerLabels": true,"transPair": {"a": "philo-on-the-cherubim","b": "philo-on-the-cherubim-b"},"transSelf": "b","lang": "grc","short": "Cohn–Wendland"}},{"meta": {"key": "philo-on-the-birth-of-abel","en": "On the Birth of Abel","kind": "treatise","gr": "","color": "#3a6a78","author": "Philo of Alexandria","form": "TREATISE","pdf": "pdfs/Philo-of-Alexandria/On-the-Birth-of-Abel.pdf","blurb": "On the sacrifices of Cain and Abel, read as the contest between self-love and love of God, with Philo’s account of how virtue is to be acquired and offered."},"text": {"title": "On the Birth of Abel","greek": "","translator": "C. D. Yonge translation","noSpeakerLabels": true,"transPair": {"a": "philo-on-the-birth-of-abel","b": "philo-on-the-birth-of-abel-b"},"transSelf": "a","lang": "eng","short": "Yonge"}},{"meta": {"key": "philo-on-the-birth-of-abel-b","en": "On the Birth of Abel","kind": "treatise","gr": "","color": "#3a6a78","author": "Philo of Alexandria","hidden": true,"pdf": "pdfs/Philo-of-Alexandria/On-the-Birth-of-Abel-Greek.pdf"},"text": {"title": "On the Birth of Abel","greek": "","translator": "Greek text (Cohn–Wendland)","noSpeakerLabels": true,"transPair": {"a": "philo-on-the-birth-of-abel","b": "philo-on-the-birth-of-abel-b"},"transSelf": "b","lang": "grc","short": "Cohn–Wendland"}},{"meta": {"key": "philo-on-the-posterity-of-cain-and-his-exile","en": "On the Posterity of Cain and His Exile","kind": "treatise","gr": "","color": "#3a6a78","author": "Philo of Alexandria","form": "TREATISE","pdf": "pdfs/Philo-of-Alexandria/On-the-Posterity-of-Cain-and-His-Exile.pdf","blurb": "On Genesis 4: Cain’s exile from the face of God, his city and his descendants as the lineage of impiety, set against Seth and the generation of hope."},"text": {"title": "On the Posterity of Cain and His Exile","greek": "","translator": "C. D. Yonge translation","noSpeakerLabels": true,"transPair": {"a": "philo-on-the-posterity-of-cain-and-his-exile","b": "philo-on-the-posterity-of-cain-and-his-exile-b"},"transSelf": "a","lang": "eng","short": "Yonge"}},{"meta": {"key": "philo-on-the-posterity-of-cain-and-his-exile-b","en": "On the Posterity of Cain and His Exile","kind": "treatise","gr": "","color": "#3a6a78","author": "Philo of Alexandria","hidden": true,"pdf": "pdfs/Philo-of-Alexandria/On-the-Posterity-of-Cain-and-His-Exile-Greek.pdf"},"text": {"title": "On the Posterity of Cain and His Exile","greek": "","translator": "Greek text (Cohn–Wendland)","noSpeakerLabels": true,"transPair": {"a": "philo-on-the-posterity-of-cain-and-his-exile","b": "philo-on-the-posterity-of-cain-and-his-exile-b"},"transSelf": "b","lang": "grc","short": "Cohn–Wendland"}},{"meta": {"key": "philo-on-the-giants","en": "On the Giants","kind": "treatise","gr": "","color": "#3a6a78","author": "Philo of Alexandria","form": "TREATISE","pdf": "pdfs/Philo-of-Alexandria/On-the-Giants.pdf","blurb": "A short treatise on Genesis 6, explaining the “sons of God” and giants as kinds of souls, and setting out Philo’s doctrine of angels and daemons as the souls of the air."},"text": {"title": "On the Giants","greek": "","translator": "C. D. Yonge translation","noSpeakerLabels": true,"transPair": {"a": "philo-on-the-giants","b": "philo-on-the-giants-b"},"transSelf": "a","lang": "eng","short": "Yonge"}},{"meta": {"key": "philo-on-the-giants-b","en": "On the Giants","kind": "treatise","gr": "","color": "#3a6a78","author": "Philo of Alexandria","hidden": true,"pdf": "pdfs/Philo-of-Alexandria/On-the-Giants-Greek.pdf"},"text": {"title": "On the Giants","greek": "","translator": "Greek text (Cohn–Wendland)","noSpeakerLabels": true,"transPair": {"a": "philo-on-the-giants","b": "philo-on-the-giants-b"},"transSelf": "b","lang": "grc","short": "Cohn–Wendland"}},{"meta": {"key": "philo-on-the-unchangableness-of-god","en": "On the Unchangableness of God","kind": "treatise","gr": "","color": "#3a6a78","author": "Philo of Alexandria","form": "TREATISE","pdf": "pdfs/Philo-of-Alexandria/On-the-Unchangableness-of-God.pdf","blurb": "On Genesis 6, arguing that God does not repent or change, that anthropomorphic language in Scripture is for the instruction of the dull, and on the flood as the soul’s cleansing."},"text": {"title": "On the Unchangableness of God","greek": "","translator": "C. D. Yonge translation","noSpeakerLabels": true,"transPair": {"a": "philo-on-the-unchangableness-of-god","b": "philo-on-the-unchangableness-of-god-b"},"transSelf": "a","lang": "eng","short": "Yonge"}},{"meta": {"key": "philo-on-the-unchangableness-of-god-b","en": "On the Unchangableness of God","kind": "treatise","gr": "","color": "#3a6a78","author": "Philo of Alexandria","hidden": true,"pdf": "pdfs/Philo-of-Alexandria/On-the-Unchangableness-of-God-Greek.pdf"},"text": {"title": "On the Unchangableness of God","greek": "","translator": "Greek text (Cohn–Wendland)","noSpeakerLabels": true,"transPair": {"a": "philo-on-the-unchangableness-of-god","b": "philo-on-the-unchangableness-of-god-b"},"transSelf": "b","lang": "grc","short": "Cohn–Wendland"}},{"meta": {"key": "philo-on-husbandry","en": "On Husbandry","kind": "treatise","gr": "","color": "#3a6a78","author": "Philo of Alexandria","form": "TREATISE","pdf": "pdfs/Philo-of-Alexandria/On-Husbandry.pdf","blurb": "Noah the husbandman of Genesis 9 becomes the type of the soul that cultivates virtue and prunes the passions, as Philo distinguishes true husbandry from mere tilling of the ground."},"text": {"title": "On Husbandry","greek": "","translator": "C. D. Yonge translation","noSpeakerLabels": true,"transPair": {"a": "philo-on-husbandry","b": "philo-on-husbandry-b"},"transSelf": "a","lang": "eng","short": "Yonge"}},{"meta": {"key": "philo-on-husbandry-b","en": "On Husbandry","kind": "treatise","gr": "","color": "#3a6a78","author": "Philo of Alexandria","hidden": true,"pdf": "pdfs/Philo-of-Alexandria/On-Husbandry-Greek.pdf"},"text": {"title": "On Husbandry","greek": "","translator": "Greek text (Cohn–Wendland)","noSpeakerLabels": true,"transPair": {"a": "philo-on-husbandry","b": "philo-on-husbandry-b"},"transSelf": "b","lang": "grc","short": "Cohn–Wendland"}},{"meta": {"key": "philo-on-drunkenness","en": "On Drunkenness","kind": "treatise","gr": "","color": "#3a6a78","author": "Philo of Alexandria","form": "TREATISE","pdf": "pdfs/Philo-of-Alexandria/On-Drunkenness.pdf","transPair": {"a": "philo-on-drunkenness","e": "philo-on-drunkenness-e"},"transSelf": "a","blurb": "On Noah’s drunkenness in Genesis 9: wine as the symbol of folly, insensibility and greed, but also of the sober intoxication of the soul rejoicing in God."},"text": {"title": "On Drunkenness","greek": "","translator": "C. D. Yonge translation","noSpeakerLabels": true,"transPair": {"a": "philo-on-drunkenness","e": "philo-on-drunkenness-e"},"transSelf": "a","lang": "eng","short": "Yonge","parMirror": "philo-on-drunkenness"}},{"meta": {"key": "philo-on-drunkenness-e","en": "On Drunkenness","kind": "treatise","gr": "Περὶ μέθης","color": "#3a6a78","author": "Philo of Alexandria","hidden": true,"transPair": {"a": "philo-on-drunkenness","e": "philo-on-drunkenness-e"},"transSelf": "e","pdf": "pdfs/Philo-of-Alexandria/On-Drunkenness-Greek.pdf","form": "TREATISE"},"text": {"title": "Περὶ μέθης","greek": "Περὶ μέθης","translator": "Greek text (Cohn–Wendland)","lang": "grc","short": "Greek","noSpeakerLabels": true,"transPair": {"a": "philo-on-drunkenness","e": "philo-on-drunkenness-e"},"transSelf": "e","parMirror": "philo-on-drunkenness"}},{"meta": {"key": "philo-on-sobriety","en": "On Sobriety","kind": "treatise","gr": "","color": "#3a6a78","author": "Philo of Alexandria","form": "TREATISE","pdf": "pdfs/Philo-of-Alexandria/On-Sobriety.pdf","blurb": "A short treatise completing the drunkenness of Noah: his waking, the curse of Canaan and the blessing of Shem, with sobriety read as t  "TREATISE"},"text": {"title": "Περὶ τῶν ἐν μέρει διαταγμάτων Γ","greek": "Περὶ τῶν ἐν μέρει διαταγμάτων Γ","translator": "Greek text (Cohn–Wendland)","lang": "grc","short": "Greek","noSpeakerLabels": true,"transPair": {"a": "philo-the-special-laws-iii","e": "philo-the-special-laws-iii-e"},"transSelf": "e","parMirror": "philo-the-special-laws-iii"}},{"meta": {"key": "philo-the-special-laws-iv","en": "The Special Laws, IV","kind": "treatise","gr": "","color": "#3a6a78","author": "Philo of Alexandria","form": "TREATISE","pdf": "pdfs/Philo-of-Alexandria/The-Special-Laws-IV.pdf","transPair": {"a": "philo-the-special-laws-iv","e": "philo-the-special-laws-iv-e"},"transSelf": "a","blurb": "The laws under the last three commandments: theft, false witness, covetousness, the dietary rules read allegorically, and the justice required of judges and rulers."},"text": {"title": "The Special Laws, IV","greek": "","translator": "C. D. Yonge translation","noSpeakerLabels": true,"transPair": {"a": "philo-the-special-laws-iv","e": "philo-the-special-laws-iv-e"},"transSelf": "a","lang": "eng","short": "Yonge","parMirror": "philo-the-special-laws-iv"}},{"meta": {"key": "philo-the-special-laws-iv-e","en": "The Special Laws, IV","kind": "treatise","gr": "Περὶ τῶν ἐν μέρει διαταγμάτων Δ","color": "#3a6a78","author": "Philo of Alexandria","hidden": true,"transPair": {"a": "philo-the-special-laws-iv","e": "philo-the-special-laws-iv-e"},"transSelf": "e","pdf": "pdfs/Philo-of-Alexandria/The-Special-Laws-IV-Greek.pdf","form": "TREATISE"},"text": {"title": "Περὶ τῶν ἐν μέρει διαταγμάτων Δ","greek": "Περὶ τῶν ἐν μέρει διαταγμάτων Δ","translator": "Greek text (Cohn–Wendland)","lang": "grc","short": "Greek","noSpeakerLabels": true,"transPair": {"a": "philo-the-special-laws-iv","e": "philo-the-special-laws-iv-e"},"transSelf": "e","parMirror": "philo-the-special-laws-iv"}},{"meta": {"key": "philo-on-the-virtues","en": "On the Virtues","kind": "treatise","gr": "","color": "#3a6a78","author": "Philo of
