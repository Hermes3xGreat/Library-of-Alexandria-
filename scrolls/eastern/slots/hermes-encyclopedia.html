<script id="hermes-encyclopedia" type="application/json">[{"id": "zoroaster","title": "Zoroaster","kind": "figure","kindLabel": "Figure","era": "Persia · date disputed","tags": ["Persian","prophet","dualism"],"teaser": "The prophet of ancient Iran — master of the Magi, and to the Greeks an archetype of primordial barbarian wisdom.","body": "<p>Zoroaster (Zarathustra) was the prophet of ancient Iran and founder of the religion that bears his name, who taught the worship of one supreme god of light and wisdom, Ahura Mazda, and a cosmic struggle between truth and the Lie, good and evil — the most thoroughgoing dualism of the ancient world, which would leave its mark on later <a class=\"xref\" href=\"#gnosticism\">Gnostic<\/a> thought. In his reform the old gods, the <em>daēvas<\/em>, were cast down as demons.<\/p><p>The Greeks, who knew him only dimly and placed him impossibly early, made Zoroaster the archetype of the 'barbarian sage' and the master of the Magi — a font of the most ancient wisdom. He was woven into the <a class=\"xref\" href=\"#prisca-theologia\">ancient theology<\/a> beside <a class=\"xref\" href=\"#hermes-trismegistus\">Hermes<\/a> and <a class=\"xref\" href=\"#orpheus\">Orpheus<\/a>, and in the Renaissance <a class=\"xref\" href=\"#plethon\">Plethon<\/a> ascribed the <a class=\"xref\" href=\"#chaldean-oracles\">Chaldaean Oracles<\/a> to him — so that 'Zoroaster' became a name under which Platonists sought a primordial revelation.<\/p>","seeAlso": [{"id": "prisca-theologia","title": "Prisca Theologia"},{"id": "chaldean-oracles","title": "The Chaldean Oracles"},{"id": "hermes-trismegistus","title": "Hermes Trismegistus"},{"id": "plethon","title": "Gemistos Plethon"},{"id": "gnosticism","title": "Gnosticism"}],"passages": [],"lib": null,"group": "mythic","gorder": 3,"search": "zoroaster persia · date disputed the prophet of ancient iran — master of the magi, and to the greeks an archetype of primordial barbarian wisdom. persian prophet dualism zoroaster (zarathustra) was the prophet of ancient iran and founder of the religion that bears his name, who taught the worship of one supreme god of light and wisdom, ahura mazda, and a cosmic struggle between truth and the lie, good and evil — the most thoroughgoing dualism of the ancient world, which would leave its mark on later gnostic thought. in his reform the old gods, the daēvas, were cast down as demons. the greeks, who knew him only dimly and placed him impossibly early, made zoroaster the archetype of the 'barbarian sage' and the master of the magi — a font of the most ancient wisdom. he was woven into the ancient theology beside hermes and orpheus, and in the renaissance plethon ascribed the chaldaean oracles to him — so that 'zoroaster' became a name under which platonists sought a primordial revelation.","author": "Zoroaster"},{"id": "the-upanishads","title": "The Upanishads","kind": "figure","kindLabel": "Figure","era": "c. 800–200 BCE","tags": [],"teaser": "The philosophical conclusion of the Vedas: the twelve principal Upanishads — Chāndogya, Kena, Aitareya, Kaushītaki, Īśā, Katha, Mundaka, Taittirīya, Brihadāranyaka, Śvetāśvatara, Praśna and Maitrāyana — on Brahman and the Self, in F. Max Müller's complete translation for the Sacred Books of the East (1879–84), with the Sanskrit text beside each.","body": "<p>The Upanishads are the concluding portion of the Vedic literature, the Vedanta or end of the Veda, in which the ritual of the sacrifice gives way to inquiry into its meaning and then into the nature of reality itself. The word probably means a sitting down near a teacher, and the texts preserve the form of instruction, often as dialogues between a sage and a pupil, a king and a Brahman, a father and a son, or a boy and Death. The oldest, the Brihadāranyaka and the Chāndogya, are in prose and may date from the eighth to the sixth century BCE; the Kena, Katha, Īśā, Mundaka and Śvetāśvatara, mostly in verse, are later; and the Praśna and Maitrāyana belong to the last centuries BCE. Some two hundred Upanishads exist in all, but these, with the Taittirīya, Aitareya and Kaushītaki, form the group that the philosopher Śankara commented on in the eighth century CE and that has been treated since as the principal ones.<\/p>\n<p>Their central teaching is the identity of Brahman, the one reality underlying the universe, with Ātman, the self within each person: “that art thou”, as the Chāndogya says. Around this they gather doctrines of the self in waking, dreaming and dreamless sleep, of rebirth and the law of action, of the subtle body, and of the knowledge by which the self is freed. They are the foundation of the later schools of Indian philosophy and of the Bhagavad Gita, and since Anquetil-Duperron’s Latin version of a Persian translation reached Schopenhauer they have been read in the West as one of the great monuments of thought.<\/p>\n<p>The library presents twelve Upanishads in F. Max Müller’s translation for the Sacred Books of the East (1879–84), with the Sanskrit text beside the English; the Aitareya is given with the whole of the Āranyaka in which it is embedded.<\/p>","seeAlso": [],"passages": [],"lib": null,"group": "sources","gorder": 900,"author": "The Upanishads","search": "the upanishads c. 800–200 bce the philosophical conclusion of the vedas: the twelve principal upanishads — chāndogya, kena, aitareya, kaushītaki, īśā, katha, mundaka, taittirīya, brihadāranyaka, śvetāśvatara, praśna and maitrāyana — on brahman and the self, in f. max müller's complete translation for the sacred books of the east (1879–84), with the sanskrit text beside each. the upanishads are the concluding portion of the vedic literature, the vedanta or end of the veda, in which the ritual of the sacrifice gives way to inquiry into its meaning and then into the nature of reality itself. the word probably means a sitting down near a teacher, and the texts preserve the form of instruction, often as dialogues between a sage and a pupil, a king and a brahman, a father and a son, or a boy and death. the oldest, the brihadāranyaka and the chāndogya, are in prose and may date from the eighth to the sixth century bce; the kena, katha, īśā, mundaka and śvetāśvatara, mostly in verse, are later; and the praśna and maitrāyana belong to the last centuries bce. some two hundred upanishads exist in all, but these, with the taittirīya, aitareya and kaushītaki, form the group that the philosopher śankara commented on in the eighth century ce and that has been treated since as the principal ones. their central teaching is the identity of brahman, the one reality underlying the universe, with ātman, the self within each person: “that art thou”, as the chāndogya says. around this they gather doctrines of the self in waking, dreaming and dreamless sleep, of rebirth and the law of action, of the subtle body, and of the knowledge by which the self is freed. they are the foundation of the later schools of indian philosophy and of the bhagavad gita, and since anquetil-duperron’s latin version of a persian translation reached schopenhauer they have been read in the west as one of the great monuments of thought. the library presents twelve upanishads in f. max müller’s translation for the sacred books of the east (1879–84), with the sanskrit text beside the english; the aitareya is given with the whole of the āranyaka in which it is embedded."},{"id": "the-vedas","title": "The Vedas","kind": "figure","kindLabel": "Figure","era": "c. 1500–500 BCE","tags": [],"teaser": "The four Vedas are the oldest scriptures of India and the oldest surviving literature in any Indo-European language: the Rigveda's 1,028 hymns to the gods of the sacrifice, the Samaveda's chants, the two Yajurvedas' sacrificial formulas, and the Atharvaveda's charms and cosmological hymns. Composed in Vedic Sanskrit in the second millennium BCE and transmitted orally for centuries, they are here in the complete public-domain translations of Ralph T. H. Griffith (1889–99) and, for the Black Yajurveda, Arthur Berriedale Keith (1914), with the Sanskrit of the Rigveda beside it.","body": "<p>The Vedas, from a Sanskrit word for knowledge, are the oldest texts of India and, in the hymns of the Rigveda, the oldest extant literature in any Indo-European language. They were composed in the north-west of the subcontinent by the Aryan tribes who entered it in the second millennium BCE, the earliest hymns perhaps about 1500 BCE and the latest portions about 500 BCE, and they were transmitted orally, by techniques of memorisation that preserved every syllable and accent, for well over a thousand years before they were commonly written down. In the Hindu tradition they are śruti, what was heard, revealed to the seers and not composed by men.<\/p>\n<p>There are four. The Rigveda, in ten books, contains 1,028 hymns to the gods of the sacrifice, Agni the fire, Indra the warrior who slays the dragon, Soma the intoxicating plant, Varuna, the Aśvins, the Dawn and others, with in its last book the speculative hymns on creation, the Purusha and the origin of the world that lead towards the Upanishads. The Samaveda is a rearrangement of Rigvedic verses for chanting. The Yajurveda, in a Black and a White recension, gives the formulas recited by the priest who performs the acts of the sacrifice, with, in the Black version, prose explanations of them. The Atharvaveda is a collection of spells, charms, curses and healing incantations, together with cosmological hymns, and preserves much of the popular religion that the priestly books leave out.<\/p>\n<p>The library presents all four Vedas in the complete translations of Ralph T. H. Griffith (1889–99), the principal of Benares College, whose Rigveda, Samaveda, White Yajurveda and Atharvaveda remain the only complete English versions in the public domain, and the Black Yajurveda in the translation of Arthur Berriedale Keith (1914); the Sanskrit of the Rigveda is given beside the English.<\/p>","seeAlso": [],"passages": [],"lib": null,"group": "sources","gorder": 900,"author": "The Vedas","search": "the vedas c. 1500–500 bce the four vedas are the oldest scriptures of india and the oldest surviving literature in any indo-european language: the rigveda's 1,028 hymns to the gods of the sacrifice, the samaveda's chants, the two yajurvedas' sacrificial formulas, and the atharvaveda's charms and cosmological hymns. composed in vedic sanskrit in the second millennium bce and transmitted orally for centuries, they are here in the complete public-domain translations of ralph t. h. griffith (1889–99) and, for the black yajurveda, arthur berriedale keith (1914), with the sanskrit of the rigveda beside it. the vedas, from a sanskrit word for knowledge, are the oldest texts of india and, in the hymns of the rigveda, the oldest extant literature in any indo-european language. they were composed in the north-west of the subcontinent by the aryan tribes who entered it in the second millennium bce, the earliest hymns perhaps about 1500 bce and the latest portions about 500 bce, and they were transmitted orally, by techniques of memorisation that preserved every syllable and accent, for well over a thousand years before they were commonly written down. in the hindu tradition they are śruti, what was heard, revealed to the seers and not composed by men. there are four. the rigveda, in ten books, contains 1,028 hymns to the gods of the sacrifice, agni the fire, indra the warrior who slays the dragon, soma the intoxicating plant, varuna, the aśvins, the dawn and others, with in its last book the speculative hymns on creation, the purusha and the origin of the world that lead towards the upanishads. the samaveda is a rearrangement of rigvedic verses for chanting. the yajurveda, in a black and a white recension, gives the formulas recited by the priest who performs the acts of the sacrifice, with, in the black version, prose explanations of them. the atharvaveda is a collection of spells, charms, curses and healing incantations, together with cosmological hymns, and preserves much of the popular religion that the priestly books leave out. the library presents all four vedas in the complete translations of ralph t. h. griffith (1889–99), the principal of benares college, whose rigveda, samaveda, white yajurveda and atharvaveda remain the only complete english versions in the public domain, and the black yajurveda in the translation of arthur berriedale keith (1914); the sanskrit of the rigveda is given beside the english."}]</script>
