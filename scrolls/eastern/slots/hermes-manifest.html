<script id="hermes-manifest" type="application/json">{"type": "hermes-manifest","version": 1,"books": [{"meta": {"key": "rigveda","en": "Rigveda","kind": "verse","gr": "ऋग्वेद","color": "#8c3f4a","author": "The Vedas","transPair": {"a": "rigveda","b": "rigveda-b"},"transSelf": "a","form": "SCRIPTURE","blurb": "The oldest of the Vedas and the oldest extant text in any Indo-European language: 1,028 hymns in ten maṇḍalas, addressed to Agni, Indra, Soma, Varuṇa, Uṣas and the other gods of the sacrifice, composed in an archaic Sanskrit that is a cousin of Homeric Greek. Ralph T. H. Griffith's complete verse translation (1889–92), cited by maṇḍala, hymn and verse, with the Sanskrit — Devanāgarī and transliteration — as a companion text."},"text": {"translator": "Ralph T. H. Griffith (1889–92)","lang": "eng","short": "Griffith","subtitle": "1,028 hymns in ten maṇḍalas — the oldest Indo-European scripture, in Griffith’s verse translation","reference": {"label": "Maṇḍala.hymn.verse","abbr": "","placeholder": "e.g. 1.1.1"},"title": "Rigveda","greek": "ऋग्वेद","noSpeakerLabels": true,"transPair": {"a": "rigveda","b": "rigveda-b"},"transSelf": "a"}},{"meta": {"key": "rigveda-b","en": "Rigveda","kind": "verse","gr": "ऋग्वेद","color": "#8c3f4a","author": "The Vedas","hidden": true,"transPair": {"a": "rigveda","b": "rigveda-b"},"transSelf": "b","form": "SCRIPTURE"},"text": {"title": "Ṛgveda Saṃhitā","translator": "Sanskrit text","short": "Sanskrit","subtitle": "Devanāgarī with roman transliteration, verse by verse","reference": {"label": "Maṇḍala.hymn.verse","abbr": "","placeholder": "e.g. 1.1.1"},"greek": "ऋग्वेद","noSpeakerLabels": true,"langName": "Sanskrit","langIso": "sa","transPair": {"a": "rigveda","b": "rigveda-b"},"transSelf": "b"}},{"meta": {"key": "atharvaveda","en": "Atharvaveda","kind": "verse","gr": "अथर्ववेद","color": "#5a3a2a","author": "The Vedas","form": "SCRIPTURE","blurb": "The fourth Veda, the Veda of the Atharvan priests: charms, spells and prayers for the bu रत","translator": "Kisari Mohan Ganguli (1883–96)","noSpeakerLabels": true,"reference": {"label": "Section.paragraph","abbr": "","placeholder": "e.g. 1.1"},"lang": "eng","short": "Ganguli"}},{"meta": {"key": "mbh-10","en": "Mahabharata 10 · Sauptika Parva","gr": "महाभारत","color": "#5a2d3c","author": "Vyasa","kind": "prose","form": "EPIC","blurb": "The Book of the Sleeping Warriors: the night massacre of the Pandava camp by Ashvatthaman. Kisari Mohan Ganguli’s complete prose translation (1883–96)."},"text": {"title": "Mahabharata 10 · Sauptika Parva","greek": "महाभारत","translator": "Kisari Mohan Ganguli (1883–96)","noSpeakerLabels": true,"reference": {"label": "Section.paragraph","abbr": "","placeholder": "e.g. 1.1"},"lang": "eng","short": "Ganguli"}},{"meta": {"key": "mbh-11","en": "Mahabharata 11 · Stri Parva","gr": "महाभारत","color": "#5a2d3c","author": "Vyasa","kind": "prose","form": "EPIC","blurb": "The Book of the Women: the lament of Gandhari and the women over the dead. Kisari Mohan Ganguli’s complete prose translation (1883–96)."},"text": {"title": "Mahabharata 11 · Stri Parva","greek": "महाभारत","translator": "Kisari Mohan Ganguli (1883–96)","noSpeakerLabels": true,"reference": {"label": "Section.paragraph","abbr": "","placeholder": "e.g. 1.1"},"lang": "eng","short": "Ganguli"}},{"meta": {"key": "mbh-12","en": "Mahabharata 12 · Santi Parva","gr": "महाभारत","color": "#5a2d3c","author": "Vyasa","kind": "prose","form": "EPIC","blurb": "The Book of Peace: Bhishma, on his bed of arrows, instructs Yudhishthira on kingship, conduct in distress, and liberation. Kisari Mohan Ganguli’s complete prose translation (1883–96)."},"text": {"title": "Mahabharata 12 · Santi Parva","greek": "महाभारत","translator": "Kisari Mohan Ganguli (1883–96)","noSpeakerLabels": true,"reference": {"label": "Section.paragraph","abbr": "","placeholder": "e.g. 1.1"},"lang": "eng","short": "Ganguli"}},{"meta": {"key": "mbh-13","en": "Mahabharata 13 · Anusasana Parva","gr": "महाभारत","color": "#5a2d3c","author": "Vyasa","kind": "prose","form": "EPIC","blurb": "The Book of the Instructions: Bhishma’s teaching continues, on gifts, duties and the praise of Shiva and Vishnu, until his death. Kisari Mohan Ganguli’s complete prose translation (1883–96)."},"text": {"title": "Mahabharata 13 · Anusasana Parva","greek": "महाभारत","translator": "Kisari Mohan Ganguli (1883–96)","noSpeakerLabels": true,"reference": {"label": "Section.paragraph","abbr": "","placeholder": "e.g. 1.1"},"lang": "eng","short": "Ganguli"}},{"meta": {"key": "mbh-14","en": "Mahabharata 14 · Aswamedha Parva","gr": "महाभारत","color": "#5a2d3c","author": "Vyasa","kind": "prose","form": "EPIC","blurb": "The Book of the Horse Sacrifice: Yudhishthira’s great sacrifice, and the Anugita taught by Krishna to Arjuna. Kisari Mohan Ganguli’s complete prose translation (1883–96)."},"text": {"title": "Mahabharata 14 · Aswamedha Parva","greek": "महाभारत","translator": "Kisari Mohan Ganguli (1883–96)","noSpeakerLabels": true,"reference": {"label": "Section.paragraph","abbr": "","placeholder": "e.g. 1.1"},"lang": "eng","short": "Ganguli"}},{"meta": {"key": "mbh-15","en": "Mahabharata 15 · Asramavasika Parva","gr": "महाभारत","color": "#5a2d3c","author": "Vyasa","kind": "prose","form": "EPIC","blurb": "The Book of the Hermitage: Dhritarashtra, Gandhari and Kunti retire to the forest and die there. Kisari Mohan Ganguli’s complete prose translation (1883–96)."},"text": {"title": "Mahabharata 15 · Asramavasika Parva","greek": "महाभारत","translator": "Kisari Mohan Ganguli (1883–96)","noSpeakerLabels": true,"reference": {"label": "Section.paragraph","abbr": "","placeholder": "e.g. 1.1"},"lang": "eng","short": "Ganguli"}},{"meta": {"key": "mbh-16","en": "Mahabharata 16 · Mausala Parva","gr": "महाभारत","color": "#5a2d3c","author": "Vyasa","kind": "prose","form": "EPIC","blurb": "The Book of the Clubs: the destruction of the Yadavas and the death of Krishna. Kisari Mohan Ganguli’s complete prose translation (1883–96). .1"},"lang": "eng","short": "Cowell"}},{"meta": {"key": "kiratarjuniya","en": "Kiratarjuniya","gr": "किरातार्जुनीय","color": "#3f5a3a","author": "Bharavi","kind": "verse","form": "EPIC","blurb": "Arjuna’s penance in the Himalayas and his combat with Shiva disguised as a mountain hunter, from one of the great court epics of Sanskrit. Romesh Chunder Dutt’s verse rendering, The Hunter and the Hero."},"text": {"title": "Kiratarjuniya","greek": "किरातार्जुनीय","translator": "Romesh Chunder Dutt (1894)","noSpeakerLabels": true,"reference": {"label": "Book.stanza","abbr": "","placeholder": "e.g. 1.1"},"lang": "eng","short": "Dutt"}},{"meta": {"key": "bhattikavya","en": "Bhattikavya, Canto I","gr": "भट्टिकाव्य","color": "#4a4a6a","author": "Bhatti","kind": "prose","form": "EPIC","blurb": "The opening canto of Bhatti’s poem, which tells the story of Rama while illustrating, rule by rule, the grammar of Pāṇini. An anonymous translation printed in The Pandit in 1867."},"text": {"title": "Bhattikavya, Canto I","greek": "भट्टिकाव्य","translator": "Anonymous, in The Pandit (1867)","noSpeakerLabels": true,"reference": {"label": "Canto.verse","abbr": "","placeholder": "e.g. 1.1"},"lang": "eng","short": "Anonymous"}},{"meta": {"key": "dhammapada","en": "The Dhammapada","gr": "Dhammapada","color": "#a9772a","author": "The Buddha","kind": "verse","form": "SCRIPTURE","blurb": "The Path of the Teaching: 423 verses of the Buddha in twenty-six chapters, the best-loved book of the Pali Canon. F. Max Müller’s translation for the Sacred Books of the East, with the Pali text beside it.","transPair": {"a": "dhammapada","b": "dhammapada-b"},"transSelf": "a"},"text": {"title": "The Dhammapada","greek": "Dhammapada","translator": "F. Max Müller (1881)","noSpeakerLabels": true,"reference": {"label": "Chapter.verse","abbr": "","placeholder": "e.g. 1.1"},"lang": "eng","short": "Müller","transPair": {"a": "dhammapada","b": "dhammapada-b"},"transSelf": "a"}},{"meta": {"key": "dhammapada-b","en": "The  and death of the Buddha, and the first sermon, the Foundation of the Kingdom of Righteousness. T. W. Rhys Davids, 1881."},"text": {"title": "Buddhist Suttas","greek": "","translator": "T. W. Rhys Davids (1881)","noSpeakerLabels": true,"reference": {"label": "Part.section.paragraph","abbr": "","placeholder": "e.g. 1.1"},"lang": "eng","short": "Davids"}},{"meta": {"key": "milindapanha","en": "The Questions of King Milinda","gr": "","color": "#a9772a","author": "The Buddha","kind": "prose","form": "SCRIPTURE","blurb": "The dialogue of the Greek king Menander of Bactria with the Buddhist elder Nāgasena: on the self that is not found, on rebirth without a soul, and on the dilemmas the king lays before the sage. T. W. Rhys Davids’s translation."},"text": {"title": "The Questions of King Milinda","greek": "","translator": "T. W. Rhys Davids (1890–94)","noSpeakerLabels": true,"reference": {"label": "Book.chapter.paragraph","abbr": "","placeholder": "e.g. 1.1"},"lang": "eng","short": "Davids"}},{"meta": {"key": "digha-nikaya","en": "Dialogues of the Buddha (Dīgha Nikāya)","gr": "","color": "#a9772a","author": "The Buddha","kind": "prose","form": "SCRIPTURE","blurb": "The first thirteen of the Long Discourses: the Perfect Net of views, the Fruits of the Life of a Recluse, and the Buddha’s debates with brahmins and wandering ascetics. T. W. Rhys Davids’s Dialogues of the Buddha (1899)."},"text": {"title": "Dialogues of the Buddha (Dīgha Nikāya)","greek": "","translator": "T. W. Rhys Davids (1899)","noSpeakerLabels": true,"reference": {"label": "Section.paragraph","abbr": "","placeholder": "e.g. 1.1"},"lang": "eng","short": "Davids"}},{"meta": {"key": "udana","en": "The Udāna","gr": "","color": "#a9772a","author": "The Buddha","kind": "prose","form": "SCRIPTURE","blurb": "Eighty solemn utterances of the Buddha, each with the story of the occasion on which it was spoken, including the blind men and the elephant. Dawsonne Melanchthon Strong’s translation of 1902."},"text": {"tit  1.1"},"transPair": {"a": "tao-te-ching","b": "tao-te-ching-b"},"transSelf": "b","langName": "Chinese","langIso": "zh","short": "Chinese"}},{"meta": {"key": "tao-te-ching-chalmers","en": "Tao Te Ching (Chalmers)","gr": "","color": "#2f5d50","author": "Laozi","kind": "prose","form": "SCRIPTURE","blurb": "The first English version of the Tao Te Ching, made by the Scottish missionary John Chalmers in Hong Kong in 1868, with the traditional chapter titles."},"text": {"title": "Tao Te Ching (Chalmers)","greek": "","translator": "John Chalmers (1868)","noSpeakerLabels": true,"reference": {"label": "Chapter.section","abbr": "","placeholder": "e.g. 1.1"},"lang": "eng","short": "Chalmers"}},{"meta": {"key": "art-of-war","en": "The Art of War","gr": "孫子兵法","color": "#7a2e24","author": "Sun Tzu","kind": "prose","form": "TREATISE","blurb": "Thirteen chapters on strategy from the age of the Warring States: on laying plans, deception, terrain, and winning without fighting. Lionel Giles’s translation of 1910, the plain text without his commentary, with the Chinese beside it.","transPair": {"a": "art-of-war","b": "art-of-war-b"},"transSelf": "a"},"text": {"title": "The Art of War","greek": "孫子兵法","translator": "Lionel Giles (1910)","noSpeakerLabels": true,"reference": {"label": "Chapter.paragraph","abbr": "","placeholder": "e.g. 1.1"},"lang": "eng","short": "Giles","transPair": {"a": "art-of-war","b": "art-of-war-b"},"transSelf": "a"}},{"meta": {"key": "art-of-war-b","en": "The Art of War","gr": "孫子兵法","color": "#7a2e24","author": "Sun Tzu","kind": "prose","form": "TREATISE","hidden": true,"transPair": {"a": "art-of-war","b": "art-of-war-b"},"transSelf": "b"},"text": {"title": "The Art of War","greek": "孫子兵法","translator": "Chinese text","noSpeakerLabels": true,"reference": {"label": "Chapter.paragraph","abbr": "","placeholder": "e.g. 1.1"},"transPair": {"a": "art-of-war","b": "art-of-war-b"},"transSelf": "b","langName": "Chinese","langIso": "zh","short": "Chinese"}},{"meta": {"key
