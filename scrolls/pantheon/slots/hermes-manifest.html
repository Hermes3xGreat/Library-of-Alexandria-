b63","author": "Ptolemy","kind": "treatise","blurb": "The theoretical first book of Ptolemy's Geography — on the difference between geography and chorography, the criticism of Marinus, and the projection of the sphere onto the plane."},"text": {"title": "The Geography","greek": "Γεωγραφικὴ Ὑφήγησις","subtitle": "Book One · trans. E. L. Stevenson (1932)","translator": "E. L. Stevenson","noSpeakerLabels": true}},{"meta": {"key": "ptolemy-centiloquy","en": "The Centiloquy","gr": "Καρπός","color": "#274b63","author": "Ptolemy","kind": "prose","blurb": "One hundred astrological aphorisms attributed to Ptolemy — the Karpos or 'Fruit' of his Four Books, a companion distillation studied alongside the Tetrabiblos for centuries."},"text": {"title": "The Centiloquy","greek": "Καρπός","subtitle": "The Fruit of his Four Books · trans. J. M. Ashmand (1822)","translator": "J. M. Ashmand","noSpeakerLabels": true}},{"meta": {"key": "vitruvius-architecture","en": "The Ten Books on Architecture","gr": "DE ARCHITECTURA","color": "#4a3f35","author": "Vitruvius","form": "TREATISE","blurb": "The one treatise on architecture to survive from antiquity, written by a Roman military engineer and dedicated to Augustus: ten books on the architect's education, materials, temples and the orders, public buildings, private houses, finishes, aqueducts, sundials and machines. Morris Hicky Morgan's translation of 1914, without the illustrations, with Krohn's Latin as companion.","transPair": {"a": "vitruvius-architecture","b": "vitruvius-architecture-b"},"transSelf": "a","kind": "treatise"},"text": {"title": "The Ten Books on Architecture","greek": "VITRUVII DE ARCHITECTURA","subtitle": "De Architectura · the Roman treatise on building, in ten books · trans. Morris Hicky Morgan","translator": "Morris Hicky Morgan (1914)","lang": "eng","short": "Morgan","transPair": {"a": "vitruvius-architecture","b": "vitruvius-architecture-b"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter.section","abbr": "","placeholder": "e.g. 3.1.3"},"parMirror": "vitruvius-architecture"}},{"meta": {"key": "vitruvius-architecture-b","en": "The Ten Books on Architecture","gr": "DE ARCHITECTURA","color": "#4a3f35","author": "Vitruvius","hidden": true,"form": "TREATISE","transPair": {"a": "vitruvius-architecture","b": "vitruvius-architecture-b"},"transSelf": "b","kind": "treatise"},"text": {"title": "De Architectura","greek": "VITRUVII DE ARCHITECTURA","translator": "Latin text (Krohn)","lang": "lat","short": "Latin","transPair": {"a": "vitruvius-architecture","b": "vitruvius-architecture-b"},"transSelf": "b","noSpeakerLabels": true,"parMirror": "vitruvius-architecture","reference": {"label": "Book.chapter.section","abbr": "","placeholder": "e.g. 3.1.3"}}},{"meta": {"key": "pliny-natural-history-1","en": "Natural History (Books I–VI)","gr": "NATURALIS HISTORIA, LIBRI I–VI","color": "#3b3a2c","author": "Pliny the Elder","form": "TREATISE","blurb": "The opening of Pliny's encyclopaedia: the dedicatory letter to Titus, then Book II on the universe — the heavens, the planets and their motions, eclipses, comets, thunder and lightning, winds, earthquakes, tides and the wonders of fire and water — and Books III to VI, the geography of the known world, coast by coast and people by people: Spain, Gaul and Italy; Greece, the Black Sea and the North; Africa, Egypt, Syria and Asia Minor; and the East as far as India, Taprobane and the Seres. The translation of John Bostock and H. T. Riley, with all of its notes; Mayhoff's Latin text is the companion, and the margin gives book and chapter.","kind": "prose","transPair": {"a": "pliny-natural-history-1","b": "pliny-natural-history-1-b"},"transSelf": "a"},"text": {"title": "Natural History (Books I–VI)","greek": "C. PLINII SECUNDI NATURALIS HISTORIA","subtitle": "Naturalis Historia I–VI · encyclopaedia of nature in thirty-seven books · trans. Bostock & Riley","translator": "John Bostock and H. T. Riley (1855–57)","lang": "eng","short": "Bostock & Riley","transPair": {"a": "pliny-natural-history-1","b": "pliny-natural-history-1-b"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 2.12"},"parMirror": "pliny-natural-history-1"}},{"meta": {"key": "pliny-natural-history-1-b","en": "Natural History (Books I–VI)","gr": "NATURALIS HISTORIA, LIBRI I–VI","color": "#3b3a2c","author": "Pliny the Elder","hidden": true,"form": "TREATISE","transPair": {"a": "pliny-natural-history-1","b": "pliny-natural-history-1-b"},"transSelf": "b","kind": "prose"},"text": {"title": "Naturalis Historia (Libri I–VI)","greek": "C. PLINII SECUNDI NATURALIS HISTORIA","translator": "Latin text (Mayhoff)","lang": "lat","short": "Latin","transPair": {"a": "pliny-natural-history-1","b": "pliny-natural-history-1-b"},"transSelf": "b","noSpeakerLabels": true,"parMirror": "pliny-natural-history-1","reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 2.12"}}},{"meta": {"key": "pliny-natural-history-2","en": "Natural History (Books VII–IX)","gr": "NATURALIS HISTORIA, LIBRI VII–IX","color": "#4a3328","author": "Pliny the Elder","form": "TREATISE","blurb": "The books on living creatures begin. Book VII is on man: strange peoples, birth, the span of life, feats of strength, memory and courage, the great men of Rome, and the inventors of the arts. Book VIII treats the land animals, from the elephant, lion and camel to dogs, horses, sheep and the mouse; Book IX the creatures of the water — whales, dolphins, tunnies, the purple-fish, pearls and the fish-ponds of the Roman rich. The translation of John Bostock and H. T. Riley, with all of its notes; Mayhoff's Latin text is the companion, and the margin gives book and chapter.","kind": "prose","transPair": {"a": "pliny-natural-history-2","b": "pliny-natural-history-2-b"},"transSelf": "a"},"text": {"title": "Natural History (Books VII–IX)","greek": "C. PLINII SECUNDI NATURALIS HISTORIA","subtitle": "Naturalis Historia VII–IX · encyclopaedia of nature in thirty-seven books · trans. Bostock & Riley","translator": "John Bostock and H. T. Riley (1855–57)","lang": "eng","short": "Bostock & Riley","transPair": {"a": "pliny-natural-history-2","b": "pliny-natural-history-2-b"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 7.12"},"parMirror": "pliny-natural-history-2"}},{"meta": {"key": "pliny-natural-history-2-b","en": "Natural History (Books VII–IX)","gr": "NATURALIS HISTORIA, LIBRI VII–IX","color": "#4a3328","author": "Pliny the Elder","hidden": true,"form": "TREATISE","transPair": {"a": "pliny-natural-history-2","b": "pliny-natural-history-2-b"},"transSelf": "b","kind": "prose"},"text": {"title": "Naturalis Historia (Libri VII–IX)","greek": "C. PLINII SECUNDI NATURALIS HISTORIA","translator": "Latin text (Mayhoff)","lang": "lat","short": "Latin","transPair": {"a": "pliny-natural-history-2","b": "pliny-natural-history-2-b"},"transSelf": "b","noSpeakerLabels": true,"parMirror": "pliny-natural-history-2","reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 7.12"}}},{"meta": {"key": "pliny-natural-history-3","en": "Natural History (Books X–XI)","gr": "NATURALIS HISTORIA, LIBRI X–XI","color": "#2f3d3a","author": "Pliny the Elder","form": "TREATISE","blurb": "Book X is the natural history of birds — the ostrich, the phoenix, eagles, the auguries drawn from birds, migration, nests, song, the fattening of poultry — with chapters on the generation, senses, food and sleep of animals in general. Book XI turns to insects, above all bees and their government, silkworms, spiders, locusts and ants, and then passes limb by limb through the comparative anatomy of animals, from the horns and the eyes to the heart, the blood, the voice and the hoofs. The translation of John Bostock and H. T. Riley, with all of its notes; Mayhoff's Latin text is the companion, and the margin gives book and chapter.","kind": "prose","transPair": {"a": "pliny-natural-history-3","b": "pliny-natural-history-3-b"},"transSelf": "a"},"text": {"title": "Natural History (Books X–XI)","greek": "C. PLINII SECUNDI NATURALIS HISTORIA","subtitle": "Naturalis Historia X–XI · encyclopaedia of nature in thirty-seven books · trans. Bostock & Riley","translator": "John Bostock and H. T. Riley (1855–57)","lang": "eng","short": "Bostock & Riley","transPair": {"a": "pliny-natural-history-3","b": "pliny-natural-history-3-b"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 10.12"},"parMirror": "pliny-natural-history-3"}},{"meta": {"key": "pliny-natural-history-3-b","en": "Natural History (Books X–XI)","gr": "NATURALIS HISTORIA, LIBRI X–XI","color": "#2f3d3a","author": "Pliny the Elder","hidden": true,"form": "TREATISE","transPair": {"a": "pliny-natural-history-3","b": "pliny-natural-history-3-b"},"transSelf": "b","kind": "prose"},"text": {"title": "Naturalis Historia (Libri X–XI)","greek": "C. PLINII SECUNDI NATURALIS HISTORIA","translator": "Latin text (Mayhoff)","lang": "lat","short": "Latin","transPair": {"a": "pliny-natural-history-3","b": "pliny-natural-history-3-b"},"transSelf": "b","noSpeakerLabels": true,"parMirror": "pliny-natural-history-3","reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 10.12"}}},{"meta": {"key": "pliny-natural-history-4","en": "Natural History (Books XII–XV)","gr": "NATURALIS HISTORIA, LIBRI XII–XV","color": "#34422c","author": "Pliny the Elder","form": "TREATISE","blurb": "The trees. Book XII describes the exotic trees and the trade in their products: the plane, ebony, pepper, cotton, frankincense, myrrh, cinnamon and balsam, with their prices at Rome. Book XIII treats unguents and perfumes, the palm, papyrus and the making of paper, citrus-wood tables and the plants of the sea. Book XIV is given to the vine and to wine — the kinds of grape, the famous vintages, drunkenness — and Book XV to the olive and its oil and to the fruit-trees: apples, pears, figs, cherries, nuts, the myrtle and the laurel. The translation of John Bostock and H. T. Riley, with all of its notes; Mayhoff's Latin text is the companion, and the margin gives book and chapter.","kind": "prose","transPair": {"a": "pliny-natural-history-4","b": "pliny-natural-history-4-b"},"transSelf": "a"},"text": {"title": "Natural History (Books XII–XV)","greek": "C. PLINII SECUNDI NATURALIS HISTORIA","subtitle": "Naturalis Historia XII–XV · encyclopaedia of nature in thirty-seven books · trans. Bostock & Riley","translator": "John Bostock and H. T. Riley (1855–57)","lang": "eng","short": "Bostock & Riley","transPair": {"a": "pliny-natural-history-4","b": "pliny-natural-history-4-b"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 12.12"},"parMirror": "pliny-natural-history-4"}},{"meta": {"key": "pliny-natural-history-4-b","en": "Natural History (Books XII–XV)","gr": "NATURALIS HISTORIA, LIBRI XII–XV","color": "#34422c","author": "Pliny the Elder","hidden": true,"form": "TREATISE","transPair": {"a": "pliny-natural-history-4","b": "pliny-natural-history-4-b"},"transSelf": "b","kind": "prose"},"text": {"title": "Naturalis Historia (Libri XII–XV)","greek": "C. PLINII SECUNDI NATURALIS HISTORIA","translator": "Latin text (Mayhoff)","lang": "lat","short": "Latin","transPair": {"a": "pliny-natural-history-4","b": "pliny-natural-history-4-b"},"transSelf": "b","noSpeakerLabels": true,"parMirror": "pliny-natural-history-4","reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 12.12"}}},{"meta": {"key": "pliny-natural-history-5","en": "Natural History (Books XVI–XVII)","gr": "NATURALIS HISTORIA, LIBRI XVI–XVII","color": "#3d4028","author": "Pliny the Elder","form": "TREATISE","blurb": "Book XVI is the natural history of the forest trees: the oak and its acorns, the pitch-trees, the ash, the lime, ivy, reeds and willows; how trees bud, flower and bear, their ages and sizes, timber and its uses in building and shipwrights' work, and the mistletoe of the Druids. Book XVII treats the cultivated trees: soils and aspects, manure, nurseries, planting, the many ways of grafting, the training and pruning of the vine, and the diseases of trees with their remedies. The translation of John Bostock and H. T. Riley, with all of its notes; Mayhoff's Latin text is the companion, and the margin gives book and chapter.","kind": "prose","transPair": {"a": "pliny-natural-history-5","b": "pliny-natural-history-5-b"},"transSelf": "a"},"text": {"title": "Natural History (Books XVI–XVII)","greek": "C. PLINII SECUNDI NATURALIS HISTORIA","subtitle": "Naturalis Historia XVI–XVII · encyclopaedia of nature in thirty-seven books · trans. Bostock & Riley","translator": "John Bostock and H. T. Riley (1855–57)","lang": "eng","short": "Bostock & Riley","transPair": {"a": "pliny-natural-history-5","b": "pliny-natural-history-5-b"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 16.12"},"parMirror": "pliny-natural-history-5"}},{"meta": {"key": "pliny-natural-history-5-b","en": "Natural History (Books XVI–XVII)","gr": "NATURALIS HISTORIA, LIBRI XVI–XVII","color": "#3d4028","author": "Pliny the Elder","hidden": true,"form": "TREATISE","transPair": {"a": "pliny-natural-history-5","b": "pliny-natural-history-5-b"},"transSelf": "b","kind": "prose"},"text": {"title": "Naturalis Historia (Libri XVI–XVII)","greek": "C. PLINII SECUNDI NATURALIS HISTORIA","translator": "Latin text (Mayhoff)","lang": "lat","short": "Latin","transPair": {"a": "pliny-natural-history-5","b": "pliny-natural-history-5-b"},"transSelf": "b","noSpeakerLabels": true,"parMirror": "pliny-natural-history-5","reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 16.12"}}},{"meta": {"key": "pliny-natural-history-6","en": "Natural History (Books XVIII–XIX)","gr": "NATURALIS HISTORIA, LIBRI XVIII–XIX","color": "#4b3d24","author": "Pliny the Elder","form": "TREATISE","blurb": "Book XVIII is on grain and the farmer's year: the old Roman regard for agriculture, the kinds of corn and pulse, bread and porridge, ploughing, sowing and harvest, the storing of grain, and a long calendar of the risings and settings of the stars with the signs of the weather. Book XIX treats flax and its uses — sails, nets, linen, asbestos cloth — and then the kitchen-garden: its watering and its plants, from the cucumber, radish and onion to cabbage, asparagus and the garden herbs. The translation of John Bostock and H. T. Riley, with all of its notes; Mayhoff's Latin text is the companion, and the margin gives book and chapter.","kind": "prose","transPair": {"a": "pliny-natural-history-6","b": "pliny-natural-history-6-b"},"transSelf": "a"},"text": {"title": "Natural History (Books XVIII–XIX)","greek": "C. PLINII SECUNDI NATURALIS HISTORIA","subtitle": "Naturalis Historia XVIII–XIX · encyclopaedia of nature in thirty-seven books · trans. Bostock & Riley","translator": "John Bostock and H. T. Riley (1855–57)","lang": "eng","short": "Bostock & Riley","transPair": {"a": "pliny-natural-history-6","b": "pliny-natural-history-6-b"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 18.12"},"parMirror": "pliny-natural-history-6"}},{"meta": {"key": "pliny-natural-history-6-b","en": "Natural History (Books XVIII–XIX)","gr": "NATURALIS HISTORIA, LIBRI XVIII–XIX","color": "#4b3d24","author": "Pliny the Elder","hidden": true,"form": "TREATISE","transPair": {"a": "pliny-natural-history-6","b": "pliny-natural-history-6-b"},"transSelf": "b","kind": "prose"},"text": {"title": "Naturalis Historia (Libri XVIII–XIX)","greek": "C. PLINII SECUNDI NATURALIS HISTORIA","translator": "Latin text (Mayhoff)","lang": "lat","short": "Latin","transPair": {"a": "pliny-natural-history-6","b": "pliny-natural-history-6-b"},"transSelf": "b","noSpeakerLabels": true,"parMirror": "pliny-natural-history-6","reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 18.12"}}},{"meta": {"key": "pliny-natural-history-7","en": "Natural History (Books XX–XXII)","gr": "NATURALIS HISTORIA, LIBRI XX–XXII","color": "#2e4034","author": "Pliny the Elder","form": "TREATISE","blurb": "The books of remedies begin. Book XX sets out the medicines drawn from the garden plants — cucumber, onion, garlic, lettuce, cabbage, rue, mint, the poppy and many more — counting the remedies of each and ending with the composition of theriac. Book XXI is on flowers and garlands, the rose, the lily and the violet, on bees and honey, and the remedies from flowers; Book XXII on the plants used for dyes and for honours, the grass crown, and the remedies from wild herbs and from the kinds of grain. The translation of John Bostock and H. T. Riley, with all of its notes; Mayhoff's Latin text is the companion, and the margin gives book and chapter.","kind": "prose","transPair": {"a": "pliny-natural-history-7","b": "pliny-natural-history-7-b"},"transSelf": "a"},"text": {"title": "Natural History (Books XX–XXII)","greek": "C. PLINII SECUNDI NATURALIS HISTORIA","subtitle": "Naturalis Historia XX–XXII · encyclopaedia of nature in thirty-seven books · trans. Bostock & Riley","translator": "John Bostock and H. T. Riley (1855–57)","lang": "eng","short": "Bostock & Riley","transPair": {"a": "pliny-natural-history-7","b": "pliny-natural-history-7-b"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 20.12"},"parMirror": "pliny-natural-history-7"}},{"meta": {"key": "pliny-natural-history-7-b","en": "Natural History (Books XX–XXII)","gr": "NATURALIS HISTORIA, LIBRI XX–XXII","color": "#2e4034","author": "Pliny the Elder","hidden": true,"form": "TREATISE","transPair": {"a": "pliny-natural-history-7","b": "pliny-natural-history-7-b"},"transSelf": "b","kind": "prose"},"text": {"title": "Naturalis Historia (Libri XX–XXII)","greek": "C. PLINII SECUNDI NATURALIS HISTORIA","translator": "Latin text (Mayhoff)","lang": "lat","short": "Latin","transPair": {"a": "pliny-natural-history-7","b": "pliny-natural-history-7-b"},"transSelf": "b","noSpeakerLabels": true,"parMirror": "pliny-natural-history-7","reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 20.12"}}},{"meta": {"key": "pliny-natural-history-8","en": "Natural History (Books XXIII–XXV)","gr": "NATURALIS HISTORIA, LIBRI XXIII–XXV","color": "#3a3144","author": "Pliny the Elder","form": "TREATISE","blurb": "Book XXIII gives the remedies derived from the cultivated trees: the vine, the wines and vinegar, the olive and its oils, the palm, and the fruits and nuts. Book XXIV gives those from the forest trees and wild shrubs, with the magical plants and the beliefs of the Magi about them. Book XXV is the history of the knowledge of herbs — Greek and Roman writers on plants, the herbs named after their discoverers, hellebore, mithridatium, betony — and the remedies for the diseases of the head, the eyes, the teeth and the mouth. The translation of John Bostock and H. T. Riley, with all of its notes; Mayhoff's Latin text is the companion, and the margin gives book and chapter.","kind": "prose","transPair": {"a": "pliny-natural-history-8","b": "pliny-natural-history-8-b"},"transSelf": "a"},"text": {"title": "Natural History (Books XXIII–XXV)","greek": "C. PLINII SECUNDI NATURALIS HISTORIA","subtitle": "Naturalis Historia XXIII–XXV · encyclopaedia of nature in thirty-seven books · trans. Bostock & Riley","translator": "John Bostock and H. T. Riley (1855–57)","lang": "eng","short": "Bostock & Riley","transPair": {"a": "pliny-natural-history-8","b": "pliny-natural-history-8-b"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 23.12"},"parMirror": "pliny-natural-history-8"}},{"meta": {"key": "pliny-natural-history-8-b","en": "Natural History (Books XXIII–XXV)","gr": "NATURALIS HISTORIA, LIBRI XXIII–XXV","color": "#3a3144","author": "Pliny the Elder","hidden": true,"form": "TREATISE","transPair": {"a": "pliny-natural-history-8","b": "pliny-natural-history-8-b"},"transSelf": "b","kind": "prose"},"text": {"title": "Naturalis Historia (Libri XXIII–XXV)","greek": "C. PLINII SECUNDI NATURALIS HISTORIA","translator": "Latin text (Mayhoff)","lang": "lat","short": "Latin","transPair": {"a": "pliny-natural-history-8","b": "pliny-natural-history-8-b"},"transSelf": "b","noSpeakerLabels": true,"parMirror": "pliny-natural-history-8","reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 23.12"}}},{"meta": {"key": "pliny-natural-history-9","en": "Natural History (Books XXVI–XXVIII)","gr": "NATURALIS HISTORIA, LIBRI XXVI–XXVIII","color": "#44303a","author": "Pliny the Elder","form": "TREATISE","blurb": "Book XXVI opens with the new diseases that reached Italy and the changing fashions of medicine, Asclepiades above all, and then classifies the remedies from plants by disease, from the throat and chest to the bowels, the skin and women's complaints. Book XXVII is an alphabetical list of the remaining plants with their remedies, from aconite onward. Book XXVIII turns to the remedies derived from living creatures, beginning with man — spittle, charms, the power of words — and passing to the elephant, lion, camel, hyaena, crocodile and the domestic animals. The translation of John Bostock and H. T. Riley, with all of its notes; Mayhoff's Latin text is the companion, and the margin gives book and chapter.","kind": "prose","transPair": {"a": "pliny-natural-history-9","b": "pliny-natural-history-9-b"},"transSelf": "a"},"text": {"title": "Natural History (Books XXVI–XXVIII)","greek": "C. PLINII SECUNDI NATURALIS HISTORIA","subtitle": "Naturalis Historia XXVI–XXVIII · encyclopaedia of nature in thirty-seven books · trans. Bostock & Riley","translator": "John Bostock and H. T. Riley (1855–57)","lang": "eng","short": "Bostock & Riley","transPair": {"a": "pliny-natural-history-9","b": "pliny-natural-history-9-b"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 26.12"},"parMirror": "pliny-natural-history-9"}},{"meta": {"key": "pliny-natural-history-9-b","en": "Natural History (Books XXVI–XXVIII)","gr": "NATURALIS HISTORIA, LIBRI XXVI–XXVIII","color": "#44303a","author": "Pliny the Elder","hidden": true,"form": "TREATISE","transPair": {"a": "pliny-natural-history-9","b": "pliny-natural-history-9-b"},"transSelf": "b","kind": "prose"},"text": {"title": "Naturalis Historia (Libri XXVI–XXVIII)","greek": "C. PLINII SECUNDI NATURALIS HISTORIA","translator": "Latin text (Mayhoff)","lang": "lat","short": "Latin","transPair": {"a": "pliny-natural-history-9","b": "pliny-natural-history-9-b"},"transSelf": "b","noSpeakerLabels": true,"parMirror": "pliny-natural-history-9","reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 26.12"}}},{"meta": {"key": "pliny-natural-history-10","en": "Natural History (Books XXIX–XXXII)","gr": "NATURALIS HISTORIA, LIBRI XXIX–XXXII","color": "#4a2f2f","author": "Pliny the Elder","form": "TREATISE","blurb": "Book XXIX begins with a history of the medical art and Pliny's censure of the Greek physicians at Rome, and continues the remedies from animals: wool, eggs, dogs, serpents, the antidotes to poisons. Book XXX gives an account of magic — its origin with Zoroaster, its spread, its falsehood — and further remedies from animals, classified by disease. Book XXXI treats waters: springs, medicinal waters, how to find water, aqueducts, salt, nitre and sponges; Book XXXII the remedies from aquatic animals, with a list of all the creatures of the sea. The translation of John Bostock and H. T. Riley, with all of its notes; Mayhoff's Latin text is the companion, and the margin gives book and chapter.","kind": "prose","transPair": {"a": "pliny-natural-history-10","b": "pliny-natural-history-10-b"},"transSelf": "a"},"text": {"title": "Natural History (Books XXIX–XXXII)","greek": "C. PLINII SECUNDI NATURALIS HISTORIA","subtitle": "Naturalis Historia XXIX–XXXII · encyclopaedia of nature in thirty-seven books · trans. Bostock & Riley","translator": "John Bostock and H. T. Riley (1855–57)","lang": "eng","short": "Bostock & Riley","transPair": {"a": "pliny-natural-history-10","b": "pliny-natural-history-10-b"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 29.12"},"parMirror": "pliny-natural-history-10"}},{"meta": {"key": "pliny-natural-history-10-b","en": "Natural History (Books XXIX–XXXII)","gr": "NATURALIS HISTORIA, LIBRI XXIX–XXXII","color": "#4a2f2f","author": "Pliny the Elder","hidden": true,"form": "TREATISE","transPair": {"a": "pliny-natural-history-10","b": "pliny-natural-history-10-b"},"transSelf": "b","kind": "prose"},"text": {"title": "Naturalis Historia (Libri XXIX–XXXII)","greek": "C. PLINII SECUNDI NATURALIS HISTORIA","translator": "Latin text (Mayhoff)","lang": "lat","short": "Latin","transPair": {"a": "pliny-natural-history-10","b": "pliny-natural-history-10-b"},"transSelf": "b","noSpeakerLabels": true,"parMirror": "pliny-natural-history-10","reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 29.12"}}},{"meta": {"key": "pliny-natural-history-11","en": "Natural History (Books XXXIII–XXXV)","gr": "NATURALIS HISTORIA, LIBRI XXXIII–XXXV","color": "#3f3a33","author": "Pliny the Elder","form": "TREATISE","blurb": "The books on metals and on art. Book XXXIII treats gold and silver: rings, coinage, the mining of gold in Spain, quicksilver, minium, mirrors, and the luxury of plate. Book XXXIV is on copper and bronze — Corinthian bronze, candelabra, and a long history of statuary in bronze and its masters — and on iron, lead and tin. Book XXXV is on painting and colours: the pigments, the history of the art from its beginnings, Apelles, Protogenes and the other painters, modelling in clay, pottery, and the earths used in medicine. The translation of John Bostock and H. T. Riley, with all of its notes; Mayhoff's Latin text is the companion, and the margin gives book and chapter.","kind": "prose","transPair": {"a": "pliny-natural-history-11","b": "pliny-natural-history-11-b"},"transSelf": "a"},"text": {"title": "Natural History (Books XXXIII–XXXV)","greek": "C. PLINII SECUNDI NATURALIS HISTORIA","subtitle": "Naturalis Historia XXXIII–XXXV · encyclopaedia of nature in thirty-seven books · trans. Bostock & Riley","translator": "John Bostock and H. T. Riley (1855–57)","lang": "eng","short": "Bostock & Riley","transPair": {"a": "pliny-natural-history-11","b": "pliny-natural-history-11-b"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 33.12"},"parMirror": "pliny-natural-history-11"}},{"meta": {"key": "pliny-natural-history-11-b","en": "Natural History (Books XXXIII–XXXV)","gr": "NATURALIS HISTORIA, LIBRI XXXIII–XXXV","color": "#3f3a33","author": "Pliny the Elder","hidden": true,"form": "TREATISE","transPair": {"a": "pliny-natural-history-11","b": "pliny-natural-history-11-b"},"transSelf": "b","kind": "prose"},"text": {"title": "Naturalis Historia (Libri XXXIII–XXXV)","greek": "C. PLINII SECUNDI NATURALIS HISTORIA","translator": "Latin text (Mayhoff)","lang": "lat","short": "Latin","transPair": {"a": "pliny-natural-history-11","b": "pliny-natural-history-11-b"},"transSelf": "b","noSpeakerLabels": true,"parMirror": "pliny-natural-history-11","reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 33.12"}}},{"meta": {"key": "pliny-natural-history-12","en": "Natural History (Books XXXVI–XXXVII)","gr": "NATURALIS HISTORIA, LIBRI XXXVI–XXXVII","color": "#2d3846","author": "Pliny the Elder","form": "TREATISE","blurb": "The last two books. Book XXXVI is the natural history of stones: marble and the luxury of marble at Rome, the sculptors in marble, obelisks, the pyramids, the labyrinths, the wonders of Rome and its buildings, the magnet, lime, sand, pavements and glass. Book XXXVII is on precious stones: the first gems and signet rings, murrhine and crystal vessels, amber, and the diamond, emerald, opal and the other gems down an alphabetical list; it ends with a comparison of the countries of the world and an address to Nature. The translation of John Bostock and H. T. Riley, with all of its notes; Mayhoff's Latin text is the companion, and the margin gives book and chapter.","kind": "prose","transPair": {"a": "pliny-natural-history-12","b": "pliny-natural-history-12-b"},"transSelf": "a"},"text": {"title": "Natural History (Books XXXVI–XXXVII)","greek": "C. PLINII SECUNDI NATURALIS HISTORIA","subtitle": "Naturalis Historia XXXVI–XXXVII · encyclopaedia of nature in thirty-seven books · trans. Bostock & Riley","translator": "John Bostock and H. T. Riley (1855–57)","lang": "eng","short": "Bostock & Riley","transPair": {"a": "pliny-natural-history-12","b": "pliny-natural-history-12-b"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 36.12"},"parMirror": "pliny-natural-history-12"}},{"meta": {"key": "pliny-natural-history-12-b","en": "Natural History (Books XXXVI–XXXVII)","gr": "NATURALIS HISTORIA, LIBRI XXXVI–XXXVII","color": "#2d3846","author": "Pliny the Elder","hidden": true,"form": "TREATISE","transPair": {"a": "pliny-natural-history-12","b": "pliny-natural-history-12-b"},"transSelf": "b","kind": "prose"},"text": {"title": "Naturalis Historia (Libri XXXVI–XXXVII)","greek": "C. PLINII SECUNDI NATURALIS HISTORIA","translator": "Latin text (Mayhoff)","lang": "lat","short": "Latin","transPair": {"a": "pliny-natural-history-12","b": "pliny-natural-history-12-b"},"transSelf": "b","noSpeakerLabels": true,"parMirror": "pliny-natural-history-12","reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 36.12"}}},{"meta": {"key": "quintilian-institutes-1","en": "Institutes of Oratory (Books I–III)","gr": "INSTITUTIO ORATORIA (LIBRI I–III)","color": "#4a3b2a","author": "Quintilian","form": "TREATISE","blurb": "The first three of the twelve books of Quintilian's Institutio Oratoria, written at Rome about AD 95 after twenty years of teaching. A prefatory letter to the bookseller Trypho is followed by Book I, on the child's earliest schooling, reading and writing, grammar and correct speech, and the music, geometry and acting an orator should learn; Book II, on the school of rhetoric, the choice of a teacher, the first exercises, and whether rhetoric is an art and what its end is; and Book III, on the history and divisions of rhetoric, the doctrine of status or basis, and panegyric, deliberative and forensic oratory. H. E. Butler's Loeb translation with its notes, and his Latin text as companion; the margin gives book, chapter and section.","kind": "treatise","transPair": {"a": "quintilian-institutes-1","b": "quintilian-institutes-1-b"},"transSelf": "a"},"text": {"title": "Institutes of Oratory (Books I–III)","greek": "M. FABII QUINTILIANI INSTITUTIO ORATORIA","subtitle": "Institutio Oratoria, libri I–III · the education of the orator · trans. H. E. Butler","translator": "H. E. Butler (1920)","lang": "eng","short": "Butler","transPair": {"a": "quintilian-institutes-1","b": "quintilian-institutes-1-b"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter.section","abbr": "","placeholder": "e.g. 2.15.34"},"parMirror": "quintilian-institutes-1"}},{"meta": {"key": "quintilian-institutes-1-b","en": "Institutes of Oratory (Books I–III)","gr": "INSTITUTIO ORATORIA (LIBRI I–III)","color": "#4a3b2a","author": "Quintilian","hidden": true,"form": "TREATISE","transPair": {"a": "quintilian-institutes-1","b": "quintilian-institutes-1-b"},"transSelf": "b","kind": "treatise"},"text": {"title": "Institutio Oratoria (Libri I–III)","greek": "M. FABII QUINTILIANI INSTITUTIO ORATORIA","translator": "Latin text (Butler)","lang": "lat","short": "Latin","transPair": {"a": "quintilian-institutes-1","b": "quintilian-institutes-1-b"},"transSelf": "b","noSpeakerLabels": true,"parMirror": "quintilian-institutes-1","reference": {"label": "Book.chapter.section","abbr": "","placeholder": "e.g. 2.15.34"}}},{"meta": {"key": "quintilian-institutes-2","en": "Institutes of Oratory (Books IV–VI)","gr": "INSTITUTIO ORATORIA (LIBRI IV–VI)","color": "#3b4032","author": "Quintilian","form": "TREATISE","blurb": "Books IV to VI of Quintilian's Institutio Oratoria, which take the reader through the parts of a forensic speech. Book IV treats the exordium, the statement of facts, digression, proposition and partition; Book V the proofs, both those found ready to hand (previous judgments, rumour, torture, documents, oaths, witnesses) and those the orator must make, with signs, arguments, examples, refutation and the enthymeme; Book VI the peroration and the stirring of the emotions, opening with Quintilian's account of the deaths of his wife and two sons, and including the long chapter on laughter and wit. H. E. Butler's Loeb translation with its notes, and his Latin text as companion; the margin gives book, chapter and section.","kind": "treatise","transPair": {"a": "quintilian-institutes-2","b": "quintilian-institutes-2-b"},"transSelf": "a"},"text": {"title": "Institutes of Oratory (Books IV–VI)","greek": "M. FABII QUINTILIANI INSTITUTIO ORATORIA","subtitle": "Institutio Oratoria, libri IV–VI · the education of the orator · trans. H. E. Butler","translator": "H. E. Butler (1921)","lang": "eng","short": "Butler","transPair": {"a": "quintilian-institutes-2","b": "quintilian-institutes-2-b"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter.section","abbr": "","placeholder": "e.g. 6.2.26"},"parMirror": "quintilian-institutes-2"}},{"meta": {"key": "quintilian-institutes-2-b","en": "Institutes of Oratory (Books IV–VI)","gr": "INSTITUTIO ORATORIA (LIBRI IV–VI)","color": "#3b4032","author": "Quintilian","hidden": true,"form": "TREATISE","transPair": {"a": "quintilian-institutes-2","b": "quintilian-institutes-2-b"},"transSelf": "b","kind": "treatise"},"text": {"title": "Institutio Oratoria (Libri IV–VI)","greek": "M. FABII QUINTILIANI INSTITUTIO ORATORIA","translator": "Latin text (Butler)","lang": "lat","short": "Latin","transPair": {"a": "quintilian-institutes-2","b": "quintilian-institutes-2-b"},"transSelf": "b","noSpeakerLabels": true,"parMirror": "quintilian-institutes-2","reference": {"label": "Book.chapter.section","abbr": "","placeholder": "e.g. 6.2.26"}}},{"meta": {"key": "quintilian-institutes-3","en": "Institutes of Oratory (Books VII–IX)","gr": "INSTITUTIO ORATORIA (LIBRI VII–IX)","color": "#33404a","author": "Quintilian","form": "TREATISE","blurb": "Books VII to IX of Quintilian's Institutio Oratoria. Book VII is on arrangement: how a case is divided and ordered under each basis, conjecture, definition and quality, and the questions that arise from the letter and intention of laws, contradictory laws, syllogism and ambiguity. Book VIII opens the treatment of style, with clearness, ornament, amplification, striking sayings and the tropes, metaphor first among them. Book IX deals with the figures of thought and of speech, quoting Cicero at length, and ends with a long chapter on composition, the order and joining of words and prose rhythm. H. E. Butler's Loeb translation with its notes, and his Latin text as companion; the margin gives book, chapter and section.","kind": "treatise","transPair": {"a": "quintilian-institutes-3","b": "quintilian-institutes-3-b"},"transSelf": "a"},"text": {"title": "Institutes of Oratory (Books VII–IX)","greek": "M. FABII QUINTILIANI INSTITUTIO ORATORIA","subtitle": "Institutio Oratoria, libri VII–IX · the education of the orator · trans. H. E. Butler","translator": "H. E. Butler (1921)","lang": "eng","short": "Butler","transPair": {"a": "quintilian-institutes-3","b": "quintilian-institutes-3-b"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter.section","abbr": "","placeholder": "e.g. 8.3.61"},"parMirror": "quintilian-institutes-3"}},{"meta": {"key": "quintilian-institutes-3-b","en": "Institutes of Oratory (Books VII–IX)","gr": "INSTITUTIO ORATORIA (LIBRI VII–IX)","color": "#33404a","author": "Quintilian","hidden": true,"form": "TREATISE","transPair": {"a": "quintilian-institutes-3","b": "quintilian-institutes-3-b"},"transSelf": "b","kind": "treatise"},"text": {"title": "Institutio Oratoria (Libri VII–IX)","greek": "M. FABII QUINTILIANI INSTITUTIO ORATORIA","translator": "Latin text (Butler)","lang": "lat","short": "Latin","transPair": {"a": "quintilian-institutes-3","b": "quintilian-institutes-3-b"},"transSelf": "b","noSpeakerLabels": true,"parMirror": "quintilian-institutes-3","reference": {"label": "Book.chapter.section","abbr": "","placeholder": "e.g. 8.3.61"}}},{"meta": {"key": "quintilian-institutes-4","en": "Institutes of Oratory (Books X–XII)","gr": "INSTITUTIO ORATORIA (LIBRI X–XII)","color": "#4a3338","author": "Quintilian","form": "TREATISE","blurb": "The last three books of Quintilian's Institutio Oratoria. Book X is on acquiring facility: its first chapter surveys the Greek and Latin authors an orator should read, poet by poet and genre by genre, and the rest treat imitation, writing, correction, translation and other exercises, premeditation and speaking extempore. Book XI is on speaking appropriately, on memory and its methods, and on delivery, voice, gesture and dress. Book XII describes the finished orator, a good man skilled in speaking: his character, his knowledge of philosophy, law and history, the cases he should take, the kinds of style, and the time to retire. H. E. Butler's Loeb translation with its notes, and his Latin text as companion; the margin gives book, chapter and section.","kind": "treatise","transPair": {"a": "quintilian-institutes-4","b": "quintilian-institutes-4-b"},"transSelf": "a"},"text": {"title": "Institutes of Oratory (Books X–XII)","greek": "M. FABII QUINTILIANI INSTITUTIO ORATORIA","subtitle": "Institutio Oratoria, libri X–XII · the education of the orator · trans. H. E. Butler","translator": "H. E. Butler (1922)","lang": "eng","short": "Butler","transPair": {"a": "quintilian-institutes-4","b": "quintilian-institutes-4-b"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter.section","abbr": "","placeholder": "e.g. 10.1.46"},"parMirror": "quintilian-institutes-4"}},{"meta": {"key": "quintilian-institutes-4-b","en": "Institutes of Oratory (Books X–XII)","gr": "INSTITUTIO ORATORIA (LIBRI X–XII)","color": "#4a3338","author": "Quintilian","hidden": true,"form": "TREATISE","transPair": {"a": "quintilian-institutes-4","b": "quintilian-institutes-4-b"},"transSelf": "b","kind": "treatise"},"text": {"title": "Institutio Oratoria (Libri X–XII)","greek": "M. FABII QUINTILIANI INSTITUTIO ORATORIA","translator": "Latin text (Butler)","lang": "lat","short": "Latin","transPair": {"a": "quintilian-institutes-4","b": "quintilian-institutes-4-b"},"transSelf": "b","noSpeakerLabels": true,"parMirror": "quintilian-institutes-4","reference": {"label": "Book.chapter.section","abbr": "","placeholder": "e.g. 10.1.46"}}},{"meta": {"key": "galen-natural-faculties","en": "On the Natural Faculties","gr": "ΠΕΡΙ ΦΥΣΙΚΩΝ ΔΥΝΑΜΕΩΝ","color": "#33414d","author": "Galen","form": "TREATISE","blurb": "Galen’s treatise in three books on the powers by which a living body is formed, grows and is nourished. Against the atomists and Erasistratus, he argues that nature works through faculties of attraction, retention, alteration and expulsion, demonstrated by dissection and by tying the ureters. Brock’s Loeb translation of 1916, with the Greek as companion.","transPair": {"a": "galen-natural-faculties","e": "galen-natural-faculties-e"},"transSelf": "a","kind": "treatise"},"text": {"title": "On the Natural Faculties","greek": "ΓΑΛΗΝΟΥ ΠΕΡΙ ΦΥΣΙΚΩΝ ΔΥΝΑΜΕΩΝ","subtitle": "Peri physikōn dynameōn · a treatise on physiology in three books · trans. A. J. Brock","translator": "A. J. Brock (1916)","lang": "eng","short": "Brock","transPair": {"a": "galen-natural-faculties","e": "galen-natural-faculties-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 1.13"},"parMirror": "galen-natural-faculties"}},{"meta": {"key": "galen-natural-faculties-e","en": "On the Natural Faculties","gr": "ΠΕΡΙ ΦΥΣΙΚΩΝ ΔΥΝΑΜΕΩΝ","color": "#33414d","author": "Galen","hidden": true,"form": "TREATISE","transPair": {"a": "galen-natural-faculties","e": "galen-natural-faculties-e"},"transSelf": "e","kind": "treatise"},"text": {"title": "Περὶ φυσικῶν δυνάμεων","greek": "ΓΑΛΗΝΟΥ ΠΕΡΙ ΦΥΣΙΚΩΝ ΔΥΝΑΜΕΩΝ","translator": "Greek text (Brock)","lang": "grc","short": "Greek","transPair": {"a": "galen-natural-faculties","e": "galen-natural-faculties-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "galen-natural-faculties","reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 1.13"}}},{"meta": {"key": "lucian-1","en": "Works, Volume I","gr": "ΑΠΑΝΤΑ, ΤΟΜΟΣ Αʹ","color": "#3f3a4f","author": "Lucian","form": "ESSAYS","blurb": "The first quarter of the works of Lucian of Samosata, the Syrian rhetorician of the second century who wrote Greek satire in dialogue and essay: among them Nigrinus, the Life of Demonax, the True History with its voyage to the moon, Icaromenippus and Timon. The Fowlers' translation (Oxford, 1905), with Harmon’s Greek as companion.","transPair": {"a": "lucian-1","e": "lucian-1-e"},"transSelf": "a","kind": "prose"},"text": {"title": "Works, Volume I","greek": "ΛΟΥΚΙΑΝΟΥ ΑΠΑΝΤΑ, ΤΟΜΟΣ Αʹ","subtitle": "Phalaris, Dionysus, Heracles, Swans and Amber, The Fly, Nigrinus and 14 more · Hapanta · dialogues and essays · trans. Fowler","translator": "H. W. Fowler and F. G. Fowler (1905)","lang": "eng","short": "Fowler","transPair": {"a": "lucian-1","e": "lucian-1-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Work.section","abbr": "","placeholder": "e.g. 7.12"},"parMirror": "lucian-1"}},{"meta": {"key": "lucian-1-e","en": "Works, Volume I","gr": "ΑΠΑΝΤΑ, ΤΟΜΟΣ Αʹ","color": "#3f3a4f","author": "Lucian","hidden": true,"form": "ESSAYS","transPair": {"a": "lucian-1","e": "lucian-1-e"},"transSelf": "e","kind": "prose"},"text": {"title": "Ἅπαντα, τόμος Αʹ","greek": "ΛΟΥΚΙΑΝΟΥ ΑΠΑΝΤΑ, ΤΟΜΟΣ Αʹ","translator": "Greek text (Harmon)","lang": "grc","short": "Greek","transPair": {"a": "lucian-1","e": "lucian-1-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "lucian-1","reference": {"label": "Work.section","abbr": "","placeholder": "e.g. 7.12"}}},{"meta": {"key": "lucian-2","en": "Works, Volume II","gr": "ΑΠΑΝΤΑ, ΤΟΜΟΣ Βʹ","color": "#34463f","author": "Lucian","form": "ESSAYS","blurb": "The second quarter of the works of Lucian of Samosata in the standard order: thirteen pieces on the philosophers and their hangers-on — Charon, the Sale of Creeds and The Fisher, The Liar, The Dependent Scholar and Menippus’ descent to the dead. The Fowlers' translation (Oxford, 1905), with Harmon’s Greek as companion.","transPair": {"a": "lucian-2","e": "lucian-2-e"},"transSelf": "a","kind": "prose"},"text": {"title": "Works, Volume II","greek": "ΛΟΥΚΙΑΝΟΥ ΑΠΑΝΤΑ, ΤΟΜΟΣ Βʹ","subtitle": "Charon, Sale of Creeds, The Fisher, The Double Indictment, Of Sacrifice, The Illiterate Book-Fancier and 7 more · Hapanta · dialogues and essays · trans. Fowler","translator": "H. W. Fowler and F. G. Fowler (1905)","lang": "eng","short": "Fowler","transPair": {"a": "lucian-2","e": "lucian-2-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Work.section","abbr": "","placeholder": "e.g. 24.12"},"parMirror": "lucian-2"}},{"meta": {"key": "lucian-2-e","en": "Works, Volume II","gr": "ΑΠΑΝΤΑ, ΤΟΜΟΣ Βʹ","color": "#34463f","author": "Lucian","hidden": true,"form": "ESSAYS","transPair": {"a": "lucian-2","e": "lucian-2-e"},"transSelf": "e","kind": "prose"},"text": {"title": "Ἅπαντα, τόμος Βʹ","greek": "ΛΟΥΚΙΑΝΟΥ ΑΠΑΝΤΑ, ΤΟΜΟΣ Βʹ","translator": "Greek text (Harmon)","lang": "grc","short": "Greek","transPair": {"a": "lucian-2","e": "lucian-2-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "lucian-2","reference": {"label": "Work.section","abbr": "","placeholder": "e.g. 24.12"}}},{"meta": {"key": "lucian-3","en": "Works, Volume III","gr": "ΑΠΑΝΤΑ, ΤΟΜΟΣ Γʹ","color": "#4a3728","author": "Lucian","form": "ESSAYS","blurb": "The third quarter of the works of Lucian of Samosata in the standard order: among them the exposure of the false prophet Alexander, The Death of Peregrine, the stories of friendship in Toxaris, The Way to Write History and the Saturnalia. The Fowlers' translation (Oxford, 1905), with Harmon’s Greek as companion.","transPair": {"a": "lucian-3","e": "lucian-3-e"},"transSelf": "a","kind": "prose"},"text": {"title": "Works, Volume III","greek": "ΛΟΥΚΙΑΝΟΥ ΑΠΑΝΤΑ, ΤΟΜΟΣ Γʹ","subtitle": "The Rhetorician’s Vade Mecum, Alexander, A Portrait-Study, Defence of the ‘Portrait-Study’, The Death of Peregrine, The Runaways and 9 more · Hapanta · dialogues and essays · trans. Fowler","translator": "H. W. Fowler and F. G. Fowler (1905)","lang": "eng","short": "Fowler","transPair": {"a": "lucian-3","e": "lucian-3-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Work.section","abbr": "","placeholder": "e.g. 38.12"},"parMirror": "lucian-3"}},{"meta": {"key": "lucian-3-e","en": "Works, Volume III","gr": "ΑΠΑΝΤΑ, ΤΟΜΟΣ Γʹ","color": "#4a3728","author": "Lucian","hidden": true,"form": "ESSAYS","transPair": {"a": "lucian-3","e": "lucian-3-e"},"transSelf": "e","kind": "prose"},"text": {"title": "Ἅπαντα, τόμος Γʹ","greek": "ΛΟΥΚΙΑΝΟΥ ΑΠΑΝΤΑ, ΤΟΜΟΣ Γʹ","translator": "Greek text (Harmon; Jacobitz)","lang": "grc","short": "Greek","transPair": {"a": "lucian-3","e": "lucian-3-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "lucian-3","reference": {"label": "Work.section","abbr": "","placeholder": "e.g. 38.12"}}},{"meta": {"key": "lucian-4","en": "Works, Volume IV","gr": "ΑΠΑΝΤΑ, ΤΟΜΟΣ Δʹ","color": "#2f3e4e","author": "Lucian","form": "ESSAYS","blurb": "The last quarter of the works of Lucian of Samosata in the standard order: among them the long Hermotimus on the rival schools of philosophy and the four sets of short dialogues — of the Dead, the Sea-Gods, the Gods and the Hetaerae. The Fowlers' translation (Oxford, 1905), with Jacobitz’s Greek as companion.","transPair": {"a": "lucian-4","e": "lucian-4-e"},"transSelf": "a","kind": "prose"},"text": {"title": "Works, Volume IV","greek": "ΛΟΥΚΙΑΝΟΥ ΑΠΑΝΤΑ, ΤΟΜΟΣ Δʹ","subtitle": "Herodotus and Aetion, Zeuxis and Antiochus, A Slip of the Tongue in Salutation, Apology for ‘The Dependent Scholar’, Harmonides, A Word with Hesiod and 9 more · Hapanta · dialogues and essays · trans. Fowler","translator": "H. W. Fowler and F. G. Fowler (1905)","lang": "eng","short": "Fowler","transPair": {"a": "lucian-4","e": "lucian-4-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Work.section","abbr": "","placeholder": "e.g. 63.20"},"parMirror": "lucian-4"}},{"meta": {"key": "lucian-4-e","en": "Works, Volume IV","gr": "ΑΠΑΝΤΑ, ΤΟΜΟΣ Δʹ","color": "#2f3e4e","author": "Lucian","hidden": true,"form": "ESSAYS","transPair": {"a": "lucian-4","e": "lucian-4-e"},"transSelf": "e","kind": "prose"},"text": {"title": "Ἅπαντα, τόμος Δʹ","greek": "ΛΟΥΚΙΑΝΟΥ ΑΠΑΝΤΑ, ΤΟΜΟΣ Δʹ","translator": "Greek text (Jacobitz)","lang": "grc","short": "Greek","transPair": {"a": "lucian-4","e": "lucian-4-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "lucian-4","reference": {"label": "Work.section","abbr": "","placeholder": "e.g. 63.20"}}},{"meta": {"key": "seneca-tragedies","en": "The Tragedies","gr": "TRAGOEDIAE","color": "#5c2e2e","author": "Seneca","kind": "treatise","form": "TRAGEDY","blurb": "The ten Latin tragedies — Medea, Phaedra, Thyestes, Oedipus, the Trojan Women and the Hercules plays among them — rhetorical, bloody and Stoic, the model for Renaissance drama."},"text": {"title": "The Tragedies","greek": "TRAGOEDIAE","subtitle": "Ten Roman Tragedies · trans. F. J. Miller (1917)","translator": "Frank Justus Miller","noSpeakerLabels": true,"reference": {"label": "Play","abbr": "","placeholder": ""}}},{"meta": {"key": "euclid-elements","en": "The Elements","gr": "ΣΤΟΙΧΕΙΑ","color": "#2f6b54","author": "Euclid","kind": "treatise","form": "MATHEMATICS","transPair": {"a": "euclid-elements","b": "euclid-elements-gr"},"transSelf": "a","blurb": "The thirteen books of Euclid’s geometry, from the definitions and the first postulates to the five regular solids, in Heath’s translation: for two thousand years the model of demonstrative reasoning."},"text": {"title": "The Elements","greek": "ΣΤΟΙΧΕΙΑ","subtitle": "Books I–XIII · trans. T. L. Heath","translator": "Thomas L. Heath","noSpeakerLabels": true,"reference": {"label": "Book","abbr": "Bk.","placeholder": "e.g. 6"},"transPair": {"a": "euclid-elements","b": "euclid-elements-gr"},"transSelf": "a","lang": "eng","short": "Heath"}},{"meta": {"key": "euclid-elements-gr","en": "The Elements · Greek","gr": "ΣΤΟΙΧΕΙΑ","color": "#2f6b54","author": "Euclid","kind": "treatise","form": "MATHEMATICS","hidden": true,"transPair": {"a": "euclid-elements","b": "euclid-elements-gr"},"transSelf": "b"},"text": {"title": "The Elements","greek": "ΣΤΟΙΧΕΙΑ","subtitle": "Greek text · ed. J. L. Heiberg","translator": "J. L. Heiberg","noSpeakerLabels": true,"reference": {"label": "Book","abbr": "Bk.","placeholder": "e.g. 6"},"transPair": {"a": "euclid-elements","b": "euclid-elements-gr"},"transSelf": "b","lang": "grc","short": "Greek"}},{"meta": {"key": "euclid-data","en": "Data","gr": "ΔΕΔΟΜΕΝΑ","color": "#2f6b54","author": "Euclid","kind": "treatise","form": "MATHEMATICS","blurb": "Euclid’s companion to the Elements, in ninety-four propositions showing what else is determined once certain magnitudes, ratios or figures in a problem are given."},"text": {"title": "Data","greek": "ΔΕΔΟΜΕΝΑ","subtitle": "On the given · trans. T. L. Heath","translator": "Thomas L. Heath","noSpeakerLabels": true}},{"meta": {"key": "euclid-optics","en": "Optics","gr": "ΟΠΤΙΚΑ","color": "#2f6b54","author": "Euclid","kind": "treatise","form": "MATHEMATICS","blurb": "The earliest surviving treatise on the geometry of vision, assuming rays issuing from the eye and deducing why things look smaller at a distance and how size and shape are judged."},"text": {"title": "Optics","greek": "ΟΠΤΙΚΑ","subtitle": "On the geometry of vision","translator": "R. C. Taliaferro","noSpeakerLabels": true}},{"meta": {"key": "archimedes-method","en": "The Method","gr": "ΠΡΟΣ ΕΡΑΤΟΣΘΕΝΗΝ ΕΦΟΔΟΣ","color": "#3a4652","author": "Archimedes","form": "TREATISE","blurb": "The letter in which Archimedes shows Eratosthenes how he found his theorems before he could prove them: figures are cut into lines and circles and weighed on an imagined balance — the segment of a parabola, the sphere, spheroid and paraboloid. Read by Heiberg in 1906 from a palimpsest at Constantinople; the text has gaps.","transPair": {"a": "archimedes-method"},"transSelf": "a","kind": "treatise"},"text": {"title": "The Method","greek": "ΑΡΧΙΜΗΔΟΥΣ ΠΕΡΙ ΤΩΝ ΜΗΧΑΝΙΚΩΝ ΘΕΩΡΗΜΑΤΩΝ ΠΡΟΣ ΕΡΑΤΟΣΘΕΝΗΝ ΕΦΟΔΟΣ","subtitle": "Ephodos · the letter to Eratosthenes on finding geometrical theorems by mechanics · trans. Robinson","translator": "Lydia G. Robinson, from J. L. Heiberg's German (1909)","lang": "eng","short": "Robinson","transPair": {"a": "archimedes-method"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Proposition","abbr": "","placeholder": "e.g. 4"}}},{"meta": {"key": "archimedes-sand-reckoner","en": "The Sand-Reckoner and Shorter Works","gr": "ΨΑΜΜΙΤΗΣ","color": "#3a4a5c","author": "Archimedes","form": "TREATISE","blurb": "Three short works of Archimedes of Syracuse. The Sand-Reckoner, addressed to King Gelon, names a number greater than the grains of sand that would fill the universe; Measurement of a Circle bounds the circumference between 3 1/7 and 3 10/71 diameters; the Cattle Problem is the verse riddle sent to Eratosthenes. A new English translation.","transPair": {"a": "archimedes-sand-reckoner"},"transSelf": "a","kind": "treatise"},"text": {"title": "The Sand-Reckoner and Shorter Works","greek": "ΑΡΧΙΜΗΔΟΥΣ ΨΑΜΜΙΤΗΣ · ΚΥΚΛΟΥ ΜΕΤΡΗΣΙΣ · ΠΡΟΒΛΗΜΑ ΒΟΕΙΚΟΝ","subtitle": "Psammites · Kyklou metresis · the Cattle Problem · a new translation from the Greek","translator": "Claude AI","lang": "eng","short": "English","transPair": {"a": "archimedes-sand-reckoner"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Work.part (S = Sand-Reckoner, C = Circle, B = Cattle Problem)","abbr": "","placeholder": "e.g. S.1"}}},{"meta": {"key": "dionysius-thrax-grammar","en": "The Art of Grammar","gr": "ΤΕΧΝΗ ΓΡΑΜΜΑΤΙΚΗ","color": "#2f3a44","author": "Dionysius Thrax","form": "TREATISE","blurb": "The oldest grammar of a European language, a handbook of a few pages from the school of the Alexandrian critics. It defines grammar as acquaintance with the usage of poets and prose writers and lists its six parts; gives rules for reading aloud, accent and punctuation; describes the letters and the kinds of syllable; and then takes the eight parts of speech in turn, noun, verb, participle, article, pronoun, preposition, adverb and conjunction, with their classes and Greek examples. Thomas Davidson’s translation, the first into English, printed at St. Louis in 1874, with his notes; the Greek terms and examples stand in the text as he gave them. The margin gives the section.","kind": "treatise"},"text": {"title": "The Art of Grammar","greek": "ΔΙΟΝΥΣΙΟΥ ΤΟΥ ΘΡΑΙΚΟΣ ΤΕΧΝΗ ΓΡΑΜΜΑΤΙΚΗ","subtitle": "Techne grammatike · the first Greek grammar · trans. Thomas Davidson","translator": "Thomas Davidson (1874)","lang": "eng","short": "Davidson","noSpeakerLabels": true,"reference": {"label": "Section","abbr": "§","placeholder": "e.g. 14"}}},{"meta": {"key": "ammianus-1","en": "The Roman History (Books XIV–XIX)","gr": "RES GESTAE (LIBRI XIV–XIX)","color": "#4a2f2a","author": "Ammianus Marcellinus","form": "HISTORY","blurb": "The surviving part of Ammianus' history of Rome opens in A.D. 353, the first thirteen books being lost. Books XIV to XIX cover the last years of Constantius II: the Cæsar Gallus, Julian's campaigns in Gaul, and the fall of Amida, at which Ammianus was present. C. D. Yonge's translation of 1862, with Rolfe's Latin.","transPair": {"a": "ammianus-1","b": "ammianus-1-b"},"transSelf": "a","kind": "history"},"text": {"title": "The Roman History (Books XIV–XIX)","greek": "AMMIANI MARCELLINI RES GESTAE","subtitle": "Res Gestae XIV–XIX · history of the later Roman empire, A.D. 353–359 · trans. C. D. Yonge","translator": "C. D. Yonge (1862)","lang": "eng","short": "Yonge","transPair": {"a": "ammianus-1","b": "ammianus-1-b"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 16.12"},"parMirror": "ammianus-1"}},{"meta": {"key": "ammianus-1-b","en": "The Roman History (Books XIV–XIX)","gr": "RES GESTAE (LIBRI XIV–XIX)","color": "#4a2f2a","author": "Ammianus Marcellinus","hidden": true,"form": "HISTORY","transPair": {"a": "ammianus-1","b": "ammianus-1-b"},"transSelf": "b","kind": "history"},"text": {"title": "Res Gestae (Libri XIV–XIX)","greek": "AMMIANI MARCELLINI RES GESTAE","translator": "Latin text (Rolfe)","lang": "lat","short": "Latin","transPair": {"a": "ammianus-1","b": "ammianus-1-b"},"transSelf": "b","noSpeakerLabels": true,"parMirror": "ammianus-1","reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 16.12"}}},{"meta": {"key": "ammianus-2","en": "The Roman History (Books XX–XXV)","gr": "RES GESTAE (LIBRI XX–XXV)","color": "#2f3f4a","author": "Ammianus Marcellinus","form": "HISTORY","blurb": "Books XX to XXV of Ammianus' history run from A.D. 360 to 364 and are chiefly the reign of Julian: the restoration of the gods, and the Persian expedition in which the historian served, ending with Julian's death and Jovian's peace. C. D. Yonge's translation of 1862, with Rolfe's Latin.","transPair": {"a": "ammianus-2","b": "ammianus-2-b"},"transSelf": "a","kind": "history"},"text": {"title": "The Roman History (Books XX–XXV)","greek": "AMMIANI MARCELLINI RES GESTAE","subtitle": "Res Gestae XX–XXV · history of the later Roman empire, A.D. 360–364 · trans. C. D. Yonge","translator": "C. D. Yonge (1862)","lang": "eng","short": "Yonge","transPair": {"a": "ammianus-2","b": "ammianus-2-b"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 22.5"},"parMirror": "ammianus-2"}},{"meta": {"key": "ammianus-2-b","en": "The Roman History (Books XX–XXV)","gr": "RES GESTAE (LIBRI XX–XXV)","color": "#2f3f4a","author": "Ammianus Marcellinus","hidden": true,"form": "HISTORY","transPair": {"a": "ammianus-2","b": "ammianus-2-b"},"transSelf": "b","kind": "history"},"text": {"title": "Res Gestae (Libri XX–XXV)","greek": "AMMIANI MARCELLINI RES GESTAE","translator": "Latin text (Rolfe)","lang": "lat","short": "Latin","transPair": {"a": "ammianus-2","b": "ammianus-2-b"},"transSelf": "b","noSpeakerLabels": true,"parMirror": "ammianus-2","reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 22.5"}}},{"meta": {"key": "ammianus-3","en": "The Roman History (Books XXVI–XXXI)","gr": "RES GESTAE (LIBRI XXVI–XXXI)","color": "#3b3a2a","author": "Ammianus Marcellinus","form": "HISTORY","blurb": "Books XXVI to XXXI of Ammianus' history cover the reigns of Valentinian and Valens, A.D. 364 to 378: the division of the empire, the German wars, and finally the Huns, the Gothic crossing of the Danube and the battle of Adrianople. C. D. Yonge's translation of 1862, with Rolfe's Latin.","transPair": {"a": "ammianus-3","b": "ammianus-3-b"},"transSelf": "a","kind": "history"},"text": {"title": "The Roman History (Books XXVI–XXXI)","greek": "AMMIANI MARCELLINI RES GESTAE","subtitle": "Res Gestae XXVI–XXXI · history of the later Ro  {"key": "cavalry-general","en": "The Cavalry General","kind": "treatise","gr": "Ἱππαρχικός","color": "#466079","author": "Xenophon","form": "TREATISE","blurb": "Advice to an Athenian commander of cavalry on recruiting and training horsemen, drilling the squadrons, sacrificing to the gods, and manoeuvring in parade and battle."},"text": {"title": "The Cavalry General","greek": "","translator": "H. G. Dakyns","noSpeakerLabels": true,"transPair": {"a": "cavalry-general","b": "cavalry-general-b"},"transSelf": "a","lang": "eng","short": "Dakyns"}},{"meta": {"key": "cavalry-general-b","en": "The Cavalry General","kind": "treatise","gr": "Ἱππαρχικός","color": "#466079","author": "Xenophon","hidden": true},"text": {"title": "The Cavalry General","greek": "","translator": "Greek text","noSpeakerLabels": true,"transPair": {"a": "cavalry-general","b": "cavalry-general-b"},"transSelf": "b","lang": "grc","short": "Greek"}},{"meta": {"key": "on-hunting","en": "On Hunting","kind": "treatise","gr": "Κυνηγετικός","color": "#466079","author": "Xenophon","form": "TREATISE","blurb": "A treatise on hunting the hare with hounds and nets, and also boar and deer, with Xenophon’s argument that the chase trains young men for war and virtue."},"text": {"title": "On Hunting","greek": "","translator": "H. G. Dakyns","noSpeakerLabels": true,"transPair": {"a": "on-hunting","b": "on-hunting-b"},"transSelf": "a","lang": "eng","short": "Dakyns"}},{"meta": {"key": "on-hunting-b","en": "On Hunting","kind": "treatise","gr": "Κυνηγετικός","color": "#466079","author": "Xenophon","hidden": true},"text": {"title": "On Hunting","greek": "","translator": "Greek text","noSpeakerLabels": true,"transPair": {"a": "on-hunting","b": "on-hunting-b"},"transSelf": "b","lang": "grc","short": "Greek"}},{"meta": {"key": "ways-and-means","en": "Ways and Means","kind": "treatise","gr": "Πόροι","color": "#466079","author": "Xenophon","form": "TREATISE","blurb": "Xenophon’s late proposals for making Athens prosperous without empire: encouraging resident foreigners, developing the silver mines of Laurium, and keeping the peace."},"text": {"title": "Ways and Means","greek": "","translator": "H. G. Dakyns","noSpeakerLabels": true,"transPair": {"a": "ways-and-means","b": "ways-and-means-b"},"transSelf": "a","lang": "eng","short": "Dakyns"}},{"meta": {"key": "ways-and-means-b","en": "Ways and Means","kind": "treatise","gr": "Πόροι","color": "#466079","author": "Xenophon","hidden": true},"text": {"title": "Ways and Means","greek": "","translator": "Greek text","noSpeakerLabels": true,"transPair": {"a": "ways-and-means","b": "ways-and-means-b"},"transSelf": "b","lang": "grc","short": "Greek"}},{"meta": {"key": "constitution-of-sparta","en": "Constitution of Sparta","kind": "treatise","gr": "Λακεδαιμονίων πολιτεία","color": "#466079","author": "Xenophon","form": "TREATISE","blurb": "An admiring account of the laws of Lycurgus — the common messes, the training of boys, the position of women, the kingship — and of how far the Spartans had fallen from them."},"text": {"title": "Constitution of Sparta","greek": "","translator": "H. G. Dakyns","noSpeakerLabels": true,"transPair": {"a": "constitution-of-sparta","b": "constitution-of-sparta-b"},"transSelf": "a","lang": "eng","short": "Dakyns"}},{"meta": {"key": "constitution-of-sparta-b","en": "Constitution of Sparta","kind": "treatise","gr": "Λακεδαιμονίων πολιτεία","color": "#466079","author": "Xenophon","hidden": true},"text": {"title": "Constitution of Sparta","greek": "","translator": "Greek text","noSpeakerLabels": true,"transPair": {"a": "constitution-of-sparta","b": "constitution-of-sparta-b"},"transSelf": "b","lang": "grc","short": "Greek"}},{"meta": {"key": "constitution-of-athens","en": "Constitution of Athens","kind": "treatise","gr": "Ἀθηναίων πολιτεία","color": "#466079","author": "Xenophon","form": "TREATISE","blurb": "A short pamphlet, transmitted among Xenophon’s works, in which a critic of democracy explains why the Athenian system, bad as he thinks it, serves the common people well and endures."},"text": {"title": "Constitution of Athens","greek": "","translator": "H. G. Dakyns","noSpeakerLabels": true,"transPair": {"a": "constitution-of-athens","b": "constitution-of-athens-b"},"transSelf": "a","lang": "eng","short": "Dakyns"}},{"meta": {"key": "constitution-of-athens-b","en": "Constitution of Athens","kind": "treatise","gr": "Ἀθηναίων πολιτεία","color": "#466079","author": "Xenophon","hidden": true},"text": {"title": "Constitution of Athens","greek": "","translator": "Greek text","noSpeakerLabels": true,"transPair": {"a": "constitution-of-athens","b": "constitution-of-athens-b"},"transSelf": "b","lang": "grc","short": "Greek"}},{"meta": {"key": "enquiry-into-plants","en": "Enquiry into Plants","kind": "treatise","gr": "Περὶ φυτῶν ἱστορία","color": "#6a7a3a","author": "Theophrastus","form": "TREATISE","blurb": "The founding work of botany in nine books, classifying plants into trees, shrubs, undershrubs and herbs, and describing their parts, propagation, habitats, timber and juices."},"text": {"title": "Enquiry into Plants","greek": "","translator": "Arthur F. Hort","noSpeakerLabels": true,"transPair": {"a": "enquiry-into-plants","b": "enquiry-into-plants-b"},"transSelf": "a","lang": "eng","short": "Hort"}},{"meta": {"key": "enquiry-into-plants-b","en": "Enquiry into Plants","kind": "treatise","gr": "Περὶ φυτῶν ἱστορία","color": "#6a7a3a","author": "Theophrastus","hidden": true},"text": {"title": "Enquiry into Plants","greek": "","translator": "Greek text","noSpeakerLabels": true,"transPair": {"a": "enquiry-into-plants","b": "enquiry-into-plants-b"},"transSelf": "b","lang": "grc","short": "Greek"}},{"meta": {"key": "on-stones","en": "On Stones","kind": "treatise","gr": "Περὶ λίθων","color": "#6a7a3a","author": "Theophrastus","form": "TREATISE","blurb": "The earliest surviving treatise on minerals, describing the stones and earths known in the fourth century BCE, their properties, where they were found, and their uses, from pearls to pigments."},"text": {"title": "On Stones","greek": "","translator": "Anonymous (1774)","noSpeakerLabels": true,"transPair": {"a": "on-stones","b": "on-stones-b"},"transSelf": "a","lang": "eng","short": "Anonymous"}},{"meta": {"key": "on-stones-b","en": "On Stones","kind": "treatise","gr": "Περὶ λίθων","color": "#6a7a3a","author": "Theophrastus","hidden": true},"text": {"title": "On Stones","greek": "","translator": "Greek text","noSpeakerLabels": true,"transPair": {"a": "on-stones","b": "on-stones-b"},"transSelf": "b","lang": "grc","short": "Greek"}},{"meta": {"key": "treatise-on-odours","en": "Treatise on Odours","kind": "treatise","gr": "","color": "#6a7a3a","author": "Theophrastus","form": "TREATISE","blurb": "Theophrastus on smells: why compounds alone have odour, the kinds of pleasant and unpleasant scents, and the making of perfumes from oils, spices and flowers."},"text": {"title": "Treatise on Odours","greek": "","translator": "Arthur F. Hort","noSpeakerLabels": true}},{"meta": {"key": "weather-signs","en": "Concerning Weather Signs","kind": "treatise","gr": "","color": "#6a7a3a","author": "Theophrastus","form": "TREATISE","blurb": "A collection of signs of rain, wind, storm and fair weather drawn from the sky, animals and plants, as Greek farmers and sailors read them."},"text": {"title": "Concerning Weather Signs","greek": "","translator": "Arthur F. Hort","noSpeakerLabels": true}},{"meta": {"key": "on-winds","en": "On Winds","kind": "treatise","gr": "","color": "#6a7a3a","author": "Theophrastus","form": "TREATISE","blurb": "Theophrastus explains the winds by their causes and conditions — direction, season, locality and the sun’s heat — and why each brings its own weather."},"text": {"title": "On Winds","greek": "","translator": "James G. Wood","noSpeakerLabels": true}},{"meta": {"key": "aristoxenus-harmonics","en": "The Elements of Harmony","gr": "ΑΡΜΟΝΙΚΑ ΣΤΟΙΧΕΙΑ","color": "#3a3d2c","author": "Aristoxenus","form": "TREATISE","blurb": "The earliest work on music theory to survive from Greece, in three books that are probably the remains of more than one treatise. Aristoxenus marks off the science of melody from acoustics and from the number-theory of the Pythagoreans, and builds it on what the ear hears and the mind retains. He treats the motion of the voice in speech and in song, pitch, the note, the interval and the scale; the three genera, enharmonic, chromatic and diatonic, and their shades; the keys; and, in the third book, a series of propositions on which intervals may follow which. H. S. Macran’s translation of 1902. The margin gives the pages of Meibom’s edition, by which the work is cited.","kind": "treatise"},"text": {"title": "The Elements of Harmony","greek": "ΑΡΙΣΤΟΞΕΝΟΥ ΑΡΜΟΝΙΚΑ ΣΤΟΙΧΕΙΑ","subtitle": "Harmonika stoicheia, in three books · the oldest surviving treatise on music · trans. H. S. Macran","translator": "H. S. Macran (1902)","lang": "eng","short": "Macran","noSpeakerLabels": true,"reference": {"label": "Meibom page","abbr": "","placeholder": "e.g. 44"}}},{"meta": {"key": "phil-sophists-b","en": "Lives of the Sophists","gr": "ΒΙΟΙ ΣΟΦΙΣΤΩΝ","color": "#653058","author": "Philostratus","kind": "prose","hidden": true},"text": {"title": "Lives of the Sophists","greek": "ΒΙΟΙ ΣΟΦΙΣΤΩΝ","translator": "Greek text","transPair": {"a": "phil-sophists","b": "phil-sophists-b"},"transSelf": "b","lang": "grc","short": "Greek"}},{"meta": {"key": "phil-letters-b","en": "Letters","gr": "ΕΠΙΣΤΟΛΑΙ","color": "#8f447c","author": "Philostratus","kind": "letters","hidden": true},"text": {"title": "Letters","greek": "ΕΠΙΣΤΟΛΑΙ","translator": "Greek text","transPair": {"a": "phil-letters","b": "phil-letters-b"},"transSelf": "b","lang": "grc","short": "Greek"}},{"meta": {"key": "phil-imagines-1-b","en": "Imagines","gr": "ΕΙΚΟΝΕΣ","color": "#703561","author": "Philostratus","kind": "prose","hidden": true},"text": {"title": "Imagines","greek": "ΕΙΚΟΝΕΣ","translator": "Greek ": "half brother of Aias."},{"name": "Menelaus.","desc": ""},{"name": "Agamemnon.","desc": ""}],"scene": "","transPair": {"a": "soph-ajax","e": "soph-ajax-e"},"transSelf": "e","lang": "grc","short": "Greek"}},{"meta": {"key": "soph-antigone","en": "Antigone","gr": "ΑΝΤΙΓΟΝΗ","color": "#4a3a6b","author": "Sophocles","form": "TRAGEDY","blurb": "Antigone buries her brother Polyneices against the decree of Creon, and is condemned to death; her defiance costs Creon his son and wife as well."},"text": {"title": "Antigone","greek": "ΑΝΤΙΓΟΝΗ","translator": "F. Storr (Loeb Classical Library, 1912)","persons": [{"name": "Creon","desc": "King of Thebes."},{"name": "Haemon","desc": "Son of Creon, betrothed to Antigone."},{"name": "Eurydice","desc": "wife of Creon."},{"name": "Teiresias","desc": "the prophet."},{"name": "Chorus","desc": "of Theban elders."},{"name": "A Watchman","desc": ""},{"name": "A Messenger","desc": ""},{"name": "A Second Messenger","desc": ""}],"scene": "","transPair": {"a": "soph-antigone","e": "soph-antigone-e"},"transSelf": "a","lang": "eng","short": "Loeb"}},{"meta": {"key": "soph-antigone-e","en": "Antigone","gr": "ΑΝΤΙΓΟΝΗ","color": "#4a3a6b","author": "Sophocles","hidden": true},"text": {"title": "Antigone","greek": "ΑΝΤΙΓΟΝΗ","translator": "Greek text","persons": [{"name": "Creon","desc": "King of Thebes."},{"name": "Haemon","desc": "Son of Creon, betrothed to Antigone."},{"name": "Eurydice","desc": "wife of Creon."},{"name": "Teiresias","desc": "the prophet."},{"name": "Chorus","desc": "of Theban elders."},{"name": "A Watchman","desc": ""},{"name": "A Messenger","desc": ""},{"name": "A Second Messenger","desc": ""}],"scene": "","transPair": {"a": "soph-antigone","e": "soph-antigone-e"},"transSelf": "e","lang": "grc","short": "Greek"}},{"meta": {"key": "soph-trachis","en": "The Women of Trachis","gr": "ΤΡΑΧΙΝΙΑΙ","color": "#4a3a6b","author": "Sophocles","form": "TRAGEDY","blurb": "Deianeira, trying to win back Heracles with a love-charm from the c ngest son of Priam and Hecuba"},{"name": "Hecuba","desc": "widow of Priam, queen of Troy, now a slave"},{"name": "Chorus of Captive Trojan Women","desc": ""},{"name": "Polyxena","desc": "daughter of Hecuba"},{"name": "Odysseus","desc": "king of Ithaca"},{"name": "Talthybius","desc": "herald of the Greek army"},{"name": "Maid-servant","desc": "an old attendant of Hecuba"},{"name": "Agamemnon","desc": "commander of the Greek army"},{"name": "Polymestor, and his Children","desc": "king of the Thracian Chersonese; his two young sons do not speak"}],"scene": ""}},{"meta": {"key": "eur-hecuba-e","en": "Hecuba","gr": "ΕΚΑΒΗ","color": "#3a3a52","author": "Euripides","hidden": true,"form": "TRAGEDY","transPair": {"a": "eur-hecuba","e": "eur-hecuba-e"},"transSelf": "e"},"text": {"title": "Ἑκάβη","greek": "ΕΥΡΙΠΙΔΟΥ ΕΚΑΒΗ","translator": "Greek text (Murray)","lang": "grc","short": "Greek","transPair": {"a": "eur-hecuba","e": "eur-hecuba-e"},"transSelf": "e","reference": {"label": "Line","abbr": "","placeholder": "e.g. 250"},"persons": [{"name": "Ghost of Polydorus","desc": "youngest son of Priam and Hecuba"},{"name": "Hecuba","desc": "widow of Priam, queen of Troy, now a slave"},{"name": "Chorus of Captive Trojan Women","desc": ""},{"name": "Polyxena","desc": "daughter of Hecuba"},{"name": "Odysseus","desc": "king of Ithaca"},{"name": "Talthybius","desc": "herald of the Greek army"},{"name": "Maid-servant","desc": "an old attendant of Hecuba"},{"name": "Agamemnon","desc": "commander of the Greek army"},{"name": "Polymestor, and his Children","desc": "king of the Thracian Chersonese; his two young sons do not speak"}],"scene": ""}},{"meta": {"key": "eur-suppliants","en": "The Suppliants","gr": "ΙΚΕΤΙΔΕΣ","color": "#46492c","author": "Euripides","form": "TRAGEDY","blurb": "The mothers of the seven chiefs who fell attacking Thebes come as suppliants to Eleusis and beg Theseus to recover the bodies Creon refuses to give up for burial. Theseus debates kingship and democracy with the Theban herald and wins the dead back in battle. Coleridge’s prose translation of 1891, with Murray’s Greek as companion.","transPair": {"a": "eur-suppliants","e": "eur-suppliants-e"},"transSelf": "a"},"text": {"title": "The Suppliants","greek": "ΕΥΡΙΠΙΔΟΥ ΙΚΕΤΙΔΕΣ","subtitle": "Hiketides · tragedy of the Argive mothers and the burial of the Seven · trans. E. P. Coleridge","translator": "E. P. Coleridge (1891)","lang": "eng","short": "Coleridge","transPair": {"a": "eur-suppliants","e": "eur-suppliants-e"},"transSelf": "a","reference": {"label": "Line","abbr": "","placeholder": "e.g. 399"},"persons": [{"name": "Aethra","desc": "mother of Theseus"},{"name": "Chorus of Argive Mothers","desc": "mothers of the chiefs who fell before Thebes, with their attendants"},{"name": "Theseus","desc": "king of Athens"},{"name": "Adrastus","desc": "king of Argos, leader of the expedition against Thebes"},{"name": "Herald","desc": "sent by Creon from Thebes"},{"name": "Messenger","desc": "a servant of Capaneus, escaped from Thebes"},{"name": "Evadne","desc": "widow of Capaneus, daughter of Iphis"},{"name": "Iphis","desc": "father of Evadne and of Eteoclus"},{"name": "Children","desc": "sons of the fallen chiefs"},{"name": "Athena","desc": "the goddess, who appears at the close"}],"scene": ""}},{"meta": {"key": "eur-suppliants-e","en": "The Suppliants","gr": "ΙΚΕΤΙΔΕΣ","color": "#46492c","author": "Euripides","hidden": true,"form": "TRAGEDY","transPair": {"a": "eur-suppliants","e": "eur-suppliants-e"},"transSelf": "e"},"text": {"title": "Ἱκέτιδες","greek": "ΕΥΡΙΠΙΔΟΥ ΙΚΕΤΙΔΕΣ","translator": "Greek text (Murray)","lang": "grc","short": "Greek","transPair": {"a": "eur-suppliants","e": "eur-suppliants-e"},"transSelf": "e","reference": {"label": "Line","abbr": "","placeholder": "e.g. 399"},"persons": [{"name": "Aethra","desc": "mother of Theseus"},{"name": "Chorus of Argive Mothers","desc": "mothers of the chiefs who fell before Thebes, with their attendants"},{"name": "Theseus","desc": "king of Athens"},{"name": "Adrastus","desc": "king of Argos, leader of the expedition against Thebes"},{"name": "Herald","desc": "sent by Creon from Thebes"},{"name": "Messenger","desc": "a servant of Capaneus, escaped from Thebes"},{"name": "Evadne","desc": "widow of Capaneus, daughter of Iphis"},{"name": "Iphis","desc": "father of Evadne and of Eteoclus"},{"name": "Children","desc": "sons of the fallen chiefs"},{"name": "Athena","desc": "the goddess, who appears at the close"}],"scene": ""}},{"meta": {"key": "eur-heracles","en": "Heracles","gr": "ΗΡΑΚΛΗΣ","color": "#5b2b26","author": "Euripides","form": "TRAGEDY","blurb": "While Heracles is away in Hades, the usurper Lycus condemns his father, wife and sons to death at Thebes. Heracles returns to kill Lycus; then Madness, sent by Hera, drives him to shoot his own wife and children. Also known as Hercules Furens. Coleridge’s prose translation, with Murray’s Greek as companion.","transPair": {"a": "eur-heracles","e": "eur-heracles-e"},"transSelf": "a"},"text": {"title": "Heracles","greek": "ΕΥΡΙΠΙΔΟΥ ΗΡΑΚΛΗΣ","subtitle": "Hērakles · tragedy of the madness of Heracles · trans. E. P. Coleridge","translator": "E. P. Coleridge (1891), modernised by Perseus","lang": "eng","short": "Coleridge","transPair": {"a": "eur-heracles","e": "eur-heracles-e"},"transSelf": "a","reference": {"label": "Line","abbr": "","placeholder": "e.g. 399"},"persons": [{"name": "Amphitryon","desc": "husband of Alcmena, the mortal father of Heracles"},{"name": "Megara","desc": "wife of Heracles, daughter of Creon"},{"name": "Lycus","desc": "usurper of the throne of Thebes"},{"name": "Iris","desc": "messenger of Hera"},{"name": "Madness","desc": "Lyssa, daughter of Night"},{"name": "Messenger","desc": "a servant of the house"},{"name": "Heracles","desc": "son of Zeus and Alcmena"},{"name": "Theseus","desc": "king of Athens"},{"name": "Chorus of Old Men of Thebes","desc": "elders loyal to the house of Heracles"}],"scene": ""}},{"meta": {"key": "eur-heracles-e","en": "Heracles","gr": "ΗΡΑΚΛΗΣ","color": "#5b2b26","author": "Euripides","hidden": true,"form": "TRAGEDY","transPair": {"a": "eur-heracles","e": "eur-heracles-e"},"transSelf": "e"},"text": {"title": "Ἡρακλῆς","greek": "ΕΥΡΙΠΙΔΟΥ ΗΡΑΚΛΗΣ","translator": "Greek text (Murray)","lang": "grc","short": "Greek","transPair": {"a": "eur-heracles","e": "eur-heracles-e"},"transSelf": "e","reference": {"label": "Line","abbr": "","placeholder": "e.g. 399"},"persons": [{"name": "Amphitryon","desc": "husband of Alcmena, the mortal father of Heracles"},{"name": "Megara","desc": "wife of Heracles, daughter of Creon"},{"name": "Lycus","desc": "usurper of the throne of Thebes"},{"name": "Iris","desc": "messenger of Hera"},{"name": "Madness","desc": "Lyssa, daughter of Night"},{"name": "Messenger","desc": "a servant of the house"},{"name": "Heracles","desc": "son of Zeus and Alcmena"},{"name": "Theseus","desc": "king of Athens"},{"name": "Chorus of Old Men of Thebes","desc": "elders loyal to the house of Heracles"}],"scene": ""}},{"meta": {"key": "eur-ion","en": "Ion","gr": "ΙΩΝ","color": "#5c471f","author": "Euripides","form": "TRAGEDY","blurb": "Creusa bore a son to Apollo and exposed him; raised at Delphi as a temple servant, he is given years later to her husband Xuthus. Creusa tries to poison him, then knows him by the tokens in his cradle; Athena names Ion ancestor of the Ionians. Coleridge’s prose translation, with Murray’s Greek as companion.","transPair": {"a": "eur-ion","e": "eur-ion-e"},"transSelf": "a"},"text": {"title": "Ion","greek": "ΕΥΡΙΠΙΔΟΥ ΙΩΝ","subtitle": "Iōn · play of Apollo’s son and his mother at Delphi · trans. E. P. Coleridge","translator": "E. P. Coleridge (1891)","lang": "eng","short": "Coleridge","transPair": {"a": "eur-ion","e": "eur-ion-e"},"transSelf": "a","reference": {"label": "Line","abbr": "","placeholder": "e.g. 399"},"persons": [{"name": "Hermes","desc": "the god, who speaks the prologue"},{"name": "Ion","desc": "temple servant at Delp
