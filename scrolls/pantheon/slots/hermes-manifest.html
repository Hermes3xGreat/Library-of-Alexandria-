<script id="hermes-manifest" type="application/json">{"type": "hermes-manifest","version": 1,"books": [{"meta": {"key": "hippocrates-1","en": "Hippocratic Writings, Volume I","gr": "ΣΥΓΓΡΑΜΜΑΤΑ Αʹ","color": "#3b4a3f","author": "Hippocrates","form": "TREATISE","blurb": "Eleven treatises from the Hippocratic Collection, the medical writings gathered under the name of Hippocrates of Cos in the fifth and fourth centuries BC: On Ancient Medicine, Airs, Waters, and Places, the Prognostics, Epidemics I and III, the Aphorisms and the Oath. Francis Adams’s translation of 1849, with the Greek as companion.","transPair": {"a": "hippocrates-1","e": "hippocrates-1-e"},"transSelf": "a","kind": "treatise"},"text": {"title": "Hippocratic Writings, Volume I","greek": "ΙΠΠΟΚΡΑΤΟΥΣ ΣΥΓΓΡΑΜΜΑΤΑ Αʹ","subtitle": "Hippokratous syngrammata I · medical-philosophical and clinical treatises of the Hippocratic Collection · trans. Francis Adams","translator": "Francis Adams (1849)","lang": "eng","short": "Adams","transPair": {"a": "hippocrates-1","e": "hippocrates-1-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Treatise and section","abbr": "","placeholder": "e.g. Aph. 1.1"},"parMirror": "hippocrates-1"}},{"meta": {"key": "hippocrates-1-e","en": "Hippocratic Writings, Volume I","gr": "ΣΥΓΓΡΑΜΜΑΤΑ Αʹ","color": "#3b4a3f","author": "Hippocrates","hidden": true,"form": "TREATISE","transPair": {"a": "hippocrates-1","e": "hippocrates-1-e"},"transSelf": "e","kind": "treatise"},"text": {"title": "Συγγράμματα, τόμος Αʹ","greek": "ΙΠΠΟΚΡΑΤΟΥΣ ΣΥΓΓΡΑΜΜΑΤΑ Αʹ","translator": "Greek text (Littré; Jones)","lang": "grc","short": "Greek","transPair": {"a": "hippocrates-1","e": "hippocrates-1-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "hippocrates-1","reference": {"label": "Treatise and section","abbr": "","placeholder": "e.g. Aph. 1.1"}}},{"meta": {"key": "hippocrates-2","en": "Hippocratic Writings, Volume II","gr": "ΣΥΓΓΡΑΜΜΑΤΑ Βʹ","color": "#4a3b34","author": "Hippocrates","form": "TREATISE","blurb": "The surgical treatises of the Hippocratic Collection: On Injuries of the Head, with the use of the trepan; On the Surgery, on bandaging; the long manuals On Fractures and On the Articulations; the Mochlicus; and the short tracts On Ulcers, On Hemorrhoids and On Fistulae. Francis Adams’s translation of 1849, with Littré’s Greek as companion.","transPair": {"a": "hippocrates-2","e": "hippocrates-2-e"},"transSelf": "a","kind": "treatise"},"text": {"title": "Hippocratic Writings, Volume II","greek": "ΙΠΠΟΚΡΑΤΟΥΣ ΣΥΓΓΡΑΜΜΑΤΑ Βʹ","subtitle": "Hippokratous syngrammata II · the surgical treatises of the Hippocratic Collection · trans. Francis Adams","translator": "Francis Adams (1849)","lang": "eng","short": "Adams","transPair": {"a": "hippocrates-2","e": "hippocrates-2-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Treatise and section","abbr": "","placeholder": "e.g. Fract. 31"},"parMirror": "hippocrates-2"}},{"meta": {"key": "hippocrates-2-e","en": "Hippocratic Writings, Volume II","gr": "ΣΥΓΓΡΑΜΜΑΤΑ Βʹ","color": "#4a3b34","author": "Hippocrates","hidden": true,"form": "TREATISE","transPair": {"a": "hippocrates-2","e": "hippocrates-2-e"},"transSelf": "e","kind": "treatise"},"text": {"title": "Συγγράμματα, τόμος Βʹ","greek": "ΙΠΠΟΚΡΑΤΟΥΣ ΣΥΓΓΡΑΜΜΑΤΑ Βʹ","translator": "Greek text (Littré)","lang": "grc","short": "Greek","transPair": {"a": "hippocrates-2","e": "hippocrates-2-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "hippocrates-2","reference": {"label": "Treatise and section","abbr": "","placeholder": "e.g. Fract. 31"}}},{"meta": {"key": "lysias-speeches","en": "Speeches","gr": "ΛΟΓΟΙ","color": "#4a3b2e","author": "Lysias","form": "ORATION","blurb": "The thirty-four speeches that have come down under the name of Lysias, the metic speech-writer who worked in Athens in the generation after the Peloponnesian War. Most were written for clients to deliver in court: a husband who killed his wife’s lover, a cripple defending his pension, a landowner accused of uprooting a sacred olive, the heirs of men ruined by confiscation. Others concern the Thirty — among them Against Eratosthenes, which Lysias spoke himself against the man he held responsible for his brother’s death — and the collection also holds the Funeral Oration and a fragment of the Olympic Oration. W. R. M. Lamb’s translation of 1930, with his notes, and the Greek text of the same edition as companion; the margin gives speech and section.","kind": "prose","transPair": {"a": "lysias-speeches","e": "lysias-speeches-e"},"transSelf": "a"},"text": {"title": "Speeches","greek": "ΛΥΣΙΟΥ ΛΟΓΟΙ","subtitle": "Logoi · the thirty-four surviving speeches of the Attic orator · trans. W. R. M. Lamb","translator": "W. R. M. Lamb (1930)","lang": "eng","short": "Lamb","transPair": {"a": "lysias-speeches","e": "lysias-speeches-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Speech.section","abbr": "Lys.","placeholder": "e.g. 12.4"},"parMirror": "lysias-speeches"}},{"meta": {"key": "lysias-speeches-e","en": "Speeches","gr": "ΛΟΓΟΙ","color": "#4a3b2e","author": "Lysias","hidden": true,"form": "ORATION","transPair": {"a": "lysias-speeches","e": "lysias-speeches-e"},"transSelf": "e","kind": "prose"},"text": {"title": "Λόγοι","greek": "ΛΥΣΙΟΥ ΛΟΓΟΙ","translator": "Greek text (Lamb)","lang": "grc","short": "Greek","transPair": {"a": "lysias-speeches","e": "lysias-speeches-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "lysias-speeches","reference": {"label": "Speech.section","abbr": "Lys.","placeholder": "e.g. 12.4"}}},{"meta": {"key": "isocrates-peace","en": "On the Peace","kind": "oration","gr": "ΠΕΡΙ ΕΙΡΗΝΗΣ","color": "#3f5a3a","author": "Isocrates","form": "ORATION","blurb": "Isocrates' eighth oration, written in 355 BCE as the Social War ended, cast as a speech to the Athenian assembly. It urges Athens to make peace with all mankind and give up the dream of empire by sea, which ruined the city once and ruins it again. Norlin's translation, with the Greek as companion.","transPair": {"a": "isocrates-peace","e": "isocrates-peace-e"},"transSelf": "a"},"text": {"title": "On the Peace","greek": "ΙΣΟΚΡΑΤΟΥΣ ΠΕΡΙ ΕΙΡΗΝΗΣ","subtitle": "De pace · Oration 8 · trans. George Norlin","translator": "George Norlin","lang": "eng","short": "Norlin","noSpeakerLabels": true,"transPair": {"a": "isocrates-peace","e": "isocrates-peace-e"},"transSelf": "a","reference": {"label": "Section","abbr": "§","placeholder": "e.g. 89"},"parMirror": "isocrates-peace"}},{"meta": {"key": "isocrates-peace-e","en": "On the Peace","kind": "oration","gr": "ΠΕΡΙ ΕΙΡΗΝΗΣ","color": "#3f5a3a","author": "Isocrates","hidden": true,"form": "ORATION","transPair": {"a": "isocrates-peace","e": "isocrates-peace-e"},"transSelf": "e"},"text": {"title": "Περὶ εἰρήνης","greek": "ΙΣΟΚΡΑΤΟΥΣ ΠΕΡΙ ΕΙΡΗΝΗΣ","translator": "Greek text (Norlin)","lang": "grc","short": "Greek","noSpeakerLabels": true,"transPair": {"a": "isocrates-peace","e": "isocrates-peace-e"},"transSelf": "e","parMirror": "isocrates-peace","reference": {"label": "Section","abbr": "§","placeholder": "e.g. 89"}}},{"meta": {"key": "isocrates-orations-1","en": "Orations, Volume I: To Demonicus, To Nicocles, Nicocles, Panegyricus, To Philip, Archidamus","gr": "ΛΟΓΟΙ, ΤΟΜΟΣ Αʹ","color": "#2f4a45","author": "Isocrates","form": "ORATION","blurb": "Six discourses of the Athenian teacher of rhetoric, as arranged in the first volume of George Norlin's Loeb edition. To Demonicus is a string of moral precepts for a young man; To Nicocles and Nicocles, addressed to and written for the young king of Salamis in Cyprus, set out the duties of a ruler and of his subjects. The Panegyricus (380 B.C.) calls on Athens and Sparta to end their rivalry and lead the Greeks against Persia, and gives the fullest statement of the Athenian claim to leadership; To Philip (346 B.C.) puts the same plan before the king of Macedon; in the Archidamus a Spartan prince argues against giving up Messene. Norlin's translation of 1928 with its notes, and his Greek text as companion; the margin gives oration and section.","kind": "prose","transPair": {"a": "isocrates-orations-1","e": "isocrates-orations-1-e"},"transSelf": "a"},"text": {"title": "Orations, Volume I: To Demonicus, To Nicocles, Nicocles, Panegyricus, To Philip, Archidamus","greek": "ΙΣΟΚΡΑΤΟΥΣ ΛΟΓΟΙ, ΤΟΜΟΣ Αʹ","subtitle": "Logoi · six discourses of advice and of Panhellenic policy (Orations 1–6) · trans. George Norlin","translator": "George Norlin (1928)","lang": "eng","short": "Norlin","transPair": {"a": "isocrates-orations-1","e": "isocrates-orations-1-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Oration.section","abbr": "Isoc.","placeholder": "e.g. 4.50"},"parMirror": "isocrates-orations-1"}},{"meta": {"key": "isocrates-orations-1-e","en": "Orations, Volume I: To Demonicus, To Nicocles, Nicocles, Panegyricus, To Philip, Archidamus","gr": "ΛΟΓΟΙ, ΤΟΜΟΣ Αʹ","color": "#2f4a45","author": "Isocrates","hidden": true,"form": "ORATION","transPair": {"a": "isocrates-orations-1","e": "isocrates-orations-1-e"},"transSelf": "e","kind": "prose"},"text": {"title": "Λόγοι, τόμος Αʹ","greek": "ΙΣΟΚΡΑΤΟΥΣ ΛΟΓΟΙ, ΤΟΜΟΣ Αʹ","translator": "Greek text (Norlin)","lang": "grc","short": "Greek","transPair": {"a": "isocrates-orations-1","e": "isocrates-orations-1-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "isocrates-orations-1","reference": {"label": "Oration.section","abbr": "Isoc.","placeholder": "e.g. 4.50"}}},{"meta": {"key": "isocrates-orations-2","en": "Orations, Volume II: Areopagiticus, Against the Sophists, Antidosis, Panathenaicus","gr": "ΛΟΓΟΙ, ΤΟΜΟΣ Βʹ","color": "#4a2f3a","author": "Isocrates","form": "ORATION","blurb": "Four discourses from the second volume of George Norlin's Loeb edition, in the order he prints them. The Areopagiticus argues for a return to the democracy of Solon and Cleisthenes, with the council of the Areopagus as guardian of conduct. Against the Sophists, a fragment from the opening of his school about 390 B.C., marks off his teaching from that of the eristics and the writers of handbooks. The Antidosis (354–353 B.C.), cast as a defence in an imaginary trial, is his account of his life, his pupils and his idea of education as philosophy, with long passages read out from his earlier works. The Panathenaicus, finished in his ninety-eighth year, praises Athens against Sparta. Norlin's translation of 1929 with its notes, and his Greek text as companion; the margin gives oration and section. On the Peace, also in that volume, stands separately in the library.","kind": "prose","transPair": {"a": "isocrates-orations-2","e": "isocrates-orations-2-e"},"transSelf": "a"},"text": {"title": "Orations, Volume II: Areopagiticus, Against the Sophists, Antidosis, Panathenaicus","greek": "ΙΣΟΚΡΑΤΟΥΣ ΛΟΓΟΙ, ΤΟΜΟΣ Βʹ","subtitle": "Logoi · Athens and its constitution, and Isocrates on his own teaching (Orations 7, 13, 15, 12) · trans. George Norlin","translator": "George Norlin (1929)","lang": "eng","short": "Norlin","transPair": {"a": "isocrates-orations-2","e": "isocrates-orations-2-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Oration.section","abbr": "Isoc.","placeholder": "e.g. 15.180"},"parMirror": "isocrates-orations-2"}},{"meta": {"key": "isocrates-orations-2-e","en": "Orations, Volume II: Areopagiticus, Against the Sophists, Antidosis, Panathenaicus","gr": "ΛΟΓΟΙ, ΤΟΜΟΣ Βʹ","color": "#4a2f3a","author": "Isocrates","hidden": true,"form": "ORATION","transPair": {"a": "isocrates-orations-2","e": "isocrates-orations-2-e"},"transSelf": "e","kind": "prose"},"text": {"title": "Λόγοι, τόμος Βʹ","greek": "ΙΣΟΚΡΑΤΟΥΣ ΛΟΓΟΙ, ΤΟΜΟΣ Βʹ","translator": "Greek text (Norlin)","lang": "grc","short": "Greek","transPair": {"a": "isocrates-orations-2","e": "isocrates-orations-2-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "isocrates-orations-2","reference": {"label": "Oration.section","abbr": "Isoc.","placeholder": "e.g. 15.180"}}},{"meta": {"key": "isocrates-orations-3","en": "Orations, Volume III: Evagoras, Helen, Busiris, Plataicus, Concerning the Team of Horses, Trapeziticus, Against Callimachus, Aegineticus, Against Lochites, Against Euthynus, and the Letters","gr": "ΛΟΓΟΙ, ΤΟΜΟΣ Γʹ","color": "#3b3f2a","author": "Isocrates","form": "ORATION","blurb": "The third volume of the Loeb Isocrates, as arranged by La Rue Van Hook. Evagoras, the first prose encomium of a contemporary, praises the dead king of Salamis in Cyprus; Helen and Busiris are display pieces on mythical subjects that correct the treatments of rival sophists; the Plataicus pleads for the Plataeans after the Theban destruction of their city in 373 B.C. Six forensic speeches from his early career as a writer for the courts follow — Concerning the Team of Horses, Trapeziticus, Against Callimachus, Aegineticus, Against Lochites and Against Euthynus — and then the nine Letters, to Dionysius, Philip, Antipater, Alexander, Timotheus, Archidamus and others. Van Hook's translation of 1945 with its notes, and his Greek text as companion; the margin gives oration and section, the Letters as ep1–ep9.","kind": "prose","transPair": {"a": "isocrates-orations-3","e": "isocrates-orations-3-e"},"transSelf": "a"},"text": {"title": "Orations, Volume III: Evagoras, Helen, Busiris, Plataicus, Concerning the Team of Horses, Trapeziticus, Against Callimachus, Aegineticus, Against Lochites, Against Euthynus, and the Letters","greek": "ΙΣΟΚΡΑΤΟΥΣ ΛΟΓΟΙ ΚΑΙ ΕΠΙΣΤΟΛΑΙ, ΤΟΜΟΣ Γʹ","subtitle": "Logoi kai Epistolai · encomia, forensic speeches (Orations 9–11, 14, 16–21) and the nine Letters · trans. La Rue Van Hook","translator": "La Rue Van Hook (1945)","lang": "eng","short": "Van Hook","transPair": {"a": "isocrates-orations-3","e": "isocrates-orations-3-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Oration.section (Letters: ep1–ep9)","abbr": "Isoc.","placeholder": "e.g. 9.12 or ep2.5"},"parMirror": "isocrates-orations-3"}},{"meta": {"key": "isocrates-orations-3-e","en": "Orations, Volume III: Evagoras, Helen, Busiris, Plataicus, Concerning the Team of Horses, Trapeziticus, Against Callimachus, Aegineticus, Against Lochites, Against Euthynus, and the Letters","gr": "ΛΟΓΟΙ, ΤΟΜΟΣ Γʹ","color": "#3b3f2a","author": "Isocrates","hidden": true,"form": "ORATION","transPair": {"a": "isocrates-orations-3","e": "isocrates-orations-3-e"},"transSelf": "e","kind": "prose"},"text": {"title": "Λόγοι, τόμος Γʹ","greek": "ΙΣΟΚΡΑΤΟΥΣ ΛΟΓΟΙ ΚΑΙ ΕΠΙΣΤΟΛΑΙ, ΤΟΜΟΣ Γʹ","translator": "Greek text (Van Hook)","lang": "grc","short": "Greek","transPair": {"a": "isocrates-orations-3","e": "isocrates-orations-3-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "isocrates-orations-3","reference": {"label": "Oration.section (Letters: ep1–ep9)","abbr": "Isoc.","placeholder": "e.g. 9.12 or ep2.5"}}},{"meta": {"key": "demosthenes-orations-1","en": "Public Orations (1–17, 20): Olynthiacs, Philippics and others","gr": "ΔΗΜΗΓΟΡΙΑΙ Α–ΙΖ · ΠΡΟΣ ΛΕΠΤΙΝΗΝ","color": "#3b4a5a","author": "Demosthenes","form": "ORATION","blurb": "The first seventeen speeches of the Demosthenic corpus, with the twentieth: the three Olynthiacs and four Philippics, On the Peace, On the Chersonese, the early speeches On the Navy-Boards, For the People of Megalopolis and For the Liberty of the Rhodians, and the court speech Against Leptines on immunity from public services. Several pieces transmitted with them are not by Demosthenes — On Halonnesus, the Answer to Philip’s Letter, Philip’s Letter itself, On Organization and On the Treaty with Alexander. J. H. Vince’s Loeb translation of 1930 with its footnotes, and the Greek of S. H. Butcher’s Oxford text as companion; each speech opens with its own heading, and the margin gives speech and section.","kind": "prose","transPair": {"a": "demosthenes-orations-1","e": "demosthenes-orations-1-e"},"transSelf": "a"},"text": {"title": "Public Orations (1–17, 20): Olynthiacs, Philippics and others","greek": "ΔΗΜΟΣΘΕΝΟΥΣ ΔΗΜΗΓΟΡΙΑΙ Α–ΙΖ · ΠΡΟΣ ΛΕΠΤΙΝΗΝ","subtitle": "Dēmēgoriai · the seventeen assembly speeches of the corpus and Against Leptines · trans. J. H. Vince","translator": "J. H. Vince (1930)","lang": "eng","short": "Vince","transPair": {"a": "demosthenes-orations-1","e": "demosthenes-orations-1-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Speech.section","abbr": "Dem.","placeholder": "e.g. 1.12"},"parMirror": "demosthenes-orations-1"}},{"meta": {"key": "demosthenes-orations-1-e","en": "Public Orations (1–17, 20): Olynthiacs, Philippics and others","gr": "ΔΗΜΗΓΟΡΙΑΙ Α–ΙΖ · ΠΡΟΣ ΛΕΠΤΙΝΗΝ","color": "#3b4a5a","author": "Demosthenes","hidden": true,"form": "ORATION","transPair": {"a": "demosthenes-orations-1","e": "demosthenes-orations-1-e"},"transSelf": "e","kind": "prose"},"text": {"title": "Δημηγορίαι Αʹ–ΙΖʹ· Πρὸς Λεπτίνην","greek": "ΔΗΜΟΣΘΕΝΟΥΣ ΔΗΜΗΓΟΡΙΑΙ Α–ΙΖ · ΠΡΟΣ ΛΕΠΤΙΝΗΝ","translator": "Greek text (Butcher)","lang": "grc","short": "Greek","transPair": {"a": "demosthenes-orations-1","e": "demosthenes-orations-1-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "demosthenes-orations-1","reference": {"label": "Speech.section","abbr": "Dem.","placeholder": "e.g. 1.12"}}},{"meta": {"key": "demosthenes-crown","en": "On the Crown","gr": "ΠΕΡΙ ΤΟΥ ΣΤΕΦΑΝΟΥ","color": "#5a3a2e","author": "Demosthenes","form": "ORATION","blurb": "Demosthenes’ defence of Ctesiphon, delivered in 330 BC against Aeschines’ indictment of the proposal to crown him for his services to Athens. The speech becomes a defence of his whole public career: the Peace of Philocrates, the Amphissian war, the alliance with Thebes and the defeat at Chaeronea, together with a sustained attack on the life and politics of Aeschines. The decrees, letters and depositions inserted in the manuscripts are later compositions and stand in square brackets. The translation of C. A. Vince and J. H. Vince (Loeb, 1926) with its footnotes, and the Greek of S. H. Butcher’s Oxford text as companion; the margin gives speech and section (18.1–18.324).","kind": "prose","transPair": {"a": "demosthenes-crown","e": "demosthenes-crown-e"},"transSelf": "a"},"text": {"title": "On the Crown","greek": "ΔΗΜΟΣΘΕΝΟΥΣ ΠΕΡΙ ΤΟΥ ΣΤΕΦΑΝΟΥ","subtitle": "Peri tou stephanou · speech in defence of Ctesiphon, 330 BC · trans. C. A. & J. H. Vince","translator": "C. A. Vince and J. H. Vince (1926)","lang": "eng","short": "Vince","transPair": {"a": "demosthenes-crown","e": "demosthenes-crown-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Speech.section","abbr": "Dem.","placeholder": "e.g. 18.12"},"parMirror": "demosthenes-crown"}},{"meta": {"key": "demosthenes-crown-e","en": "On the Crown","gr": "ΠΕΡΙ ΤΟΥ ΣΤΕΦΑΝΟΥ","color": "#5a3a2e","author": "Demosthenes","hidden": true,"form": "ORATION","transPair": {"a": "demosthenes-crown","e": "demosthenes-crown-e"},"transSelf": "e","kind": "prose"},"text": {"title": "Ὑπὲρ Κτησιφῶντος περὶ τοῦ στεφάνου","greek": "ΔΗΜΟΣΘΕΝΟΥΣ ΠΕΡΙ ΤΟΥ ΣΤΕΦΑΝΟΥ","translator": "Greek text (Butcher)","lang": "grc","short": "Greek","transPair": {"a": "demosthenes-crown","e": "demosthenes-crown-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "demosthenes-crown","reference": {"label": "Speech.section","abbr": "Dem.","placeholder": "e.g. 18.12"}}},{"meta": {"key": "demosthenes-embassy","en": "On the False Embassy","gr": "ΠΕΡΙ ΤΗΣ ΠΑΡΑΠΡΕΣΒΕΙΑΣ","color": "#44503a","author": "Demosthenes","form": "ORATION","blurb": "Demosthenes’ prosecution of Aeschines in 343 BC for misconduct on the second embassy to Philip of Macedon in 346, the mission that was to receive Philip’s oath to the Peace of Philocrates. Demosthenes charges his fellow envoy with false reports, with delay that allowed Philip to take Thrace and to pass Thermopylae, with the ruin of the Phocians, and with taking bribes; he quotes Solon and Sophocles against him. Aeschines’ reply survives, and he was acquitted by a narrow margin. The translation of C. A. Vince and J. H. Vince (Loeb, 1926), which entitles the speech On the Embassy, with its footnotes, and the Greek of S. H. Butcher’s Oxford text as companion; the margin gives speech and section (19.1–19.343) in the Oxford numbering.","kind": "prose","transPair": {"a": "demosthenes-embassy","e": "demosthenes-embassy-e"},"transSelf": "a"},"text": {"title": "On the False Embassy","greek": "ΔΗΜΟΣΘΕΝΟΥΣ ΠΕΡΙ ΤΗΣ ΠΑΡΑΠΡΕΣΒΕΙΑΣ","subtitle": "Peri tēs parapresbeias · prosecution of Aeschines, 343 BC · trans. C. A. & J. H. Vince","translator": "C. A. Vince and J. H. Vince (1926)","lang": "eng","short": "Vince","transPair": {"a": "demosthenes-embassy","e": "demosthenes-embassy-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Speech.section","abbr": "Dem.","placeholder": "e.g. 19.12"},"parMirror": "demosthenes-embassy"}},{"meta": {"key": "demosthenes-embassy-e","en": "On the False Embassy","gr": "ΠΕΡΙ ΤΗΣ ΠΑΡΑΠΡΕΣΒΕΙΑΣ","color": "#44503a","author": "Demosthenes","hidden": true,"form": "ORATION","transPair": {"a": "demosthenes-embassy","e": "demosthenes-embassy-e"},"transSelf": "e","kind": "prose"},"text": {"title": "Περὶ τῆς παραπρεσβείας","greek": "ΔΗΜΟΣΘΕΝΟΥΣ ΠΕΡΙ ΤΗΣ ΠΑΡΑΠΡΕΣΒΕΙΑΣ","translator": "Greek text (Butcher)","lang": "grc","short": "Greek","transPair": {"a": "demosthenes-embassy","e": "demosthenes-embassy-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "demosthenes-embassy","reference": {"label": "Speech.section","abbr": "Dem.","placeholder": "e.g. 19.12"}}},{"meta": {"key": "demosthenes-orations-2","en": "Orations 21–26: Against Meidias, Androtion, Aristocrates, Timocrates, Aristogeiton","gr": "ΚΑΤΑ ΜΕΙΔΙΟΥ · ΑΝΔΡΟΤΙΩΝΟΣ · ΑΡΙΣΤΟΚΡΑΤΟΥΣ · ΤΙΜΟΚΡΑΤΟΥΣ · ΑΡΙΣΤΟΓΕΙΤΟΝΟΣ","color": "#4a3b52","author": "Demosthenes","form": "ORATION","blurb": "Six speeches written for public prosecutions at Athens. Against Meidias concerns the blow Meidias struck Demosthenes in the theatre while he served as choregus at the Dionysia of 348; Against Androtion and Against Timocrates attack decrees and laws as unconstitutional, and Against Aristocrates a decree giving personal protection to the mercenary commander Charidemus, with a long account of the Athenian homicide courts. The two speeches Against Aristogeiton, on a politician prosecuted while a state debtor, are generally thought not to be by Demosthenes. J. H. Vince’s Loeb translation of 1935 with its footnotes, and the Greek of S. H. Butcher’s Oxford text as companion; the margin gives speech and section.","kind": "prose","transPair": {"a": "demosthenes-orations-2","e": "demosthenes-orations-2-e"},"transSelf": "a"},"text": {"title": "Orations 21–26: Against Meidias, Androtion, Aristocrates, Timocrates, Aristogeiton","greek": "ΔΗΜΟΣΘΕΝΟΥΣ ΚΑΤΑ ΜΕΙΔΙΟΥ · ΑΝΔΡΟΤΙΩΝΟΣ · ΑΡΙΣΤΟΚΡΑΤΟΥΣ · ΤΙΜΟΚΡΑΤΟΥΣ · ΑΡΙΣΤΟΓΕΙΤΟΝΟΣ","subtitle": "Kata Meidiou … Aristogeitonos · six speeches for public prosecutions · trans. J. H. Vince","translator": "J. H. Vince (1935)","lang": "eng","short": "Vince","transPair": {"a": "demosthenes-orations-2","e": "demosthenes-orations-2-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Speech.section","abbr": "Dem.","placeholder": "e.g. 21.12"},"parMirror": "demosthenes-orations-2"}},{"meta": {"key": "demosthenes-orations-2-e","en": "Orations 21–26: Against Meidias, Androtion, Aristocrates, Timocrates, Aristogeiton","gr": "ΚΑΤΑ ΜΕΙΔΙΟΥ · ΑΝΔΡΟΤΙΩΝΟΣ · ΑΡΙΣΤΟΚΡΑΤΟΥΣ · ΤΙΜΟΚΡΑΤΟΥΣ · ΑΡΙΣΤΟΓΕΙΤΟΝΟΣ","color": "#4a3b52","author": "Demosthenes","hidden": true,"form": "ORATION","transPair": {"a": "demosthenes-orations-2","e": "demosthenes-orations-2-e"},"transSelf": "e","kind": "prose"},"text": {"title": "Κατὰ Μειδίου, Ἀνδροτίωνος, Ἀριστοκράτους, Τιμοκράτους, Ἀριστογείτονος","greek": "ΔΗΜΟΣΘΕΝΟΥΣ ΚΑΤΑ ΜΕΙΔΙΟΥ · ΑΝΔΡΟΤΙΩΝΟΣ · ΑΡΙΣΤΟΚΡΑΤΟΥΣ · ΤΙΜΟΚΡΑΤΟΥΣ · ΑΡΙΣΤΟΓΕΙΤΟΝΟΣ","translator": "Greek text (Butcher)","lang": "grc","short": "Greek","transPair": {"a": "demosthenes-orations-2","e": "demosthenes-orations-2-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "demosthenes-orations-2","reference": {"label": "Speech.section","abbr": "Dem.","placeholder": "e.g. 21.12"}}},{"meta": {"key": "demosthenes-private-1","en": "Private Orations 27–40","gr": "ΛΟΓΟΙ ΙΔΙΩΤΙΚΟΙ ΚΖ–Μ","color": "#3e4f45","author": "Demosthenes","form": "ORATION","blurb": "Fourteen speeches written for private lawsuits. The five speeches against Aphobus and Onetor are Demosthenes’ own suits, brought as a young man against the guardians who had wasted his father’s estate. The rest concern maritime loans and trade (Against Zenothemis, Apaturius, Phormio and Lacritus), the banker Pasion’s heirs (For Phormio), a mining lease (Against Pantaenetus), a guardianship settlement (Against Nausimachus and Xenopeithes), and a dispute between half-brothers over a name and a dowry (Against Boeotus I–II); several are not by Demosthenes. A. T. Murray’s Loeb translation of 1936 with its footnotes, and the Greek of W. Rennie’s Oxford text as companion; the margin gives speech and section.","kind": "prose","transPair": {"a": "demosthenes-private-1","e": "demosthenes-private-1-e"},"transSelf": "a"},"text": {"title": "Private Orations 27–40","greek": "ΔΗΜΟΣΘΕΝΟΥΣ ΛΟΓΟΙ ΙΔΙΩΤΙΚΟΙ ΚΖ–Μ","subtitle": "Logoi idiōtikoi · fourteen speeches in private suits · trans. A. T. Murray","translator": "A. T. Murray (1936)","lang": "eng","short": "Murray","transPair": {"a": "demosthenes-private-1","e": "demosthenes-private-1-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Speech.section","abbr": "Dem.","placeholder": "e.g. 27.12"},"parMirror": "demosthenes-private-1"}},{"meta": {"key": "demosthenes-private-1-e","en": "Private Orations 27–40","gr": "ΛΟΓΟΙ ΙΔΙΩΤΙΚΟΙ ΚΖ–Μ","color": "#3e4f45","author": "Demosthenes","hidden": true,"form": "ORATION","transPair": {"a": "demosthenes-private-1","e": "demosthenes-private-1-e"},"transSelf": "e","kind": "prose"},"text": {"title": "Λόγοι ἰδιωτικοί ΚΖʹ–Μʹ","greek": "ΔΗΜΟΣΘΕΝΟΥΣ ΛΟΓΟΙ ΙΔΙΩΤΙΚΟΙ ΚΖ–Μ","translator": "Greek text (Rennie)","lang": "grc","short": "Greek","transPair": {"a": "demosthenes-private-1","e": "demosthenes-private-1-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "demosthenes-private-1","reference": {"label": "Speech.section","abbr": "Dem.","placeholder": "e.g. 27.12"}}},{"meta": {"key": "demosthenes-private-2","en": "Private Orations 41–49","gr": "ΛΟΓΟΙ ΙΔΙΩΤΙΚΟΙ ΜΑ–ΜΘ","color": "#55452f","author": "Demosthenes","form": "ORATION","blurb": "Nine speeches from private suits, most of them not by Demosthenes. They deal with a dowry (Against Spudias), an exchange of properties to escape a public service (Against Phaenippus), the inheritance of Hagnias and of Archiades (Against Macartatus, Against Leochares), false testimony (the two speeches of Apollodorus Against Stephanus, and Against Evergus and Mnesibulus), damages over an estate (Against Olympiodorus), and a debt owed by the general Timotheus to the banker Pasion (Against Timotheus). The laws and depositions read in court are given as transmitted. A. T. Murray’s Loeb translation of 1939 with its footnotes, and the Greek of W. Rennie’s Oxford text as companion; the margin gives speech and section.","kind": "prose","transPair": {"a": "demosthenes-private-2","e": "demosthenes-private-2-e"},"transSelf": "a"},"text": {"title": "Private Orations 41–49","greek": "ΔΗΜΟΣΘΕΝΟΥΣ ΛΟΓΟΙ ΙΔΙΩΤΙΚΟΙ ΜΑ–ΜΘ","subtitle": "Logoi idiōtikoi · nine speeches in private suits · trans. A. T. Murray","translator": "A. T. Murray (1939)","lang": "eng","short": "Murray","transPair": {"a": "demosthenes-private-2","e": "demosthenes-private-2-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Speech.section","abbr": "Dem.","placeholder": "e.g. 41.12"},"parMirror": "demosthenes-private-2"}},{"meta": {"key": "demosthenes-private-2-e","en": "Private Orations 41–49","gr": "ΛΟΓΟΙ ΙΔΙΩΤΙΚΟΙ ΜΑ–ΜΘ","color": "#55452f","author": "Demosthenes","hidden": true,"form": "ORATION","transPair": {"a": "demosthenes-private-2","e": "demosthenes-private-2-e"},"transSelf": "e","kind": "prose"},"text": {"title": "Λόγοι ἰδιωτικοί ΜΑʹ–ΜΘʹ","greek": "ΔΗΜΟΣΘΕΝΟΥΣ ΛΟΓΟΙ ΙΔΙΩΤΙΚΟΙ ΜΑ–ΜΘ","translator": "Greek text (Rennie)","lang": "grc","short": "Greek","transPair": {"a": "demosthenes-private-2","e": "demosthenes-private-2-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "demosthenes-private-2","reference": {"label": "Speech.section","abbr": "Dem.","placeholder": "e.g. 41.12"}}},{"meta": {"key": "demosthenes-private-3","en": "Private Orations 50–59","gr": "ΛΟΓΟΙ ΙΔΙΩΤΙΚΟΙ Ν–ΝΘ","color": "#5a3f45","author": "Demosthenes","form": "ORATION","blurb": "Ten speeches, most of them not by Demosthenes: Apollodorus on the costs of an overlong trierarchy (Against Polycles), On the Trierarchic Crown, Apollodorus Against Callippus and Against Nicostratus, Ariston’s suit for assault Against Conon, a farmer’s defence against a claim for flood damage (Against Callicles), a maritime loan (Against Dionysodorus), Euxitheus’ appeal against loss of citizenship (Against Eubulides), the information Against Theocrines, and the prosecution of the courtesan Neaera for living as the wife of an Athenian citizen, the longest account of a woman’s life in Attic oratory. A. T. Murray’s Loeb translation of 1939 with its footnotes, and the Greek of W. Rennie’s Oxford text as companion; the margin gives speech and section.","kind": "prose","transPair": {"a": "demosthenes-private-3","e": "demosthenes-private-3-e"},"transSelf": "a"},"text": {"title": "Private Orations 50–59","greek": "ΔΗΜΟΣΘΕΝΟΥΣ ΛΟΓΟΙ ΙΔΙΩΤΙΚΟΙ Ν–ΝΘ","subtitle": "Logoi idiōtikoi · ten speeches in private and public suits · trans. A. T. Murray","translator": "A. T. Murray (1939)","lang": "eng","short": "Murray","transPair": {"a": "demosthenes-private-3","e": "demosthenes-private-3-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Speech.section","abbr": "Dem.","placeholder": "e.g. 50.12"},"parMirror": "demosthenes-private-3"}},{"meta": {"key": "demosthenes-private-3-e","en": "Private Orations 50–59","gr": "ΛΟΓΟΙ ΙΔΙΩΤΙΚΟΙ Ν–ΝΘ","color": "#5a3f45","author": "Demosthenes","hidden": true,"form": "ORATION","transPair": {"a": "demosthenes-private-3","e": "demosthenes-private-3-e"},"transSelf": "e","kind": "prose"},"text": {"title": "Λόγοι ἰδιωτικοί Νʹ–ΝΘʹ","greek": "ΔΗΜΟΣΘΕΝΟΥΣ ΛΟΓΟΙ ΙΔΙΩΤΙΚΟΙ Ν–ΝΘ","translator": "Greek text (Rennie)","lang": "grc","short": "Greek","transPair": {"a": "demosthenes-private-3","e": "demosthenes-private-3-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "demosthenes-private-3","reference": {"label": "Speech.section","abbr": "Dem.","placeholder": "e.g. 50.12"}}},{"meta": {"key": "demosthenes-minor","en": "Funeral Speech, Erotic Essay, Exordia and Letters (60–63)","gr": "ΕΠΙΤΑΦΙΟΣ · ΕΡΩΤΙΚΟΣ · ΠΡΟΟΙΜΙΑ · ΕΠΙΣΤΟΛΑΙ","color": "#2f4a4f","author": "Demosthenes","form": "ORATION","blurb": "The last pieces of the Demosthenic corpus. The Funeral Speech honours the Athenians who fell at Chaeronea in 338; the Erotic Essay, an encomium of the youth Epicrates, is almost certainly not by Demosthenes. The fifty-six Exordia are openings for speeches to the Assembly, several of them close to the openings of surviving Philippics. The six Letters are addressed to the Athenian Council and Assembly, four of them from Demosthenes’ exile after the Harpalus affair; their authenticity is disputed. The translation of N. W. and N. J. DeWitt (Loeb, 1949) with its footnotes, and the Greek of W. Rennie’s Oxford text as companion; the margin gives speech and section, and for the Exordia and Letters number and section (62.1.1, 63.1.1).","kind": "prose","transPair": {"a": "demosthenes-minor","e": "demosthenes-minor-e"},"transSelf": "a"},"text": {"title": "Funeral Speech, Erotic Essay, Exordia and Letters (60–63)","greek": "ΔΗΜΟΣΘΕΝΟΥΣ ΕΠΙΤΑΦΙΟΣ · ΕΡΩΤΙΚΟΣ · ΠΡΟΟΙΜΙΑ · ΕΠΙΣΤΟΛΑΙ","subtitle": "Epitaphios · Erōtikos · Prooimia · Epistolai · the minor works of the corpus · trans. N. W. & N. J. DeWitt","translator": "N. W. and N. J. DeWitt (1949)","lang": "eng","short": "DeWitt","transPair": {"a": "demosthenes-minor","e": "demosthenes-minor-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Speech.section (Exordia, Letters: 62.n.section, 63.n.section)","abbr": "Dem.","placeholder": "e.g. 60.12"},"parMirror": "demosthenes-minor"}},{"meta": {"key": "demosthenes-minor-e","en": "Funeral Speech, Erotic Essay, Exordia and Letters (60–63)","gr": "ΕΠΙΤΑΦΙΟΣ · ΕΡΩΤΙΚΟΣ · ΠΡΟΟΙΜΙΑ · ΕΠΙΣΤΟΛΑΙ","color": "#2f4a4f","author": "Demosthenes","hidden": true,"form": "ORATION","transPair": {"a": "demosthenes-minor","e": "demosthenes-minor-e"},"transSelf": "e","kind": "prose"},"text": {"title": "Ἐπιτάφιος, Ἐρωτικός, Προοίμια, Ἐπιστολαί","greek": "ΔΗΜΟΣΘΕΝΟΥΣ ΕΠΙΤΑΦΙΟΣ · ΕΡΩΤΙΚΟΣ · ΠΡΟΟΙΜΙΑ · ΕΠΙΣΤΟΛΑΙ","translator": "Greek text (Rennie)","lang": "grc","short": "Greek","transPair": {"a": "demosthenes-minor","e": "demosthenes-minor-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "demosthenes-minor","reference": {"label": "Speech.section (Exordia, Letters: 62.n.section, 63.n.section)","abbr": "Dem.","placeholder": "e.g. 60.12"}}},{"meta": {"key": "aeschines-speeches","en": "Speeches","gr": "ΛΟΓΟΙ","color": "#4a3b2a","author": "Aeschines","form": "ORATION","blurb": "The three surviving speeches of Aeschines, all of them from his long quarrel with Demosthenes over Athenian policy toward Philip of Macedon. Against Timarchus (345 B.C.) disqualifies one of his accusers by attacking his private life, and is a principal source for Athenian law and custom on male prostitution and the conduct of citizens; On the Embassy (343 B.C.) is his defence against Demosthenes' charge of misconduct in the negotiation of the Peace of Philocrates; Against Ctesiphon (330 B.C.) attacks the proposal to crown Demosthenes, and was answered by the speech On the Crown. Charles Darwin Adams's Loeb translation of 1919 with its notes, and his Greek text as companion; the margin gives ought the metres of Alcaeus and Sappho into Latin, issued from about 23 BC: friendship, wine, love, the countryside, the shortness of life, the gods and the Rome of Augustus. John Conington's rhymed verse translation of 1863, with the Latin.","transPair": {"a": "horace-odes","b": "horace-odes-b"},"transSelf": "a","kind": "verse"},"text": {"title": "Odes and Secular Hymn","greek": "Q. HORATII FLACCI CARMINA ET CARMEN SAECULARE","subtitle": "Carmina, Carmen Saeculare · the four books of lyric odes and the hymn for the Secular Games · trans. John Conington","translator": "John Conington (1863)","lang": "eng","short": "Conington","transPair": {"a": "horace-odes","b": "horace-odes-b"},"transSelf": "a","reference": {"label": "Book.ode","abbr": "","placeholder": "e.g. 1.9 (CS for the Secular Hymn)"},"parMirror": "horace-odes"}},{"meta": {"key": "horace-odes-b","en": "Odes and Secular Hymn","gr": "CARMINA ET CARMEN SAECULARE","color": "#3d4a3a","author": "Horace","hidden": true,"form": "POETRY","transPair": {"a": "horace-odes","b": "horace-odes-b"},"transSelf": "b","kind": "verse"},"text": {"title": "Carmina et Carmen Saeculare","greek": "Q. HORATII FLACCI CARMINA ET CARMEN SAECULARE","translator": "Latin text (Shorey–Laing)","lang": "lat","short": "Latin","transPair": {"a": "horace-odes","b": "horace-odes-b"},"transSelf": "b","parMirror": "horace-odes","reference": {"label": "Book.ode","abbr": "","placeholder": "e.g. 1.9 (CS for the Secular Hymn)"}}},{"meta": {"key": "horace-satires","en": "Satires","gr": "SERMONES","color": "#4b3a3f","author": "Horace","form": "POETRY","blurb": "Horace's two books of conversational hexameter poems, published about 35 and 30 BC. Book I has ten satires — on avarice, the journey to Brundisium, his father, the bore; Book II eight, mostly dialogues — Damasippus, the town and country mouse, Nasidienus. Christopher Smart's prose version as revised by Buckley, with the Latin.","transPair": {"a": "horace-satires","b": "horace-satires-b"},"transSel es and Secular Hymn","gr": "EPODI ET CARMEN SAECULARE","color": "#4a3a30","author": "Horace","hidden": true,"form": "POETRY","transPair": {"a": "horace-epodes","b": "horace-epodes-b"},"transSelf": "b","kind": "verse"},"text": {"title": "Epodi et Carmen Saeculare","greek": "Q. HORATII FLACCI EPODON LIBER ET CARMEN SAECULARE","translator": "Latin text (Vollmer; Shorey–Laing)","lang": "lat","short": "Latin","transPair": {"a": "horace-epodes","b": "horace-epodes-b"},"transSelf": "b","noSpeakerLabels": true,"parMirror": "horace-epodes","reference": {"label": "Epode","abbr": "","placeholder": "e.g. 16"}}},{"meta": {"key": "horace-epistles","en": "Epistles","gr": "EPISTULAE","color": "#33434a","author": "Horace","form": "LETTERS","blurb": "Horace's two books of letters in hexameter verse. Book I, published about 20 BC, turns from lyric to the question of how to live, in letters to Maecenas, Lollius and others; Book II holds two long literary letters, to Augustus and to Julius Florus. Christopher Smart's prose version as revised by Buckley, with the Latin.","transPair": {"a": "horace-epistles","b": "horace-epistles-b"},"transSelf": "a","kind": "letters"},"text": {"title": "Epistles","greek": "Q. HORATII FLACCI EPISTULAE","subtitle": "Epistulae · twenty-two verse letters in two books · trans. Christopher Smart, rev. T. A. Buckley","translator": "Christopher Smart, rev. T. A. Buckley (1863)","lang": "eng","short": "Smart","transPair": {"a": "horace-epistles","b": "horace-epistles-b"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.epistle","abbr": "","placeholder": "e.g. 1.10"},"parMirror": "horace-epistles"}},{"meta": {"key": "horace-epistles-b","en": "Epistles","gr": "EPISTULAE","color": "#33434a","author": "Horace","hidden": true,"form": "LETTERS","transPair": {"a": "horace-epistles","b": "horace-epistles-b"},"transSelf": "b","kind": "letters"},"text": {"title": "Epistulae","greek": "Q. HORATII FLACCI EPISTULAE","translator": "Latin text (Fairclough)","lang": "lat","short": "Latin","transPair": {"a": "horace-epistles","b": "horace-epistles-b"},"transSelf": "b","noSpeakerLabels": true,"parMirror": "horace-epistles","reference": {"label": "Book.epistle","abbr": "","placeholder": "e.g. 1.10"}}},{"meta": {"key": "nonnus-dionysiaca","en": "Dionysiaca","kind": "poem","gr": "ΔΙΟΝΥΣΙΑΚΑ","color": "#6b2d5b","author": "Nonnus","transPair": {"a": "nonnus-dionysiaca","e": "nonnus-dionysiaca-e"},"transSelf": "a","form": "EPIC","blurb": "The last great epic of the ancient world and the longest poem to survive from antiquity: forty-eight books on the life of Dionysus, composed in Greek hexameters at Panopolis in Egypt in the fifth century CE, from Zeus’s theft of Europa through the Indian war to the god’s ascent to Olympus."},"text": {"title": "Dionysiaca","greek": "ΔΙΟΝΥΣΙΑΚΑ","subtitle": "48 books, 21,286 verses — a line-by-line English translation, keyed to the Greek","translator": "Claude AI","lang": "eng","short": "Claude AI","noSpeakerLabels": true,"transPair": {"a": "nonnus-dionysiaca","e": "nonnus-dionysiaca-e"},"transSelf": "a","reference": {"label": "Book and line","abbr": "","placeholder": "e.g. 1.100"}}},{"meta": {"key": "nonnus-dionysiaca-e","en": "Dionysiaca","kind": "poem","gr": "ΔΙΟΝΥΣΙΑΚΑ","color": "#6b2d5b","author": "Nonnus","hidden": true,"transPair": {"a": "nonnus-dionysiaca","e": "nonnus-dionysiaca-e"},"transSelf": "e","form": "EPIC"},"text": {"title": "Dionysiaca","greek": "ΔΙΟΝΥΣΙΑΚΑ","translator": "Greek text","lang": "grc","short": "Greek","noSpeakerLabels": true,"transPair": {"a": "nonnus-dionysiaca","e": "nonnus-dionysiaca-e"},"transSelf": "e","reference": {"label": "Book and line","abbr": "","placeholder": "e.g. 1.100"}}},{"meta": {"key": "manilius-astronomica","en": "Astronomica","kind": "poem","gr": "ASTRONOMICA","color": "#3b4a7a","author": "Manilius","transPair": {"a": "manilius-astronomica","b": "manilius-astronomica-b"},"transSelf": "a","form": "EPIC","blurb": "The one surviving Latin poem of ays","e": "hesiod-works-days-e"},"transSelf": "a","lang": "eng","short": "Evelyn-White","parMirror": "hesiod-works-days"}},{"meta": {"key": "hesiod-works-days-e","en": "Works and Days","kind": "poem","gr": "ΕΡΓΑ ΚΑΙ ΗΜΕΡΑΙ","color": "#27418d","author": "Hesiod","hidden": true,"transPair": {"a": "hesiod-works-days","e": "hesiod-works-days-e"},"transSelf": "e","form": "POETRY"},"text": {"title": "Ἔργα καὶ Ἡμέραι","greek": "ΕΡΓΑ ΚΑΙ ΗΜΕΡΑΙ","translator": "Greek text (Evelyn-White)","lang": "grc","short": "Greek","noSpeakerLabels": true,"transPair": {"a": "hesiod-works-days","e": "hesiod-works-days-e"},"transSelf": "e","parMirror": "hesiod-works-days"}},{"meta": {"key": "herodotus-1","en": "The Histories (Books I–III)","kind": "history","gr": "ΙΣΤΟΡΙΑΙ","color": "#7d2e2e","author": "Herodotus","form": "HISTORY","transPair": {"a": "herodotus-1","e": "herodotus-1-e"},"transSelf": "a","blurb": "The first three books of the Histories: the rise of Persia under Cyrus, the fall of Croesus and Lydia, a long account of Egypt’s customs and kings, and Cambyses and Darius taking the throne."},"text": {"title": "The Histories (Books I–III)","greek": "ΙΣΤΟΡΙΩΝ ΑΠΟΔΕΞΙΣ","subtitle": "Clio · Euterpe · Thaleia","translator": "G. C. Macaulay (1890)","noSpeakerLabels": true,"transPair": {"a": "herodotus-1","e": "herodotus-1-e"},"transSelf": "a","lang": "eng","short": "Macaulay","parMirror": "herodotus-1"}},{"meta": {"key": "herodotus-1-e","en": "The Histories (Books I–III)","kind": "history","gr": "ΙΣΤΟΡΙΑΙ Α–Γ","color": "#7d2e2e","author": "Herodotus","hidden": true,"transPair": {"a": "herodotus-1","e": "herodotus-1-e"},"transSelf": "e","form": "HISTORY"},"text": {"title": "Ἱστορίαι Α–Γ","greek": "ΙΣΤΟΡΙΑΙ Α–Γ","translator": "Greek text (Godley)","lang": "grc","short": "Greek","noSpeakerLabels": true,"transPair": {"a": "herodotus-1","e": "herodotus-1-e"},"transSelf": "e","parMirror": "herodotus-1"}},{"meta": {"key": "herodotus-2","en": "The Histories (Books IV–VI)","kind": "history","gr": "ΙΣΤΟΡΙΑΙ","color": "#7d2e2e","author": "Herodotus","form": "HISTORY","transPair": {"a": "herodotus-2","e": "herodotus-2-e"},"transSelf": "a","blurb": "Books IV–VI of the Histories: Scythia and Libya, the Ionian revolt, Sparta’s kings, and the first Persian invasion of Greece ending with the Athenian victory at Marathon in 490 BCE."},"text": {"title": "The Histories (Books IV–VI)","greek": "ΙΣΤΟΡΙΩΝ ΑΠΟΔΕΞΙΣ","subtitle": "Melpomene · Terpsichore · Erato","translator": "G. C. Macaulay (1890)","noSpeakerLabels": true,"transPair": {"a": "herodotus-2","e": "herodotus-2-e"},"transSelf": "a","lang": "eng","short": "Macaulay","parMirror": "herodotus-2"}},{"meta": {"key": "herodotus-2-e","en": "The Histories (Books IV–VI)","kind": "history","gr": "ΙΣΤΟΡΙΑΙ Δ–Ϛ","color": "#7d2e2e","author": "Herodotus","hidden": true,"transPair": {"a": "herodotus-2","e": "herodotus-2-e"},"transSelf": "e","form": "HISTORY"},"text": {"title": "Ἱστορίαι Δ–Ϛ","greek": "ΙΣΤΟΡΙΑΙ Δ–Ϛ","translator": "Greek text (Godley)","lang": "grc","short": "Greek","noSpeakerLabels": true,"transPair": {"a": "herodotus-2","e": "herodotus-2-e"},"transSelf": "e","parMirror": "herodotus-2"}},{"meta": {"key": "herodotus-3","en": "The Histories (Books VII–IX)","kind": "history","gr": "ΙΣΤΟΡΙΑΙ","color": "#7d2e2e","author": "Herodotus","form": "HISTORY","transPair": {"a": "herodotus-3","e": "herodotus-3-e"},"transSelf": "a","blurb": "The last three books of the Histories: Xerxes’ great invasion, the stand at Thermopylae, the sea-fight at Salamis, and the Greek victories at Plataea and Mycale that ended the Persian threat."},"text": {"title": "The Histories (Books VII–IX)","greek": "ΙΣΤΟΡΙΩΝ ΑΠΟΔΕΞΙΣ","subtitle": "Polymnia · Urania · Calliope","translator": "G. C. Macaulay (1890)","noSpeakerLabels": true,"transPair": {"a": "herodotus-3","e": "herodotus-3-e"},"transSelf": "a","lang": "eng","short": "Macaulay","parMirror": "herodotus-3"}},{"meta": {"key": "herodotus-3-e","en": "The Histories (Books VII–IX)","kind": "his ns and Sparta, 422–414 BC: the Peace of Nicias, the battle of Mantinea, the Melian dialogue and the destruction of Melos, and the sailing of the great fleet to Sicily. Richard Crawley’s translation of 1874, with the Greek as companion.","transPair": {"a": "thucydides-3","e": "thucydides-3-e"},"transSelf": "a","kind": "history"},"text": {"title": "The Peloponnesian War (Books V–VI)","greek": "ΘΟΥΚΥΔΙΔΟΥ ΙΣΤΟΡΙΑΙ Εʹ–Ϛʹ","subtitle": "Historiai · history of the war between Athens and Sparta, Books V–VI of eight · trans. Richard Crawley","translator": "Richard Crawley (1874)","lang": "eng","short": "Crawley","transPair": {"a": "thucydides-3","e": "thucydides-3-e"},"transSelf": "a","reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 5.89"},"parMirror": "thucydides-3"}},{"meta": {"key": "thucydides-3-e","en": "The Peloponnesian War (Books V–VI)","gr": "ΙΣΤΟΡΙΑΙ Εʹ–Ϛʹ","color": "#3a4a52","author": "Thucydides","hidden": true,"form": "HISTORY","transPair": {"a": "thucydides-3","e": "thucydides-3-e"},"transSelf": "e","kind": "history"},"text": {"title": "Ἱστορίαι (Εʹ–Ϛʹ)","greek": "ΘΟΥΚΥΔΙΔΟΥ ΙΣΤΟΡΙΑΙ Εʹ–Ϛʹ","translator": "Greek text (Jones)","lang": "grc","short": "Greek","transPair": {"a": "thucydides-3","e": "thucydides-3-e"},"transSelf": "e","parMirror": "thucydides-3","reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 5.89"}}},{"meta": {"key": "thucydides-4","en": "The Peloponnesian War (Books VII–VIII)","gr": "ΙΣΤΟΡΙΑΙ Ζʹ–Ηʹ","color": "#2e3f4f","author": "Thucydides","form": "HISTORY","blurb": "The last two books of Thucydides’ history of the war between Athens and Sparta, 414–411 BC: the destruction of the Athenian expedition at Syracuse, then the revolt of the Ionian allies, the Four Hundred at Athens, and Cynossema, where the narrative stops unfinished. Richard Crawley’s translation of 1874, with the Greek as companion.","transPair": {"a": "thucydides-4","e": "thucydides-4-e"},"transSelf": "a","kind": "history"},"text": {"title":
