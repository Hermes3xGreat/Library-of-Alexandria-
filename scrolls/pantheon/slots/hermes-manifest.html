": true,"reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 1.63"},"parMirror": "polybius-1"}},{"meta": {"key": "polybius-1-e","en": "The Histories (Books I–II)","gr": "ΙΣΤΟΡΙΑΙ Αʹ–Βʹ","color": "#3d3a2f","author": "Polybius","hidden": true,"form": "HISTORY","transPair": {"a": "polybius-1","e": "polybius-1-e"},"transSelf": "e","kind": "history"},"text": {"title": "Ἱστορίαι Αʹ–Βʹ","greek": "ΠΟΛΥΒΙΟΥ ΙΣΤΟΡΙΑΙ","translator": "Greek text (Büttner-Wobst)","lang": "grc","short": "Greek","transPair": {"a": "polybius-1","e": "polybius-1-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "polybius-1","reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 1.63"}}},{"meta": {"key": "polybius-2","en": "The Histories (Books III–IV)","gr": "ΙΣΤΟΡΙΑΙ Γʹ–Δʹ","color": "#35403a","author": "Polybius","form": "HISTORY","blurb": "Book III opens the main narrative with the Hannibalic War: its causes, the siege of Saguntum, Hannibal’s march across the Alps, and the Roman defeats at the Trebia, Lake Trasimene and Cannae (220–216 BC). Book IV turns to Greece and the Social War of Philip V. Shuckburgh’s translation of 1889, with the Greek as companion.","transPair": {"a": "polybius-2","e": "polybius-2-e"},"transSelf": "a","kind": "history"},"text": {"title": "The Histories (Books III–IV)","greek": "ΠΟΛΥΒΙΟΥ ΙΣΤΟΡΙΑΙ","subtitle": "Historiai, Books III–IV · the rise of Rome to world power, 264–146 BC · trans. Shuckburgh","translator": "Evelyn S. Shuckburgh (1889)","lang": "eng","short": "Shuckburgh","transPair": {"a": "polybius-2","e": "polybius-2-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 3.48"},"parMirror": "polybius-2"}},{"meta": {"key": "polybius-2-e","en": "The Histories (Books III–IV)","gr": "ΙΣΤΟΡΙΑΙ Γʹ–Δʹ","color": "#35403a","author": "Polybius","hidden": true,"form": "HISTORY","transPair": {"a": "polybius-2","e": "polybius-2-e"},"transSelf": "e","kind": "history"},"text": {"title": "Ἱστορίαι Γʹ–Δʹ","greek": "ΠΟΛΥΒΙΟΥ ΙΣΤΟΡΙΑΙ","translator": "Greek text (Büttner-Wobst)","lang": "grc","short": "Greek","transPair": {"a": "polybius-2","e": "polybius-2-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "polybius-2","reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 3.48"}}},{"meta": {"key": "polybius-3","en": "The Histories (Books V–VIII)","gr": "ΙΣΤΟΡΙΑΙ Εʹ–Ηʹ","color": "#2f3a45","author": "Polybius","form": "HISTORY","blurb": "Book V completes the Social War and the war of Antiochus III and Ptolemy IV to the battle of Raphia; with it the continuous text of Polybius ends. Book VI describes the Roman constitution and army; Books VII and VIII include Archimedes at Syracuse. Shuckburgh’s translation of 1889, with the Greek as companion.","transPair": {"a": "polybius-3","e": "polybius-3-e"},"transSelf": "a","kind": "history"},"text": {"title": "The Histories (Books V–VIII)","greek": "ΠΟΛΥΒΙΟΥ ΙΣΤΟΡΙΑΙ","subtitle": "Historiai, Books V–VIII · the rise of Rome to world power, 264–146 BC · trans. Shuckburgh","translator": "Evelyn S. Shuckburgh (1889)","lang": "eng","short": "Shuckburgh","transPair": {"a": "polybius-3","e": "polybius-3-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 6.11"},"parMirror": "polybius-3"}},{"meta": {"key": "polybius-3-e","en": "The Histories (Books V–VIII)","gr": "ΙΣΤΟΡΙΑΙ Εʹ–Ηʹ","color": "#2f3a45","author": "Polybius","hidden": true,"form": "HISTORY","transPair": {"a": "polybius-3","e": "polybius-3-e"},"transSelf": "e","kind": "history"},"text": {"title": "Ἱστορίαι Εʹ–Ηʹ","greek": "ΠΟΛΥΒΙΟΥ ΙΣΤΟΡΙΑΙ","translator": "Greek text (Büttner-Wobst)","lang": "grc","short": "Greek","transPair": {"a": "polybius-3","e": "polybius-3-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "polybius-3","reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 6.11"}}},{"meta": {"key": "polybius-4","en": "The Histories (Books IX–XV)","gr": "ΙΣΤΟΡΙΑΙ Θʹ–ΙΕʹ","color": "#403434","author": "Polybius","form": "HISTORY","blurb": "Excerpts for the years 211–202 BC: Hannibal’s march on Rome and the fall of Capua, Scipio’s capture of New Carthage, Philopoemen’s reforms, the Metaurus, the long criticism of Timaeus that fills Book XII, and Scipio in Africa to the battle of Zama. Shuckburgh’s translation of 1889, with the Greek as companion.","transPair": {"a": "polybius-4","e": "polybius-4-e"},"transSelf": "a","kind": "history"},"text": {"title": "The Histories (Books IX–XV)","greek": "ΠΟΛΥΒΙΟΥ ΙΣΤΟΡΙΑΙ","subtitle": "Historiai, Books IX–XV · the rise of Rome to world power, 264–146 BC · trans. Shuckburgh","translator": "Evelyn S. Shuckburgh (1889)","lang": "eng","short": "Shuckburgh","transPair": {"a": "polybius-4","e": "polybius-4-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 10.16"},"parMirror": "polybius-4"}},{"meta": {"key": "polybius-4-e","en": "The Histories (Books IX–XV)","gr": "ΙΣΤΟΡΙΑΙ Θʹ–ΙΕʹ","color": "#403434","author": "Polybius","hidden": true,"form": "HISTORY","transPair": {"a": "polybius-4","e": "polybius-4-e"},"transSelf": "e","kind": "history"},"text": {"title": "Ἱστορίαι Θʹ–ΙΕʹ","greek": "ΠΟΛΥΒΙΟΥ ΙΣΤΟΡΙΑΙ","translator": "Greek text (Büttner-Wobst)","lang": "grc","short": "Greek","transPair": {"a": "polybius-4","e": "polybius-4-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "polybius-4","reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 10.16"}}},{"meta": {"key": "polybius-5","en": "The Histories (Books XVI–XXVII)","gr": "ΙΣΤΟΡΙΑΙ ΙϚʹ–ΚΖʹ","color": "#3a3345","author": "Polybius","form": "HISTORY","blurb": "Excerpts for the years 201–170 BC: Philip V’s war with Attalus and Rhodes, the battle of Cynoscephalae and the comparison of phalanx and legion, the proclamation of Greek freedom at the Isthmus, the war with Antiochus, and the opening of the war with Perseus. Shuckburgh’s translation of 1889, with the Greek as companion.","transPair": {"a": "polybius-5","e": "polybius-5-e"},"transSelf": "a","kind": "history"},"text": {"title": "The Histories (Books XVI–XXVII)","greek": "ΠΟΛΥΒΙΟΥ ΙΣΤΟΡΙΑΙ","subtitle": "Historiai, Books XVI–XXVII · the rise of Rome to world power, 264–146 BC · trans. Shuckburgh","translator": "Evelyn S. Shuckburgh (1889)","lang": "eng","short": "Shuckburgh","transPair": {"a": "polybius-5","e": "polybius-5-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 18.28"},"parMirror": "polybius-5"}},{"meta": {"key": "polybius-5-e","en": "The Histories (Books XVI–XXVII)","gr": "ΙΣΤΟΡΙΑΙ ΙϚʹ–ΚΖʹ","color": "#3a3345","author": "Polybius","hidden": true,"form": "HISTORY","transPair": {"a": "polybius-5","e": "polybius-5-e"},"transSelf": "e","kind": "history"},"text": {"title": "Ἱστορίαι ΙϚʹ–ΚΖʹ","greek": "ΠΟΛΥΒΙΟΥ ΙΣΤΟΡΙΑΙ","translator": "Greek text (Büttner-Wobst)","lang": "grc","short": "Greek","transPair": {"a": "polybius-5","e": "polybius-5-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "polybius-5","reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 18.28"}}},{"meta": {"key": "polybius-6","en": "The Histories (Books XXVIII–XXXIX)","gr": "ΙΣΤΟΡΙΑΙ ΚΗʹ–ΛΘʹ","color": "#2f4040","author": "Polybius","form": "HISTORY","blurb": "Excerpts for the years 170–146 BC: the war with Perseus and the battle of Pydna, Popilius’ circle round Antiochus Epiphanes, Polybius’s detention in Italy and friendship with Scipio Aemilianus, the destruction of Carthage and the sack of Corinth. The unplaced Shorter Fragments close the volume. Shuckburgh’s translation of 1889, with the Greek as companion.","transPair": {"a": "polybius-6","e": "polybius-6-e"},"transSelf": "a","kind": "history"},"text": {"title": "The Histories (Books XXVIII–XXXIX)","greek": "ΠΟΛΥΒΙΟΥ ΙΣΤΟΡΙΑΙ","subtitle": "Historiai, Books XXVIII–XXXIX · the rise of Rome to world power, 264–146 BC · trans. Shuckburgh","translator": "Evelyn S. Shuckburgh (1889)","lang": "eng","short": "Shuckburgh","transPair": {"a": "polybius-6","e": "polybius-6-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 31.4"},"parMirror": "polybius-6"}},{"meta": {"key": "polybius-6-e","en": "The Histories (Books XXVIII–XXXIX)","gr": "ΙΣΤΟΡΙΑΙ ΚΗʹ–ΛΘʹ","color": "#2f4040","author": "Polybius","hidden": true,"form": "HISTORY","transPair": {"a": "polybius-6","e": "polybius-6-e"},"transSelf": "e","kind": "history"},"text": {"title": "Ἱστορίαι ΚΗʹ–ΛΘʹ","greek": "ΠΟΛΥΒΙΟΥ ΙΣΤΟΡΙΑΙ","translator": "Greek text (Büttner-Wobst)","lang": "grc","short": "Greek","transPair": {"a": "polybius-6","e": "polybius-6-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "polybius-6","reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 31.4"}}},{"meta": {"key": "caesar-gallic-war","en": "The Gallic War","gr": "COMMENTARII DE BELLO GALLICO","color": "#5a2a27","author": "Julius Caesar","form": "HISTORY","blurb": "Caesar’s commentaries on his campaigns in Gaul from 58 to 52 BC, one book to a year: the migration of the Helvetii and the war with Ariovistus, the Belgic and Venetic campaigns, the bridging of the Rhine and the two crossings to Britain, the destruction of Sabinus and Cotta’s legion, the digression on the customs of the Gauls and Germans, and the rising of Vercingetorix that ends at Alesia. The eighth book, by Caesar’s officer Aulus Hirtius, carries the narrative through 51 and 50 BC and opens with his prefatory letter to Balbus. The translation of W. A. McDevitte and W. S. Bohn, whose square brackets mark words supplied by the translators, with the Latin of T. Rice Holmes’s Oxford text as companion; the margin gives book and chapter.","kind": "history","transPair": {"a": "caesar-gallic-war","b": "caesar-gallic-war-b"},"transSelf": "a"},"text": {"title": "The Gallic War","greek": "C. IULI CAESARIS COMMENTARII DE BELLO GALLICO","subtitle": "Commentarii de Bello Gallico · Caesar’s own account of the conquest of Gaul, with Hirtius’ eighth book · trans. McDevitte & Bohn","translator": "W. A. McDevitte and W. S. Bohn (1851)","lang": "eng","short": "McDevitte & Bohn","transPair": {"a": "caesar-gallic-war","b": "caesar-gallic-war-b"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 1.12"},"parMirror": "caesar-gallic-war"}},{"meta": {"key": "caesar-gallic-war-b","en": "The Gallic War","gr": "COMMENTARII DE BELLO GALLICO","color": "#5a2a27","author": "Julius Caesar","hidden": true,"form": "HISTORY","transPair": {"a": "caesar-gallic-war","b": "caesar-gallic-war-b"},"transSelf": "b","kind": "history"},"text": {"title": "Commentarii de Bello Gallico","greek": "C. IULI CAESARIS COMMENTARII DE BELLO GALLICO","translator": "Latin text (Rice Holmes)","lang": "lat","short": "Latin","transPair": {"a": "caesar-gallic-war","b": "caesar-gallic-war-b"},"transSelf": "b","noSpeakerLabels": true,"parMirror": "caesar-gallic-war","reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 1.12"}}},{"meta": {"key": "caesar-civil-war","en": "The Civil War","gr": "COMMENTARII DE BELLO CIVILI","color": "#3b3550","author": "Julius Caesar","form": "HISTORY","blurb": "Caesar’s three books on the first two years of the civil war. The first runs from the debates in the senate in January 49 BC and the march into Italy to the siege of Brundisium and the campaign against Afranius and Petreius at Ilerda; the second covers the siege of Massilia, the surrender of Varro in Further Spain and the defeat and death of Curio in Africa; the third the crossing to Epirus, the blockade at Dyrrachium, the battle of Pharsalus, Pompey’s flight and murder in Egypt, and the beginning of the Alexandrian war, where the text breaks off. A. G. Peskett’s translation for the Loeb Classical Library, with the Latin of R. du Pontet’s Oxford text as companion; the margin gives book and chapter.","kind": "history","transPair": {"a": "caesar-civil-war","b": "caesar-civil-war-b"},"transSelf": "a"},"text": {"title": "The Civil War","greek": "C. IULI CAESARIS COMMENTARII DE BELLO CIVILI","subtitle": "Commentarii de Bello Civili · Caesar’s account of the war against Pompey, 49–48 BC · trans. A. G. Peskett","translator": "A. G. Peskett (1914)","lang": "eng","short": "Peskett","transPair": {"a": "caesar-civil-war","b": "caesar-civil-war-b"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 1.12"},"parMirror": "caesar-civil-war"}},{"meta": {"key": "caesar-civil-war-b","en": "The Civil War","gr": "COMMENTARII DE BELLO CIVILI","color": "#3b3550","author": "Julius Caesar","hidden": true,"form": "HISTORY","transPair": {"a": "caesar-civil-war","b": "caesar-civil-war-b"},"transSelf": "b","kind": "history"},"text": {"title": "Commentarii de Bello Civili","greek": "C. IULI CAESARIS COMMENTARII DE BELLO CIVILI","translator": "Latin text (du Pontet)","lang": "lat","short": "Latin","transPair": {"a": "caesar-civil-war","b": "caesar-civil-war-b"},"transSelf": "b","noSpeakerLabels": true,"parMirror": "caesar-civil-war","reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 1.12"}}},{"meta": {"key": "sallust-catiline","en": "The Conspiracy of Catiline","gr": "DE CATILINAE CONIURATIONE","color": "#4a2f2a","author": "Sallust","form": "HISTORY","blurb": "Sallust’s monograph on the conspiracy of Lucius Sergius Catilina in the consulship of Cicero, 63 BC. After a preface on the mind and the writing of history and a sketch of the decline of Roman morals since the fall of Carthage, it follows Catiline from the first plot and his failures at the consular elections to the meetings of the conspirators, the dealings with the envoys of the Allobroges and the arrests in the city; the debate in the senate is given in the paired speeches of Caesar and Cato, with the comparison of the two men, and the book ends with the executions and Catiline’s death in battle at Pistoria. John Selby Watson’s translation with his explanatory notes, and the Latin of the Perseus Digital Library text (edition not named in its header) as companion; the margin gives the chapter.","kind": "history","transPair": {"a": "sallust-catiline","b": "sallust-catiline-b"},"transSelf": "a"},"text": {"title": "The Conspiracy of Catiline","greek": "C. SALLUSTI CRISPI DE CATILINAE CONIURATIONE","subtitle": "De Catilinae Coniuratione · monograph on the conspiracy of 63 BC · trans. J. S. Watson","translator": "J. S. Watson (1852)","lang": "eng","short": "Watson","transPair": {"a": "sallust-catiline","b": "sallust-catiline-b"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Chapter","abbr": "","placeholder": "e.g. 51"},"parMirror": "sallust-catiline"}},{"meta": {"key": "sallust-catiline-b","en": "The Conspiracy of Catiline","gr": "DE CATILINAE CONIURATIONE","color": "#4a2f2a","author": "Sallust","hidden": true,"form": "HISTORY","transPair": {"a": "sallust-catiline","b": "sallust-catiline-b"},"transSelf": "b","kind": "history"},"text": {"title": "De Catilinae Coniuratione","greek": "C. SALLUSTI CRISPI DE CATILINAE CONIURATIONE","translator": "Latin text (Perseus; editor not named)","lang": "lat","short": "Latin","transPair": {"a": "sallust-catiline","b": "sallust-catiline-b"},"transSelf": "b","noSpeakerLabels": true,"parMirror": "sallust-catiline","reference": {"label": "Chapter","abbr": "","placeholder": "e.g. 51"}}},{"meta": {"key": "sallust-jugurtha","en": "The Jugurthine War","gr": "BELLUM IUGURTHINUM","color": "#51432a","author": "Sallust","form": "HISTORY","blurb": "Sallust’s account of the war the Romans fought in Africa against Jugurtha, king of Numidia. It tells how Jugurtha, adopted by Micipsa, destroyed his cousins Hiempsal and Adherbal and bought off Roman envoys and commanders; how the scandal was forced into the open at Rome by the tribune Memmius; and how the war was then carried on by Metellus and by Marius, whose election to the consulship and speech against the nobility stand at the centre of the book, until Sulla persuaded Bocchus of Mauretania to hand Jugurtha over. Digressions describe the geography and peoples of Africa, the Philaeni and the growth of party strife at Rome. John Selby Watson’s translation with his explanatory notes, and the Latin of the Perseus Digital Library text (edition not named in its header) as companion; the margin gives the chapter.","kind": "history","transPair": {"a": "sallust-jugurtha","b": "sallust-jugurtha-b"},"transSelf": "a"},"text": {"title": "The Jugurthine War","greek": "C. SALLUSTI CRISPI BELLUM IUGURTHINUM","subtitle": "Bellum Iugurthinum · monograph on the war with Jugurtha of Numidia, 111–105 BC · trans. J. S. Watson","translator": "J. S. Watson (1852)","lang": "eng","short": "Watson","transPair": {"a": "sallust-jugurtha","b": "sallust-jugurtha-b"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Chapter","abbr": "","placeholder": "e.g. 51"},"parMirror": "sallust-jugurtha"}},{"meta": {"key": "sallust-jugurtha-b","en": "The Jugurthine War","gr": "BELLUM IUGURTHINUM","color": "#51432a","author": "Sallust","hidden": true,"form": "HISTORY","transPair": {"a": "sallust-jugurtha","b": "sallust-jugurtha-b"},"transSelf": "b","kind": "history"},"text": {"title": "Bellum Iugurthinum","greek": "C. SALLUSTI CRISPI BELLUM IUGURTHINUM","translator": "Latin text (Perseus; editor not named)","lang": "lat","short": "Latin","transPair": {"a": "sallust-jugurtha","b": "sallust-jugurtha-b"},"transSelf": "b","noSpeakerLabels": true,"parMirror": "sallust-jugurtha","reference": {"label": "Chapter","abbr": "","placeholder": "e.g. 51"}}},{"meta": {"key": "diodorus-library-1","en": "The Historical Library (Books I–III)","gr": "ΒΙΒΛΙΟΘΗΚΗ ΙΣΤΟΡΙΚΗ","color": "#3d3528","author": "Diodorus Siculus","form": "HISTORY","blurb": "The opening books of the universal history that Diodorus of Agyrium in Sicily compiled in the first century BC: the general preface; Book I on Egypt, its gods, kings, laws and animal worship; Book II on Assyria, Media, India, the Scythians, Amazons and Arabia; Book III on Ethiopia, the Red Sea coasts, the gold mines, Libya and the Atlantians. This is George Booth's translation of 1700, the first complete English version, given in its period English with only the typography modernised (long s, ligatures); his marked marginal notes are kept as footnotes. No Greek companion. The margin gives Booth's book and chapter, which are his own divisions and not the chapters of modern editions.","kind": "history"},"text": {"title": "The Historical Library (Books I–III)","greek": "ΔΙΟΔΩΡΟΥ ΤΟΥ ΣΙΚΕΛΙΩΤΟΥ ΒΙΒΛΙΟΘΗΚΗ ΙΣΤΟΡΙΚΗ","subtitle": "Bibliotheke historike · universal history, books I–III · trans. George Booth, 1700","translator": "George Booth (1700)","lang": "eng","short": "Booth","noSpeakerLabels": true,"reference": {"label": "Booth's book.chapter","abbr": "","placeholder": "e.g. 1.3"}}},{"meta": {"key": "diodorus-library-2","en": "The Historical Library (Books IV–V)","gr": "ΒΙΒΛΙΟΘΗΚΗ ΙΣΤΟΡΙΚΗ","color": "#2f3b33","author": "Diodorus Siculus","form": "HISTORY","blurb": "Books IV and V of Diodorus's universal history. Book IV gathers the Greek myths into a continuous account: Bacchus, Priapus and the Muses, the labours and wanderings of Hercules, the Argonauts and Medea, Theseus, the Seven against Thebes, Daedalus and Minos. Book V, the book of islands, describes Sicily, Britain and its tin, Gaul, the Celtiberians, Liguria, Tuscany, Panchaea, Samothrace, Rhodes, Crete and the lesser Aegean islands. This is George Booth's translation of 1700 in its period English, with only the typography modernised; his marked marginal notes are kept as footnotes. No Greek companion. The margin gives Booth's book and chapter, which are his own divisions and not the chapters of modern editions.","kind": "history"},"text": {"title": "The Historical Library (Books IV–V)","greek": "ΔΙΟΔΩΡΟΥ ΤΟΥ ΣΙΚΕΛΙΩΤΟΥ ΒΙΒΛΙΟΘΗΚΗ ΙΣΤΟΡΙΚΗ","subtitle": "Bibliotheke historike · universal history, books IV–V · trans. George Booth, 1700","translator": "George Booth (1700)","lang": "eng","short": "Booth","noSpeakerLabels": true,"reference": {"label": "Booth's book.chapter","abbr": "","placeholder": "e.g. 4.3"}}},{"meta": {"key": "diodorus-library-3","en": "The Historical Library (Books XI–XIII)","gr": "ΒΙΒΛΙΟΘΗΚΗ ΙΣΤΟΡΙΚΗ","color": "#3b2f2f","author": "Diodorus Siculus","form": "HISTORY","blurb": "Books XI to XIII of Diodorus's universal history, where the surviving narrative resumes after the lost Books VI–X: Xerxes' invasion, Thermopylae, Salamis and Plataea; Gelon and Hiero in Sicily; the growth of Athenian power, the laws of Charondas and Zaleucus, the Peloponnesian War, the Athenian disaster at Syracuse, and the Carthaginian sack of Selinus, Himera and Agrigentum, down to the rise of Dionysius. This is George Booth's translation of 1700 in its period English, with only the typography modernised; his marked marginal notes are kept as footnotes. No Greek companion. The margin gives Booth's book and chapter, which are his own divisions and not the chapters of modern editions.","kind": "history"},"text": {"title": "The Historical Library (Books XI–XIII)","greek": "ΔΙΟΔΩΡΟΥ ΤΟΥ ΣΙΚΕΛΙΩΤΟΥ ΒΙΒΛΙΟΘΗΚΗ ΙΣΤΟΡΙΚΗ","subtitle": "Bibliotheke historike · universal history, books XI–XIII · trans. George Booth, 1700","translator": "George Booth (1700)","lang": "eng","short": "Booth","noSpeakerLabels": true,"reference": {"label": "Booth's book.chapter","abbr": "","placeholder": "e.g. 11.3"}}},{"meta": {"key": "diodorus-library-4","en": "The Historical Library (Books XIV–XV)","gr": "ΒΙΒΛΙΟΘΗΚΗ ΙΣΤΟΡΙΚΗ","color": "#2e3440","author": "Diodorus Siculus","form": "HISTORY","blurb": "Books XIV and XV of Diodorus's universal history: the Thirty at Athens, the march of Cyrus and the retreat of the Ten Thousand, the wars of Dionysius the Elder against Carthage and in Italy, the Gauls' capture of Rome, the Corinthian War and the King's Peace; then the rise of Thebes under Pelopidas and Epaminondas, Leuctra and Mantinea, and the revolt of the satraps. This is George Booth's translation of 1700 in its period English, with only the typography modernised; his marked marginal notes are kept as footnotes. No Greek companion. The margin gives Booth's book and chapter, which are his own divisions and not the chapters of modern editions. One page of Book XIV is missing in the copy transcribed.","kind": "history"},"text": {"title": "The Historical Library (Books XIV–XV)","greek": "ΔΙΟΔΩΡΟΥ ΤΟΥ ΣΙΚΕΛΙΩΤΟΥ ΒΙΒΛΙΟΘΗΚΗ ΙΣΤΟΡΙΚΗ","subtitle": "Bibliotheke historike · universal history, books XIV–XV · trans. George Booth, 1700","translator": "George Booth (1700)","lang": "eng","short": "Booth","noSpeakerLabels": true,"reference": {"label": "Booth's book.chapter","abbr": "","placeholder": "e.g. 14.3"}}},{"meta": {"key": "diodorus-library-5","en": "The Historical Library (Books XVI–XVIII)","gr": "ΒΙΒΛΙΟΘΗΚΗ ΙΣΤΟΡΙΚΗ","color": "#40342a","author": "Diodorus Siculus","form": "HISTORY","blurb": "Books XVI to XVIII of Diodorus's universal history: the reign of Philip of Macedon, the Sacred War, Dion and Timoleon in Sicily, and Chaeronea; the whole of Alexander's expedition from the Granicus to his death at Babylon; and the first wars of the Successors, with Perdiccas, Antipater, Eumenes and Antigonus. This is George Booth's translation of 1700 in its period English, with only the typography modernised; his marked marginal notes are kept as footnotes. No Greek companion. The margin gives Booth's book and chapter, which are his own divisions and not the chapters of modern editions. The supplement Booth compiled from Curtius and Arrian for the gap in Book XVII stands with the Fragments volume.","kind": "history"},"text": {"title": "The Historical Library (Books XVI–XVIII)","greek": "ΔΙΟΔΩΡΟΥ ΤΟΥ ΣΙΚΕΛΙΩΤΟΥ ΒΙΒΛΙΟΘΗΚΗ ΙΣΤΟΡΙΚΗ","subtitle": "Bibliotheke historike · universal history, books XVI–XVIII · trans. George Booth, 1700","translator": "George Booth (1700)","lang": "eng","short": "Booth","noSpeakerLabels": true,"reference": {"label": "Booth's book.chapter","abbr": "","placeholder": "e.g. 16.3"}}},{"meta": {"key": "diodorus-library-6","en": "The Historical Library (Books XIX–XX)","gr": "ΒΙΒΛΙΟΘΗΚΗ ΙΣΤΟΡΙΚΗ","color": "#33303d","author": "Diodorus Siculus","form": "HISTORY","blurb": "Books XIX and XX of Diodorus's universal history, the last that survive entire: the rise of Agathocles at Syracuse and his invasion of Africa; the campaigns of Eumenes and Antigonus, the deaths of Olympias and of Alexander's heirs, Demetrius at Gaza, Salamis and the siege of Rhodes, the Successors taking the title of king, and Roman wars with the Samnites, down to the eve of Ipsus. This is George Booth's translation of 1700 in its period English, with only the typography modernised; his marked marginal notes are kept as footnotes. No Greek companion. The margin gives Booth's book and chapter, which are his own divisions and not the chapters of modern editions.","kind": "history"},"text": {"title": "The Historical Library (Books XIX–XX)","greek": "ΔΙΟΔΩΡΟΥ ΤΟΥ ΣΙΚΕΛΙΩΤΟΥ ΒΙΒΛΙΟΘΗΚΗ ΙΣΤΟΡΙΚΗ","subtitle": "Bibliotheke historike · universal history, books XIX–XX · trans. George Booth, 1700","translator": "George Booth (1700)","lang": "eng","short": "Booth","noSpeakerLabels": true,"reference": {"label": "Booth's book.chapter","abbr": "","placeholder": "e.g. 19.3"}}},{"meta": {"key": "diodorus-library-7","en": "The Historical Library (Fragments)","gr": "ΒΙΒΛΙΟΘΗΚΗ ΙΣΤΟΡΙΚΗ","color": "#2f3a3d","author": "Diodorus Siculus","form": "HISTORY","blurb": "What remained in 1700 of the lost books of Diodorus, as George Booth printed it after Book XX: pieces of Books VI and VII from Eusebius and George the Monk; the eclogues of Books XXI–XXVI published by Rhodomannus; the excerpts in Photius's Bibliotheca (Books XXXI–XL); the excerpts on virtues and vices published by Valesius; the excerpts on embassies published by Ursinus; and last, a supplement that is not Diodorus but Booth's filling of the gap in Book XVII from Curtius and Arrian. Booth's translation of 1700 in its period English, with only the typography modernised. No Greek companion. The margin gives the collection (R, P, V, U, S), then Booth's book and fragment number, which are not those of modern editions.","kind": "history"},"text": {"title": "The Historical Library (Fragments)","greek": "ΔΙΟΔΩΡΟΥ ΤΟΥ ΣΙΚΕΛΙΩΤΟΥ ΒΙΒΛΙΟΘΗΚΗ ΙΣΤΟΡΙΚΗ","subtitle": "Bibliotheke historike · universal history, fragments of the lost books · trans. George Booth, 1700","translator": "George Booth (1700)","lang": "eng","short": "Booth","noSpeakerLabels": true,"reference": {"label": "Collection, book.fragment","abbr": "","placeholder": "e.g. V26.45"}}},{"meta": {"key": "virgil-eclogues","en": "The Eclogues","kind": "poem","gr": "ECLOGAE","color": "#3f6b4f","author": "Virgil","form": "POETRY","blurb": "Ten pastoral poems in the manner of Theocritus, where shepherds sing of love, lost farms and poetry, and the fourth foretells a child who will restore the golden age."},"text": {"title": "The Eclogues","greek": "ECLOGAE","translator": "J. B. Greenough (1900)","noSpeakerLabels": false,"transPair": {"a": "virgil-eclogues","b": "virgil-eclogues-b"},"transSelf": "a","lang": "eng","short": "Greenough"}},{"meta": {"key": "virgil-eclogues-b","en": "The Eclogues","kind": "poem","gr": "ECLOGAE","color": "#3f6b4f","author": "Virgil","hidden": true},"text": {"title": "Eclogae","greek": "ECLOGAE","translator": "Latin text, ed. Greenough","noSpeakerLabels": true,"transPair": {"a": "virgil-eclogues","b": "virgil-eclogues-b"},"transSelf": "b","lang": "lat","short": "Greenough"}},{"meta": {"key": "virgil-georgics","en": "The Georgics","kind": "poem","gr": "GEORGICA","color": "#7a6a2f","author": "Virgil","form": "POETRY","blurb": "Virgil’s didactic poem on farming in four books — crops, trees and vines, livestock, and bees — ending with the story of Orpheus and Eurydice, and praising the labour that civilizes the land."},"text": {"title": "The Georgics","greek": "GEORGICA","translator": "J. B. Greenough (1900)","noSpeakerLabels": true,"transPair": {"a": "virgil-georgics","b": "virgil-georgics-b"},"transSelf": "a","lang": "eng","short": "Greenough"}},{"meta": {"key": "virgil-georgics-b","en": "The Georgics","kind": "poem","gr": "GEORGICA","color": "#7a6a2f","author": "Virgil","hidden": true},"text": {"title": "Georgica","greek": "GEORGICA","translator": "Latin text, ed. Greenough","noSpeakerLabels": true,"transPair": {"a": "virgil-georgics","b": "virgil-georgics-b"},"transSelf": "b","lang": "lat","short": "Greenough"}},{"meta": {"key": "virgil-aeneid","en": "The Aeneid","kind": "epic","gr": "AENEIS","color": "#5a2d2d","author": "Virgil","form": "EPIC","blurb": "Rome’s national epic in Dryden’s couplets: Aeneas flees burning Troy, loves and leaves Dido at Carthage, descends to the underworld, and fights Turnus for a homeland in Italy."},"text": {"title": "The Aeneid","greek": "AENEIS","translator": "John Dryden (1697)","noSpeakerLabels": true,"transPair": {"a": "virgil-aeneid","b": "virgil-aeneid-b"},"transSelf": "a","lang": "eng","short": "Dryden"}},{"meta": {"key": "virgil-aeneid-b","en": "The Aeneid","kind": "epic","gr": "AENEIS","color": "#5a2d2d","author": "Virgil","hidden": true},"text": {"title": "Aeneis","greek": "AENEIS","translator": "Latin text, ed. Greenough","noSpeakerLabels": true,"transPair": {"a": "virgil-aeneid","b": "virgil-aeneid-b"},"transSelf": "b","lang": "lat","short": "Greenough"}},{"meta": {"key": "ovid-metamorphoses","en": "Metamorphoses","kind": "epic","gr": "METAMORPHOSES","color": "#7a3b5e","author": "Ovid","form": "EPIC","blurb": "Ovid’s great poem of transformations from the creation to Caesar’s apotheosis — Daphne, Phaethon, Narcissus, Pygmalion, Orpheus — in the eighteenth-century versions of Dryden, Pope, Addison and others."},"text": {"title": "Metamorphoses","greek": "METAMORPHOSES","translator": "Garth edition — Dryden, Pope, Addison & others (1717)","noSpeakerLabels": true,"transPair": {"a": "ovid-metamorphoses","b": "ovid-metamorphoses-b"},"transSelf": "a","lang": "eng","short": "Garth"}},{"meta": {"key": "ovid-metamorphoses-b","en": "Metamorphoses","kind": "epic","gr": "METAMORPHOSES","color": "#7a3b5e","author": "Ovid","hidden": true},"text": {"title": "Metamorphoses","greek": "METAMORPHOSES","translator": "Latin text","noSpeakerLabels": true,"transPair": {"a": "ovid-metamorphoses","b": "ovid-metamorphoses-b"},"transSelf": "b","lang": "lat","short": "Latin"}},{"meta": {"key": "ovid-heroides","en": "Heroides","kind": "letters","gr": "HEROIDES","color": "#8a4a2f","author": "Ovid","form": "POETRY","blurb": "Verse letters from the heroines of myth to absent lovers — Penelope to Ulysses, Dido to Aeneas, Medea to Jason, Sappho to Phaon — giving the women’s side of the old stories."},"text": {"title": "Heroides","greek": "HEROIDES","translator": "from the Delphi edition","noSpeakerLabels": true,"transPair": {"a": "ovid-heroides","b": "ovid-heroides-b"},"transSelf": "a","lang": "eng","short": "Delphi"}},{"meta": {"key": "ovid-heroides-b","en": "Heroides","kind": "letters","gr": "HEROIDES","color": "#8a4a2f","author": "Ovid","hidden": true},"text": {"title": "Heroides","greek": "HEROIDES","translator": "Latin text","noSpeakerLabels": true,"transPair": {"a": "ovid-heroides","b": "ovid-heroides-b"},"transSelf": "b","lang": "lat","short": "Latin"}},{"meta": {"key": "ovid-fasti","en": "Fasti","kind": "poem","gr": "FASTI","color": "#3a5a7a","author": "Ovid","form": "POETRY","blurb": "Ovid’s poem on the Roman calendar, January to June, explaining the origin of each festival and rite with myths, star-risings and the voices of the gods themselves."},"text": {"title": "Fasti","greek": "FASTI","translator": "from the Delphi edition","noSpeakerLabels": true,"transPair": {"a": "ovid-fasti","b": "ovid-fasti-b"},"transSelf": "a","lang": "eng","short": "Delphi"}},{"meta": {"key": "ovid-fasti-b","en": "Fasti","kind": "poem","gr": "FASTI","color": "#3a5a7a","author": "Ovid","hidden": true},"text": {"title": "Fasti","greek": "FASTI","translator": "Latin text","noSpeakerLabels": true,"transPair": {"a": "ovid-fasti","b": "ovid-fasti-b"},"transSelf": "b","lang": "lat","short": "Latin"}},{"meta": {"key": "livy-1","en": "The History of Rome (Books 1–5)","kind": "history","gr": "AB URBE CONDITA","color": "#6b3a2a","author": "Livy","form": "HISTORY","blurb": "The first five books of Livy’s history: Aeneas and the founding of Rome, the seven kings, the expulsion of the Tarquins, the early Republic, and the sack of the city by the Gauls in 390 BCE."},"text": {"title": "The History of Rome (Books 1–5)","greek": "AB URBE CONDITA","translator": "Rev. Canon Roberts (1912)","noSpeakerLabels": true,"transPair": {"a": "livy-1","b": "livy-1-b"},"transSelf": "a","lang": "eng","short": "Roberts"}},{"meta": {"key": "livy-1-b","en": "The History of Rome (Books 1–5)","kind": "history","gr": "AB URBE CONDITA","color": "#6b3a2a","author": "Livy","hidden": true},"text": {"title": "Ab Urbe Condita","greek": "AB URBE CONDITA","translator": "Latin text","noSpeakerLabels": true,"transPair": {"a": "livy-1","b": "livy-1-b"},"transSelf": "b","lang": "lat","short": "Latin"}},{"meta": {"key": "livy-2","en": "The History of Rome (Books 6–10)","kind": "history","gr": "AB URBE CONDITA","color": "#6b3a2a","author": "Livy","form": "HISTORY","blurb": "Books 6–10 of Livy: Rome’s recovery after the Gallic sack, the Licinian laws, the Latin and Samnite wars, and the self-sacrifice of the Decii, down to the battle of Sentinum in 295 BCE."},"text": {"title": "The History of Rome (Books 6–10)","greek": "AB URBE CONDITA","translator": "Rev. Canon Roberts (1912)","noSpeakerLabels": true,"transPair": {"a": "livy-2","b": "livy-2-b"},"transSelf": "a","lang": "eng","short": "Roberts"}},{"meta": {"key": "livy-2-b","en": "The History of Rome (Books 6–10)","kind": "history","gr": "AB URBE CONDITA","color": "#6b3a2a","author": "Livy","hidden": true},"text": {"title": "Ab Urbe Condita","greek": "AB URBE CONDITA","translator": "Latin text","noSpeakerLabels": true,"transPair": {"a": "livy-2","b": "livy-2-b"},"transSelf": "b","lang": "lat","short": "Latin"}},{"meta": {"key": "livy-3","en": "The History of Rome (Books 21–30)","kind": "history","gr": "AB URBE CONDITA","color": "#6b3a2a","author": "Livy","form": "HISTORY","blurb": "Books 21–30, Livy’s account of the Second Punic War: Hannibal’s crossing of the Alps, the disasters at Trasimene and Cannae, the sieges of Syracuse and Capua, and Scipio’s victory at Zama."},"text": {"title": "The History of Rome (Books 21–30)","greek": "AB URBE CONDITA","translator": "Rev. Canon Roberts (1912)","noSpeakerLabels": true,"transPair": {"a": "livy-3","b": "livy-3-b"},"transSelf": "a","lang": "eng","short": "Roberts"}},{"meta": {"key": "livy-3-b","en": "The History of Rome (Books 21–30)","kind": "history","gr": "AB URBE CONDITA","color": "#6b3a2a","author": "Livy","hidden": true},"text": {"title": "Ab Urbe Condita","greek": "AB URBE CONDITA","translator": "Latin text","noSpeakerLabels": true,"transPair": {"a": "livy-3","b": "livy-3-b"},"transSelf": "b","lang": "lat","short": "Latin"}},{"meta": {"key": "livy-4","en": "The History of Rome (Books 31–40)","kind": "history","gr": "AB URBE CONDITA","color": "#6b3a2a","author": "Livy","form": "HISTORY","blurb": "Books 31–40 of Livy: Rome’s wars in Greece and Asia after Hannibal, the defeat of Philip V and Antiochus, the proclamation of Greek freedom, and the career and fall of Scipio Africanus."},"text": {"title": "The History of Rome (Books 31–40)","greek": "AB URBE CONDITA","translator": "Rev. Canon Roberts (1912)","noSpeakerLabels": true,"transPair": {"a": "livy-4","b": "livy-4-b"},"transSelf": "a","lang": "eng","short": "Roberts"}},{"meta": {"key": "livy-4-b","en": "The History of Rome (Books 31–40)","kind": "history","gr": "AB URBE CONDITA","color": "#6b3a2a","author": "Livy","hidden": true},"text": {"title": "Ab Urbe Condita","greek": "AB URBE CONDITA","translator": "Latin text","noSpeakerLabels": true,"transPair": {"a": "livy-4","b": "livy-4-b"},"transSelf": "b","lang": "lat","short": "Latin"}},{"meta": {"key": "livy-5","en": "The History of Rome (Books 41–45)","kind": "history","gr": "AB URBE CONDITA","color": "#6b3a2a","author": "Livy","form": "HISTORY","blurb": "Books 41–45, the last that survive of Livy’s history: the Third Macedonian War, Aemilius Paullus’s victory over Perseus at Pydna in 168 BCE, and his triumph at Rome."},"text": {"title": "The History of Rome (Books 41–45)","greek": "AB URBE CONDITA","translator": "Rev. Canon Roberts (1912)","noSpeakerLabels": true,"transPair": {"a": "livy-5","b": "livy-5-b"},"transSelf": "a","lang": "eng","short": "Roberts"}},{"meta": {"key": "livy-5-b","en": "The History of Rome (Books 41–45)","kind": "history","gr": "AB URBE CONDITA","color": "#6b3a2a","author": "Livy","hidden": true},"text": {"title": "Ab Urbe Condita","greek": "AB URBE CONDITA","translator": "Latin text","noSpeakerLabels": true,"transPair": {"a": "livy-5","b": "livy-5-b"},"transSelf": "b","lang": "lat","short": "Latin"}},{"meta": {"key": "strabo-geography-1","en": "Geography (Books I–III)","gr": "ΓΕΩΓΡΑΦΙΚΑ Αʹ–Γʹ","color": "#3b4a3f","author": "Strabo","form": "TREATISE","blurb": "The first three of the seventeen books of Strabo's description of the inhabited world, written under Augustus and Tiberius. Books I and II are the introduction: geography claimed for the philosopher, Homer defended as its founder, and the measurements and maps of Eratosthenes, Hipparchus, Polybius and Posidonius examined and corrected, ending with Strabo's own outline of the globe, its zones and the shape of the known world. Book III begins the circuit of the Mediterranean with Iberia: Turdetania and its mines, Lusitania, the northern mountaineers, Gades and the Tin Islands. Translated by H. C. Hamilton (Books I–VI) and W. Falconer for Bohn's Classical Library, with their notes identifying the ancient places; the Greek of Meineke's Teubner edition is the companion, and the margin gives book, chapter and section.","kind": "prose","transPair": {"a": "strabo-geography-1","e": "strabo-geography-1-e"},"transSelf": "a"},"text": {"title": "Geography (Books I–III)","greek": "ΣΤΡΑΒΩΝΟΣ ΓΕΩΓΡΑΦΙΚΑ","subtitle": "Geographika, Books I–III · description of the inhabited world · trans. Hamilton & Falconer","translator": "H. C. Hamilton and W. Falconer (1854)","lang": "eng","short": "Hamilton & Falconer","transPair": {"a": "strabo-geography-1","e": "strabo-geography-1-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter.section","abbr": "","placeholder": "e.g. 2.3.8"},"parMirror": "strabo-geography-1"}},{"meta": {"key": "strabo-geography-1-e","en": "Geography (Books I–III)","gr": "ΓΕΩΓΡΑΦΙΚΑ Αʹ–Γʹ","color": "#3b4a3f","author": "Strabo","hidden": true,"form": "TREATISE","transPair": {"a": "strabo-geography-1","e": "strabo-geography-1-e"},"transSelf": "e","kind": "prose"},"text": {"title": "Γεωγραφικά (Αʹ–Γʹ)","greek": "ΣΤΡΑΒΩΝΟΣ ΓΕΩΓΡΑΦΙΚΑ","translator": "Greek text (Meineke)","lang": "grc","short": "Greek","transPair": {"a": "strabo-geography-1","e": "strabo-geography-1-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "strabo-geography-1","reference": {"label": "Book.chapter.section","abbr": "","placeholder": "e.g. 2.3.8"}}},{"meta": {"key": "strabo-geography-2","en": "Geography (Books IV–VII)","gr": "ΓΕΩΓΡΑΦΙΚΑ Δʹ–Ζʹ","color": "#4a3f33","author": "Strabo","form": "TREATISE","blurb": "Books IV to VII of Strabo's description of the inhabited world. Book IV covers Gaul beyond the Alps, Britain, Ireland, Thule and the Alpine peoples; Books V and VI go through Italy from the Po to the heel, with Rome, Campania, Sicily and the Lipari islands, and close with an account of how Rome came to rule; Book VII takes the north and east of Europe: Germans, Cimbri, Getae and Scythians, the Crimea, Illyria, Epirus and Dodona, with the fragments on Macedonia and Thrace that replace the lost end of the book. Translated by H. C. Hamilton (Books I–VI) and W. Falconer for Bohn's Classical Library, with their notes identifying the ancient places; the Greek of Meineke's Teubner edition is the companion, and the margin gives book, chapter and section.","kind": "prose","transPair": {"a": "strabo-geography-2","e": "strabo-geography-2-e"},"transSelf": "a"},"text": {"title": "Geography (Books IV–VII)","greek": "ΣΤΡΑΒΩΝΟΣ ΓΕΩΓΡΑΦΙΚΑ","subtitle": "Geographika, Books IV–VII · description of the inhabited world · trans. Hamilton & Falconer","translator": "H. C. Hamilton and W. Falconer (1854)","lang": "eng","short": "Hamilton & Falconer","transPair": {"a": "strabo-geography-2","e": "strabo-geography-2-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter.section","abbr": "","placeholder": "e.g. 5.3.8"},"parMirror": "strabo-geography-2"}},{"meta": {"key": "strabo-geography-2-e","en": "Geography (Books IV–VII)","gr": "ΓΕΩΓΡΑΦΙΚΑ Δʹ–Ζʹ","color": "#4a3f33","author": "Strabo","hidden": true,"form": "TREATISE","transPair": {"a": "strabo-geography-2","e": "strabo-geography-2-e"},"transSelf": "e","kind": "prose"},"text": {"title": "Γεωγραφικά (Δʹ–Ζʹ)","greek": "ΣΤΡΑΒΩΝΟΣ ΓΕΩΓΡΑΦΙΚΑ","translator": "Greek text (Meineke)","lang": "grc","short": "Greek","transPair": {"a": "strabo-geography-2","e": "strabo-geography-2-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "strabo-geography-2","reference": {"label": "Book.chapter.section","abbr": "","placeholder": "e.g. 5.3.8"}}},{"meta": {"key": "strabo-geography-3","en": "Geography (Books VIII–X)","gr": "ΓΕΩΓΡΑΦΙΚΑ Ηʹ–Ιʹ","color": "#33424d","author": "Strabo","form": "TREATISE","blurb": "Books VIII to X of Strabo's description of the inhabited world: Greece. Book VIII goes round the Peloponnese — Elis and Olympia, Messenia, Laconia, Argolis, Corinth, Achaia and Arcadia; Book IX covers Attica and Megara, Boeotia, Phocis with Delphi, Locris and Thessaly; Book X Euboea, Aetolia and Acarnania, Crete and the Cyclades, with a long digression on the Curetes and the rites of the Mother of the Gods. Throughout, the Homeric Catalogue of Ships is the frame and the places are identified line by line. Translated by H. C. Hamilton (Books I–VI) and W. Falconer for Bohn's Classical Library, with their notes identifying the ancient places; the Greek of Meineke's Teubner edition is the companion, and the margin gives book, chapter and section.","kind": "prose","transPair": {"a": "strabo-geography-3","e": "strabo-geography-3-e"},"transSelf": "a"},"text": {"title": "Geography (Books VIII–X)","greek": "ΣΤΡΑΒΩΝΟΣ ΓΕΩΓΡΑΦΙΚΑ","subtitle": "Geographika, Books VIII–X · description of the inhabited world · trans. Hamilton & Falconer","translator": "H. C. Hamilton and W. Falconer (1856)","lang": "eng","short": "Hamilton & Falconer","transPair": {"a": "strabo-geography-3","e": "strabo-geography-3-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter.section","abbr": "","placeholder": "e.g. 9.3.8"},"parMirror": "strabo-geography-3"}},{"meta": {"key": "strabo-geography-3-e","en": "Geography (Books VIII–X)","gr": "ΓΕΩΓΡΑΦΙΚΑ Ηʹ–Ιʹ","color": "#33424d","author": "Strabo","hidden": true,"form": "TREATISE","transPair": {"a": "strabo-geography-3","e": "strabo-geography-3-e"},"transSelf": "e","kind": "prose"},"text": {"title": "Γεωγραφικά (Ηʹ–Ιʹ)","greek": "ΣΤΡΑΒΩΝΟΣ ΓΕΩΓΡΑΦΙΚΑ","translator": "Greek text (Meineke)","lang": "grc","short": "Greek","transPair": {"a": "strabo-geography-3","e": "strabo-geography-3-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "strabo-geography-3","reference": {"label": "Book.chapter.section","abbr": "","placeholder": "e.g. 9.3.8"}}},{"meta": {"key": "strabo-geography-4","en": "Geography (Books XI–XIV)","gr": "ΓΕΩΓΡΑΦΙΚΑ ΙΑʹ–ΙΔʹ","color": "#4d3a3a","author": "Strabo","form": "TREATISE","blurb": "Books XI to XIV of Strabo's description of the inhabited world: northern and western Asia. Book XI runs from the Don across the Caucasus, the Caspian peoples, Parthia, Bactria, Media and Armenia; Book XII covers Cappadocia, Pontus — Strabo's own country, with his native Amasia — Bithynia, Galatia and Phrygia; Book XIII the Troad, discussed at length against Homer, with Lesbos, Pergamum and Sardis; Book XIV Ionia, Caria, Rhodes, Lycia, Pamphylia, Cilicia and Cyprus, with notices of the famous men of each city. Translated by H. C. Hamilton (Books I–VI) and W. Falconer for Bohn's Classical Library, with their notes identifying the ancient places; the Greek of Meineke's Teubner edition is the companion, and the margin gives book, chapter and section.","kind": "prose","transPair": {"a": "strabo-geography-4","e": "strabo-geography-4-e"},"transSelf": "a"},"text": {"title": "Geography (Books XI–XIV)","greek": "ΣΤΡΑΒΩΝΟΣ ΓΕΩΓΡΑΦΙΚΑ","subtitle": "Geographika, Books XI–XIV · description of the inhabited world · trans. Hamilton & Falconer","translator": "H. C. Hamilton and W. Falconer (1856–1857)","lang": "eng","short": "Hamilton & Falconer","transPair": {"a": "strabo-geography-4","e": "strabo-geography-4-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter.section","abbr": "","placeholder": "e.g. 12.3.8"},"parMirror": "strabo-geography-4"}},{"meta": {"key": "strabo-geography-4-e","en": "Geography (Books XI–XIV)","gr": "ΓΕΩΓΡΑΦΙΚΑ ΙΑʹ–ΙΔʹ","color": "#4d3a3a","author": "Strabo","hidden": true,"form": "TREATISE","transPair": {"a": "strabo-geography-4","e": "strabo-geography-4-e"},"transSelf": "e","kind": "prose"},"text": {"title": "Γεωγραφικά (ΙΑʹ–ΙΔʹ)","greek": "ΣΤΡΑΒΩΝΟΣ ΓΕΩΓΡΑΦΙΚΑ","translator": "Greek text (Meineke)","lang": "grc","short": "Greek","transPair": {"a": "strabo-geography-4","e": "strabo-geography-4-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "strabo-geography-4","reference": {"label": "Book.chapter.section","abbr": "","placeholder": "e.g. 12.3.8"}}},{"meta": {"key": "strabo-geography-5","en": "Geography (Books XV–XVII)","gr": "ΓΕΩΓΡΑΦΙΚΑ ΙΕʹ–ΙΖʹ","color": "#45402f","author": "Strabo","form": "TREATISE","blurb": "The last three books of Strabo's description of the inhabited world. Book XV describes India from the companions of Alexander and from Megasthenes — rivers, castes, elephants, the Brahmans — then Ariana and Persia; Book XVI covers Assyria and Babylon, Mesopotamia, Syria, Phoenicia and Judaea, with the account of Moses, and Arabia, including the expedition of Aelius Gallus; Book XVII is Egypt, which Strabo travelled up the Nile with the prefect, Ethiopia, and Libya as far as the Atlantic, closing with the division of the Roman provinces. Translated by H. C. Hamilton (Books I–VI) and W. Falconer for Bohn's Classical Library, with their notes identifying the ancient places; the Greek of Meineke's Teubner edition is the companion, and the margin gives book, chapter and section.","kind": "prose","transPair": {"a": "strabo-geography-5","e": "strabo-geography-5-e"},"transSelf": "a"},"text": {"title": "Geography (Books XV–XVII)","greek": "ΣΤΡΑΒΩΝΟΣ ΓΕΩΓΡΑΦΙΚΑ","subtitle": "Geographika, Books XV–XVII · description of the inhabited world · trans. Hamilton & Falconer","translator": "H. C. Hamilton and W. Falconer (1857)","lang": "eng","short": "Hamilton & Falconer","transPair": {"a": "strabo-geography-5","e": "strabo-geography-5-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter.section","abbr": "","placeholder": "e.g. 16.3.8"},"parMirror": "strabo-geography-5"}},{"meta": {"key": "strabo-geography-5-e","en": "Geography (Books XV–XVII)","gr": "ΓΕΩΓΡΑΦΙΚΑ ΙΕʹ–ΙΖʹ","color": "#45402f","author": "Strabo","hidden": true,"form": "TREATISE","transPair": {"a": "strabo-geography-5","e": "strabo-geography-5-e"},"transSelf": "e","kind": "prose"},"text": {"title": "Γεωγραφικά (ΙΕʹ–ΙΖʹ)","greek": "ΣΤΡΑΒΩΝΟΣ ΓΕΩΓΡΑΦΙΚΑ","translator": "Greek text (Meineke)","lang": "grc","short": "Greek","transPair": {"a": "strabo-geography-5","e": "strabo-geography-5-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "strabo-geography-5","reference": {"label": "Book.chapter.section","abbr": "","placeholder": "e.g. 16.3.8"}}},{"meta": {"key": "tacitus-agricola","en": "Agricola","gr": "DE VITA IULII AGRICOLAE","color": "#3f4a3c","author": "Tacitus","form": "BIOGRAPHY","blurb": "Tacitus’ life of his father-in-law Cnaeus Julius Agricola, governor of Britain from about A.D. 77 to 84, written soon after the death of Domitian: his seven campaigns, a description of the island and its peoples, Mons Graupius, and the last years under a jealous emperor. Church and Brodribb’s translation, with the Latin as companion.","transPair": {"a": "tacitus-agricola","b": "tacitus-agricola-b"},"transSelf": "a","kind": "prose"},"text": {"title": "Agricola","greek": "CORNELII TACITI DE VITA IULII AGRICOLAE","subtitle": "De vita Iulii Agricolae · life of Cnaeus Julius Agricola, governor of Britain · trans. Church & Brodribb","translator": "A. J. Church and W. J. Brodribb (1868)","lang": "eng","short": "Church & Brodribb","transPair": {"a": "tacitus-agricola","b": "tacitus-agricola-b"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Chapter","abbr": "","placeholder": "e.g. 30"},"parMirror": "tacitus-agricola"}},{"meta": {"key": "tacitus-agricola-b","en": "Agricola","gr": "DE VITA IULII AGRICOLAE","color": "#3f4a3c","author": "Tacitus","hidden": true,"form": "BIOGRAPHY","transPair": {"a": "tacitus-agricola","b": "tacitus-agricola-b"},"transSelf": "b","kind": "prose"},"text": {"title": "De vita Iulii Agricolae","greek": "CORNELII TACITI DE VITA IULII AGRICOLAE","translator": "Latin text (Furneaux)","lang": "lat","short": "Latin","transPair": {"a": "tacitus-agricola","b": "tacitus-agricola-b"},"transSelf": "b","noSpeakerLabels": true,"parMirror": "tacitus-agricola","reference": {"label": "Chapter","abbr": "","placeholder": "e.g. 30"}}},{"met . 3.5"}}},{"meta": {"key": "pliny-letters-2","en": "Letters (Books VI–X)","gr": "EPISTULAE (LIBRI VI–X)","color": "#33434a","author": "Pliny the Younger","form": "LETTERS","blurb": "Books six to ten of the letters of the younger Pliny. Books VI–IX continue the private correspondence and include the two letters to Tacitus on the eruption of Vesuvius and the death of the elder Pliny, the haunted house at Athens, the dolphin of Hippo, the source of the Clitumnus and the account of his day in the country. Book X is the official correspondence with the emperor Trajan, most of it written from the province of Bithynia and Pontus, with Trajan's replies, among them the exchange about the Christians. John B. Firth's translation of 1900, without notes as he printed it, and the Latin text of the Perseus Digital Library as companion; the margin gives book and letter in the standard numbering. This volume's text was reconstructed from a modernised transcription checked against a scan of the 1900 printing, and has not yet been proofread against the page images.","kind": "letters","transPair": {"a": "pliny-letters-2","b": "pliny-letters-2-b"},"transSelf": "a"},"text": {"title": "Letters (Books VI–X)","greek": "C. PLINII CAECILII SECUNDI EPISTULAE","subtitle": "Epistulae, libri VI–X · private letters and the correspondence with Trajan · trans. John B. Firth","translator": "John B. Firth (1900)","lang": "eng","short": "Firth","transPair": {"a": "pliny-letters-2","b": "pliny-letters-2-b"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.letter","abbr": "Ep.","placeholder": "e.g. 6.16"},"parMirror": "pliny-letters-2"}},{"meta": {"key": "pliny-letters-2-b","en": "Letters (Books VI–X)","gr": "EPISTULAE (LIBRI VI–X)","color": "#33434a","author": "Pliny the Younger","hidden": true,"form": "LETTERS","transPair": {"a": "pliny-letters-2","b": "pliny-letters-2-b"},"transSelf": "b","kind": "letters"},"text": {"title": "Epistulae (Libri VI–X)","greek": "C. PLINII CAECILII SE n through the Granicus, Issus, Gaugamela and India to his death at Babylon. E. J. Chinnock’s literal translation of 1884, and Roos’s Greek.","transPair": {"a": "arrian-anabasis","e": "arrian-anabasis-e"},"transSelf": "a","kind": "history"},"text": {"title": "The Anabasis of Alexander","greek": "ΑΡΡΙΑΝΟΥ ΑΛΕΞΑΝΔΡΟΥ ΑΝΑΒΑΣΙΣ","subtitle": "Alexandrou Anabasis · history of the campaigns of Alexander the Great, in seven books · trans. E. J. Chinnock","translator": "E. J. Chinnock (1884)","lang": "eng","short": "Chinnock","transPair": {"a": "arrian-anabasis","e": "arrian-anabasis-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 3.15"},"parMirror": "arrian-anabasis"}},{"meta": {"key": "arrian-anabasis-e","en": "The Anabasis of Alexander","gr": "ΑΛΕΞΑΝΔΡΟΥ ΑΝΑΒΑΣΙΣ","color": "#4a3528","author": "Arrian","hidden": true,"form": "HISTORY","transPair": {"a": "arrian-anabasis","e": "arrian-anabasis-e"},"transSelf": "e","kind": "history"},"text": {"title": "Ἀλεξάνδρου Ἀνάβασις","greek": "ΑΡΡΙΑΝΟΥ ΑΛΕΞΑΝΔΡΟΥ ΑΝΑΒΑΣΙΣ","translator": "Greek text (Roos)","lang": "grc","short": "Greek","transPair": {"a": "arrian-anabasis","e": "arrian-anabasis-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "arrian-anabasis","reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 3.15"}}},{"meta": {"key": "appian-foreign-wars-1","en": "The Roman History: The Foreign Wars (Preface; the Kings to the Punic Wars)","gr": "ΡΩΜΑΪΚΑ","color": "#5a2e26","author": "Appian","form": "HISTORY","blurb": "The first half of Appian’s history of Rome’s wars, written at Alexandria and Rome in the second century AD and arranged not by years but by the peoples Rome fought. After the author’s Preface come the surviving excerpts of the lost early books — the Kings, Italy, the Samnites, the Gauls, Sicily and the islands — and then three books that survive whole: the wars in Spain down to Numantia, the war with Hannibal in Italy, and the Punic wars to the destruction of Carthage. Horace White’s translation of 1899, with his footnotes, and the Greek of Mendelssohn’s Teubner edition as companion (the Preface is English only). The margin gives the book’s number within this volume and the section or fragment number: 7.12 is The Wars in Spain, section 12.","kind": "history","transPair": {"a": "appian-foreign-wars-1","e": "appian-foreign-wars-1-e"},"transSelf": "a"},"text": {"title": "The Roman History: The Foreign Wars (Preface; the Kings to the Punic Wars)","greek": "ΑΠΠΙΑΝΟΥ ΡΩΜΑΪΚΑ","subtitle": "Rhomaika · history of Rome’s wars, nation by nation: Preface, Kings, Italy, Samnium, Gaul, Sicily, Spain, Hannibal, Carthage · trans. Horace White","translator": "Horace White (1899)","lang": "eng","short": "White","transPair": {"a": "appian-foreign-wars-1","e": "appian-foreign-wars-1-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.section","abbr": "","placeholder": "e.g. 7.12"},"parMirror": "appian-foreign-wars-1"}},{"meta": {"key": "appian-foreign-wars-1-e","en": "The Roman History: The Foreign Wars (Preface; the Kings to the Punic Wars)","gr": "ΡΩΜΑΪΚΑ","color": "#5a2e26","author": "Appian","hidden": true,"form": "HISTORY","transPair": {"a": "appian-foreign-wars-1","e": "appian-foreign-wars-1-e"},"transSelf": "e","kind": "history"},"text": {"title": "Ῥωμαϊκά","greek": "ΑΠΠΙΑΝΟΥ ΡΩΜΑΪΚΑ","translator": "Greek text (Mendelssohn)","lang": "grc","short": "Greek","transPair": {"a": "appian-foreign-wars-1","e": "appian-foreign-wars-1-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "appian-foreign-wars-1","reference": {"label": "Book.section","abbr": "","placeholder": "e.g. 7.12"}}},{"meta": {"key": "appian-foreign-wars-2","en": "The Roman History: The Foreign Wars (Numidia to the Mithridatic Wars)","gr": "ΡΩΜΑΪΚΑ","color": "#4a3a22","author": "Appian","form": "HISTORY","blurb": "The second half of Appian’s history of Rome’s foreign wars, arranged by the peoples Rome fought. It opens with the excerpts that remain of the Numidian and Macedonian books — Jugurtha, Philip V, Perseus — and continues with three books preserved complete: the Illyrian wars down to Augustus, the Syrian wars against Antiochus the Great with a survey of the Seleucid kings, and the long account of the three wars against Mithridates of Pontus, ending with Pompey’s settlement of the East. Horace White’s translation of 1899, with his footnotes, and the Greek of Mendelssohn’s Teubner edition as companion. The margin gives the book’s number within this volume and the section or fragment number: 5.22 is The Mithridatic Wars, section 22.","kind": "history","transPair": {"a": "appian-foreign-wars-2","e": "appian-foreign-wars-2-e"},"transSelf": "a"},"text": {"title": "The Roman History: The Foreign Wars (Numidia to the Mithridatic Wars)","greek": "ΑΠΠΙΑΝΟΥ ΡΩΜΑΪΚΑ","subtitle": "Rhomaika · history of Rome’s wars, nation by nation: Numidia, Macedonia, Illyria, Syria, Mithridates · trans. Horace White","translator": "Horace White (1899)","lang": "eng","short": "White","transPair": {"a": "appian-foreign-wars-2","e": "appian-foreign-wars-2-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.section","abbr": "","placeholder": "e.g. 5.22"},"parMirror": "appian-foreign-wars-2"}},{"meta": {"key": "appian-foreign-wars-2-e","en": "The Roman History: The Foreign Wars (Numidia to the Mithridatic Wars)","gr": "ΡΩΜΑΪΚΑ","color": "#4a3a22","author": "Appian","hidden": true,"form": "HISTORY","transPair": {"a": "appian-foreign-wars-2","e": "appian-foreign-wars-2-e"},"transSelf": "e","kind": "history"},"text": {"title": "Ῥωμαϊκά","greek": "ΑΠΠΙΑΝΟΥ ΡΩΜΑΪΚΑ","translator": "Greek text (Mendelssohn)","lang": "grc","short": "Greek","transPair": {"a": "appian-foreign-wars-2","e": "appian-foreign-wars-2-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "appian-foreign-wars-2","reference": {"label": "Book.section","abbr": "","placeholder": "e.g. 5.22"}}},{"meta": {"key": "appian-civil-wars-1","en": "The Civil Wars (Books I–II)","gr": "ΕΜΦΥΛΙΩΝ","color": "#3b2a3f","author": "Appian","form": "HISTORY","blurb": "The first two of the five books Appian gave to Rome’s civil wars, the only continuous ancient narrative of the century from the Gracchi to the Triumvirate. Book I runs from the agrarian law of Tiberius Gracchus through Marius and Sulla, the Social War, Sertorius and Spartacus; Book II from the conspiracy of Catiline and the alliance of Pompey, Crassus and Caesar to Pharsalus, the Ides of March and Caesar’s funeral, closing with a comparison of Caesar and Alexander. Horace White’s translation of 1899, with his footnotes, and the Greek of Mendelssohn’s Teubner edition as companion; the margin gives book and section, the standard citation.","kind": "history","transPair": {"a": "appian-civil-wars-1","e": "appian-civil-wars-1-e"},"transSelf": "a"},"text": {"title": "The Civil Wars (Books I–II)","greek": "ΑΠΠΙΑΝΟΥ ΡΩΜΑΪΚΩΝ ΕΜΦΥΛΙΩΝ","subtitle": "Emphylia · history of the Roman civil wars, books 1–2: the Gracchi to the death of Caesar · trans. Horace White","translator": "Horace White (1899)","lang": "eng","short": "White","transPair": {"a": "appian-civil-wars-1","e": "appian-civil-wars-1-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.section","abbr": "","placeholder": "e.g. 2.14"},"parMirror": "appian-civil-wars-1"}},{"meta": {"key": "appian-civil-wars-1-e","en": "The Civil Wars (Books I–II)","gr": "ΕΜΦΥΛΙΩΝ","color": "#3b2a3f","author": "Appian","hidden": true,"form": "HISTORY","transPair": {"a": "appian-civil-wars-1","e": "appian-civil-wars-1-e"},"transSelf": "e","kind": "history"},"text": {"title": "Ῥωμαϊκῶν Ἐμφυλίων Αʹ–Βʹ","greek": "ΑΠΠΙΑΝΟΥ ΡΩΜΑΪΚΩΝ ΕΜΦΥΛΙΩΝ","translator": "Greek text (Mendelssohn)","lang": "grc","short": "Greek","transPair": {"a": "appian-civil-wars-1","e": "appian-civil-wars-1-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "appian-civil-wars-1","reference": {"label": "Book.section","abbr": "","placeholder": "e.g. 2.14"}}},{"meta": {"key": "appian-civil-wars-2","en": "The Civil Wars (Books III–V)","gr": "ΕΜΦΥΛΙΩΝ","color": "#2f3442","author": "Appian","form": "HISTORY","blurb": "Books III–V of Appian’s Civil Wars. Book III follows Antony and the young Octavian after Caesar’s murder through the war of Mutina; Book IV gives the proscriptions of the triumvirs, with its long series of escapes and betrayals, and the campaigns of Brutus and Cassius ending at Philippi; Book V covers the Perusine war, the treaties of Brundisium and Misenum, and the war against Sextus Pompeius down to his death in 35 BC. Two short fragments translated by White from the end of Mendelssohn’s edition follow, in English only. Horace White’s translation of 1899, with his footnotes, and the Greek of Mendelssohn’s Teubner edition as companion; the margin gives book and section, the standard citation.","kind": "history","transPair": {"a": "appian-civil-wars-2","e": "appian-civil-wars-2-e"},"transSelf": "a"},"text": {"title": "The Civil Wars (Books III–V)","greek": "ΑΠΠΙΑΝΟΥ ΡΩΜΑΪΚΩΝ ΕΜΦΥΛΙΩΝ","subtitle": "Emphylia · history of the Roman civil wars, books 3–5: Antony and Octavian to the death of Sextus Pompeius · trans. Horace White","translator": "Horace White (1899)","lang": "eng","short": "White","transPair": {"a": "appian-civil-wars-2","e": "appian-civil-wars-2-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.section","abbr": "","placeholder": "e.g. 4.8"},"parMirror": "appian-civil-wars-2"}},{"meta": {"key": "appian-civil-wars-2-e","en": "The Civil Wars (Books III–V)","gr": "ΕΜΦΥΛΙΩΝ","color": "#2f3442","author": "Appian","hidden": true,"form": "HISTORY","transPair": {"a": "appian-civil-wars-2","e": "appian-civil-wars-2-e"},"transSelf": "e","kind": "history"},"text": {"title": "Ῥωμαϊκῶν Ἐμφυλίων Γʹ–Εʹ","greek": "ΑΠΠΙΑΝΟΥ ΡΩΜΑΪΚΩΝ ΕΜΦΥΛΙΩΝ","translator": "Greek text (Mendelssohn)","lang": "grc","short": "Greek","transPair": {"a": "appian-civil-wars-2","e": "appian-civil-wars-2-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "appian-civil-wars-2","reference": {"label": "Book.section","abbr": "","placeholder": "e.g. 4.8"}}},{"meta": {"key": "dio-roman-history-1","en": "Roman History (Books 1–11)","gr": "ΡΩΜΑΪΚΗ ΙΣΤΟΡΙΑ","color": "#4a2f2a","author": "Cassius Dio","form": "HISTORY","blurb": "The first eleven books of Cassius Dio's history of Rome, which survive only in pieces: the landing of Aeneas and the kings of Alba, Romulus and Numa, the Tarquins and Lucretia, the first consuls, Coriolanus, the decemvirs, Camillus and the Gallic sack, the Samnite wars, Pyrrhus, and the opening of the first war with Carthage down to Regulus. What is printed is what the Loeb gives: the fragments of Dio preserved by Byzantine excerptors and lexica, set beside the twelfth-century epitome of Zonaras (and passages of Tzetzes and others) that follows Dio for these years. Earnest Cary's Loeb translation (1914), made on the basis of H. B. Foster's version, with his notes; there is no Greek companion. The margin gives the book and the fragment number of Boissevain's edition, or the chapter of Zonaras, as the Loeb prints them.","kind": "history"},"text": {"title": "Roman History (Books 1–11)","greek": "ΔΙΩΝΟΣ ΚΑΣΣΙΟΥ ΡΩΜΑΪΚΗ ΙΣΤΟΡΙΑ","subtitle": "Rhōmaïkē Historia · Books 1–11, from the landing of Aeneas to the middle of the First Punic War (to about 250 B.C.) · trans. Earnest Cary","translator": "Earnest Cary (1914)","lang": "eng","short": "Cary","noSpeakerLabels": true,"reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 2.7"}}},{"meta": {"key": "dio-roman-history-2","en": "Roman History (Books 12–35)","gr": "ΡΩΜΑΪΚΗ ΙΣΤΟΡΙΑ","color": "#3d3a2c","author": "Cassius Dio","form": "HISTORY","blurb": "Books 12–35 of Cassius Dio's Roman History, lost except for fragments: the end of the first war with Carthage, the Gallic and Illyrian wars, Hannibal's invasion, Cannae, Scipio in Spain and Africa, the wars with Philip, Antiochus and Perseus, the destruction of Carthage and Corinth, Viriathus and Numantia, the Gracchi, Jugurtha, the Cimbri, the Social War, Marius, Cinna and Sulla, and the first wars with Mithridates. For Books 12–21 the narrative is carried by the epitome of Zonaras, with Dio's own fragments set beside it; from Book 22 only the excerpts remain. Earnest Cary's Loeb translation (1914), made on the basis of H. B. Foster's version, with his notes; there is no Greek companion. The margin gives the book and the fragment number of Boissevain's edition, or the chapter of Zonaras, as the Loeb prints them.","kind": "history"},"text": {"title": "Roman History (Books 12–35)","greek": "ΔΙΩΝΟΣ ΚΑΣΣΙΟΥ ΡΩΜΑΪΚΗ ΙΣΤΟΡΙΑ","subtitle": "Rhōmaïkē Historia · Books 12–35, from the end of the First Punic War to the wars of Sulla and Mithridates (about 250–70 B.C.) · trans. Earnest Cary","translator": "Earnest Cary (1914)","lang": "eng","short": "Cary","noSpeakerLabels": true,"reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 15.57"}}},{"meta": {"key": "dio-roman-history-3","en": "Roman History (Books 36–40)","gr": "ΡΩΜΑΪΚΗ ΙΣΤΟΡΙΑ","color": "#2f3b45","author": "Cassius Dio","form": "HISTORY","blurb": "Books 36–40 of Cassius Dio's Roman History, where the continuous text begins: Lucullus and Pompey against Mithridates and Tigranes, the Gabinian law and the war with the pirates, Pompey in the East, Catiline's conspiracy, the compact of Pompey, Crassus and Caesar, Caesar's consulship, Cicero's exile and return, the conquest of Gaul and the crossings to Britain, Crassus's defeat at Carrhae, and the disorders at Rome down to the eve of the civil war. Earnest Cary's Loeb translation (1914), made on the basis of H. B. Foster's version, with his notes as transcribed on LacusCurtius, and the Greek of the Loeb edition as companion; the margin gives book and chapter.","kind": "history","transPair": {"a": "dio-roman-history-3","e": "dio-roman-history-3-e"},"transSelf": "a"},"text": {"title": "Roman History (Books 36–40)","greek": "ΔΙΩΝΟΣ ΚΑΣΣΙΟΥ ΡΩΜΑΪΚΗ ΙΣΤΟΡΙΑ","subtitle": "Rhōmaïkē Historia · Books 36–40, 69–50 B.C. · trans. Earnest Cary","translator": "Earnest Cary (1914)","lang": "eng","short": "Cary","transPair": {"a": "dio-roman-history-3","e": "dio-roman-history-3-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 37.20"}}},{"meta": {"key": "dio-roman-history-3-e","en": "Roman History (Books 36–40)","gr": "ΡΩΜΑΪΚΗ ΙΣΤΟΡΙΑ","color": "#2f3b45","author": "Cassius Dio","hidden": true,"form": "HISTORY","transPair": {"a": "dio-roman-history-3","e": "dio-roman-history-3-e"},"transSelf": "e","kind": "history"},"text": {"title": "Ῥωμαϊκὴ Ἱστορία","greek": "ΔΙΩΝΟΣ ΚΑΣΣΙΟΥ ΡΩΜΑΪΚΗ ΙΣΤΟΡΙΑ","translator": "Greek text (Cary)","lang": "grc","short": "Greek","transPair": {"a": "dio-roman-history-3","e": "dio-roman-history-3-e"},"transSelf": "e","noSpeakerLabels": true,"reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 37.20"}}},{"meta": {"key": "dio-roman-history-4","en": "Roman History (Books 41–45)","gr": "ΡΩΜΑΪΚΗ ΙΣΤΟΡΙΑ","color": "#3a2f45","author": "Cassius Dio","form": "HISTORY","blurb": "Books 41–45 of Cassius Dio's Roman History: Caesar's crossing of the Rubicon, the campaigns in Spain and at Dyrrachium, Pharsalus and the death of Pompey, the Alexandrian war, Thapsus and Munda, Caesar's dictatorship and honours, his murder on the Ides of March, Antony's funeral speech, the arrival of the young Octavian, and Cicero's speech against Antony. Earnest Cary's Loeb translation (1916), made on the basis of H. B. Foster's version, with his notes as transcribed on LacusCurtius, and the Greek of the Loeb edition as companion; the margin gives book and chapter.","kind": "history","transPair": {"a": "dio-roman-history-4","e": "dio-roman-history-4-e"},"transSelf": "a"},"text": {"title": "Roman History (Books 41–45)","greek": "ΔΙΩΝΟΣ ΚΑΣΣΙΟΥ ΡΩΜΑΪΚΗ ΙΣΤΟΡΙΑ","subtitle": "Rhōmaïkē Historia · Books 41–45, 49–44 B.C. · trans. Earnest Cary","translator": "Earnest Cary (1916)","lang": "eng","short": "Cary","transPair": {"a": "dio-roman-history-4","e": "dio-roman-history-4-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 44.19"},"parMirror": "dio-roman-history-4"}},{"meta": {"key": "dio-roman-history-4-e","en": "Roman History (Books 41–45)","gr": "ΡΩΜΑΪΚΗ ΙΣΤΟΡΙΑ","color": "#3a2f45","author": "Cassius Dio","hidden": true,"form": "HISTORY","transPair": {"a": "dio-roman-history-4","e": "dio-roman-history-4-e"},"transSelf": "e","kind": "history"},"text": {"title": "Ῥωμαϊκὴ Ἱστορία","greek": "ΔΙΩΝΟΣ ΚΑΣΣΙΟΥ ΡΩΜΑΪΚΗ ΙΣΤΟΡΙΑ","translator": "Greek text (Cary)","lang": "grc","short": "Greek","transPair": {"a": "dio-roman-history-4","e": "dio-roman-history-4-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "dio-roman-history-4","reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 44.19"}}},{"meta": {"key": "dio-roman-history-5","en": "Roman History (Books 46–50)","gr": "ΡΩΜΑΪΚΗ ΙΣΤΟΡΙΑ","color": "#2d4038","author": "Cassius Dio","form": "HISTORY","blurb": "Books 46–50 of Cassius Dio's Roman History: the reply of Calenus to Cicero, the war of Mutina, the triumvirate of Antony, Lepidus and Octavian and the proscriptions, Philippi, the Perusine war, the struggle with Sextus Pompey, Antony's Parthian campaign and his life with Cleopatra, the breach between the two leaders, and the battle of Actium with the speeches before it. Earnest Cary's Loeb translation (1917), made on the basis of H. B. Foster's version, with his notes as transcribed on LacusCurtius, and the Greek of the Loeb edition as companion; the margin gives book and chapter.","kind": "history","transPair": {"a": "dio-roman-history-5","e": "dio-roman-history-5-e"},"transSelf": "a"},"text": {"title": "Roman History (Books 46–50)","greek": "ΔΙΩΝΟΣ ΚΑΣΣΙΟΥ ΡΩΜΑΪΚΗ ΙΣΤΟΡΙΑ","subtitle": "Rhōmaïkē Historia · Books 46–50, 43–31 B.C. · trans. Earnest Cary","translator": "Earnest Cary (1917)","lang": "eng","short": "Cary","transPair": {"a": "dio-roman-history-5","e": "dio-roman-history-5-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 50.31"},"parMirror": "dio-roman-history-5"}},{"meta": {"key": "dio-roman-history-5-e","en": "Roman History (Books 46–50)","gr": "ΡΩΜΑΪΚΗ ΙΣΤΟΡΙΑ","color": "#2d4038","author": "Cassius Dio","hidden": true,"form": "HISTORY","transPair": {"a": "dio-roman-history-5","e": "dio-roman-history-5-e"},"transSelf": "e","kind": "history"},"text": {"title": "Ῥωμαϊκὴ Ἱστορία","greek": "ΔΙΩΝΟΣ ΚΑΣΣΙΟΥ ΡΩΜΑΪΚΗ ΙΣΤΟΡΙΑ","translator": "Greek text (Cary)","lang": "grc","short": "Greek","transPair": {"a": "dio-roman-history-5","e": "dio-roman-history-5-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "dio-roman-history-5","reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 50.31"}}},{"meta": {"key": "dio-roman-history-6","en": "Roman History (Books 51–55)","gr": "ΡΩΜΑΪΚΗ ΙΣΤΟΡΙΑ","color": "#45332b","author": "Cassius Dio","form": "HISTORY","blurb": "Books 51–55 of Cassius Dio's Roman History: the deaths of Antony and Cleopatra and the annexation of Egypt, the debate of Agrippa and Maecenas before Octavian on republic and monarchy, the settlement of 27 B.C. and the powers and titles of the emperors, the government of Augustus, the wars in Spain, the Alps, Germany and Pannonia, the deaths of Agrippa and Drusus, the retirement of Tiberius, and the military and financial arrangements of the later reign. Earnest Cary's Loeb translation (1917), made on the basis of H. B. Foster's version, with his notes as transcribed on LacusCurtius, and the Greek of the Loeb edition as companion; the margin gives book and chapter.","kind": "history","transPair": {"a": "dio-roman-history-6","e": "dio-roman-history-6-e"},"transSelf": "a"},"text": {"title": "Roman History (Books 51–55)","greek": "ΔΙΩΝΟΣ ΚΑΣΣΙΟΥ ΡΩΜΑΪΚΗ ΙΣΤΟΡΙΑ","subtitle": "Rhōmaïkē Historia · Books 51–55, 31 B.C.–A.D. 8 · trans. Earnest Cary","translator": "Earnest Cary (1917)","lang": "eng","short": "Cary","transPair": {"a": "dio-roman-history-6","e": "dio-roman-history-6-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 53.16"}}},{"meta": {"key": "dio-roman-history-6-e","en": "Roman History (Books 51–55)","gr": "ΡΩΜΑΪΚΗ ΙΣΤΟΡΙΑ","color": "#45332b","author": "Cassius Dio","hidden": true,"form": "HISTORY","transPair": {"a": "dio-roman-history-6","e": "dio-roman-history-6-e"},"transSelf": "e","kind": "history"},"text": {"title": "Ῥωμαϊκὴ Ἱστορία","greek": "ΔΙΩΝΟΣ ΚΑΣΣΙΟΥ ΡΩΜΑΪΚΗ ΙΣΤΟΡΙΑ","translator": "Greek text (Cary)","lang": "grc","short": "Greek","transPair": {"a": "dio-roman-history-6","e": "dio-roman-history-6-e"},"transSelf": "e","noSpeakerLabels": true,"reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 53.16"}}},{"meta": {"key": "dio-roman-history-7","en": "Roman History (Books 56–60)","gr": "ΡΩΜΑΪΚΗ ΙΣΤΟΡΙΑ","color": "#2b3545","author": "Cassius Dio","form": "HISTORY","blurb": "Books 56–60 of Cassius Dio's Roman History: Augustus's speeches to the married and the unmarried, the destruction of Varus and his legions in Germany, the death and funeral of Augustus, the reign of Tiberius with Germanicus, Sejanus and the treason trials, the reign of Gaius (Caligula) and his murder, and the first years of Claudius, including the invasion of Britain. Parts of the text are filled out from the epitomes. Earnest Cary's Loeb translation (1924), made on the basis of H. B. Foster's version, with his notes as transcribed on LacusCurtius; there is no Greek companion. The margin gives book and chapter.","kind": "history"},"text": {"title": "Roman History (Books 56–60)","greek": "ΔΙΩΝΟΣ ΚΑΣΣΙΟΥ ΡΩΜΑΪΚΗ ΙΣΤΟΡΙΑ","subtitle": "Rhōmaïkē Historia · Books 56–60, A.D. 9–46 · trans. Earnest Cary","translator": "Earnest Cary (1924)","lang": "eng","short": "Cary","noSpeakerLabels": true,"reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 56.18"}}},{"meta": {"key": "dio-roman-history-8","en": "Roman History (Books 61–70)","gr": "ΡΩΜΑΪΚΗ ΙΣΤΟΡΙΑ","color": "#40302f","author": "Cassius Dio","form": "HISTORY","blurb": "Books 61–70 of Cassius Dio's Roman History, which survive only in the Byzantine abridgements of Xiphilinus and Zonaras and in excerpts: the last years of Claudius, the reign of Nero with the revolt of Boudicca, the fire of Rome and the tour of Greece, the year of the four emperors, Vespasian and the fall of Jerusalem, Titus and the eruption of Vesuvius, Domitian, Nerva, Trajan's Dacian and Parthian wars, Hadrian, and the little that remained of Antoninus Pius. Earnest Cary's Loeb translation (1925), made on the basis of H. B. Foster's version, with his notes; there is no Greek companion. The margin gives the traditional book and chapter printed in the Loeb margin, which in these books differs from the numbering of the book headings.","kind": "history"},"text": {"title": "Roman History (Books 61–70)","greek": "ΔΙΩΝΟΣ ΚΑΣΣΙΟΥ ΡΩΜΑΪΚΗ ΙΣΤΟΡΙΑ","subtitle": "Rhōmaïkē Historia · Books 61–70, A.D. 47–161 · trans. Earnest Cary","translator": "Earnest Cary (1925)","lang": "eng","short": "Cary","noSpeakerLabels": true,"reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 62.16"}}},{"meta": {"key": "dio-roman-history-9","en": "Roman History (Books 71–80)","gr": "ΡΩΜΑΪΚΗ ΙΣΤΟΡΙΑ","color": "#33392b","author": "Cassius Dio","form": "HISTORY","blurb": "Books 71–80 of Cassius Dio's Roman History, the part for which the author, a senator, was an eyewitness; they survive in the abridgement of Xiphilinus and in excerpts, with a damaged manuscript of Dio's own text for most of the last two books. They cover Marcus Aurelius and the Marcomannic wars, Commodus, Pertinax, the auction of the empire to Didius Julianus, Septimius Severus and his civil and eastern wars, Caracalla, Macrinus, Elagabalus, and a short close on Severus Alexander and Dio's second consulship. Earnest Cary's Loeb translation (1927), made on the basis of H. B. Foster's version, with his notes; there is no Greek companion. The margin gives the traditional book and chapter printed in the Loeb margin, which in these books differs from the numbering of the book headings.","kind": "history"},"text": {"title": "Roman History (Books 71–80)","greek": "ΔΙΩΝΟΣ ΚΑΣΣΙΟΥ ΡΩΜΑΪΚΗ ΙΣΤΟΡΙΑ","subtitle": "Rhōmaïkē Historia · Books 71–80, A.D. 161–229 · trans. Earnest Cary","translator": "Earnest Cary (1927)","lang": "eng","short": "Cary","noSpeakerLabels": true,"reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 72.22"}}},{"meta": {"key": "apollodorus-library","en": "The Library","gr": "ΒΙΒΛΙΟΘΗΚΗ","color": "#4a3626","author": "Apollodorus","form": "TREATISE","blurb": "A summary of Greek myth and heroic legend from the birth of the gods to the death of Odysseus, compiled probably in the first or second century AD; the lost ending survives in the Epitome. J. G. Frazer's Loeb translation of 1921 with all his footnotes, and his Greek text.","transPair": {"a": "apollodorus-library","e": "apollodorus-library-e"},"transSelf": "a","kind": "prose"},"text": {"title": "The Library","greek": "ΑΠΟΛΛΟΔΩΡΟΥ ΒΙΒΛΙΟΘΗΚΗ","subtitle": "Bibliotheke · a handbook of Greek myth in three books, with the Epitome · trans. J. G. Frazer","translator": "J. G. Frazer (1921)","lang": "eng","short": "Frazer","transPair": {"a": "apollodorus-library","e": "apollodorus-library-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter.section","abbr": "","placeholder": "e.g. 2.5.1 or E.5.3"},"parMirror": "apollodorus-library"}},{"meta": {"key": "apollodorus-library-e","en": "The Library","gr": "ΒΙΒΛΙΟΘΗΚΗ","color": "#4a3626","author": "Apollodorus","hidden": true,"form": "TREATISE","transPair": {"a": "apollodorus-library","e": "apollodorus-library-e"},"tran ias-1","e": "pausanias-1-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "pausanias-1","reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 1.22"}}},{"meta": {"key": "pausanias-2","en": "Description of Greece (Books III–IV: Laconia, Messenia)","gr": "ΕΛΛΑΔΟΣ ΠΕΡΙΗΓΗΣΙΣ Γ–Δ","color": "#3d4636","author": "Pausanias","form": "TREATISE","blurb": "Books III and IV of Pausanias’ second-century guide to Greece. Book III gives the royal houses of Sparta, the city itself, Amyclae and the Free Laconians; Book IV the wars of Messenia against Sparta, the exploits of Aristomenes and the restoration under Epaminondas. Shilleto’s translation of 1886, with Spiro’s Greek as companion.","transPair": {"a": "pausanias-2","e": "pausanias-2-e"},"transSelf": "a","kind": "prose"},"text": {"title": "Description of Greece (Books III–IV: Laconia, Messenia)","greek": "ΠΑΥΣΑΝΙΟΥ ΕΛΛΑΔΟΣ ΠΕΡΙΗΓΗΣΙΣ","subtitle": "Hellados Periegesis · a traveller’s guide to Greece, Books III–IV: Laconia, Messenia · trans. Shilleto","translator": "A. R. Shilleto (1886)","lang": "eng","short": "Shilleto","transPair": {"a": "pausanias-2","e": "pausanias-2-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 3.16"},"parMirror": "pausanias-2"}},{"meta": {"key": "pausanias-2-e","en": "Description of Greece (Books III–IV: Laconia, Messenia)","gr": "ΕΛΛΑΔΟΣ ΠΕΡΙΗΓΗΣΙΣ Γ–Δ","color": "#3d4636","author": "Pausanias","hidden": true,"form": "TREATISE","transPair": {"a": "pausanias-2","e": "pausanias-2-e"},"transSelf": "e","kind": "prose"},"text": {"title": "Ἑλλάδος Περιήγησις (Γʹ–Δʹ)","greek": "ΠΑΥΣΑΝΙΟΥ ΕΛΛΑΔΟΣ ΠΕΡΙΗΓΗΣΙΣ","translator": "Greek text (Spiro)","lang": "grc","short": "Greek","transPair": {"a": "pausanias-2","e": "pausanias-2-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "pausanias-2","reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. 3.16"}}},{"meta": {"key": "pausanias-3","en": "Description of
