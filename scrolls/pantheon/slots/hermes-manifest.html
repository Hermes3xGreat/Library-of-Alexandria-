ff to Agamemnon, Astyanax is thrown from the walls, Helen pleads her case before Menelaus, and the women go down to the ships. Produced in 415 BC. E. P. Coleridge’s prose translation, with Gilbert Murray’s Greek.","transPair": {"a": "eur-trojan-women","e": "eur-trojan-women-e"},"transSelf": "a"},"text": {"title": "The Trojan Women","greek": "ΕΥΡΙΠΙΔΟΥ ΤΡΩΙΑΔΕΣ","subtitle": "Trōiades · tragedy of the captive women after the fall of Troy · trans. E. P. Coleridge","translator": "E. P. Coleridge (1891), modernised by Perseus","lang": "eng","short": "Coleridge","transPair": {"a": "eur-trojan-women","e": "eur-trojan-women-e"},"transSelf": "a","reference": {"label": "Line","abbr": "","placeholder": "e.g. 399"},"persons": [{"name": "Poseidon","desc": "the god, who speaks the prologue"},{"name": "Athena","desc": "the goddess, now turned against the Greeks"},{"name": "Hecuba","desc": "queen of Troy, widow of Priam"},{"name": "Chorus","desc": "captive Trojan women"},{"name": "Talthybius","desc": "herald of the Greek army"},{"name": "Cassandra","desc": "daughter of Hecuba, prophetess, allotted to Agamemnon"},{"name": "Andromache","desc": "widow of Hector, allotted to Neoptolemus"},{"name": "Menelaus","desc": "king of Sparta"},{"name": "Helen","desc": "his wife"}],"scene": ""}},{"meta": {"key": "eur-trojan-women-e","en": "The Trojan Women","gr": "ΤΡΩΙΑΔΕΣ","color": "#44384f","author": "Euripides","hidden": true,"form": "TRAGEDY","transPair": {"a": "eur-trojan-women","e": "eur-trojan-women-e"},"transSelf": "e"},"text": {"title": "Τρῳάδες","greek": "ΕΥΡΙΠΙΔΟΥ ΤΡΩΙΑΔΕΣ","translator": "Greek text (Murray)","lang": "grc","short": "Greek","transPair": {"a": "eur-trojan-women","e": "eur-trojan-women-e"},"transSelf": "e","reference": {"label": "Line","abbr": "","placeholder": "e.g. 399"},"persons": [{"name": "Poseidon","desc": "the god, who speaks the prologue"},{"name": "Athena","desc": "the goddess, now turned against the Greeks"},{"name": "Hecuba","desc": "queen of Troy, widow of Priam"},{"name": "Chorus","desc": "captive Trojan women"},{"name": "Talthybius","desc": "herald of the Greek army"},{"name": "Cassandra","desc": "daughter of Hecuba, prophetess, allotted to Agamemnon"},{"name": "Andromache","desc": "widow of Hector, allotted to Neoptolemus"},{"name": "Menelaus","desc": "king of Sparta"},{"name": "Helen","desc": "his wife"}],"scene": ""}},{"meta": {"key": "eur-electra","en": "Electra","gr": "ΗΛΕΚΤΡΑ","color": "#2d4b3e","author": "Euripides","form": "TRAGEDY","blurb": "Electra has been married off to a poor farmer. Orestes returns in secret, is recognised by an old servant, and kills Aegisthus at a sacrifice; brother and sister then kill Clytemnestra together and are at once undone by the deed. E. P. Coleridge’s prose translation, with Gilbert Murray’s Greek.","transPair": {"a": "eur-electra","e": "eur-electra-e"},"transSelf": "a"},"text": {"title": "Electra","greek": "ΕΥΡΙΠΙΔΟΥ ΗΛΕΚΤΡΑ","subtitle": "Ēlektra · tragedy of the vengeance of Electra and Orestes · trans. E. P. Coleridge","translator": "E. P. Coleridge (1891), modernised by Perseus","lang": "eng","short": "Coleridge","transPair": {"a": "eur-electra","e": "eur-electra-e"},"transSelf": "a","reference": {"label": "Line","abbr": "","placeholder": "e.g. 399"},"persons": [{"name": "Peasant","desc": "a Mycenaean farmer, husband of Electra in name only"},{"name": "Electra","desc": "daughter of Agamemnon and Clytemnestra"},{"name": "Orestes","desc": "her brother, returned from exile"},{"name": "Pylades","desc": "friend of Orestes; a mute character"},{"name": "Chorus","desc": "Argive country-women"},{"name": "Old Man","desc": "once the servant of Agamemnon, who saved the child Orestes"},{"name": "Messenger","desc": "a servant of Orestes"},{"name": "Clytemnestra","desc": "queen of Argos, widow and murderer of Agamemnon"},{"name": "Dioskouroi","desc": "Castor and Polydeuces, brothers of Clytemnestra, who appear at the close"}],"scene": ""}},{"meta": {"key": "eur-electra-e","en": "Electra" lt on the story that Helen never went to Troy: a phantom took her place while she waited out the war in Egypt. Menelaos is shipwrecked, they recognise each other and by a pretended funeral at sea escape King Theoklymenos. E. P. Coleridge's prose translation, with Gilbert Murray's Greek.","transPair": {"a": "eur-helen","e": "eur-helen-e"},"transSelf": "a"},"text": {"title": "Helen","greek": "ΕΥΡΙΠΙΔΟΥ ΕΛΕΝΗ","subtitle": "Helenē · tragedy of the Helen who never went to Troy · trans. E. P. Coleridge","translator": "E. P. Coleridge (1891), modernised by Perseus","lang": "eng","short": "Coleridge","transPair": {"a": "eur-helen","e": "eur-helen-e"},"transSelf": "a","reference": {"label": "Line","abbr": "","placeholder": "e.g. 528"},"persons": [{"name": "Helen","desc": "wife of Menelaos"},{"name": "Teucer","desc": "a Greek warrior, brother of Aias"},{"name": "Chorus","desc": "captive Greek women attending Helen"},{"name": "Menelaos","desc": "king of Sparta, husband of Helen"},{"name": "Old Woman (Portress)","desc": "doorkeeper of the palace of Theoklymenos"},{"name": "Messenger","desc": "an old servant of Menelaos"},{"name": "Theonoe","desc": "prophetess, sister of Theoklymenos"},{"name": "Theoklymenos","desc": "king of Egypt, son of Proteus"},{"name": "Servant","desc": "a servant of the palace"},{"name": "Dioskouroi","desc": "Castor and Polydeuces, brothers of Helen, appearing as gods"},{"name": "Second Messenger","desc": "a servant of Theoklymenos, from the ship"}],"scene": ""}},{"meta": {"key": "eur-helen-e","en": "Helen","gr": "ΕΛΕΝΗ","color": "#2e4a5c","author": "Euripides","hidden": true,"form": "TRAGEDY","transPair": {"a": "eur-helen","e": "eur-helen-e"},"transSelf": "e"},"text": {"title": "Ἑλένη","greek": "ΕΥΡΙΠΙΔΟΥ ΕΛΕΝΗ","translator": "Greek text (Murray)","lang": "grc","short": "Greek","transPair": {"a": "eur-helen","e": "eur-helen-e"},"transSelf": "e","reference": {"label": "Line","abbr": "","placeholder": "e.g. 528"},"persons": [{"name": "Helen","desc": "wife
