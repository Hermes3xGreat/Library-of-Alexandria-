boethius-tractates","b": "boethius-tractates-b"},"transSelf": "a","lang": "eng","short": "Stewart"}},{"meta": {"key": "dionysius-celestial-hierarchy","en": "On the Heavenly Hierarchy","gr": "ΠΕΡΙ ΤΗΣ ΟΥΡΑΝΙΑΣ ΙΕΡΑΡΧΙΑΣ","color": "#6e5a1c","author": "Pseudo-Dionysius","kind": "treatise","form": "TREATISE","pdf": "pdfs/Pseudo-Dionysius/On-the-Heavenly-Hierarchy.pdf","blurb": "The treatise that fixed the Christian angelology: nine orders in three triads, from Seraphim to Angels, through which the divine light descends and the soul is drawn upward."},"text": {"title": "On the Heavenly Hierarchy","greek": "ΠΕΡΙ ΤΗΣ ΟΥΡΑΝΙΑΣ ΙΕΡΑΡΧΙΑΣ","subtitle": "The Celestial Hierarchy — the nine orders of angels","translator": "John Parker (1897)","noSpeakerLabels": true}},{"meta": {"key": "dionysius-ecclesiastical-hierarchy","en": "On the Ecclesiastical Hierarchy","gr": "ΠΕΡΙ ΤΗΣ ΕΚΚΛΗΣΙΑΣΤΙΚΗΣ ΙΕΡΑΡΧΙΑΣ","color": "#6e5a1c","author": "Pseudo-Dionysius","kind": "treatise","form": "TREATISE","pdf": "pdfs/Pseudo-Dionysius/On-the-Ecclesiastical-Hierarchy.pdf","blurb": "The church’s sacraments and orders — baptism, the eucharist, the consecration of oil, bishops, priests and monks — explained as the earthly image of the heavenly hierarchy."},"text": {"title": "On the Ecclesiastical Hierarchy","greek": "ΠΕΡΙ ΤΗΣ ΕΚΚΛΗΣΙΑΣΤΙΚΗΣ ΙΕΡΑΡΧΙΑΣ","subtitle": "The earthly image of the heavenly order · trans. John Parker (1897)","translator": "John Parker (1897)","noSpeakerLabels": true}},{"meta": {"key": "dionysius-divine-names","en": "On Divine Names","gr": "ΠΕΡΙ ΘΕΙΩΝ ΟΝΟΜΑΤΩΝ","color": "#6e5a1c","author": "Pseudo-Dionysius","kind": "treatise","form": "TREATISE","pdf": "pdfs/Pseudo-Dionysius/On-Divine-Names.pdf","blurb": "On how God, who is beyond all names, is rightly called Good, Being, Life, Wisdom, Power and One, with a long treatment of the problem of evil as a privation."},"text": {"title": "On Divine Names","greek": "ΠΕΡΙ ΘΕΙΩΝ ΟΝΟΜΑΤΩΝ","subtitle": "How the Nameless is celebrated under every name · trans. John Parker (1897)","translator": "John Parker (1897)","noSpeakerLabels": true}},{"meta": {"key": "dionysius-mystic-theology","en": "On Mystic Theology","gr": "ΠΕΡΙ ΜΥΣΤΙΚΗΣ ΘΕΟΛΟΓΙΑΣ","color": "#6e5a1c","author": "Pseudo-Dionysius","kind": "treatise","form": "TREATISE","pdf": "pdfs/Pseudo-Dionysius/On-Mystic-Theology.pdf","blurb": "A short treatise of five chapters on the ascent beyond knowledge into the divine darkness, denying every name of God in turn — the fountainhead of Christian apophatic mysticism."},"text": {"title": "On Mystic Theology","greek": "ΠΕΡΙ ΜΥΣΤΙΚΗΣ ΘΕΟΛΟΓΙΑΣ","subtitle": "The ascent into the Divine Darkness · trans. John Parker (1897)","translator": "John Parker (1897)","noSpeakerLabels": true}},{"meta": {"key": "dionysius-letters","en": "The Letters","gr": "ΕΠΙΣΤΟΛΑΙ","color": "#6e5a1c","author": "Pseudo-Dionysius","kind": "prose","form": "LETTERS","pdf": "pdfs/Pseudo-Dionysius/The-Letters.pdf","blurb": "Ten letters to Gaius, Dorotheus, Polycarp, Demophilus and others, on the unknowing that is knowledge, the humanity of Christ, and mercy toward sinners, with a final letter to John at Patmos."},"text": {"title": "The Letters","greek": "ΕΠΙΣΤΟΛΑΙ","subtitle": "Eleven letters — to Gaius, Polycarp, Demophilus, Titus, and John at Patmos · trans. John Parker (1897)","translator": "John Parker (1897)","noSpeakerLabels": true}},{"meta": {"key": "plethon-chaldean-oracles","en": "Exposition of the Chaldean Oracles","gr": "ΕΞΗΓΗΣΙΣ ΕΙΣ ΤΑ ΛΟΓΙΑ","color": "#4a2b53","author": "Plethon","kind": "treatise","form": "COMMENTARY","pdf": "pdfs/Plethon/Exposition-of-the-Chaldean-Oracles.pdf","blurb": "The Byzantine Platonist’s commentary on the Chaldean Oracles, which he assigned to the Magi of Zoroaster, reading them as a doctrine of the soul, the gods and the heavens."},"text": {"title": "Exposition of the Chaldean Oracles","greek": "ΕΞΗΓΗΣΙΣ ΕΙΣ ΤΑ ΛΟΓΙΑ","subtitle": "On the Magian Oracles of Zoroaster · trans. Thomas Stanley (1661)","translator": "Thomas Stanley","noSpeakerLabels": true,"reference": {"label": "Oracle","abbr": "Or.","placeholder": "e.g. 1"}}},{"meta": {"key": "plethon-hymns","en": "Hymns","gr": "ΥΜΝΟΙ","color": "#6f581f","author": "Plethon","kind": "verse","form": "HYMN","pdf": "pdfs/Plethon/Hymns.pdf","blurb": "Twenty-seven hymns from Plethon’s Book of Laws, to Zeus, Poseidon, Hera, the Olympians and the daemons, composed for a restored Hellenic worship in fifteenth-century Mistra."},"text": {"title": "Hymns","greek": "ΥΜΝΟΙ","subtitle": "Hymns to the Gods, from the Book of Laws","noSpeakerLabels": true,"reference": {"label": "Hymn","abbr": "Hy.","placeholder": "e.g. 1"},"translator": "Claude AI, from the Greek of the Alexandre edition of 1858"}},{"meta": {"key": "ficino-de-amore","en": "On Love","gr": "DE AMORE","color": "#6a3b2c","author": "Marsilio Ficino","form": "COMMENTARY","kind": "treatise","pdf": "pdfs/Marsilio-Ficino/On-Love.pdf","blurb": "Ficino's commentary on Plato's Symposium, written in 1468–69: a Platonic banquet at Careggi on Plato's birthday, where seven guests expound the seven speeches — beauty as the splendour of divine goodness, the two Venuses, the four divine frenzies. The book that carried Platonic love into the Renaissance. A new translation, with the Latin as companion.","transPair": {"a": "ficino-de-amore","b": "ficino-de-amore-b"},"transSelf": "a"},"text": {"title": "On Love","greek": "COMMENTARIUM IN CONVIVIUM PLATONIS DE AMORE","subtitle": "Commentary on Plato's Symposium · new translation from the Latin (Lyon 1557, collated with the Laurenziana manuscript) · notes not yet verified","translator": "Claude AI","lang": "eng","short": "English","noSpeakerLabels": true,"reference": {"label": "Speech.chapter","abbr": "","placeholder": "e.g. VI.7"},"transPair": {"a": "ficino-de-amore","b": "ficino-de-amore-b"},"transSelf": "a","parMirror": "ficino-de-amore","parPara": true}},{"meta": {"key": "ficino-de-amore-b","en": "On Love","gr": "DE AMORE","color": "#6a3b2c","author": "Marsilio Ficino","hidden": true,"form": "COMMENTARY","kind": "treatise","pdf": "pdfs/Marsilio-Ficino/On-Love-Latin.pdf","transPair": {"a": "ficino-de-amore","b": "ficino-de-amore-b"},"transSelf": "b"},"text": {"title": "Commentarium in Convivium Platonis de amore","greek": "COMMENTARIUM IN CONVIVIUM PLATONIS DE AMORE","translator": "Latin text (Lyon 1557, collated with the Laurenziana manuscript)","lang": "lat","short": "Latin","noSpeakerLabels": true,"reference": {"label": "Speech.chapter","abbr": "","placeholder": "e.g. VI.7"},"transPair": {"a": "ficino-de-amore","b": "ficino-de-amore-b"},"transSelf": "b","parMirror": "ficino-de-amore","parPara": true}},{"meta": {"key": "pico-platonick-discourse","en": "A Platonick Discourse upon Love","gr": "COMMENTO SOPRA UNA CANZONE D'AMORE","color": "#6a2c3b","author": "Pico della Mirandola","form": "COMMENTARY","kind": "treatise","blurb": "Pico's commentary on his friend Benivieni's Platonic canzone of love (1486): the threefold existence of things, the Angelic Mind and the World-Soul, the two Venuses, and the soul's ascent from sensible to celestial beauty. The companion piece to Ficino's On Love, in Thomas Stanley's English of 1651."},"text": {"title": "A Platonick Discourse upon Love","greek": "COMMENTO SOPRA UNA CANZONE D'AMORE DI GIROLAMO BENIVIENI","subtitle": "Translated by Thomas Stanley (1651) · edited by Edmund G. Gardner (Boston, 1914) · public domain","translator": "Thomas Stanley","lang": "eng","short": "Stanley","noSpeakerLabels": true,"reference": {"label": "Book.chapter","abbr": "","placeholder": "e.g. II.13"}}},{"meta": {"key": "agrippa-occult-1","en": "Occult Philosophy — Book One","gr": "DE OCCULTA PHILOSOPHIA","color": "#4a2e6f","author": "Cornelius Agrippa","kind": "treatise","form": "TREATISE","pdf": "pdfs/Cornelius-Agrippa/Occult-Philosophy-Book-One.pdf","blurb": "Agrippa’s first book, on natural magic: the four elements, the occult virtues of stones, plants and animals, sympathies and antipathies, and the powers of the planets in things below."},"text": {"title": "Occult Philosophy — Book One","greek": "DE OCCULTA PHILOSOPHIA","subtitle": "Book One: Natural Magic — of the Three Books of Occult Philosophy","translator": "Willis F. Whitehead (1898)","noSpeakerLabels": true}},{"meta": {"key": "agrippa-occult-2","en": "Occult Philosophy — Book Two","gr": "DE OCCULTA PHILOSOPHIA","color": "#4a2e6f","author": "Cornelius Agrippa","kind": "treatise","form": "TREATISE","pdf": "pdfs/Cornelius-Agrippa/Occult-Philosophy-Book-Two.pdf","blurb": "The second book, on celestial magic: the mysteries of number, magic squares and planetary seals, the images of the stars, and how the heavens may be drawn down into made things."},"text": {"title": "Occult Philosophy — Book Two","greek": "DE OCCULTA PHILOSOPHIA","subtitle": "Book Two: Celestial Magic — of the Three Books of Occult Philosophy · trans. J.F. (1651)","translator": "J.F. (1651)","noSpeakerLabels": true}},{"meta": {"key": "agrippa-occult-3","en": "Occult Philosophy — Book Three","gr": "DE OCCULTA PHILOSOPHIA","color": "#4a2e6f","author": "Cornelius Agrippa","kind": "treatise","form": "TREATISE","pdf": "pdfs/Cornelius-Agrippa/Occult-Philosophy-Book-Three.pdf","blurb": "Agrippa’s third book, on ceremonial magic: divine names, the orders of angels and spirits, the soul’s ascent, and the Kabbalah of letters, with his later retraction of the whole."},"text": {"title": "Occult Philosophy — Book Three","greek": "DE OCCULTA PHILOSOPHIA","subtitle": "Book Three: Ceremonial Magic, with the Censure or Retractation · trans. J.F. (1651)","translator": "J.F. (1651)","noSpeakerLabels": true}},{"meta": {"key": "bruno-infinite-universe","en": "On the Infinite Universe and Worlds","gr": "De l'infinito, universo et mondi","color": "#2c3566","author": "Giordano Bruno","kind": "dialogue","form": "DIALOGUE","pdf": "pdfs/Giordano-Bruno/On-the-Infinite-Universe-and-Worlds.pdf","blurb": "Five dialogues of 1584 in which Bruno argues, against Aristotle, that the universe is infinite, holds innumerable worlds, and has no centre, since an infinite cause must have an infinite effect."},"text": {"title": "On the Infinite Universe and Worlds","greek": "De l'infinito, universo et mondi","subtitle": "Five cosmological dialogues · 1584 · trans. Claude AI","translator": "Claude AI","noSpeakerLabels": true,"persons": [{"name": "FILOTEO","desc": "who speaks for Bruno"},{"name": "ELPINO","desc": "his young interlocutor"},{"name": "FRACASTORIO","desc": "a physician"},{"name": "BURCHIO","desc": "an Aristotelian"},{"name": "ALBERTINO","desc": "a Peripatetic, in the fifth dialogue"}]}},{"meta": {"key": "poetic-edda","en": "The Poetic Edda","color": "#4b5d7a","author": "The Elder Edda","form": "POETRY","kind": "verse","blurb": "The lays of the gods and heroes of the North, from the Codex Regius: the Voluspo, the Wise-Woman’s prophecy of the world’s making and its doom; the Hovamol, sayings of the High One; Othin’s contests of wisdom, Thor’s journeys, and the great cycle of Sigurth, Brynhild and the Volsungs. Henry Adams Bellows’s complete translation, keeping the alliterative half-lines, cited by stanza."},"text": {"title": "The Poetic Edda","translator": "Henry Adams Bellows (1923)","lang": "eng","short": "Bellows","noSpeakerLabels": true,"reference": {"label": "Stanza","abbr": "","placeholder": "e.g. 1"}}},{"meta": {"key": "prose-edda","en": "The Prose Edda","color": "#5a6b84","author": "Snorri Sturluson","form": "TREATISE","kind": "prose","blurb": "Snorri Sturluson’s handbook of the old Norse myths, written in Iceland about 1220: the Fooling of Gylfe, where three mysterious figures tell a Swedish king of the creation, the gods of Asgard, the death of Balder and the Twilight of the Gods; then Brage’s talk on the origin of poetry. Rasmus Anderson’s translation of the Younger Edda."},"text": {"title": "The Prose Edda","translator": "Rasmus B. Anderson (1880)","lang": "eng","short": "Anderson","reference": {"label": "Section","abbr": "","placeholder": "e.g. 1"}}},{"meta": {"key": "beowulf","en": "Beowulf","color": "#3d5a5a","author": "The Beowulf Poet","form": "EPIC","kind": "verse","blurb": "The great Old English epic: the hero of the Geats crosses the sea to free Hrothgar’s hall Heorot from the monster Grendel, follows Grendel’s mother to her lair beneath the mere, and, an old king at last, fights the dragon that guards a buried hoard. J. Lesslie Hall’s verse translation, in the measure of the original."},"text": {"title": "Beowulf","translator": "J. Lesslie Hall (1892)","lang": "eng","short": "Hall","noSpeakerLabels": true}},{"meta": {"key": "kalevala","en": "The Kalevala","color": "#3f6a7a","author": "Elias Lönnrot","form": "EPIC","kind": "verse","blurb": "The national epic of Finland, gathered from the singers of Karelia by Elias Lönnrot: the birth of Wainamoinen the eternal singer, the forging of the magic Sampo, the wooing of the Maiden of the North, the tragedy of Kullervo, and the theft of the Sampo from Pohyola — fifty runes in John Martin Crawford’s complete translation."},"text": {"title": "The Kalevala","translator": "John Martin Crawford (1888)","lang": "eng","short": "Crawford","noSpeakerLabels": true}},{"meta": {"key": "nibelungenlied","en": "The Nibelungenlied","color": "#6a4a3a","author": "The Nibelungenlied Poet","form": "EPIC","kind": "verse","blurb": "The German epic of Siegfried, slayer of the dragon and winner of the Nibelung hoard, of his marriage to Kriemhild and his murder by Hagen, and of Kriemhild’s terrible revenge at the court of Etzel, king of the Huns — thirty-nine adventures in Lettsom’s translation."},"text": {"title": "The Nibelungenlied","translator": "William Nanson Lettsom (1850, rev. 1901)","lang": "eng","short": "Lettsom","noSpeakerLabels": true}},{"meta": {"key": "mabinogion","en": "The Mabinogion","color": "#3a6a4a","author": "The Welsh Bards","form": "NOVEL","kind": "prose","blurb": "The tales of medieval Wales: the four branches of the Mabinogi — Pwyll, Branwen, Manawyddan and Math — Kilhwch and Olwen and the hunting of the boar Twrch Trwyth, the Dream of Rhonabwy, and the Arthurian romances of Owain, Peredur and Geraint. Lady Charlotte Guest’s translation."},"text": {"title": "The Mabinogion","translator": "Lady Charlotte Guest (1849)","lang": "eng","short": "Guest"}},{"meta": {"key": "gods-and-fighting-men","en": "Gods and Fighting Men","color": "#4a6a3a","author": "Lady Gregory","form": "NOVEL","kind": "prose","blurb": "The story of the Tuatha Dé Danann and of the Fianna of Ireland, arranged and put into English by Lady Gregory: the coming of the gods, Lugh of the Long Hand and the battle of Magh Tuireadh, the Sons of Tuireann, and the deeds of Finn, Oisín, Diarmuid and Gráinne."},"text": {"title": "Gods and Fighting Men","translator": "Lady Augusta Gregory (1904)","lang": "eng","short": "Gregory"}},{"meta": {"key": "song-of-roland","en": "The Song of Roland","color": "#7a3a3a","author": "Turold","form": "EPIC","kind": "verse","blurb": "The oldest great poem of France: Charlemagne’s rearguard betrayed by Ganelon and cut down at Roncevaux, Roland’s refusal to sound his horn until too late, Oliver and Archbishop Turpin at his side, and the Emperor’s vengeance. C. K. Scott-Moncrieff’s translation, cited by laisse."},"text": {"title": "The Song of Roland","translator": "C. K. Scott-Moncrieff (1919)","lang": "eng","short": "Scott-Moncrieff","noSpeakerLabels": true,"reference": {"label": "Laisse","abbr": "","placeholder": "e.g. CLXXVI"}}},{"meta": {"key": "sir-gawain","en": "Sir Gawain and the Green Knight","color": "#2f6a3a","author": "The Gawain Poet","form": "NOVEL","kind": "prose","blurb": "At Arthur’s Christmas feast a green giant offers his neck to the axe, on condition that the striker seek him out a year later to receive the blow in return. Gawain takes up the challenge — and is tested on the way in a lord’s castle. Jessie L. Weston’s prose rendering of the Middle English romance."},"text": {"title": "Sir Gawain and the Green Knight","translator": "Jessie L. Weston (1898)","lang": "eng","short": "Weston"}},{"meta": {"key": "morte-darthur-1","en": "Le Morte d’Arthur, Volume I","color": "#5a3a6a","author": "Sir Thomas Malory","form": "NOVEL","kind": "prose","blurb": "Malory’s Arthur, as William Caxton printed it in 1485: the begetting of Arthur and the sword in the stone, Merlin, the Lady of the Lake and Excalibur, the war with Rome, Launcelot, Gareth, and the first adventures of Tristram (Books I–IX)."},"text": {"title": "Le Morte d’Arthur, Volume I","translator": "Caxton’s text (1485)","lang": "eng","short": "Caxton"}},{"meta": {"key": "morte-darthur-2","en": "Le Morte d’Arthur, Volume II","color": "#5a3a6a","author": "Sir Thomas Malory","form": "NOVEL","kind": "prose","blurb": "The rest of Malory’s Arthur: Tristram and Isoud, the Quest of the Holy Grail with Galahad, Percival and Bors, Launcelot and Guenever, the fall of the Round Table and the death of Arthur (Books X–XXI)."},"text": {"title": "Le Morte d’Arthur, Volume II","translator": "Caxton’s text (1485)","lang": "eng","short": "Caxton"}},{"meta": {"key": "divine-comedy","en": "The Divine Comedy","color": "#7a5a2a","author": "Dante Alighieri","form": "EPIC","kind": "verse","blurb": "Midway upon the journey of his life, Dante is led by Virgil down through the circles of Hell and up the mountain of Purgatory, and by Beatrice through the heavens to the vision of the Love that moves the sun and the other stars. Longfellow’s line-for-line translation of the Inferno, Purgatorio and Paradiso."},"text": {"title": "The Divine Comedy","translator": "Henry Wadsworth Longfellow (1867)","lang": "eng","short": "Longfellow","noSpeakerLabels": true}},{"meta": {"key": "chretien-arthurian-romances","en": "Four Arthurian Romances","color": "#6a3a5a","author": "Chrétien de Troyes","form": "NOVEL","kind": "prose","blurb": "The first great Arthurian romances, written in twelfth-century Champagne: Erec and Enide, Cligès, Yvain or the Knight of the Lion, and Lancelot or the Knight of the Cart — Camelot, Guinevere and the Round Table as the Middle Ages first imagined them. Comfort’s prose translation, cited by the lines of the Old French."},"text": {"title": "Four Arthurian Romances","translator": "W. W. Comfort (1914)","lang": "eng","short": "Comfort","reference": {"label": "Lines","abbr": "","placeholder": "e.g. 1-26"}}},{"meta": {"key": "tristan-and-iseult","en": "The Romance of Tristan and Iseult","color": "#4a3a6a","author": "Joseph Bédier","form": "NOVEL","kind": "prose","blurb": "The love-potion drunk by mistake at sea, King Mark and the Forest of Morois, the leap from the chantry and the ordeal by iron, Iseult of the White Hands and the black sail — the Tristan legend as Joseph Bédier recomposed it from the medieval fragments, in Hilaire Belloc’s English."},"text": {"title": "The Romance of Tristan and Iseult","translator": "Hilaire Belloc (1913)","lang": "eng","short": "Belloc"}},{"meta": {"key": "marie-de-france-lays","en": "The Lays of Marie de France","color": "#6a4a6a","author": "Marie de France","form": "NOVEL","kind": "prose","blurb": "The Breton lays of the first woman poet of French: Lanval and the fairy mistress, the werewolf Bisclavret, the nightingale, the honeysuckle twined about the hazel, Eliduc and his two loves — with Graelent, a story from beyond the sea, and the Chatelaine of Vergi."},"text": {"title": "The Lays of Marie de France","translator": "Eugene Mason (1911)","lang": "eng","short": "Mason"}},{"meta": {"key": "parzival-1","en": "Parzival, Volume I","color": "#7a5a3a","author": "Wolfram von Eschenbach","form": "EPIC","kind": "verse","blurb": "Wolfram’s German Grail epic: Gamuret’s adventures in the East, the boy Parzival raised in the forest by Herzeleide, his first knighthood, Kondwiramur, and the silent visit to the Grail Castle of the wounded king Anfortas (Books I–IX)."},"text": {"title": "Parzival, Volume I","translator": "Jessie L. Weston (1894)","lang": "eng","short": "Weston","noSpeakerLabels": true}},{"meta": {"key": "parzival-2","en": "Parzival, Volume II","color": "#7a5a3a","author": "Wolfram von Eschenbach","form": "EPIC","kind": "verse","blurb": "Gawain’s adventures at the Château Merveil, Parzival’s meeting with his pagan brother Feirefis, and his return to the Grail to ask the question that heals the king (Books X–XVI)."},"text": {"title": "Parzival, Volume II","translator": "Jessie L. Weston (1894)","lang": "eng","short": "Weston","noSpeakerLabels": true}},{"meta": {"key": "anglo-saxon-chronicle","en": "The Anglo-Saxon Chronicle","color": "#5a5a3a","author": "The English Chroniclers","form": "HISTORY","kind": "prose","blurb": "England’s year-book from the Roman invasion to 1154, kept by the monks of Winchester, Peterborough and other houses: the coming of the Saxons, Alfred’s wars with the Danes, the Viking raids, the Norman Conquest. Cited by year."},"text": {"title": "The Anglo-Saxon Chronicle","translator": "James Ingram (1823)","lang": "eng","short": "Ingram","reference": {"label": "Year","abbr": "","placeholder": "e.g. 1066"}}},{"meta": {"key": "bede-ecclesiastical-history","en": "The Ecclesiastical History of the English People","color": "#4a4a6a","author": "The Venerable Bede","form": "HISTORY","kind": "prose","blurb": "Bede of Jarrow’s history of England from Caesar to 731: Augustine’s mission to Kent, the conversion of Northumbria and the sparrow flying through the hall, Aidan and Cuthbert, the synod of Whitby, and Cædmon the cowherd poet."},"text": {"title": "The Ecclesiastical History of the English People","translator": "A. M. Sellar (1907)","lang": "eng","short": "Sellar"}},{"meta": {"key": "imitation-of-christ","en": "The Imitation of Christ","color": "#4a5a6a","author": "Thomas à Kempis","form": "TREATISE","kind": "prose","blurb": "The most widely read devotional book of the Middle Ages, written in the Low Countries about 1420: counsels on the inner life, humility, the contempt of vanities, and the soul’s conversation with Christ, in four books."},"text": {"title": "The Imitation of Christ","translator": "William Benham","lang": "eng","short": "Benham"}},{"meta": {"key": "julian-revelations","en": "Revelations of Divine Love","color": "#6a5a4a","author": "Julian of Norwich","form": "TREATISE","kind": "prose","blurb": "The sixteen “shewings” given to an anchoress of Norwich in May 1373, and twenty years of her reflection on them: the hazelnut that is all that is made, God as Mother, and the promise that “all shall be well, and all manner of thing shall be well.” The first book in English known to be written by a woman."},"text": {"title": "Revelations of Divine Love","translator": "Grace Warrack (ed., 1901)","lang": "eng","short": "Warrack"}},{"meta": {"key": "scott-cathedral-builders","en": "The Cathedral Builders","color": "#4a4a4a","author": "Leader Scott","form": "HISTORY","kind": "prose","blurb": "The story of the Comacine Masters, the guild of builders the author traces from Roman times through the Lombard and Romanesque churches to the Gothic cathedrals."},"text": {"title": "The Cathedral Builders","translator": "Original text (1899)","lang": "eng","short": "Original text"}},{"meta": {"key": "addison-knights-templars","en": "The History of the Knights Templars","color": "#6a2a2a","author": "Charles G. Addison","form": "HISTORY","kind": "prose","blurb": "The rise of the Order in the Holy Land, its wars, wealth and suppression, and the history of the Temple Church and the Temple in London."},"text": {"title": "The History of the Knights Templars","translator": "Original text (1842)","lang": "eng","short": "Original text"}},{"meta": {"key": "mysteries-of-the-rosie-cross","en": "Mysteries of the Rosie Cross","color": "#5a2a3a","author": "The Rosicrucians","form": "HISTORY","kind": "prose","blurb": "A history of the Rosicrucians from the manifestos of Christian Rosenkreuz through Fludd, Maier and the English adepts, with extracts from their writings."},"text": {"title": "Mysteries of the Rosie Cross","translator": "Anonymous (1891)","lang": "eng","short": "Anonymous"}},{"meta": {"key": "sendivogius-new-light-of-alchymie","en": "A New Light of Alchymie","color": "#5a4a1a","author": "Michael Sendivogius","form": "TREATISE","kind": "prose","blurb": "Twelve treatises on nature and the generation of metals, the Dialogue of Mercury, the Alchymist and Nature, and the Treatise of Sulphur — one of the most read alchemical books of the seventeenth century, in its first English dress."},"text": {"title": "A New Light of Alchymie","translator": "John French (1650)","lang": "eng","short": "John French"}},{"meta": {"key": "paracelsus-nature-of-things","en": "Of the Nature of Things","color": "#4a5a2a","author": "Paracelsus","form": "TREATISE","kind": "prose","blurb": "Nine books on the generation, growth, preservation, life, death, resurrection, transmutation, separation and signatures of natural things."},"text": {"title": "Of the Nature of Things","translator": "John French (1650)","lang": "eng","short": "John French"}},{"meta": {"key": "redgrove-alchemy-ancient-and-modern","en": "Alchemy: Ancient and Modern","color": "#5a3a2a","author": "H. Stanley Redgrove","form": "HISTORY","kind": "prose","blurb": "A short account of alchemical doctrine and its relation to mysticism and to modern science, with lives of the chief alchemists."},"text": {"title": "Alchemy: Ancient and Modern","translator": "Original text (1911)","lang": "eng","short": "Original text"}},{"meta": {"key": "muir-story-of-alchemy","en": "The Story of Alchemy and the Beginnings of Chemistry","color": "#4a4a3a","author": "M. M. Pattison Muir","form": "HISTORY","kind": "prose","blurb": "How the alchemists thought about matter and change, what their language meant, and how chemistry grew out of their art."},"text": {"title": "The Story of Alchemy and the Beginnings of Chemistry","translator": "Original text (1902)","lang": "eng","short": "Original text"}},{"meta": {"key": "silberer-hidden-symbolism","en": "Hidden Symbolism of Alchemy and the Occult Arts","color": "#3a3a4a","author": "Herbert Silberer","form": "TREATISE","kind": "prose","blurb": "A Rosicrucian parable read first as a dream and then as hermetic art: the meeting of psychoanalysis, alchemy and mysticism."},"text": {"title": "Hidden Symbolism of Alchemy and the Occult Arts","translator": "Smith Ely Jelliffe (1917)","lang": "eng","short": "Smith Ely Jelliffe"}},{"meta": {"key": "levi-history-of-magic","en": "The History of Magic","color": "#4a2a4a","author": "Éliphas Lévi","form": "HISTORY","kind": "prose","blurb": "Magic from its fabled origins through the Magi, the Kabbalah, the mysteries, the Middle Ages and the Revolution, as told by the French magus."},"text": {"title": "The History of Magic","translator": "A. E. Waite (1913)","lang": "eng","short": "A. E. Waite"}},{"meta": {"key": "goetia-lesser-key-of-solomon","en": "The Lesser Key of Solomon: Goetia","color": "#3a2a2a","author": "The Lesser Key of Solomon","form": "TREATISE","kind": "prose","blurb": "The first book of the Lemegeton: the seventy-two spirits, their seals and offices, the circle and the conjurations."},"text": {"title": "The Lesser Key of Solomon: Goetia","translator": "S. L. MacGregor Mathers (ed. De Laurence, 1916)","lang": "eng","short": "S. L. MacGregor Mather"}},{"meta": {"key": "ginsburg-kabbalah","en": "The Kabbalah: Its Doctrines, Development and Literature","color": "#2a3a5a","author": "Christian D. Ginsburg","form": "TREATISE","kind": "prose","blurb": "The Sephiroth, the worlds and the soul; the history of the doctrine; and an account of the Zohar and the other Kabbalistic books."},"text": {"title": "The Kabbalah: Its Doctrines, Development and Literature","translator": "Original text (1865)","lang": "eng","short": "Original text"}},{"meta": {"key": "waite-key-to-the-tarot","en": "The Illustrated Key to the Tarot","color": "#5a2a3a","author": "A. E. Waite","form": "TREATISE","kind": "prose","blurb": "The veil and its symbols: the history of the cards, the doctrine behind the Greater Arcana, and the meanings and methods of divination."},"text": {"title": "The Illustrated Key to the Tarot","translator": "Original text (1918 ed.)","lang": "eng","short": "Original text"}},{"meta": {"key": "waite-lives-of-alchemystical-philosophers","en": "Lives of Alchemystical Philosophers","color": "#5a2a3a","author": "A. E. Waite","form": "BIOGRAPHY","kind": "prose","blurb": "From Geber and Rhasis to Flamel, Paracelsus and the adepts of the seventeenth century, with an essay on the true principles of the Great Work."},"text": {"title": "Lives of Alchemystical Philosophers","translator": "Original text (1888)","lang": "eng","short": "Original text"}},{"meta": {"key": "godwin-lives-of-the-necromancers","en": "Lives of the Necromancers","color": "#3a3a3a","author": "William Godwin","form": "BIOGRAPHY","kind": "prose","blurb": "An account of those who claimed, or were charged with, magical power, from the ancient East and Greece to Faustus, Dee and the witch trials."},"text": {"title": "Lives of the Necromancers","translator": "Original text (1834)","lang": "eng","short": "Original text"}},{"meta": {"key": "thorndike-place-of-magic","en": "The Place of Magic in the Intellectual History of Europe","color": "#3a4a4a","author": "Lynn Thorndike","form": "HISTORY","kind": "prose","blurb": "How far magic entered the science and learning of the Roman Empire: Pliny, Seneca, Ptolemy, Galen and the philosophers."},"text": {"title": "The Place of Magic in the Intellectual History of Europe","translator": "Original text (1905)","lang": "eng","short": "Original text"}},{"meta": {"key": "dee-private-diary","en": "The Private Diary of Dr. John Dee","color": "#2a4a4a","author": "John Dee","form": "HISTORY","kind": "prose","blurb": "The Elizabethan mathematician and magus in his own notes, 1554–1601, with the catalogue of his library of manuscripts."},"text": {"title": "The Private Diary of Dr. John Dee","translator": "J. O. Halliwell (ed., 1842)","lang": "eng","short": "J. O. Halliwell"}},{"meta": {"key": "lilly-life-and-times","en": "History of His Life and Times","color": "#4a3a5a","author": "William Lilly","form": "BIOGRAPHY","kind": "prose","blurb": "The astrologer of the Civil War tells his own story, from servant to the most famous almanac-maker in England."},"text": {"title": "History of His Life and Times","translator": "Original text (1715)","lang": "eng","short": "Original text"}},{"meta": {"key": "sepharial-astrology","en": "Astrology: How to Make and Read Your Own Horoscope","color": "#2a2a5a","author": "Sepharial","form": "TREATISE","kind": "prose","blurb": "The signs, planets and houses, how to cast a figure of the heavens, and how to judge it."},"text": {"title": "Astrology: How to Make and Read Your Own Horoscope","translator": "Original text (1920 ed.)","lang": "eng","short": "Original text"}},{"meta": {"key": "culpeper-complete-herbal","en": "The Complete Herbal","color": "#2a5a2a","author": "Nicholas Culpeper","form": "TREATISE","kind": "prose","blurb": "The English Physician: every herb with its planet, its virtues and its uses, with the directions for making syrups, oils and ointments."},"text": {"title": "The Complete Herbal","translator": "Original text (1653; 1850 ed.)","lang": "eng","short": "Original text"}},{"meta": {"key": "scot-discoverie-of-witchcraft","en": "The Discoverie of Witchcraft","color": "#3a2a1a","author": "Reginald Scot","form": "TREATISE","kind": "prose","blurb": "The first great English book against the witch-hunters: sixteen books on witches, conjurors, alchemists and jugglers, with the Discourse upon Devils and Spirits. In the spelling of 1584."},"text": {"title": "The Discoverie of Witchcraft","translator": "Original text (1584; ed. Nicholson 1886)","lang": "eng","short": "Original text"}},{"meta": {"key": "scott-demonology-and-witchcraft","en": "Letters on Demonology and Witchcraft","color": "#4a3a2a","author": "Sir Walter Scott","form": "LETTERS","kind": "prose","blurb": "Ten letters on the belief in spirits, fairies and witches, and on the witch trials of England, Scotland and New England."},"text": {"title": "Letters on Demonology and Witchcraft","translator": "Original text (1830)","lang": "eng","short": "Original text"}},{"meta": {"key": "summers-history-of-witchcraft","en": "The History of Witchcraft and Demonology","color": "#3a1a1a","author": "Montague Summers","form": "HISTORY","kind": "prose","blurb": "The witch as heretic, the Sabbat, familiars, possession and the witch in drama, by a writer who believed in what he described."},"text": {"title": "The History of Witchcraft and Demonology","translator": "Original text (1926)","lang": "eng","short": "Original text"}},{"meta": {"key": "blavatsky-isis-unveiled-1","en": "Isis Unveiled, Volume I: Science","color": "#2a2a4a","author": "H. P. Blavatsky","form": "TREATISE","kind": "prose","blurb": "A master-key to the mysteries of ancient and modern science: phenomena, magic and the old philosophies against the science of her day."},"text": {"title": "Isis Unveiled, Volume I: Science","translator": "Original text (1877)","lang": "eng","short": "Original text"}},{"meta": {"key": "blavatsky-isis-unveiled-2","en": "Isis Unveiled, Volume II: Theology","color": "#2a2a4a","author": "H. P. Blavatsky","form": "TREATISE","kind": "prose","blurb": "The churches, the Gnostics, the Kabbalah and the religions of India set side by side."},"text": {"title": "Isis Unveiled, Volume II: Theology","translator": "Original text (1877)","lang": "eng","short": "Original text"}},{"meta": {"key": "blavatsky-secret-doctrine-1","en": "The Secret Doctrine, Volume I: Cosmogenesis","color": "#2a3a4a","author": "H. P. Blavatsky","form": "TREATISE","kind": "prose","blurb": "The Stanzas of Dzyan on the birth of the cosmos, with the evolution of symbolism and the bearing of science."},"text": {"title": "The Secret Doctrine, Volume I: Cosmogenesis","translator": "Original text (3rd ed., 1893)","lang": "eng","short": "Original text"}},{"meta": {"key": "blavatsky-secret-doctrine-2","en": "The Secret Doctrine, Volume II: Anthropogenesis","color": "#2a3a4a","author": "H. P. Blavatsky","form": "TREATISE","kind": "prose","blurb": "The Stanzas on the origin of humanity and its races, the archaic symbolism of the world religions, and science contrasted."},"text": {"title": "The Secret Doctrine, Volume II: Anthropogenesis","translator": "Original text (3rd ed., 1893)","lang": "eng","short": "Original text"}},{"meta": {"key": "blavatsky-secret-doctrine-3","en": "The Secret Doctrine, Volume III","color": "#2a3a4a","author": "H. P. Blavatsky","form": "TREATISE","kind": "prose","blurb": "Papers gathered after her death: the adepts, the mysteries, and the teaching on occult study."},"text": {"title": "The Secret Doctrine, Volume III","translator": "Annie Besant (ed., 1897)","lang": "eng","short": "Annie Besant"}},{"meta": {"key": "blavatsky-key-to-theosophy","en": "The Key to Theosophy","color": "#2a3a4a","author": "H. P. Blavatsky","form": "DIALOGUE","kind": "prose","blurb": "Theosophy explained by question and answer: its ethics, science and philosophy, karma, reincarnation and the states after death."},"text": {"title": "The Key to Theosophy","translator": "Original text (1889)","lang": "eng","short": "Original text"}},{"meta": {"key": "steiner-outline-of-occult-science","en": "An Outline of Occult Science","color": "#3a2a5a","author": "Rudolf Steiner","form": "TREATISE","kind": "prose","blurb": "The nature of man, sleep and death, the evolution of the world, and the path to knowledge of higher worlds."},"text": {"title": "An Outline of Occult Science","translator": "Authorized translation (1922)","lang": "eng","short": "Authorized translation"}},{"meta": {"key": "steiner-mystics-of-the-renaissance","en": "Mystics of the Renaissance","color": "#3a2a5a","author": "Rudolf Steiner","form": "HISTORY","kind": "prose","blurb": "Eckhart, Tauler, Suso, Ruysbroeck, Nicholas of Cusa, Agrippa, Paracelsus, Weigel, Boehme, Bruno and Angelus Silesius, and their relation to modern thought."},"text": {"title": "Mystics of the Renaissance","translator": "Bertram Keightley (1911)","lang": "eng","short": "Bertram Keightley"}}]}</script>
