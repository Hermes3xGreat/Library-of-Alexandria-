<script id="hermes-manifest" type="application/json">{"type": "hermes-manifest","version": 1,"books": [{"meta": {"key": "book-of-the-dead","en": "The Book of the Dead","gr": "PERT EM HRU","color": "#8a5a1e","author": "Ancient Egypt","form": "SCRIPTURE","pdf": "pdfs/Ancient-Egypt/book-of-the-dead.pdf","blurb": "The spells the Egyptians wrote on papyrus and laid in the tomb to carry the dead safely through the Netherworld: the hymns to the rising and setting Sun, the chapters for keeping the heart and the name, for passing the gates and their keepers, for taking any form at will, the Field of Reeds, and chapter 125, the Judgement in the Hall of the Two Truths, where the heart is weighed against the feather of Maāt and the dead man declares the sins he has not committed. Peter Le Page Renouf’s translation, finished after his death by Édouard Naville (1904), with their notes, the hieroglyphs they cite, and all the vignettes from the papyri of Ani, Hunefer and others reproduced in their plates, each set at the head of the chapter it illustrates. The margin gives the chapter. Text from the Project Gutenberg edition, proofread by Distributed Proofreaders.","kind": "prose"},"text": {"title": "The Book of the Dead","greek": "THE CHAPTERS OF COMING FORTH BY DAY","subtitle": "The Chapters of Coming Forth by Day · with the vignettes · trans. P. Le Page Renouf and É. Naville","translator": "P. Le Page Renouf and Édouard Naville (1904)","lang": "eng","short": "Renouf–Naville","noSpeakerLabels": true,"reference": {"label": "Chapter","abbr": "","placeholder": "e.g. 125"}}},{"meta": {"key": "hermes-emerald-tablet","en": "The Emerald Tablet","gr": "ΣΜΑΡΑΓΔΙΝΗ ΠΛΑΞ","color": "#1a6e4a","author": "Hermes Trismegistus","kind": "treatise","pdf": "pdfs/Hermes-Trismegistus/The-Emerald-Tablet.pdf","blurb": "Hermes Trismegistus's cryptic Hermetic text — known for the maxim \"as above, so below\" — presented in its Latin vulgate alongside the principal historic English renderings: from the twe ": "The Perfect Discourse of Hermes Trismegistus, the longest Hermetic writing, surviving whole only in this Latin version handed down with Apuleius. Hermes speaks of the one who is all, of the gods men call into statues, and of the day they leave Egypt. A new English translation, with the Latin as companion.","transPair": {"a": "hermes-asclepius","b": "hermes-asclepius-b"},"transSelf": "a"},"text": {"title": "Asclepius","greek": "HERMETIS TRISMEGISTI ASCLEPIUS","subtitle": "The Perfect Discourse · a new translation from the Latin","translator": "Claude AI","lang": "eng","short": "English","noSpeakerLabels": true,"transPair": {"a": "hermes-asclepius","b": "hermes-asclepius-b"},"transSelf": "a","reference": {"label": "Chapter","abbr": "ch.","placeholder": "e.g. 24"},"parMirror": "hermes-asclepius"}},{"meta": {"key": "hermes-asclepius-b","en": "Asclepius","kind": "dialogue","gr": "ASCLEPIUS","color": "#5a4326","author": "Hermes Trismegistus","hidden": true,"form": "DIALOGUE","pdf": "pdfs/Hermes-Trismegistus/Asclepius-Latin.pdf","transPair": {"a": "hermes-asclepius","b": "hermes-asclepius-b"},"transSelf": "b"},"text": {"title": "Asclepius","greek": "HERMETIS TRISMEGISTI ASCLEPIUS","translator": "Latin text","lang": "lat","short": "Latin","noSpeakerLabels": true,"transPair": {"a": "hermes-asclepius","b": "hermes-asclepius-b"},"transSelf": "b","parMirror": "hermes-asclepius","reference": {"label": "Chapter","abbr": "ch.","placeholder": "e.g. 24"}}},{"meta": {"key": "hermes-stobaeus","en": "The Hermetic Excerpts of Stobaeus","kind": "treatise","gr": "ΕΡΜΟΥ ΕΚ ΤΩΝ ΣΤΟΒΑΙΟΥ","color": "#4a3a5a","author": "Hermes Trismegistus","form": "EXCERPTS","pdf": "pdfs/Hermes-Trismegistus/The-Hermetic-Excerpts-of-Stobaeus.pdf","blurb": "The Hermetic writings that survive only because John of Stobi copied them into his fifth-century Anthology: twenty-nine excerpts from the discourses of Hermes to Tat and Ammon, and those of Isis to Horus, among them the Korē Kosmou, the myth of the fall of souls. A new English translation, with the Greek as companion.","transPair": {"a": "hermes-stobaeus","e": "hermes-stobaeus-e"},"transSelf": "a"},"text": {"title": "The Hermetic Excerpts of Stobaeus","greek": "ΕΡΜΟΥ ΤΡΙΣΜΕΓΙΣΤΟΥ ΕΚ ΤΩΝ ΣΤΟΒΑΙΟΥ","subtitle": "Stobaei Hermetica I–XXIX, with the Korē Kosmou · a new translation from the Greek","translator": "Claude AI","lang": "eng","short": "English","noSpeakerLabels": true,"transPair": {"a": "hermes-stobaeus","e": "hermes-stobaeus-e"},"transSelf": "a","reference": {"label": "Excerpt.section","abbr": "","placeholder": "e.g. 23.5"},"parMirror": "hermes-stobaeus"}},{"meta": {"key": "hermes-stobaeus-e","en": "The Hermetic Excerpts of Stobaeus","kind": "treatise","gr": "ΕΡΜΟΥ ΕΚ ΤΩΝ ΣΤΟΒΑΙΟΥ","color": "#4a3a5a","author": "Hermes Trismegistus","hidden": true,"form": "EXCERPTS","pdf": "pdfs/Hermes-Trismegistus/The-Hermetic-Excerpts-of-Stobaeus-Greek.pdf","transPair": {"a": "hermes-stobaeus","e": "hermes-stobaeus-e"},"transSelf": "e"},"text": {"title": "Ἑρμοῦ ἐκ τῶν Στοβαίου","greek": "ΕΡΜΟΥ ΤΡΙΣΜΕΓΙΣΤΟΥ ΕΚ ΤΩΝ ΣΤΟΒΑΙΟΥ","translator": "Greek text (Scott)","lang": "grc","short": "Greek","noSpeakerLabels": true,"transPair": {"a": "hermes-stobaeus","e": "hermes-stobaeus-e"},"transSelf": "e","parMirror": "hermes-stobaeus","reference": {"label": "Excerpt.section","abbr": "","placeholder": "e.g. 23.5"}}},{"meta": {"key": "egypt-papyrus-of-ani","en": "The Papyrus of Ani","color": "#8a5a1e","author": "Ancient Egypt","form": "SCRIPTURE","kind": "prose","blurb": "The Book of the Dead as written for the scribe Ani at Thebes about 1250 BC — the finest of the funerary papyri: hymns to the rising and setting Sun, the chapters for keeping the heart and the name, for the transformations, for sailing in the boat of Ra, and the Negative Confession before the gods of the Hall of Judgement. E. A. Wallis Budge’s translation of the Theban Recension, a second English voice beside Renouf and Naville.","gr": "PERT EM HRU"},"text": {"title": "The Papyrus of Ani","translator": "E. A. Wallis Budge (1895)","lang": "eng","short": "Budge"}},{"meta": {"key": "egypt-hymns-inscriptions","en": "Hymns, Inscriptions and Papyri","color": "#a0742a","author": "Ancient Egypt","form": "HYMN","kind": "prose","blurb": "The voice of Egypt’s temples and courts: the Great Tablet of Rameses II at Abu Simbel, the Hymn to the Nile, hymns to Osiris, Amen and Ra-Harmachis, the Song of the Harper, the Lamentations of Isis and Nephthys, the Litany of Ra, the Book of Respirations, the travels of an Egyptian scribe and the epic of Penta-Our on the battle of Kadesh — in the translations of the nineteenth-century Egyptologists, as gathered by Epiphanius Wilson (1901)."},"text": {"title": "Hymns, Inscriptions and Papyri","translator": "Naville, Chabas, Goodwin, Birch, Cook, Lushington and others (1901 edition)","lang": "eng","short": "Various"}},{"meta": {"key": "egypt-tales","en": "Egyptian Tales","color": "#6f7f3a","author": "The Scribes of Egypt","form": "NOVEL","kind": "prose","blurb": "The oldest stories in the world, copied by the scribes on papyrus: the Shipwrecked Sailor and the serpent of the island, the Adventures of Sanehat, the Doomed Prince, Anpu and Bata, the Tales of the Magicians at the court of Khufu, Setna and the magic book of Thoth, the Peasant’s eloquent complaint, and the taking of Joppa — as edited by Flinders Petrie."},"text": {"title": "Egyptian Tales","translator": "W. M. Flinders Petrie (ed., 1895–99)","lang": "eng","short": "Petrie"}},{"meta": {"key": "ptahhotep-instruction","en": "The Instruction of Ptah-hotep","color": "#7a4b2a","author": "Ptahhotep","form": "TREATISE","kind": "prose","blurb": "“Be not proud because thou art learned.” The counsels of the vizier Ptah-hotep to his son — on fair speech, humility, justice, friendship and the household — long called the oldest book in the world, with the shorter Instruction of Ke’Gemni and the Instruction of King Amenemhe’et to his son. Battiscombe Gunn’s translation, cited by maxim."},"text": {"title": "The Instruction of Ptah-hotep","translator": "Battiscombe G. Gunn (1906)","lang": "eng","short": "Gunn","reference": {"label": "Maxim","abbr": "","placeholder": "e.g. 1"}}},{"meta": {"key": "murray-egyptian-legends","en": "Ancient Egyptian Legends","color": "#4e6e8a","author": "Margaret Murray","form": "FABLES","kind": "prose","blurb": "The legends of the gods retold from the papyri and temple walls by the Egyptologist Margaret Murray: Osiris, the scorpions of Isis, the battles of Horus, the secret name of Ra, the Book of Thoth, the beer of Heliopolis that saved mankind, and the journey of the Sun through the regions of night."},"text": {"title": "Ancient Egyptian Legends","translator": "Margaret A. Murray (1913)","lang": "eng","short": "Murray"}},{"meta": {"key": "budge-legends-of-the-gods","en": "Legends of the Gods","color": "#9a6a2a","author": "Ancient Egypt","form": "SCRIPTURE","kind": "prose","blurb": "The Egyptian myths in the words of the papyri and temple walls: the Book of Knowing the Evolutions of Ra and the creation of the world, the Destruction of Mankind by the Eye of Ra, Ra and Isis and the secret name, Horus of Behutet and the Winged Disk, the death of Horus by the scorpion’s sting, and the history of Isis and Osiris. Budge’s translations."},"text": {"title": "Legends of the Gods","translator": "E. A. Wallis Budge (1912)","lang": "eng","short": "Budge"}},{"meta": {"key": "budge-literature-egyptians","en": "The Literature of the Ancient Egyptians","color": "#16706b","author": "E. A. Wallis Budge","form": "HISTORY","kind": "prose","blurb": "A survey in the Egyptians’ own words: the Pyramid Texts, tales of the magicians, the Book of the Dead and the books of the underworld, hymns to the gods, moral precepts, the love songs, and the travels of Sinuhe and Unamūn — each with long translated extracts."},"text": {"title": "The Literature of the Ancient Egyptians","translator": "E. A. Wallis Budge (1914)","lang": "eng","short": "E. A. Wallis Budge"}},{"meta": {"key": "budge-future-life","en": "Egyptian Ideas of the Future Life","color": "#1a5a5a","author": "E. A. Wallis Budge","form": "HISTORY","kind": "prose","blurb": "What the Egyptians believed about God, Osiris and the resurrection, the judgment of the dead in the Hall of Maat, and immortality — told through the funerary texts."},"text": {"title": "Egyptian Ideas of the Future Life","translator": "E. A. Wallis Budge (1900)","lang": "eng","short": "E. A. Wallis Budge"}},{"meta": {"key": "petrie-religion-egypt","en": "The Religion of Ancient Egypt","color": "#5a4a2a","author": "W. M. Flinders Petrie","form": "HISTORY","kind": "prose","blurb": "A short, clear account by the great excavator: the nature of the gods, the soul and its parts, animal worship, the cosmic and human gods, ritual, priesthood and the sacred books."},"text": {"title": "The Religion of Ancient Egypt","translator": "W. M. Flinders Petrie (1906)","lang": "eng","short": "W. M. Flinders Petrie"}},{"meta": {"key": "weigall-akhnaton","en": "The Life and Times of Akhnaton","color": "#7a5a1a","author": "Arthur Weigall","form": "HISTORY","kind": "prose","blurb": "The pharaoh who swept away the old gods for the one Aten: his parents, the new city at Amarna, the great Hymn to the Aten, and the fall of his religion."},"text": {"title": "The Life and Times of Akhnaton","translator": "Arthur Weigall (1910)","lang": "eng","short": "Arthur Weigall"}}]}</script>
