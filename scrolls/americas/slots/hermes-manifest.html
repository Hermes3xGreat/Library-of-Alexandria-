<script id="hermes-manifest" type="application/json">{"type": "hermes-manifest","version": 1,"books": [{"meta": {"key": "popol-vuh","en": "The Popol Vuh","color": "#8a5a2a","author": "The Popol Vuh","form": "SCRIPTURE","kind": "prose","blurb": "The sacred book of the K’iche’ Maya: the making of the world and the failed first peoples of mud and wood, the downfall of the proud Vukub-Cakix, the Hero Twins Hunahpu and Xbalanque and their contest with the lords of Xibalba, and the origin of the K’iche’ nations. Lewis Spence’s account and translation."},"text": {"title": "The Popol Vuh","translator": "Lewis Spence (1908)","lang": "eng","short": "Spence"}},{"meta": {"key": "spence-myths-mexico-peru","en": "The Myths of Mexico and Peru","color": "#7a4a2a","author": "Lewis Spence","form": "HISTORY","kind": "prose","blurb": "The gods, temples, calendars and myths of the Aztecs, the Maya and the Incas — Quetzalcoatl and Tezcatlipoca, the Popol Vuh, the coming of Manco Capac — with the old hymns and legends retold."},"text": {"title": "The Myths of Mexico and Peru","translator": "Lewis Spence (1913)","lang": "eng","short": "Spence"}},{"meta": {"key": "columbus-letters","en": "The Life of Columbus, from His Own Letters","color": "#3a5a7a","author": "Christopher Columbus","form": "LETTERS","kind": "prose","blurb": "The voyages of discovery told in Columbus’s own letters and journals: the plan, the first landfall in the Indies, the return to Spain, the later voyages and the admiral’s chains."},"text": {"title": "The Life of Columbus, from His Own Letters","translator": "Edward Everett Hale (ed., 1891)","lang": "eng","short": "Hale"}},{"meta": {"key": "diaz-conquest-1","en": "The Conquest of New Spain, Volume I","color": "#7a3a2a","author": "Bernal Díaz del Castillo","form": "HISTORY","kind": "prose","blurb": "A soldier of Cortés tells the conquest of Mexico as he saw it: the first expeditions, the landing at Vera Cruz, the march inland, Tlaxcala, and the first sight of Tenochtitlan and Montezuma."},"text": {"title": "The Conquest of New Spain, Volume I","translator": "John Ingram Lockhart (1844)","lang": "eng","short": "Lockhart"}},{"meta": {"key": "diaz-conquest-2","en": "The Conquest of New Spain, Volume II","color": "#7a3a2a","author": "Bernal Díaz del Castillo","form": "HISTORY","kind": "prose","blurb": "The Noche Triste, the siege and fall of Tenochtitlan, the death of Cuauhtemoc, and the later years of New Spain, in Bernal Díaz’s own words."},"text": {"title": "The Conquest of New Spain, Volume II","translator": "John Ingram Lockhart (1844)","lang": "eng","short": "Lockhart"}},{"meta": {"key": "prescott-peru","en": "History of the Conquest of Peru","color": "#6a5a2a","author": "William H. Prescott","form": "HISTORY","kind": "prose","blurb": "The empire of the Incas — its government, religion and roads — and its overthrow by Pizarro: Atahualpa at Cajamarca, the ransom room, the civil wars of the conquerors. Prescott’s classic history."},"text": {"title": "History of the Conquest of Peru","translator": "William H. Prescott (1847)","lang": "eng","short": "Prescott"}},{"meta": {"key": "iroquois-book-of-rites","en": "The Iroquois Book of Rites","color": "#4a6a3a","author": "The Iroquois League","form": "SCRIPTURE","kind": "prose","blurb": "The Condolence Council of the Five Nations — “At the Wood’s Edge”, the roll call of the founders of the League, and the hymns of mourning and raising up of a new chief — in Hale’s English translation of the Canienga and Onondaga books."},"text": {"title": "The Iroquois Book of Rites","translator": "Horatio Hale (1883)","lang": "eng","short": "Hale","reference": {"label": "Paragraph","abbr": "","placeholder": "e.g. 1"}}},{"meta": {"key": "cherokee-myths","en": "Myths of the Cherokee","color": "#5a6a2a","author": "The Cherokee","form": "SCRIPTURE","kind": "prose","blurb": "How the World Was Made, the First Fire, Kana’ti and Selu, the origin of disease and medicine, the Uktena and the Nunnehi — the sacred myths, animal stories and local legends of the Cherokee, gathered by James Mooney."},"text": {"title": "Myths of the Cherokee","translator": "James Mooney (1900)","lang": "eng","short": "Mooney"}},{"meta": {"key": "cherokee-sacred-formulas","en": "The Sacred Formulas of the Cherokees","color": "#5a6a2a","author": "The Cherokee","form": "SCRIPTURE","kind": "prose","blurb": "The healing, hunting and love formulas from the Swimmer manuscript, in Mooney’s translation."},"text": {"title": "The Sacred Formulas of the Cherokees","translator": "James Mooney (1891)","lang": "eng","short": "Mooney"}},{"meta": {"key": "navaho-legends","en": "Navaho Legends","color": "#7a5a3a","author": "The Navaho","form": "SCRIPTURE","kind": "prose","blurb": "The Navaho origin legend — the emergence through the four worlds, Changing Woman and the War Gods who slew the monsters — and the other sacred stories, as told to Washington Matthews."},"text": {"title": "Navaho Legends","translator": "Washington Matthews (1897)","lang": "eng","short": "Matthews"}},{"meta": {"key": "midewiwin","en": "The Midē’wiwin","color": "#4a5a6a","author": "The Ojibwa","form": "SCRIPTURE","kind": "prose","blurb": "The Grand Medicine Society of the Ojibwa: its origin myth, the four degrees of initiation, the chants and the birch-bark records, as observed by Walter Hoffman."},"text": {"title": "The Midē’wiwin","translator": "Walter James Hoffman (1891)","lang": "eng","short": "Hoffman"}},{"meta": {"key": "algonquin-legends","en": "Algonquin Legends of New England","color": "#3a5a5a","author": "The Algonquin","form": "NOVEL","kind": "prose","blurb": "Glooskap the divinity, Lox the mischief-maker, Master Rabbit, the Chenoo and the witches of the Passamaquoddy, Micmac and Penobscot, collected by Charles Leland."},"text": {"title": "Algonquin Legends of New England","translator": "Charles G. Leland (1884)","lang": "eng","short": "Leland"}},{"meta": {"key": "schoolcraft-hiawatha","en": "The Myth of Hiawatha","color": "#5a5a3 erature of the Hopi","translator": "Hattie Greene Lockett (1933)","lang": "eng","short": "Lockett"}},{"meta": {"key": "zuni-creation-myths","en": "Outlines of Zuñi Creation Myths","color": "#8a4a2a","author": "The Zuñi","form": "SCRIPTURE","kind": "prose","blurb": "The genesis of the worlds and of men among the Zuñi: Awonawilona, the four wombs of the earth, the forthcoming of men, the search for the Middle Place."},"text": {"title": "Outlines of Zuñi Creation Myths","translator": "Frank Hamilton Cushing (1896)","lang": "eng","short": "Cushing"}},{"meta": {"key": "zuni-folk-tales","en": "Zuñi Folk Tales","color": "#8a4a2a","author": "The Zuñi","form": "NOVEL","kind": "prose","blurb": "The Trial of Lovers, the Poor Turkey Girl, the Youth and his Eagle and many more, told to Cushing during his years at Zuñi."},"text": {"title": "Zuñi Folk Tales","translator": "Frank Hamilton Cushing (1901)","lang": "eng","short": "Cushing"}},{"meta": {"key": "eskimo-folk-tales","en": "Eskimo Folk-Tales","color": "#3a5a6a","author": "The Inuit","form": "NOVEL","kind": "prose","blurb": "Greenland tales gathered by Knud Rasmussen: the Coming of Men, Qujavarssuk, the woman who had a bear as a foster-son, and other stories of the Arctic."},"text": {"title": "Eskimo Folk-Tales","translator": "Knud Rasmussen (ed., 1921)","lang": "eng","short": "Rasmussen"}},{"meta": {"key": "tlingit-myths","en": "Tlingit Myths and Texts","color": "#2a4a5a","author": "The Tlingit","form": "SCRIPTURE","kind": "prose","blurb": "Raven the creator and trickster, the Land-Otter people, the Wolf-Chief’s son — the myths of the Tlingit of southeast Alaska, recorded by John Swanton."},"text": {"title": "Tlingit Myths and Texts","translator": "John R. Swanton (1909)","lang": "eng","short": "Swanton"}}]}</script>
