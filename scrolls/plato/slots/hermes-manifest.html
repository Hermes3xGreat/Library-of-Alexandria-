ias","hidden":true,"form":"ORATION","pdf":"pdfs/Lysias/lysias-speeches-Greek.pdf","transPair":{"a":"lysias-speeches","e":"lysias-speeches-e"},"transSelf":"e","kind":"prose"},"text":{"title":"Λόγοι","greek":"ΛΥΣΙΟΥ ΛΟΓΟΙ","translator":"Greek text (Lamb)","lang":"grc","short":"Greek","transPair":{"a":"lysias-speeches","e":"lysias-speeches-e"},"transSelf":"e","noSpeakerLabels":true,"parMirror":"lysias-speeches","reference":{"label":"Speech.section","abbr":"Lys.","placeholder":"e.g. 12.4"}}},{"meta":{"key":"isocrates-peace","en":"On the Peace","kind":"oration","gr":"ΠΕΡΙ ΕΙΡΗΝΗΣ","color":"#3f5a3a","author":"Isocrates","form":"ORATION","pdf":"pdfs/Isocrates/On-the-Peace.pdf","blurb":"Isocrates' eighth oration, written in 355 BCE as the Social War ended, cast as a speech to the Athenian assembly. It urges Athens to make peace with all mankind and give up the dream of empire by sea, which ruined the city once and ruins it again. Norlin's translation, with the Greek as companion.","transPair":{"a":"isocrates-peace","e":"isocrates-peace-e"},"transSelf":"a"},"text":{"title":"On the Peace","greek":"ΙΣΟΚΡΑΤΟΥΣ ΠΕΡΙ ΕΙΡΗΝΗΣ","subtitle":"De pace · Oration 8 · trans. George Norlin","translator":"George Norlin","lang":"eng","short":"Norlin","noSpeakerLabels":true,"transPair":{"a":"isocrates-peace","e":"isocrates-peace-e"},"transSelf":"a","reference":{"label":"Section","abbr":"§","placeholder":"e.g. 89"},"parMirror":"isocrates-peace"}},{"meta":{"key":"isocrates-peace-e","en":"On the Peace","kind":"oration","gr":"ΠΕΡΙ ΕΙΡΗΝΗΣ","color":"#3f5a3a","author":"Isocrates","hidden":true,"form":"ORATION","pdf":"pdfs/Isocrates/On-the-Peace-Greek.pdf","transPair":{"a":"isocrates-peace","e":"isocrates-peace-e"},"transSelf":"e"},"text":{"title":"Περὶ εἰρήνης","greek":"ΙΣΟΚΡΑΤΟΥΣ ΠΕΡΙ ΕΙΡΗΝΗΣ","translator":"Greek text (Norlin)","lang":"grc","short":"Greek","noSpeakerLabels":true,"transPair":{"a":"isocrates-peace","e":"isocrates-peace-e"},"transSelf":"e","parMirror":"isocrates-peace","reference":{"label":"Section","abbr":"§","placeholder":"e.g. 89"}}},{"meta":{"key":"isocrates-orations-1","en":"Orations, Volume I: To Demonicus, To Nicocles, Nicocles, Panegyricus, To Philip, Archidamus","gr":"ΛΟΓΟΙ, ΤΟΜΟΣ Αʹ","color":"#2f4a45","author":"Isocrates","form":"ORATION","pdf":"pdfs/Isocrates/isocrates-orations-1.pdf","blurb":"Six discourses of the Athenian teacher of rhetoric, as arranged in the first volume of George Norlin's Loeb edition. To Demonicus is a string of moral precepts for a young man; To Nicocles and Nicocles, addressed to and written for the young king of Salamis in Cyprus, set out the duties of a ruler and of his subjects. The Panegyricus (380 B.C.) calls on Athens and Sparta to end their rivalry and lead the Greeks against Persia, and gives the fullest statement of the Athenian claim to leadership; To Philip (346 B.C.) puts the same plan before the king of Macedon; in the Archidamus a Spartan prince argues against giving up Messene. Norlin's translation of 1928 with its notes, and his Greek text as companion; the margin gives oration and section.","kind":"prose","transPair":{"a":"isocrates-orations-1","e":"isocrates-orations-1-e"},"transSelf":"a"},"text":{"title":"Orations, Volume I: To Demonicus, To Nicocles, Nicocles, Panegyricus, To Philip, Archidamus","greek":"ΙΣΟΚΡΑΤΟΥΣ ΛΟΓΟΙ, ΤΟΜΟΣ Αʹ","subtitle":"Logoi · six discourses of advice and of Panhellenic policy (Orations 1–6) · trans. George Norlin","translator":"George Norlin (1928)","lang":"eng","short":"Norlin","transPair":{"a":"isocrates-orations-1","e":"isocrates-orations-1-e"},"transSelf":"a","noSpeakerLabels":true,"reference":{"label":"Oration.section","abbr":"Isoc.","placeholder":"e.g. 4.50"},"parMirror":"isocrates-orations-1"}},{"meta":{"key":"isocrates-orations-1-e","en":"Orations, Volume I: To Demonicus, To Nicocles, Nicocles, Panegyricus, To Philip, Archidamus","gr":"ΛΟΓΟΙ, ΤΟΜΟΣ Αʹ","color":"#2f4a45","author":"Isocrates","hidden":true,"form":"ORATION","pdf":"pdfs/Isocrates/isocrates-orations-1-Greek.pdf","transPair":{"a":"isocrates-orations-1","e":"isocrates-orations-1-e"},"transSelf":"e","kind":"prose"},"text":{"title":"Λόγοι, τόμος Αʹ","greek":"ΙΣΟΚΡΑΤΟΥΣ ΛΟΓΟΙ, ΤΟΜΟΣ Αʹ","translator":"Greek text (Norlin)","lang":"grc","short":"Greek","transPair":{"a":"isocrates-orations-1","e":"isocrates-orations-1-e"},"transSelf":"e","noSpeakerLabels":true,"parMirror":"isocrates-orations-1","reference":{"label":"Oration.section","abbr":"Isoc.","placeholder":"e.g. 4.50"}}},{"meta":{"key":"isocrates-orations-2","en":"Orations, Volume II: Areopagiticus, Against the Sophists, Antidosis, Panathenaicus","gr":"ΛΟΓΟΙ, ΤΟΜΟΣ Βʹ","color":"#4a2f3a","author":"Isocrates","form":"ORATION","pdf":"pdfs/Isocrates/isocrates-orations-2.pdf","blurb":"Four discourses from the second volume of George Norlin's Loeb edition, in the order he prints them. The Areopagiticus argues for a return to the democracy of Solon and Cleisthenes, with the council of the Areopagus as guardian of conduct. Against the Sophists, a fragment from the opening of his school about 390 B.C., marks off his teaching from that of the eristics and the writers of handbooks. The Antidosis (354–353 B.C.), cast as a defence in an imaginary trial, is his account of his life, his pupils and his idea of education as philosophy, with long passages read out from his earlier works. The Panathenaicus, finished in his ninety-eighth year, praises Athens against Sparta. Norlin's translation of 1929 with its notes, and his Greek text as companion; the margin gives oration and section. On the Peace, also in that volume, stands separately in the library.","kind":"prose","transPair":{"a":"isocrates-orations-2","e":"isocrates-orations-2-e"},"transSelf":"a"},"text":{"title":"Orations, Volume II: Areopagiticus, Against the Sophists, Antidosis, Panathenaicus","greek":"ΙΣΟΚΡΑΤΟΥΣ ΛΟΓΟΙ, ΤΟΜΟΣ Βʹ","subtitle":"Logoi · Athens and its constitution, and Isocrates on his own teaching (Orations 7, 13, 15, 12) · trans. George Norlin","translator":"George Norlin (1929)","lang":"eng","short":"Norlin","transPair":{"a":"isocrates-orations-2","e":"isocrates-orations-2-e"},"transSelf":"a","noSpeakerLabels":true,"reference":{"label":"Oration.section","abbr":"Isoc.","placeholder":"e.g. 15.180"},"parMirror":"isocrates-orations-2"}},{"meta":{"key":"isocrates-orations-2-e","en":"Orations, Volume II: Areopagiticus, Against the Sophists, Antidosis, Panathenaicus","gr":"ΛΟΓΟΙ, ΤΟΜΟΣ Βʹ","color":"#4a2f3a","author":"Isocrates","hidden":true,"form":"ORATION","pdf":"pdfs/Isocrates/isocrates-orations-2-Greek.pdf","transPair":{"a":"isocrates-orations-2","e":"isocrates-orations-2-e"},"transSelf":"e","kind":"prose"},"text":{"title":"Λόγοι, τόμος Βʹ","greek":"ΙΣΟΚΡΑΤΟΥΣ ΛΟΓΟΙ, ΤΟΜΟΣ Βʹ","translator":"Greek text (Norlin)","lang":"grc","short":"Greek","transPair":{"a":"isocrates-orations-2","e":"isocrates-orations-2-e"},"transSelf":"e","noSpeakerLabels":true,"parMirror":"isocrates-orations-2","reference":{"label":"Oration.section","abbr":"Isoc.","placeholder":"e.g. 15.180"}}},{"meta":{"key":"isocrates-orations-3","en":"Orations, Volume III: Evagoras, Helen, Busiris, Plataicus, Concerning the Team of Horses, Trapeziticus, Against Callimachus, Aegineticus, Against Lochites, Against Euthynus, and the Letters","gr":"ΛΟΓΟΙ, ΤΟΜΟΣ Γʹ","color":"#3b3f2a","author":"Isocrates","form":"ORATION","pdf":"pdfs/Isocrates/isocrates-orations-3.pdf","blurb":"The third volume of the Loeb Isocrates, as arranged by La Rue Van Hook. Evagoras, the first prose encomium of a contemporary, praises the dead king of Salamis in Cyprus; Helen and Busiris are display pieces on mythical subjects that correct the treatments of rival sophists; the Plataicus pleads for the Plataeans after the Theban destruction of their city in 373 B.C. Six forensic speeches from his early career as a writer for the courts follow — Concerning the Team of Horses, Trapeziticus, Against Callimachus, Aegineticus, Against Lochites and Against Euthynus — and then the nine Letters, to Dionysius, Philip, Antipater, Alexander, Timotheus, Archidamus and others. Van Hook's translation of 1945 with its notes, and his Greek text as companion; the margin gives oration and section, the Letters as ep1–ep9.","kind":"prose","transPair":{"a":"isocrates-orations-3","e":"isocrates-orations-3-e"},"transSelf":"a"},"text":{"title":"Orations, Volume III: Evagoras, Helen, Busiris, Plataicus, Concerning the Team of Horses, Trapeziticus, Against Callimachus, Aegineticus, Against Lochites, Against Euthynus, and the Letters","greek":"ΙΣΟΚΡΑΤΟΥΣ ΛΟΓΟΙ ΚΑΙ ΕΠΙΣΤΟΛΑΙ, ΤΟΜΟΣ Γʹ","subtitle":"Logoi kai Epistolai · encomia, forensic speeches (Orations 9–11, 14, 16–21) and the nine Letters · trans. La Rue Van Hook","translator":"La Rue Van Hook (1945)","lang":"eng","short":"Van Hook","transPair":{"a":"isocrates-orations-3","e":"isocrates-orations-3-e"},"transSelf":"a","noSpeakerLabels":true,"reference":{"label":"Oration.section (Letters: ep1–ep9)","abbr":"Isoc.","placeholder":"e.g. 9.12 or ep2.5"},"parMirror":"isocrates-orations-3"}},{"meta":{"key":"isocrates-orations-3-e","en":"Orations, Volume III: Evagoras, Helen, Busiris, Plataicus, Concerning the Team of Horses, Trapeziticus, Against Callimachus, Aegineticus, Against Lochites, Against Euthynus, and the Letters","gr":"ΛΟΓΟΙ, ΤΟΜΟΣ Γʹ","color":"#3b3f2a","author":"Isocrates","hidden":true,"form":"ORATION","pdf":"pdfs/Isocrates/isocrates-orations-3-Greek.pdf","transPair":{"a":"isocrates-orations-3","e":"isocrates-orations-3-e"},"transSelf":"e","kind":"prose"},"text":{"title":"Λόγοι, τόμος Γʹ","greek":"ΙΣΟΚΡΑΤΟΥΣ ΛΟΓΟΙ ΚΑΙ ΕΠΙΣΤΟΛΑΙ, ΤΟΜΟΣ Γʹ","translator":"Greek text (Van Hook)","lang":"grc","short":"Greek","transPair":{"a":"isocrates-orations-3","e":"isocrates-orations-3-e"},"transSelf":"e","noSpeakerLabels":true,"parMirror":"isocrates-orations-3","reference":{"label":"Oration.section (Letters: ep1–ep9)","abbr":"Isoc.","placeholder":"e.g. 9.12 or ep2.5"}}},{"meta":{"key":"demosthenes-orations-1","en":"Public Orations (1–17, 20): Olynthiacs, Philippics and others","gr":"ΔΗΜΗΓΟΡΙΑΙ Α–ΙΖ · ΠΡΟΣ ΛΕΠΤΙΝΗΝ","color":"#3b4a5a","author":"Demosthenes","form":"ORATION","pdf":"pdfs/Demosthenes/demosthenes-orations-1.pdf","blurb":"The first seventeen speeches of the Demosthenic corpus, with the twentieth: the three Olynthiacs and four Philippics, On the Peace, On the Chersonese, the early speeches On the Navy-Boards, For the People of Megalopolis and For the Liberty of the Rhodians, and the court speech Against Leptines on immunity from public services. Several pieces transmitted with them are not by Demosthenes — On Halonnesus, the Answer to Philip’s Letter, Philip’s Letter itself, On Organization and On the Treaty with Alexander. J. H. Vince’s Loeb translation of 1930 with its footnotes, and the Greek of S. H. Butcher’s Oxford text as companion; each speech opens with its own heading, and the margin gives speech and section.","kind":"prose","transPair":{"a":"demosthenes-orations-1","e":"demosthenes-orations-1-e"},"transSelf":"a"},"text":{"title":"Public Orations (1–17, 20): Olynthiacs, Philippics and others","greek":"ΔΗΜΟΣΘΕΝΟΥΣ ΔΗΜΗΓΟΡΙΑΙ Α–ΙΖ · ΠΡΟΣ ΛΕΠΤΙΝΗΝ","subtitle":"Dēmēgoriai · the seventeen assembly speeches of the corpus and Against Leptines · trans. J. H. Vince","translator":"J. H. Vince (1930)","lang":"eng","short":"Vince","transPair":{"a":"demosthenes-orations-1","e":"demosthenes-orations-1-e"},"transSelf":"a","noSpeakerLabels":true,"reference":{"label":"Speech.section","abbr":"Dem.","placeholder":"e.g. 1.12"},"parMirror":"demosthenes-orations-1"}},{"meta":{"key":"demosthenes-orations-1-e","en":"Public Orations (1–17, 20): Olynthiacs, Philippics and others","gr":"ΔΗΜΗΓΟΡΙΑΙ Α–ΙΖ · ΠΡΟΣ ΛΕΠΤΙΝΗΝ","color":"#3b4a5a","author":"Demosthenes","hidden":true,"form":"ORATION","pdf":"pdfs/Demosthenes/demosthenes-orations-1-Greek.pdf","transPair":{"a":"demosthenes-orations-1","e":"demosthenes-orations-1-e"},"transSelf":"e","kind":"prose"},"text":{"title":"Δημηγορίαι Αʹ–ΙΖʹ· Πρὸς Λεπτίνην","gree r":{"a":"demosthenes-crown","e":"demosthenes-crown-e"},"transSelf":"e","kind":"prose"},"text":{"title":"Ὑπὲρ Κτησιφῶντος περὶ τοῦ στεφάνου","greek":"ΔΗΜΟΣΘΕΝΟΥΣ ΠΕΡΙ ΤΟΥ ΣΤΕΦΑΝΟΥ","translator":"Greek text (Butcher)","lang":"grc","short":"Greek","transPair":{"a":"demosthenes-crown","e":"demosthenes-crown-e"},"transSelf":"e","noSpeakerLabels":true,"parMirror":"demosthenes-crown","reference":{"label":"Speech.section","abbr":"Dem.","placeholder":"e.g. 18.12"}}},{"meta":{"key":"demosthenes-embassy","en":"On the False Embassy","gr":"ΠΕΡΙ ΤΗΣ ΠΑΡΑΠΡΕΣΒΕΙΑΣ","color":"#44503a","author":"Demosthenes","form":"ORATION","pdf":"pdfs/Demosthenes/demosthenes-embassy.pdf","blurb":"Demosthenes’ prosecution of Aeschines in 343 BC for misconduct on the second embassy to Philip of Macedon in 346, the mission that was to receive Philip’s oath to the Peace of Philocrates. Demosthenes charges his fellow envoy with false reports, with delay that allowed Philip to take Thrace and to pass Thermopylae, with the ruin of the Phocians, and with taking bribes; he quotes Solon and Sophocles against him. Aeschines’ reply survives, and he was acquitted by a narrow margin. The translation of C. A. Vince and J. H. Vince (Loeb, 1926), which entitles the speech On the Embassy, with its footnotes, and the Greek of S. H. Butcher’s Oxford text as companion; the margin gives speech and section (19.1–19.343) in the Oxford numbering.","kind":"prose","transPair":{"a":"demosthenes-embassy","e":"demosthenes-embassy-e"},"transSelf":"a"},"text":{"title":"On the False Embassy","greek":"ΔΗΜΟΣΘΕΝΟΥΣ ΠΕΡΙ ΤΗΣ ΠΑΡΑΠΡΕΣΒΕΙΑΣ","subtitle":"Peri tēs parapresbeias · prosecution of Aeschines, 343 BC · trans. C. A. & J. H. Vince","translator":"C. A. Vince and J. H. Vince (1926)","lang":"eng","short":"Vince","transPair":{"a":"demosthenes-embassy","e":"demosthenes-embassy-e"},"transSelf":"a","noSpeakerLabels":true,"reference":{"label":"Speech.section","abbr":"Dem.","placeholder":"e.g. 19.12"},"parMirror":"demosthenes-embassy"}},{"meta":{"key":"demosthenes-embassy-e","en":"On the False Embassy","gr":"ΠΕΡΙ ΤΗΣ ΠΑΡΑΠΡΕΣΒΕΙΑΣ","color":"#44503a","author":"Demosthenes","hidden":true,"form":"ORATION","pdf":"pdfs/Demosthenes/demosthenes-embassy-Greek.pdf","transPair":{"a":"demosthenes-embassy","e":"demosthenes-embassy-e"},"transSelf":"e","kind":"prose"},"text":{"title":"Περὶ τῆς παραπρεσβείας","greek":"ΔΗΜΟΣΘΕΝΟΥΣ ΠΕΡΙ ΤΗΣ ΠΑΡΑΠΡΕΣΒΕΙΑΣ","translator":"Greek text (Butcher)","lang":"grc","short":"Greek","transPair":{"a":"demosthenes-embassy","e":"demosthenes-embassy-e"},"transSelf":"e","noSpeakerLabels":true,"parMirror":"demosthenes-embassy","reference":{"label":"Speech.section","abbr":"Dem.","placeholder":"e.g. 19.12"}}},{"meta":{"key":"demosthenes-orations-2","en":"Orations 21–26: Against Meidias, Androtion, Aristocrates, Timocrates, Aristogeiton","gr":"ΚΑΤΑ ΜΕΙΔΙΟΥ · ΑΝΔΡΟΤΙΩΝΟΣ · ΑΡΙΣΤΟΚΡΑΤΟΥΣ · ΤΙΜΟΚΡΑΤΟΥΣ · ΑΡΙΣΤΟΓΕΙΤΟΝΟΣ","color":"#4a3b52","author":"Demosthenes","form":"ORATION","pdf":"pdfs/Demosthenes/demosthenes-orations-2.pdf","blurb":"Six speeches written for public prosecutions at Athens. Against Meidias concerns the blow Meidias struck Demosthenes in the theatre while he served as choregus at the Dionysia of 348; Against Androtion and Against Timocrates attack decrees and laws as unconstitutional, and Against Aristocrates a decree giving personal protection to the mercenary commander Charidemus, with a long account of the Athenian homicide courts. The two speeches Against Aristogeiton, on a politician prosecuted while a state debtor, are generally thought not to be by Demosthenes. J. H. Vince’s Loeb translation of 1935 with its footnotes, and the Greek of S. H. Butcher’s Oxford text as companion; the margin gives speech and section.","kind":"prose","transPair":{"a":"demosthenes-orations-2","e":"demosthenes-orations-2-e"},"transSelf":"a"},"text":{"title":"Orations 21–26: Against Meidias, Androtion, Aristocrates, Timocrates, Aristogeiton","greek":"ΔΗΜΟΣΘΕΝΟΥΣ ΚΑΤΑ ΜΕΙΔΙΟΥ · ΑΝΔΡΟΤΙΩΝΟΣ · ΑΡΙΣΤΟΚΡΑΤΟΥΣ · ΤΙΜΟΚΡΑΤΟΥΣ · ΑΡΙΣΤΟΓΕΙΤΟΝΟΣ","subtitle":"Kata Meidiou … Aristogeitonos · six speeches for public prosecutions · trans. J. H. Vince","translator":"J. H. Vince (1935)","lang":"eng","short":"Vince","transPair":{"a":"demosthenes-orations-2","e":"demosthenes-orations-2-e"},"transSelf":"a","noSpeakerLabels":true,"reference":{"label":"Speech.section","abbr":"Dem.","placeholder":"e.g. 21.12"},"parMirror":"demosthenes-orations-2"}},{"meta":{"key":"demosthenes-orations-2-e","en":"Orations 21–26: Against Meidias, Androtion, Aristocrates, Timocrates, Aristogeiton","gr":"ΚΑΤΑ ΜΕΙΔΙΟΥ · ΑΝΔΡΟΤΙΩΝΟΣ · ΑΡΙΣΤΟΚΡΑΤΟΥΣ · ΤΙΜΟΚΡΑΤΟΥΣ · ΑΡΙΣΤΟΓΕΙΤΟΝΟΣ","color":"#4a3b52","author":"Demosthenes","hidden":true,"form":"ORATION","pdf":"pdfs/Demosthenes/demosthenes-orations-2-Greek.pdf","transPair":{"a":"demosthenes-orations-2","e":"demosthenes-orations-2-e"},"transSelf":"e","kind":"prose"},"text":{"title":"Κατὰ Μειδίου, Ἀνδροτίωνος, Ἀριστοκράτους, Τιμοκράτους, Ἀριστογείτονος","greek":"ΔΗΜΟΣΘΕΝΟΥΣ ΚΑΤΑ ΜΕΙΔΙΟΥ · ΑΝΔΡΟΤΙΩΝΟΣ · ΑΡΙΣΤΟΚΡΑΤΟΥΣ · ΤΙΜΟΚΡΑΤΟΥΣ · ΑΡΙΣΤΟΓΕΙΤΟΝΟΣ","translator":"Greek text (Butcher)","lang":"grc","short":"Greek","transPair":{"a":"demosthenes-orations-2","e":"demosthenes-orations-2-e"},"transSelf":"e","noSpeakerLabels":true,"parMirror":"demosthenes-orations-2","reference":{"label":"Speech.section","abbr":"Dem.","placeholder":"e.g. 21.12"}}},{"meta":{"key":"demosthenes-private-1","en":"Private Orations 27–40","gr":"ΛΟΓΟΙ ΙΔΙΩΤΙΚΟΙ ΚΖ–Μ","color":"#3e4f45","author":"Demosthenes","form":"ORATION","pdf":"pdfs/Demosthenes/demosthenes-private-1.pdf","blurb":"Fourteen speeches written for private lawsuits. The five speeches against Aphobus and Onetor are Demosthenes’ own suits, brought as a young man against the guardians who had wasted his father’s estate. The rest concern maritime loans and trade (Against Zenothemis, Apaturius, Phormio and Lacritus), the banker Pasion’s heirs (For Phormio), a mining lease (Against Pantaenetus), a guardianship settlement (Against Nausimachus and Xenopeithes), and a dispute between half-brothers over a name and a dowry (Against Boeotus I–II); several are not by Demosthenes. A. T. Murray’s Loeb translation of 1936 with its footnotes, and the Greek of W. Rennie’s Oxford text as companion; the margin gives speech and section.","kind":"prose","transPair":{"a":"demosthenes-private-1","e":"demosthenes-private-1-e"},"transSelf":"a"},"text":{"title":"Private Orations 27–40","greek":"ΔΗΜΟΣΘΕΝΟΥΣ ΛΟΓΟΙ ΙΔΙΩΤΙΚΟΙ ΚΖ–Μ","subtitle":"Logoi idiōtikoi · fourteen speeches in private suits · trans. A. T. Murray","translator":"A. T. Murray (1936)","lang":"eng","short":"Murray","transPair":{"a":"demosthenes-private-1","e":"demosthenes-private-1-e"},"transSelf":"a","noSpeakerLabels":true,"reference":{"label":"Speech.section","abbr":"Dem.","placeholder":"e.g. 27.12"},"parMirror":"demosthenes-private-1"}},{"meta":{"key":"demosthenes-private-1-e","en":"Private Orations 27–40","gr":"ΛΟΓΟΙ ΙΔΙΩΤΙΚΟΙ ΚΖ–Μ","color":"#3e4f45","author":"Demosthenes","hidden":true,"form":"ORATION","pdf":"pdfs/Demosthenes/demosthenes-private-1-Greek.pdf","transPair":{"a":"demosthenes-private-1","e":"demosthenes-private-1-e"},"transSelf":"e","kind":"prose"},"text":{"title":"Λόγοι ἰδιωτικοί ΚΖʹ–Μʹ","greek":"ΔΗΜΟΣΘΕΝΟΥΣ ΛΟΓΟΙ ΙΔΙΩΤΙΚΟΙ ΚΖ–Μ","translator":"Greek text (Rennie)","lang":"grc","short":"Greek","transPair":{"a":"demosthenes-private-1","e":"demosthenes-private-1-e"},"transSelf":"e","noSpeakerLabels":true,"parMirror":"demosthenes-private-1","reference":{"label":"Speech.section","abbr":"Dem.","placeholder":"e.g. 27.12"}}},{"meta":{"key":"demosthenes-private-2","en":"Private Orations 41–49","gr":"ΛΟΓΟΙ ΙΔΙΩΤΙΚΟΙ ΜΑ–ΜΘ","color":"#55452f","author":"Demosthenes","form":"ORATION","pdf":"pdfs/Demosthenes/demosthenes-private-2.pdf","blurb":"Nine speeches from private suits, most of them not by Demosthenes. They deal with a dowry (Against Spudias), an exchange of properties to escape a public service (Against Phaenippus), the inheritance of Hagnias and of Archiades (Against Macartatus, Against Leochares), false testimony (the two speeches of Apollodorus Against Stephanus, and Against Evergus and Mnesibulus), damages over an estate (Against Olympiodorus), and a debt owed by the general Timotheus to the banker Pasion (Against Timotheus). The laws and depositions read in court are given as transmitted. A. T. Murray’s Loeb translation of 1939 with its footnotes, and the Greek of W. Rennie’s Oxford text as companion; the margin gives speech and section.","kind":"prose","transPair":{"a":"demosthenes-private-2","e":"demosthenes-private-2-e"},"transSelf":"a"},"text":{"title":"Private Orations 41–49","greek":"ΔΗΜΟΣΘΕΝΟΥΣ ΛΟΓΟΙ ΙΔΙΩΤΙΚΟΙ ΜΑ–ΜΘ","subtitle":"Logoi idiōtikoi · nine speeches in private suits · trans. A. T. Murray","translator":"A. T. Murray (1939)","lang":"eng","short":"Murray","transPair":{"a":"demosthenes-private-2","e":"demosthenes-private-2-e"},"transSelf":"a","noSpeakerLabels":true,"reference":{"label":"Speech.section","abbr":"Dem.","placeholder":"e.g. 41.12"},"parMirror":"demosthenes-private-2"}},{"meta":{"key":"demosthenes-private-2-e","en":"Private Orations 41–49","gr":"ΛΟΓΟΙ ΙΔΙΩΤΙΚΟΙ ΜΑ–ΜΘ","color":"#55452f","author":"Demosthenes","hidden":true,"form":"ORATION","pdf":"pdfs/Demosthenes/demosthenes-private-2-Greek.pdf","transPair":{"a":"demosthenes-private-2","e":"demosthenes-private-2-e"},"transSelf":"e","kind":"prose"},"text":{"title":"Λόγοι ἰδιωτικοί ΜΑʹ–ΜΘʹ","greek":"ΔΗΜΟΣΘΕΝΟΥΣ ΛΟΓΟΙ ΙΔΙΩΤΙΚΟΙ ΜΑ–ΜΘ","translator":"Greek text (Rennie)","lang":"grc","short":"Greek","transPair":{"a":"demosthenes-private-2","e":"demosthenes-private-2-e"},"transSelf":"e","noSpeakerLabels":true,"parMirror":"demosthenes-private-2","reference":{"label":"Speech.section","abbr":"Dem.","placeholder":"e.g. 41.12"}}},{"meta":{"key":"demosthenes-private-3","en":"Private Orations 50–59","gr":"ΛΟΓΟΙ ΙΔΙΩΤΙΚΟΙ Ν–ΝΘ","color":"#5a3f45","author":"Demosthenes","form":"ORATION","pdf":"pdfs/Demosthenes/demosthenes-private-3.pdf","blurb":"Ten speeches, most of them not by Demosthenes: Apollodorus on the costs of an overlong trierarchy (Against Polycles), On the Trierarchic Crown, Apollodorus Against Callippus and Against Nicostratus, Ariston’s suit for assault Against Conon, a farmer’s defence against a claim for flood damage (Against Callicles), a maritime loan (Against Dionysodorus), Euxitheus’ appeal against loss of citizenship (Against Eubulides), the information Against Theocrines, and the prosecution of the courtesan Neaera for living as the wife of an Athenian citizen, the longest account of a woman’s life in Attic oratory. A. T. Murray’s Loeb translation of 1939 with its footnotes, and the Greek of W. Rennie’s Oxford text as companion; the margin gives speech and section.","kind":"prose","transPair":{"a":"demosthenes-private-3","e":"demosthenes-private-3-e"},"transSelf":"a"},"text":{"title":"Private Orations 50–59","greek":"ΔΗΜΟΣΘΕΝΟΥΣ ΛΟΓΟΙ ΙΔΙΩΤΙΚΟΙ Ν–ΝΘ","subtitle":"Logoi idiōtikoi · ten speeches in private and public suits · trans. A. T. Murray","translator":"A. T. Murray (1939)","lang":"eng","short":"Murray","transPair":{"a":"demosthenes-private-3","e":"demosthenes-private-3-e"},"transSelf":"a","noSpeakerLabels":true,"reference":{"label":"Speech.section","abbr":"Dem.","placeholder":"e.g. 50.12"},"parMirror":"demosthenes-private-3"}},{"meta":{"key":"demosthenes-private-3-e","en":"Private Orations 50–59","gr":"ΛΟΓΟΙ ΙΔΙΩΤΙΚΟΙ Ν–ΝΘ","color":"#5a3f45","author":"Demosthenes","hidden":true,"form":"ORATION","pdf":"pdfs/Demosthenes/demosthenes-private-3-Greek.pdf","transPair":{"a":"demosthenes-private-3","e":"demosthenes-private-3-e"},"transSelf":"e","kind":"prose"},"text":{"title":"Λόγοι ἰδιωτικοί Νʹ–ΝΘʹ","greek":"ΔΗΜΟΣΘΕΝΟΥΣ ΛΟΓΟΙ ΙΔΙΩΤΙΚΟΙ Ν–ΝΘ","translator":"Greek text (Rennie)","lang":"grc","short":"Greek","transPair":{"a":"demosthenes-private-3","e":"demosthenes-private-3-e"},"transSelf":"e","noSpeakerLabels":true,"parMirror":"demosthenes-private-3","reference":{"label":"Speech.section","abbr":"Dem.","placeholder":"e.g. 50.12"}}},{"meta":{"key":"demosthenes-minor","en":"Funeral Speech, Erotic Essay, Exordia and Letters (60–63)","gr":"ΕΠΙΤΑΦΙΟΣ · ΕΡΩΤΙΚΟΣ · ΠΡΟΟΙΜΙΑ · ΕΠΙΣΤΟΛΑΙ","color":"#2f4a4f","author":"Demosthenes","form":"ORATION","pdf":"pdfs/Demosthenes/demosthenes-minor.pdf","blurb":"The last pieces of the Demosthenic corpus. The Funeral Speech honours the Athenians who fell at Chaeronea in 338; the Erotic Essay, an encomium of the youth Epicrates, is almost certainly not by Demosthenes. The fifty-six Exordia are openings for speeches to the Assembly, several of them close to the openings of surviving Philippics. The six Letters are addressed to the Athenian Council and Assembly, four of them from Demosthenes’ exile after the Harpalus affair; their authenticity is disputed. The translation of N. W. and N. J. DeWitt (Loeb, 1949) with its footnotes, and the Greek of W. Rennie’s Oxford text as companion; the margin gives speech and section, and for the Exordia and Letters number and section (62.1.1, 63.1.1).","kind":"prose","transPair":{"a":"demosthenes-minor","e":"demosthenes-minor-e"},"transSelf":"a"},"text":{"title":"Funeral Speech, Erotic Essay, Exordia and Letters (60–63)","greek":"ΔΗΜΟΣΘΕΝΟΥΣ ΕΠΙΤΑΦΙΟΣ · ΕΡΩΤΙΚΟΣ · ΠΡΟΟΙΜΙΑ · ΕΠΙΣΤΟΛΑΙ","subtitle":"Epitaphios · Erōtikos · Prooimia · Epistolai · the minor works of the corpus · trans. N. W. & N. J. DeWitt","translator":"N. W. and N. J. DeWitt (1949)","lang":"eng","short":"DeWitt","transPair":{"a":"demosthenes-minor","e":"demosthenes-minor-e"},"transSelf":"a","noSpeakerLabels":true,"reference":{"label":"Speech.section (Exordia, Letters: 62.n.section, 63.n.section)","abbr":"Dem.","placeholder":"e.g. 60.12"},"parMirror":"demosthenes-minor"}},{"meta":{"key":"demosthenes-minor-e","en":"Funeral Speech, Erotic Essay, Exordia and Letters (60–63)","gr":"ΕΠΙΤΑΦΙΟΣ · ΕΡΩΤΙΚΟΣ · ΠΡΟΟΙΜΙΑ · ΕΠΙΣΤΟΛΑΙ","color":"#2f4a4f","author":"Demosthenes","hidden":true,"form":"ORATION","pdf":"pdfs/Demosthene ssical Library, with the Latin of R. du Pontet’s Oxford text as companion; the margin gives book and chapter.","kind":"history","transPair":{"a":"caesar-civil-war","b":"caesar-civil-war-b"},"transSelf":"a"},"text":{"title":"The Civil War","greek":"C. IULI CAESARIS COMMENTARII DE BELLO CIVILI","subtitle":"Commentarii de Bello Civili · Caesar’s account of the war against Pompey, 49–48 BC · trans. A. G. Peskett","translator":"A. G. Peskett (1914)","lang":"eng","short":"Peskett","transPair":{"a":"caesar-civil-war","b":"caesar-civil-war-b"},"transSelf":"a","noSpeakerLabels":true,"reference":{"label":"Book.chapter","abbr":"","placeholder":"e.g. 1.12"},"parMirror":"caesar-civil-war"}},{"meta":{"key":"caesar-civil-war-b","en":"The Civil War","gr":"COMMENTARII DE BELLO CIVILI","color":"#3b3550","author":"Julius Caesar","hidden":true,"form":"HISTORY","pdf":"pdfs/Julius-Caesar/caesar-civil-war-Latin.pdf","transPair":{"a":"caesar-civil-war","b":"caesar-civil-war-b"},"transSelf":"b","kind":"history"},"text":{"title":"Commentarii de Bello Civili","greek":"C. IULI CAESARIS COMMENTARII DE BELLO CIVILI","translator":"Latin text (du Pontet)","lang":"lat","short":"Latin","transPair":{"a":"caesar-civil-war","b":"caesar-civil-war-b"},"transSelf":"b","noSpeakerLabels":true,"parMirror":"caesar-civil-war","reference":{"label":"Book.chapter","abbr":"","placeholder":"e.g. 1.12"}}},{"meta":{"key":"sallust-catiline","en":"The Conspiracy of Catiline","gr":"DE CATILINAE CONIURATIONE","color":"#4a2f2a","author":"Sallust","form":"HISTORY","pdf":"pdfs/Sallust/sallust-catiline.pdf","blurb":"Sallust’s monograph on the conspiracy of Lucius Sergius Catilina in the consulship of Cicero, 63 BC. After a preface on the mind and the writing of history and a sketch of the decline of Roman morals since the fall of Carthage, it follows Catiline from the first plot and his failures at the consular elections to the meetings of the conspirators, the dealings with the envoys of the Allobroges and the arrests in the city; the debate in the senate is given in the paired speeches of Caesar and Cato, with the comparison of the two men, and the book ends with the executions and Catiline’s death in battle at Pistoria. John Selby Watson’s translation with his explanatory notes, and the Latin of the Perseus Digital Library text (edition not named in its header) as companion; the margin gives the chapter.","kind":"history","transPair":{"a":"sallust-catiline","b":"sallust-catiline-b"},"transSelf":"a"},"text":{"title":"The Conspiracy of Catiline","greek":"C. SALLUSTI CRISPI DE CATILINAE CONIURATIONE","subtitle":"De Catilinae Coniuratione · monograph on the conspiracy of 63 BC · trans. J. S. Watson","translator":"J. S. Watson (1852)","lang":"eng","short":"Watson","transPair":{"a":"sallust-catiline","b":"sallust-catiline-b"},"transSelf":"a","noSpeakerLabels":true,"reference":{"label":"Chapter","abbr":"","placeholder":"e.g. 51"},"parMirror":"sallust-catiline"}},{"meta":{"key":"sallust-catiline-b","en":"The Conspiracy of Catiline","gr":"DE CATILINAE CONIURATIONE","color":"#4a2f2a","author":"Sallust","hidden":true,"form":"HISTORY","pdf":"pdfs/Sallust/sallust-catiline-Latin.pdf","transPair":{"a":"sallust-catiline","b":"sallust-catiline-b"},"transSelf":"b","kind":"history"},"text":{"title":"De Catilinae Coniuratione","greek":"C. SALLUSTI CRISPI DE CATILINAE CONIURATIONE","translator":"Latin text (Perseus; editor not named)","lang":"lat","short":"Latin","transPair":{"a":"sallust-catiline","b":"sallust-catiline-b"},"transSelf":"b","noSpeakerLabels":true,"parMirror":"sallust-catiline","reference":{"label":"Chapter","abbr":"","placeholder":"e.g. 51"}}},{"meta":{"key":"sallust-jugurtha","en":"The Jugurthine War","gr":"BELLUM IUGURTHINUM","color":"#51432a","author":"Sallust","form":"HISTORY","pdf":"pdfs/Sallust/sallust-jugurtha.pdf","blurb":"Sallust’s account of the war the Romans fought in Africa against Jugurtha, king of Numidia. It tells how Jugurtha, adopted by Micipsa, destroyed his cousins Hiempsal and Adherbal and bought off Roman envoys and commanders; how the scandal was forced into the open at Rome by the tribune Memmius; and how the war was then carried on by Metellus and by Marius, whose election to the consulship and speech against the nobility stand at the centre of the book, until Sulla persuaded Bocchus of Mauretania to hand Jugurtha over. Digressions describe the geography and peoples of Africa, the Philaeni and the growth of party strife at Rome. John Selby Watson’s translation with his explanatory notes, and the Latin of the Perseus Digital Library text (edition not named in its header) as companion; the margin gives the chapter.","kind":"history","transPair":{"a":"sallust-jugurtha","b":"sallust-jugurtha-b"},"transSelf":"a"},"text":{"title":"The Jugurthine War","greek":"C. SALLUSTI CRISPI BELLUM IUGURTHINUM","subtitle":"Bellum Iugurthinum · monograph on the war with Jugurtha of Numidia, 111–105 BC · trans. J. S. Watson","translator":"J. S. Watson (1852)","lang":"eng","short":"Watson","transPair":{"a":"sallust-jugurtha","b":"sallust-jugurtha-b"},"transSelf":"a","noSpeakerLabels":true,"reference":{"label":"Chapter","abbr":"","placeholder":"e.g. 51"},"parMirror":"sallust-jugurtha"}},{"meta":{"key":"sallust-jugurtha-b","en":"The Jugurthine War","gr":"BELLUM IUGURTHINUM","color":"#51432a","author":"Sallust","hidden":true,"form":"HISTORY","pdf":"pdfs/Sallust/sallust-jugurtha-Latin.pdf","transPair":{"a":"sallust-jugurtha","b":"sallust-jugurtha-b"},"transSelf":"b","kind":"history"},"text":{"title":"Bellum Iugurthinum","greek":"C. SALLUSTI CRISPI BELLUM IUGURTHINUM","translator":"Latin text (Perseus; editor not named)","lang":"lat","short":"Latin","transPair":{"a":"sallust-jugurtha","b":"sallust-jugurtha-b"},"transSelf":"b","noSpeakerLabels":true,"parMirror":"sallust-jugurtha","reference":{"label":"Chapter","abbr":"","placeholder":"e.g. 51"}}},{"meta":{"key":"diodorus-library-1","en":"The Historical Library (Books I–III)","gr":"ΒΙΒΛΙΟΘΗΚΗ ΙΣΤΟΡΙΚΗ","color":"#3d3528","author":"Diodorus Siculus","form":"HISTORY","pdf":"pdfs/Diodorus-Siculus/diodorus-library-1.pdf","blurb":"The opening books of the universal history that Diodorus of Agyrium in Sicily compiled in the first century BC: the general preface; Book I on Egypt, its gods, kings, laws and animal worship; Book II on Assyria, Media, India, the Scythians, Amazons and Arabia; Book III on Ethiopia, the Red Sea coasts, the gold mines, Libya and the Atlantians. This is George Booth's translation of 1700, the first complete English version, given in its period English with only the typography modernised (long s, ligatures); his marked marginal notes are kept as footnotes. No Greek companion. The margin gives Booth's book and chapter, which are his own divisions and not the chapters of modern editions.","kind":"history"},"text":{"title":"The Historical Library (Books I–III)","greek":"ΔΙΟΔΩΡΟΥ ΤΟΥ ΣΙΚΕΛΙΩΤΟΥ ΒΙΒΛΙΟΘΗΚΗ ΙΣΤΟΡΙΚΗ","subtitle":"Bibliotheke historike · universal history, books I–III · trans. George Booth, 1700","translator":"George Booth (1700)","lang":"eng","short":"Booth","noSpeakerLabels":true,"reference":{"label":"Booth's book.chapter","abbr":"","placeholder":"e.g. 1.3"}}},{"meta":{"key":"diodorus-library-2","en":"The Historical Library (Books IV–V)","gr":"ΒΙΒΛΙΟΘΗΚΗ ΙΣΤΟΡΙΚΗ","color":"#2f3b33","author":"Diodorus Siculus","form":"HISTORY","pdf":"pdfs/Diodorus-Siculus/diodorus-library-2.pdf","blurb":"Books IV and V of Diodorus's universal history. Book IV gathers the Greek myths into a continuous account: Bacchus, Priapus and the Muses, the labours and wanderings of Hercules, the Argonauts and Medea, Theseus, the Seven against Thebes, Daedalus and Minos. Book V, the book of islands, describes Sicily, Britain and its tin, Gaul, the Celtiberians, Liguria, Tuscany, Panchaea, Samothrace, Rhodes, Crete and the lesser Aegean islands. This is George Booth's translation of 1700 in its period English, with only the typography modernised; his marked marginal notes are kept as footnotes. No Greek companion. The margin gives Booth's book and chapter, which are his own divisions and not the chapters of modern editions.","kind":"history"},"text":{"title":"The Historical Library (Books IV–V)","greek":"ΔΙΟΔΩΡΟΥ ΤΟΥ ΣΙΚΕΛΙΩΤΟΥ ΒΙΒΛΙΟΘΗΚΗ ΙΣΤΟΡΙΚΗ","subtitle":"Bibliotheke historike · universal history, books IV–V · trans. George Booth, 1700","translator":"George Booth (1700)","lang":"eng","short":"Booth","noSpeakerLabels":true,"reference":{"label":"Booth's book.chapter","abbr":"","placeholder":"e.g. 4.3"}}},{"meta":{"key":"diodorus-library-3","en":"The Historical Library (Books XI–XIII)","gr":"ΒΙΒΛΙΟΘΗΚΗ ΙΣΤΟΡΙΚΗ","color":"#3b2f2f","author":"Diodorus Siculus","form":"HISTORY","pdf":"pdfs/Diodorus-Siculus/diodorus-library-3.pdf","blurb":"Books XI to XIII of Diodorus's universal history, where the surviving narrative resumes after the lost Books VI–X: Xerxes' invasion, Thermopylae, Salamis and Plataea; Gelon and Hiero in Sicily; the growth of Athenian power, the laws of Charondas and Zaleucus, the Peloponnesian War, the Athenian disaster at Syracuse, and the Carthaginian sack of Selinus, Himera and Agrigentum, down to the rise of Dionysius. This is George Booth's translation of 1700 in its period English, with only the typography modernised; his marked marginal notes are kept as footnotes. No Greek companion. The margin gives Booth's book and chapter, which are his own divisions and not the chapters of modern editions.","kind":"history"},"text":{"title":"The Historical Library (Books XI–XIII)","greek":"ΔΙΟΔΩΡΟΥ ΤΟΥ ΣΙΚΕΛΙΩΤΟΥ ΒΙΒΛΙΟΘΗΚΗ ΙΣΤΟΡΙΚΗ","subtitle":"Bibliotheke historike · universal history, books XI–XIII · trans. George Booth, 1700","translator":"George Booth (1700)","lang":"eng","short":"Booth","noSpeakerLabels":true,"reference":{"label":"Booth's book.chapter","abbr":"","placeholder":"e.g. 11.3"}}},{"meta":{"key":"diodorus-library-4","en":"The Historical Library (Books XIV–XV)","gr":"ΒΙΒΛΙΟΘΗΚΗ ΙΣΤΟΡΙΚΗ","color":"#2e3440","author":"Diodorus Siculus","form":"HISTORY","pdf":"pdfs/Diodorus-Siculus/diodorus-library-4.pdf","blurb":"Books XIV and XV of Diodorus's universal history: the Thirty at Athens, the march of Cyrus and the retreat of the Ten Thousand, the wars of Dionysius the Elder against Carthage and in Italy, the Gauls' capture of Rome, the Corinthian War and the King's Peace; then the rise of Thebes under Pelopidas and Epaminondas, Leuctra and Mantinea, and the revolt of the satraps. This is George Booth's translation of 1700 in its period English, with only the typography modernised; his marked marginal notes are kept as footnotes. No Greek companion. The margin gives Booth's book and chapter, which are his own divisions and not the chapters of modern editions. One page of Book XIV is missing in the copy transcribed.","kind":"history"},"text":{"title":"The Historical Library (Books XIV–XV)","greek":"ΔΙΟΔΩΡΟΥ ΤΟΥ ΣΙΚΕΛΙΩΤΟΥ ΒΙΒΛΙΟΘΗΚΗ ΙΣΤΟΡΙΚΗ","subtitle":"Bibliotheke historike · universal history, books XIV–XV · trans. George Booth, 1700","translator":"George Booth (1700)","lang":"eng","short":"Booth","noSpeakerLabels":true,"reference":{"label":"Booth's book.chapter","abbr":"","placeholder":"e.g. 14.3"}}},{"meta":{"key":"diodorus-library-5","en":"The Historical Library (Books XVI–XVIII)","gr":"ΒΙΒΛΙΟΘΗΚΗ ΙΣΤΟΡΙΚΗ","color":"#40342a","author":"Diodorus Siculus","form":"HISTORY","pdf":"pdfs/Diodorus-Siculus/diodorus-library-5.pdf","blurb":"Books XVI to XVIII of Diodorus's universal history: the reign of Philip of Macedon, the Sacred War, Dion and Timoleon in Sicily, and Chaeronea; the whole of Alexander's expedition from the Granicus to his death at Babylon; and the first wars of the Successors, with Perdiccas, Antipater, Eumenes and Antigonus. This is George Booth's translation of 1700 in its period English, with only the typography modernised; his marked marginal notes are kept as footnotes. No Greek companion. The margin gives Booth's book and chapter, which are his own divisions and not the chapters of modern editions. The supplement Booth compiled from Curtius and Arrian for the gap in Book XVII stands with the Fragments volume.","kind":"history"},"text":{"title":"The Historical Library (Books XVI–XVIII)","greek":"ΔΙΟΔΩΡΟΥ ΤΟΥ ΣΙΚΕΛΙΩΤΟΥ ΒΙΒΛΙΟΘΗΚΗ ΙΣΤΟΡΙΚΗ","subtitle":"Bibliotheke historike · universal history, books XVI–XVIII · trans. George Booth, 1700","translator":"George Booth (1700)","lang":"eng","short":"Booth","noSpeakerLabels":true,"reference":{"label":"Booth's book.chapter","abbr":"","placeholder":"e.g. 16.3"}}},{"meta":{"key":"diodorus-library-6","en":"The Historical Library (Books XIX–XX)","gr":"ΒΙΒΛΙΟΘΗΚΗ ΙΣΤΟΡΙΚΗ","color":"#33303d","author":"Diodorus Siculus","form":"HISTORY","pdf":"pdfs/Diodorus-Siculus/diodorus-library-6.pdf","blurb":"Books XIX and XX of Diodorus's universal history, the last that survive entire: the rise of Agathocles at Syracuse and his invasion of Africa; the campaigns of Eumenes and Antigonus, the deaths of Olympias and of Alexander's heirs, Demetrius at Gaza, Salamis and the siege of Rhodes, the Successors taking the title of king, and Roman wars with the Samnites, down to the eve of Ipsus. This is George Booth's translation of 1700 in its period English, with only the typography modernised; his marked marginal notes are kept as footnotes. No Greek companion. The margin gives Booth's book and chapter, which are his own divisions and not the chapters of modern editions.","kind":"history"},"text":{"title":"The Historical Library (Books XIX–XX)","greek":"ΔΙΟΔΩΡΟΥ ΤΟΥ ΣΙΚΕΛΙΩΤΟΥ ΒΙΒΛΙΟΘΗΚΗ ΙΣΤΟΡΙΚΗ","subtitle":"Bibliotheke historike · universal history, books XIX–XX · trans. George Booth, 1700","translator":"George Booth (1700)","lang":"eng","short":"Booth","noSpeakerLabels":true,"reference":{"label":"Booth's book.chapter","abbr":"","placeholder":"e.g. 19.3"}}},{"meta":{"key":"diodorus-library-7","en":"The Historical Library (Fragments)","gr":"ΒΙΒΛΙΟΘΗΚΗ ΙΣΤΟΡΙΚΗ","color":"#2f3a3d","author":"Diodorus Siculus","form":"HISTORY","pdf":"pdfs/Diodorus-Siculus/diodorus-library-7.pdf","blurb":"What remained in 1700 of the lost books of Diodorus, as George Booth printed it after Book XX: pieces of Books VI and VII from Eusebius and George the Monk; the eclogues of Books XXI–XXVI published by Rhodomannus; the excerpts in Photius's Bibliotheca (Books XXXI–XL); the excerpts on virtues and vices published by Valesius; the excerpts on embassies published by Ursinus; and last, a supplement that is not Diodorus but Booth's filling of the gap in Book XVII from Curtius and Arrian. Booth's translation of 1700 in its period English, with only the typography modernised. No Greek companion. The margin gives the collection (R, P, V, U, S), then Booth's book and fragment number, which are not those of modern editions.","kind":"history"},"text":{"title":"The Historical Library (Fragments)","greek":"ΔΙΟΔΩΡΟΥ ΤΟΥ ΣΙΚΕΛΙΩΤΟΥ ΒΙΒΛΙΟΘΗΚΗ ΙΣΤΟΡΙΚΗ","subtitle":"Bibliotheke historike · universal history, fragments of the lost books · trans. George Booth, 1700","translator":"George Booth (1700)","lang":"eng","short":"Booth","noSpeakerLabels":true,"reference":{"label":"Collection, book.fragment","abbr":"","placeholder":"e.g. V26.45"}}},{"meta":{"key":"virgil-eclogues","en":"The Eclogues","kind":"poem","gr":"ECLOGAE","color":"#3f6b4f","author":"Virgil","form":"POETRY","pdf":"pdfs/Virgil/The-Eclogues.pdf","blurb":"Ten pastoral poems in the manner of Theocritus, where shepherds sing of love, lost farms and poetry, and the fourth foretells a child who will restore the golden age."},"text":{"title":"The Eclogues","greek":"ECLOGAE","translator":"J. B. Greenough (1900)","noSpeakerLabels":false,"transPair":{"a":"virgil-eclogues","b":"virgil-eclogues-b"},"transSelf":"a","lang":"eng","short":"Greenough"}},{"meta":{"key":"virgil-eclogues-b","en":"The Eclogues","kind":"poem","gr":"ECLOGAE","color":"#3f6b4f","author":"Virgil","hidden":true,"pdf":"pdfs/Virgil/The-Eclogues-Latin.pdf"},"text":{"title":"Eclog ","short":"Latin"}},{"meta":{"key":"livy-2","en":"The History of Rome (Books 6–10)","kind":"history","gr":"AB URBE CONDITA","color":"#6b3a2a","author":"Livy","form":"HISTORY","pdf":"pdfs/Livy/The-History-of-Rome-Books-6-10.pdf","blurb":"Books 6–10 of Livy: Rome’s recovery after the Gallic sack, the Licinian laws, the Latin and Samnite wars, and the self-sacrifice of the Decii, down to the battle of Sentinum in 295 BCE."},"text":{"title":"The History of Rome (Books 6–10)","greek":"AB URBE CONDITA","translator":"Rev. Canon Roberts (1912)","noSpeakerLabels":true,"transPair":{"a":"livy-2","b":"livy-2-b"},"transSelf":"a","lang":"eng","short":"Roberts"}},{"meta":{"key":"livy-2-b","en":"The History of Rome (Books 6–10)","kind":"history","gr":"AB URBE CONDITA","color":"#6b3a2a","author":"Livy","hidden":true,"pdf":"pdfs/Livy/The-History-of-Rome-Books-6-10-Latin.pdf"},"text":{"title":"Ab Urbe Condita","greek":"AB URBE CONDITA","translator":"Latin text","noSpeakerLabels":true,"transPair":{"a":"livy-2","b":"livy-2-b"},"transSelf":"b","lang":"lat","short":"Latin"}},{"meta":{"key":"livy-3","en":"The History of Rome (Books 21–30)","kind":"history","gr":"AB URBE CONDITA","color":"#6b3a2a","author":"Livy","form":"HISTORY","pdf":"pdfs/Livy/The-History-of-Rome-Books-21-30.pdf","blurb":"Books 21–30, Livy’s account of the Second Punic War: Hannibal’s crossing of the Alps, the disasters at Trasimene and Cannae, the sieges of Syracuse and Capua, and Scipio’s victory at Zama."},"text":{"title":"The History of Rome (Books 21–30)","greek":"AB URBE CONDITA","translator":"Rev. Canon Roberts (1912)","noSpeakerLabels":true,"transPair":{"a":"livy-3","b":"livy-3-b"},"transSelf":"a","lang":"eng","short":"Roberts"}},{"meta":{"key":"livy-3-b","en":"The History of Rome (Books 21–30)","kind":"history","gr":"AB URBE CONDITA","color":"#6b3a2a","author":"Livy","hidden":true,"pdf":"pdfs/Livy/The-History-of-Rome-Books-21-30-Latin.pdf"},"text":{"title":"Ab Urbe Condita","greek":"AB URBE CONDITA","translator" -45-Latin.pdf"},"text":{"title":"Ab Urbe Condita","greek":"AB URBE CONDITA","translator":"Latin text","noSpeakerLabels":true,"transPair":{"a":"livy-5","b":"livy-5-b"},"transSelf":"b","lang":"lat","short":"Latin"}},{"meta":{"key":"strabo-geography-1","en":"Geography (Books I–III)","gr":"ΓΕΩΓΡΑΦΙΚΑ Αʹ–Γʹ","color":"#3b4a3f","author":"Strabo","form":"TREATISE","pdf":"pdfs/Strabo/strabo-geography-1.pdf","blurb":"The first three of the seventeen books of Strabo's description of the inhabited world, written under Augustus and Tiberius. Books I and II are the introduction: geography claimed for the philosopher, Homer defended as its founder, and the measurements and maps of Eratosthenes, Hipparchus, Polybius and Posidonius examined and corrected, ending with Strabo's own outline of the globe, its zones and the shape of the known world. Book III begins the circuit of the Mediterranean with Iberia: Turdetania and its mines, Lusitania, the northern mountaineers, Gades and the Tin Islands. Translated by H. C. Hamilton (Books I–VI) and W. Falconer for Bohn's Classical Library, with their notes identifying the ancient places; the Greek of Meineke's Teubner edition is the companion, and the margin gives book, chapter and section.","kind":"prose","transPair":{"a":"strabo-geography-1","e":"strabo-geography-1-e"},"transSelf":"a"},"text":{"title":"Geography (Books I–III)","greek":"ΣΤΡΑΒΩΝΟΣ ΓΕΩΓΡΑΦΙΚΑ","subtitle":"Geographika, Books I–III · description of the inhabited world · trans. Hamilton & Falconer","translator":"H. C. Hamilton and W. Falconer (1854)","lang":"eng","short":"Hamilton & Falconer","transPair":{"a":"strabo-geography-1","e":"strabo-geography-1-e"},"transSelf":"a","noSpeakerLabels":true,"reference":{"label":"Book.chapter.section","abbr":"","placeholder":"e.g. 2.3.8"},"parMirror":"strabo-geography-1"}},{"meta":{"key":"strabo-geography-1-e","en":"Geography (Books I–III)","gr":"ΓΕΩΓΡΑΦΙΚΑ Αʹ–Γʹ","color":"#3b4a3f","author":"Strabo","hidden":true,"form":"TREATISE","pdf":"pdf low the books of Moses: the Creation, the Flood, Abraham and the patriarchs, Joseph in Egypt, the Exodus, the giving of the law at Sinai, the tabernacle and the priesthood, the forty years in the wilderness, and the summary of the Mosaic constitution that closes with the death of Moses. William Whiston's translation of 1737 with his notes and chapter headings, and the Greek of Niese's edition as companion; the margin gives book, chapter and section in Whiston's numbering.","kind":"history","transPair":{"a":"josephus-antiquities-1","e":"josephus-antiquities-1-e"},"transSelf":"a"},"text":{"title":"Antiquities of the Jews (Books I–IV)","greek":"ΦΛΑΥΙΟΥ ΙΩΣΗΠΟΥ ΙΟΥΔΑΪΚΗ ΑΡΧΑΙΟΛΟΓΙΑ","subtitle":"Ioudaikē Archaiologia · history of the Jews from the Creation to A.D. 66, in twenty books · Books I–IV · trans. William Whiston","translator":"William Whiston (1737)","lang":"eng","short":"Whiston","transPair":{"a":"josephus-antiquities-1","e":"josephus-antiquities-1-e"},"transSelf":"a","noSpeakerLabels":true,"reference":{"label":"Book.chapter.section","abbr":"","placeholder":"e.g. 18.3.3"},"parMirror":"josephus-antiquities-1"}},{"meta":{"key":"josephus-antiquities-1-e","en":"Antiquities of the Jews (Books I–IV)","gr":"ΙΟΥΔΑΪΚΗ ΑΡΧΑΙΟΛΟΓΙΑ","color":"#3d3527","author":"Josephus","hidden":true,"form":"HISTORY","pdf":"pdfs/Josephus/josephus-antiquities-1-Greek.pdf","transPair":{"a":"josephus-antiquities-1","e":"josephus-antiquities-1-e"},"transSelf":"e","kind":"history"},"text":{"title":"Ἰουδαϊκὴ Ἀρχαιολογία","greek":"ΦΛΑΥΙΟΥ ΙΩΣΗΠΟΥ ΙΟΥΔΑΪΚΗ ΑΡΧΑΙΟΛΟΓΙΑ","translator":"Greek text (Niese)","lang":"grc","short":"Greek","transPair":{"a":"josephus-antiquities-1","e":"josephus-antiquities-1-e"},"transSelf":"e","noSpeakerLabels":true,"parMirror":"josephus-antiquities-1","reference":{"label":"Book.chapter.section","abbr":"","placeholder":"e.g. 18.3.3"}}},{"meta":{"key":"josephus-antiquities-2","en":"Antiquities of the Jews (Books V–VII)","gr":"ΙΟΥΔΑΪΚΗ ΑΡΧΑΙΟΛΟΓΙΑ","color":"#3d3527","autho rrhus, and the opening of the first war with Carthage down to Regulus. What is printed is what the Loeb gives: the fragments of Dio preserved by Byzantine excerptors and lexica, set beside the twelfth-century epitome of Zonaras (and passages of Tzetzes and others) that follows Dio for these years. Earnest Cary's Loeb translation (1914), made on the basis of H. B. Foster's version, with his notes; there is no Greek companion. The margin gives the book and the fragment number of Boissevain's edition, or the chapter of Zonaras, as the Loeb prints them.","kind":"history"},"text":{"title":"Roman History (Books 1–11)","greek":"ΔΙΩΝΟΣ ΚΑΣΣΙΟΥ ΡΩΜΑΪΚΗ ΙΣΤΟΡΙΑ","subtitle":"Rhōmaïkē Historia · Books 1–11, from the landing of Aeneas to the middle of the First Punic War (to about 250 B.C.) · trans. Earnest Cary","translator":"Earnest Cary (1914)","lang":"eng","short":"Cary","noSpeakerLabels":true,"reference":{"label":"Book.chapter","abbr":"","placeholder":"e.g. 2.7"}}},{"meta":{"key":"dio-roman-history-2","en":"Roman History (Books 12–35)","gr":"ΡΩΜΑΪΚΗ ΙΣΤΟΡΙΑ","color":"#3d3a2c","author":"Cassius Dio","form":"HISTORY","pdf":"pdfs/Cassius-Dio/dio-roman-history-2.pdf","blurb":"Books 12–35 of Cassius Dio's Roman History, lost except for fragments: the end of the first war with Carthage, the Gallic and Illyrian wars, Hannibal's invasion, Cannae, Scipio in Spain and Africa, the wars with Philip, Antiochus and Perseus, the destruction of Carthage and Corinth, Viriathus and Numantia, the Gracchi, Jugurtha, the Cimbri, the Social War, Marius, Cinna and Sulla, and the first wars with Mithridates. For Books 12–21 the narrative is carried by the epitome of Zonaras, with Dio's own fragments set beside it; from Book 22 only the excerpts remain. Earnest Cary's Loeb translation (1914), made on the basis of H. B. Foster's version, with his notes; there is no Greek companion. The margin gives the book and the fragment number of Boissevain's edition, or the chapter of Zonaras, as the Loeb prints them.","kind":"history"},"text":{"title":"Roman History (Books 12–35)","greek":"ΔΙΩΝΟΣ ΚΑΣΣΙΟΥ ΡΩΜΑΪΚΗ ΙΣΤΟΡΙΑ","subtitle":"Rhōmaïkē Historia · Books 12–35, from the end of the First Punic War to the wars of Sulla and Mithridates (about 250–70 B.C.) · trans. Earnest Cary","translator":"Earnest Cary (1914)","lang":"eng","short":"Cary","noSpeakerLabels":true,"reference":{"label":"Book.chapter","abbr":"","placeholder":"e.g. 15.57"}}},{"meta":{"key":"dio-roman-history-3","en":"Roman History (Books 36–40)","gr":"ΡΩΜΑΪΚΗ ΙΣΤΟΡΙΑ","color":"#2f3b45","author":"Cassius Dio","form":"HISTORY","pdf":"pdfs/Cassius-Dio/dio-roman-history-3.pdf","blurb":"Books 36–40 of Cassius Dio's Roman History, where the continuous text begins: Lucullus and Pompey against Mithridates and Tigranes, the Gabinian law and the war with the pirates, Pompey in the East, Catiline's conspiracy, the compact of Pompey, Crassus and Caesar, Caesar's consulship, Cicero's exile and return, the conquest of Gaul and the crossings to Britain, Crassus's defeat at Carrhae, and the disorders at Rome down to the eve of the civil war. Earnest Cary's Loeb translation (1914), made on the basis of H. B. Foster's version, with his notes as transcribed on LacusCurtius, and the Greek of the Loeb edition as companion; the margin gives book and chapter.","kind":"history","transPair":{"a":"dio-roman-history-3","e":"dio-roman-history-3-e"},"transSelf":"a"},"text":{"title":"Roman History (Books 36–40)","greek":"ΔΙΩΝΟΣ ΚΑΣΣΙΟΥ ΡΩΜΑΪΚΗ ΙΣΤΟΡΙΑ","subtitle":"Rhōmaïkē Historia · Books 36–40, 69–50 B.C. · trans. Earnest Cary","translator":"Earnest Cary (1914)","lang":"eng","short":"Cary","transPair":{"a":"dio-roman-history-3","e":"dio-roman-history-3-e"},"transSelf":"a","noSpeakerLabels":true,"reference":{"label":"Book.chapter","abbr":"","placeholder":"e.g. 37.20"}}},{"meta":{"key":"dio-roman-history-3-e","en":"Roman History (Books 36–40)","gr":"ΡΩΜΑΪΚΗ ΙΣΤΟΡΙΑ","color":"#2f3b45","author":"Cassius Dio","hidden":true,"form":"HISTORY", liny the Elder","form":"TREATISE","pdf":"pdfs/Pliny-the-Elder/pliny-natural-history-1.pdf","blurb":"The opening of Pliny's encyclopaedia: the dedicatory letter to Titus, then Book II on the universe — the heavens, the planets and their motions, eclipses, comets, thunder and lightning, winds, earthquakes, tides and the wonders of fire and water — and Books III to VI, the geography of the known world, coast by coast and people by people: Spain, Gaul and Italy; Greece, the Black Sea and the North; Africa, Egypt, Syria and Asia Minor; and the East as far as India, Taprobane and the Seres. The translation of John Bostock and H. T. Riley, with all of its notes; Mayhoff's Latin text is the companion, and the margin gives book and chapter.","kind":"prose","transPair":{"a":"pliny-natural-history-1","b":"pliny-natural-history-1-b"},"transSelf":"a"},"text":{"title":"Natural History (Books I–VI)","greek":"C. PLINII SECUNDI NATURALIS HISTORIA","subtitle":"Naturalis Historia I–VI · encyclopaedia of nature in thirty-seven books · trans. Bostock & Riley","translator":"John Bostock and H. T. Riley (1855–57)","lang":"eng","short":"Bostock & Riley","transPair":{"a":"pliny-natural-history-1","b":"pliny-natural-history-1-b"},"transSelf":"a","noSpeakerLabels":true,"reference":{"label":"Book.chapter","abbr":"","placeholder":"e.g. 2.12"},"parMirror":"pliny-natural-history-1"}},{"meta":{"key":"pliny-natural-history-1-b","en":"Natural History (Books I–VI)","gr":"NATURALIS HISTORIA, LIBRI I–VI","color":"#3b3a2c","author":"Pliny the Elder","hidden":true,"form":"TREATISE","pdf":"pdfs/Pliny-the-Elder/pliny-natural-history-1-Latin.pdf","transPair":{"a":"pliny-natural-history-1","b":"pliny-natural-history-1-b"},"transSelf":"b","kind":"prose"},"text":{"title":"Naturalis Historia (Libri I–VI)","greek":"C. PLINII SECUNDI NATURALIS HISTORIA","translator":"Latin text (Mayhoff)","lang":"lat","short":"Latin","transPair":{"a":"pliny-natural-history-1","b":"pliny-natural-history-1-b"},"transSelf":"b","noSp bri VII–IX)","greek":"C. PLINII SECUNDI NATURALIS HISTORIA","translator":"Latin text (Mayhoff)","lang":"lat","short":"Latin","transPair":{"a":"pliny-natural-history-2","b":"pliny-natural-history-2-b"},"transSelf":"b","noSpeakerLabels":true,"parMirror":"pliny-natural-history-2","reference":{"label":"Book.chapter","abbr":"","placeholder":"e.g. 7.12"}}},{"meta":{"key":"pliny-natural-history-3","en":"Natural History (Books X–XI)","gr":"NATURALIS HISTORIA, LIBRI X–XI","color":"#2f3d3a","author":"Pliny the Elder","form":"TREATISE","pdf":"pdfs/Pliny-the-Elder/pliny-natural-history-3.pdf","blurb":"Book X is the natural history of birds — the ostrich, the phoenix, eagles, the auguries drawn from birds, migration, nests, song, the fattening of poultry — with chapters on the generation, senses, food and sleep of animals in general. Book XI turns to insects, above all bees and their government, silkworms, spiders, locusts and ants, and then passes limb by limb through the comparative anatomy of animals, from the horns and the eyes to the heart, the blood, the voice and the hoofs. The translation of John Bostock and H. T. Riley, with all of its notes; Mayhoff's Latin text is the companion, and the margin gives book and chapter.","kind":"prose","transPair":{"a":"pliny-natural-history-3","b":"pliny-natural-history-3-b"},"transSelf":"a"},"text":{"title":"Natural History (Books X–XI)","greek":"C. PLINII SECUNDI NATURALIS HISTORIA","subtitle":"Naturalis Historia X–XI · encyclopaedia of nature in thirty-seven books · trans. Bostock & Riley","translator":"John Bostock and H. T. Riley (1855–57)","lang":"eng","short":"Bostock & Riley","transPair":{"a":"pliny-natural-history-3","b":"pliny-natural-history-3-b"},"transSelf":"a","noSpeakerLabels":true,"reference":{"label":"Book.chapter","abbr":"","placeholder":"e.g. 10.12"},"parMirror":"pliny-natural-history-3"}},{"meta":{"key":"pliny-natural-history-3-b","en":"Natural History (Books X–XI)","gr":"NATURALIS HISTORIA, LIBRI X–XI","color":"#2f3 ies of each and ending with the composition of theriac. Book XXI is on flowers and garlands, the rose, the lily and the violet, on bees and honey, and the remedies from flowers; Book XXII on the plants used for dyes and for honours, the grass crown, and the remedies from wild herbs and from the kinds of grain. The translation of John Bostock and H. T. Riley, with all of its notes; Mayhoff's Latin text is the companion, and the margin gives book and chapter.","kind":"prose","transPair":{"a":"pliny-natural-history-7","b":"pliny-natural-history-7-b"},"transSelf":"a"},"text":{"title":"Natural History (Books XX–XXII)","greek":"C. PLINII SECUNDI NATURALIS HISTORIA","subtitle":"Naturalis Historia XX–XXII · encyclopaedia of nature in thirty-seven books · trans. Bostock & Riley","translator":"John Bostock and H. T. Riley (1855–57)","lang":"eng","short":"Bostock & Riley","transPair":{"a":"pliny-natural-history-7","b":"pliny-natural-history-7-b"},"transSelf":"a","noSpeakerLabels":true,"reference":{"label":"Book.chapter","abbr":"","placeholder":"e.g. 20.12"},"parMirror":"pliny-natural-history-7"}},{"meta":{"key":"pliny-natural-history-7-b","en":"Natural History (Books XX–XXII)","gr":"NATURALIS HISTORIA, LIBRI XX–XXII","color":"#2e4034","author":"Pliny the Elder","hidden":true,"form":"TREATISE","pdf":"pdfs/Pliny-the-Elder/pliny-natural-history-7-Latin.pdf","transPair":{"a":"pliny-natural-history-7","b":"pliny-natural-history-7-b"},"transSelf":"b","kind":"prose"},"text":{"title":"Naturalis Historia (Libri XX–XXII)","greek":"C. PLINII SECUNDI NATURALIS HISTORIA","translator":"Latin text (Mayhoff)","lang":"lat","short":"Latin","transPair":{"a":"pliny-natural-history-7","b":"pliny-natural-history-7-b"},"transSelf":"b","noSpeakerLabels":true,"parMirror":"pliny-natural-history-7","reference":{"label":"Book.chapter","abbr":"","placeholder":"e.g. 20.12"}}},{"meta":{"key":"pliny-natural-history-8","en":"Natural History (Books XXIII–XXV)","gr":"NATURALIS HISTORIA, LIBRI XXIII–XXV","color":"#3a3144","author":"Pliny the Elder","form":"TREATISE","pdf":"pdfs/Pliny-the-Elder/pliny-natural-history-8.pdf","blurb":"Book XXIII gives the remedies derived from the cultivated trees: the vine, the wines and vinegar, the olive and its oils, the palm, and the fruits and nuts. Book XXIV gives those from the forest trees and wild shrubs, with the magical plants and the beliefs of the Magi about them. Book XXV is the history of the knowledge of herbs — Greek and Roman writers on plants, the herbs named after their discoverers, hellebore, mithridatium, betony — and the remedies for the diseases of the head, the eyes, the teeth and the mouth. The translation of John Bostock and H. T. Riley, with all of its notes; Mayhoff's Latin text is the companion, and the margin gives book and chapter.","kind":"prose","transPair":{"a":"pliny-natural-history-8","b":"pliny-natural-history-8-b"},"transSelf":"a"},"text":{"title":"Natural History (Books XXIII–XXV)","greek":"C. PLINII SECUNDI NATURALIS HISTORIA","subtitle":"Naturalis Historia XXIII–XXV · encyclopaedia of nature in thirty-seven books · trans. Bostock & Riley","translator":"John Bostock and H. T. Riley (1855–57)","lang":"eng","short":"Bostock & Riley","transPair":{"a":"pliny-natural-history-8","b":"pliny-natural-history-8-b"},"transSelf":"a","noSpeakerLabels":true,"reference":{"label":"Book.chapter","abbr":"","placeholder":"e.g. 23.12"},"parMirror":"pliny-natural-history-8"}},{"meta":{"key":"pliny-natural-history-8-b","en":"Natural History (Books XXIII–XXV)","gr":"NATURALIS HISTORIA, LIBRI XXIII–XXV","color":"#3a3144","author":"Pliny the Elder","hidden":true,"form":"TREATISE","pdf":"pdfs/Pliny-the-Elder/pliny-natural-history-8-Latin.pdf","transPair":{"a":"pliny-natural-history-8","b":"pliny-natural-history-8-b"},"transSelf":"b","kind":"prose"},"text":{"title":"Naturalis Historia (Libri XXIII–XXV)","greek":"C. PLINII SECUNDI NATURALIS HISTORIA","translator":"Latin text (Mayhoff)","lang":"lat","short":"Latin","transPair":{"a e of the twelve books of Quintilian's Institutio Oratoria, written at Rome about AD 95 after twenty years of teaching. A prefatory letter to the bookseller Trypho is followed by Book I, on the child's earliest schooling, reading and writing, grammar and correct speech, and the music, geometry and acting an orator should learn; Book II, on the school of rhetoric, the choice of a teacher, the first exercises, and whether rhetoric is an art and what its end is; and Book III, on the history and divisions of rhetoric, the doctrine of status or basis, and panegyric, deliberative and forensic oratory. H. E. Butler's Loeb translation with its notes, and his Latin text as companion; the margin gives book, chapter and section.","kind":"treatise","transPair":{"a":"quintilian-institutes-1","b":"quintilian-institutes-1-b"},"transSelf":"a"},"text":{"title":"Institutes of Oratory (Books I–III)","greek":"M. FABII QUINTILIANI INSTITUTIO ORATORIA","subtitle":"Institutio Oratoria, libri I–III · the education of the orator · trans. H. E. Butler","translator":"H. E. Butler (1920)","lang":"eng","short":"Butler","transPair":{"a":"quintilian-institutes-1","b":"quintilian-institutes-1-b"},"transSelf":"a","noSpeakerLabels":true,"reference":{"label":"Book.chapter.section","abbr":"","placeholder":"e.g. 2.15.34"},"parMirror":"quintilian-institutes-1"}},{"meta":{"key":"quintilian-institutes-1-b","en":"Institutes of Oratory (Books I–III)","gr":"INSTITUTIO ORATORIA (LIBRI I–III)","color":"#4a3b2a","author":"Quintilian","hidden":true,"form":"TREATISE","pdf":"pdfs/Quintilian/quintilian-institutes-1-Latin.pdf","transPair":{"a":"quintilian-institutes-1","b":"quintilian-institutes-1-b"},"transSelf":"b","kind":"treatise"},"text":{"title":"Institutio Oratoria (Libri I–III)","greek":"M. FABII QUINTILIANI INSTITUTIO ORATORIA","translator":"Latin text (Butler)","lang":"lat","short":"Latin","transPair":{"a":"quintilian-institutes-1","b":"quintilian-institutes-1-b"},"transSelf":"b","noSpeakerLabels":true,"parMirror":"quintilian-institutes-1","reference":{"label":"Book.chapter.section","abbr":"","placeholder":"e.g. 2.15.34"}}},{"meta":{"key":"quintilian-institutes-2","en":"Institutes of Oratory (Books IV–VI)","gr":"INSTITUTIO ORATORIA (LIBRI IV–VI)","color":"#3b4032","author":"Quintilian","form":"TREATISE","pdf":"pdfs/Quintilian/quintilian-institutes-2.pdf","blurb":"Books IV to VI of Quintilian's Institutio Oratoria, which take the reader through the parts of a forensic speech. Book IV treats the exordium, the statement of facts, digression, proposition and partition; Book V the proofs, both those found ready to hand (previous judgments, rumour, torture, documents, oaths, witnesses) and those the orator must make, with signs, arguments, examples, refutation and the enthymeme; Book VI the peroration and the stirring of the emotions, opening with Quintilian's account of the deaths of his wife and two sons, and including the long chapter on laughter and wit. H. E. Butler's Loeb translation with its notes, and his Latin text as companion; the margin gives book, chapter and section.","kind":"treatise","transPair":{"a":"quintilian-institutes-2","b":"quintilian-institutes-2-b"},"transSelf":"a"},"text":{"title":"Institutes of Oratory (Books IV–VI)","greek":"M. FABII QUINTILIANI INSTITUTIO ORATORIA","subtitle":"Institutio Oratoria, libri IV–VI · the education of the orator · trans. H. E. Butler","translator":"H. E. Butler (1921)","lang":"eng","short":"Butler","transPair":{"a":"quintilian-institutes-2","b":"quintilian-institutes-2-b"},"transSelf":"a","noSpeakerLabels":true,"reference":{"label":"Book.chapter.section","abbr":"","placeholder":"e.g. 6.2.26"},"parMirror":"quintilian-institutes-2"}},{"meta":{"key":"quintilian-institutes-2-b","en":"Institutes of Oratory (Books IV–VI)","gr":"INSTITUTIO ORATORIA (LIBRI IV–VI)","color":"#3b4032","author":"Quintilian","hidden":true,"form":"TREATISE","pdf":"pdfs/Quintilian/quintilian-institutes-2-Latin.pdf","transPair":{"a":"quintilian-institutes-2","b":"quintilian-institutes-2-b"},"transSelf":"b","kind":"treatise"},"text":{"title":"Institutio Oratoria (Libri IV–VI)","greek":"M. FABII QUINTILIANI INSTITUTIO ORATORIA","translator":"Latin text (Butler)","lang":"lat","short":"Latin","transPair":{"a":"quintilian-institutes-2","b":"quintilian-institutes-2-b"},"transSelf":"b","noSpeakerLabels":true,"parMirror":"quintilian-institutes-2","reference":{"label":"Book.chapter.section","abbr":"","placeholder":"e.g. 6.2.26"}}},{"meta":{"key":"quintilian-institutes-3","en":"Institutes of Oratory (Books VII–IX)","gr":"INSTITUTIO ORATORIA (LIBRI VII–IX)","color":"#33404a","author":"Quintilian","form":"TREATISE","pdf":"pdfs/Quintilian/quintilian-institutes-3.pdf","blurb":"Books VII to IX of Quintilian's Institutio Oratoria. Book VII is on arrangement: how a case is divided and ordered under each basis, conjecture, definition and quality, and the questions that arise from the letter and intention of laws, contradictory laws, syllogism and ambiguity. Book VIII opens the treatment of style, with clearness, ornament, amplification, striking sayings and the tropes, metaphor first among them. Book IX deals with the figures of thought and of speech, quoting Cicero at length, and ends with a long chapter on composition, the order and joining of words and prose rhythm. H. E. Butler's Loeb translation with its notes, and his Latin text as companion; the margin gives book, chapter and section.","kind":"treatise","transPair":{"a":"quintilian-institutes-3","b":"quintilian-institutes-3-b"},"transSelf":"a"},"text":{"title":"Institutes of Oratory (Books VII–IX)","greek":"M. FABII QUINTILIANI INSTITUTIO ORATORIA","subtitle":"Institutio Oratoria, libri VII–IX · the education of the orator · trans. H. E. Butler","translator":"H. E. Butler (1921)","lang":"eng","short":"Butler","transPair":{"a":"quintilian-institutes-3","b":"quintilian-institutes-3-b"},"transSelf":"a","noSpeakerLabels":true,"reference":{"label":"Book.chapter.section","abbr": ed to King Gelon, names a number greater than the grains of sand that would fill the universe; Measurement of a Circle bounds the circumference between 3 1/7 and 3 10/71 diameters; the Cattle Problem is the verse riddle sent to Eratosthenes. A new English translation.","transPair":{"a":"archimedes-sand-reckoner"},"transSelf":"a","kind":"treatise"},"text":{"title":"The Sand-Reckoner and Shorter Works","greek":"ΑΡΧΙΜΗΔΟΥΣ ΨΑΜΜΙΤΗΣ · ΚΥΚΛΟΥ ΜΕΤΡΗΣΙΣ · ΠΡΟΒΛΗΜΑ ΒΟΕΙΚΟΝ","subtitle":"Psammites · Kyklou metresis · the Cattle Problem · a new translation from the Greek","translator":"Claude AI","lang":"eng","short":"English","transPair":{"a":"archimedes-sand-reckoner"},"transSelf":"a","noSpeakerLabels":true,"reference":{"label":"Work.part (S = Sand-Reckoner, C = Circle, B = Cattle Problem)","abbr":"","placeholder":"e.g. S.1"}}},{"meta":{"key":"dionysius-thrax-grammar","en":"The Art of Grammar","gr":"ΤΕΧΝΗ ΓΡΑΜΜΑΤΙΚΗ","color":"#2f3a44","author":"Dionysius Thrax","form":"TREATISE","pdf":"pdfs/Dionysius-Thrax/dionysius-thrax-grammar.pdf","blurb":"The oldest grammar of a European language, a handbook of a few pages from the school of the Alexandrian critics. It defines grammar as acquaintance with the usage of poets and prose writers and lists its six parts; gives rules for reading aloud, accent and punctuation; describes the letters and the kinds of syllable; and then takes the eight parts of speech in turn, noun, verb, participle, article, pronoun, preposition, adverb and conjunction, with their classes and Greek examples. Thomas Davidson’s translation, the first into English, printed at St. Louis in 1874, with his notes; the Greek terms and examples stand in the text as he gave them. The margin gives the section.","kind":"treatise"},"text":{"title":"The Art of Grammar","greek":"ΔΙΟΝΥΣΙΟΥ ΤΟΥ ΘΡΑΙΚΟΣ ΤΕΧΝΗ ΓΡΑΜΜΑΤΙΚΗ","subtitle":"Techne grammatike · the first Greek grammar · trans. Thomas Davidson","translator":"Thomas Davidson (1874)","lang":"eng","short":"Davidson","noSpeake
