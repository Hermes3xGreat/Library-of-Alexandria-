<script id="hermes-manifest" type="application/json">{"type": "hermes-manifest","version": 1,"books": [{"meta": {"key": "yasna","en": "Yasna","gr": "","color": "#b5772a","author": "Zoroaster","kind": "prose","form": "SCRIPTURE","pdf": "pdfs/Zoroaster/Yasna.pdf","blurb": "The central liturgy of Zoroastrian worship in seventy-two chapters, framing the Gathas, the oldest hymns attributed to Zarathushtra himself, with invocations, confessions and praise."},"text": {"title": "Yasna","greek": "","translator": "L. H. Mills, 1898","kind": "prose","reference": {"label": "Section","abbr": "§","placeholder": "e.g. 2.5"}}},{"meta": {"key": "vendidad","en": "Vendidad","gr": "","color": "#b5772a","author": "Zoroaster","kind": "prose","form": "SCRIPTURE","pdf": "pdfs/Zoroaster/Vendidad.pdf","blurb": "The Zoroastrian law against the demons: the creation of the good lands, the myth of Yima, and the rules for purity, the dead, dogs and penance, in dialogue between Ahura Mazda and Zarathushtra."},"text": {"title": "Vendidad","greek": "","translator": "James Darmesteter, 1898","kind": "prose","reference": {"label": "Section","abbr": "§","placeholder": "e.g. 2.5"}}},{"meta": {"key": "visperad","en": "Visperad","gr": "","color": "#b5772a","author": "Zoroaster","kind": "prose","form": "SCRIPTURE","pdf": "pdfs/Zoroaster/Visperad.pdf","blurb": "A liturgical supplement to the Yasna, recited at the seasonal festivals, invoking in turn all the lords of the ritual order of spiritual and earthly creatures."},"text": {"title": "Visperad","greek": "","translator": "L. H. Mills, 1898","kind": "prose","reference": {"label": "Section","abbr": "§","placeholder": "e.g. 2.5"}}},{"meta": {"key": "khordeh-avesta","en": "Khordeh Avesta","gr": "","color": "#b5772a","author": "Zoroaster","kind": "prose","form": "SCRIPTURE","pdf": "pdfs/Zoroaster/Khordeh-Avesta.pdf","blurb": "The “little Avesta” of daily prayers: the Ahuna Vairya and other sacred formulas, the Gahs for the five watches of the day, and the Yashts to the Waters, the Sun, Mithra and the Fravashis."},"text": {"title": "Khordeh Avesta","greek": "","translator": "James Darmesteter, 1898","kind": "prose","reference": {"label": "Section","abbr": "§","placeholder": "e.g. 2.5"}}},{"meta": {"key": "josephus-antiquities-1","en": "Antiquities of the Jews (Books I–IV)","gr": "ΙΟΥΔΑΪΚΗ ΑΡΧΑΙΟΛΟΓΙΑ","color": "#3d3527","author": "Josephus","form": "HISTORY","pdf": "pdfs/Josephus/josephus-antiquities-1.pdf","blurb": "The first four of the twenty books in which Josephus retold the history of his people for Greek and Roman readers, finished at Rome in A.D. 93–94. They follow the books of Moses: the Creation, the Flood, Abraham and the patriarchs, Joseph in Egypt, the Exodus, the giving of the law at Sinai, the tabernacle and the priesthood, the forty years in the wilderness, and the summary of the Mosaic constitution that closes with the death of Moses. William Whiston's translation of 1737 with his notes and chapter headings, and the Greek of Niese's edition as companion; the margin gives book, chapter and section in Whiston's numbering.","kind": "history","transPair": {"a": "josephus-antiquities-1","e": "josephus-antiquities-1-e"},"transSelf": "a"},"text": {"title": "Antiquities of the Jews (Books I–IV)","greek": "ΦΛΑΥΙΟΥ ΙΩΣΗΠΟΥ ΙΟΥΔΑΪΚΗ ΑΡΧΑΙΟΛΟΓΙΑ","subtitle": "Ioudaikē Archaiologia · history of the Jews from the Creation to A.D. 66, in twenty books · Books I–IV · trans. William Whiston","translator": "William Whiston (1737)","lang": "eng","short": "Whiston","transPair": {"a": "josephus-antiquities-1","e": "josephus-antiquities-1-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter.section","abbr": "","placeholder": "e.g. 18.3.3"},"parMirror": "josephus-antiquities-1"}},{"meta": {"key": "josephus-antiquities-1-e","en": "Antiquities of the Jews (Books I–IV)","gr": "ΙΟΥΔΑΪΚΗ ΑΡΧΑΙΟΛΟΓΙΑ","color": "#3d3527","author": "Josephus","hidden": true,"form": "HISTORY","pdf": "pdfs/Josephus/josephus-antiquities-1-Greek.pdf","transPair": {"a": "josephus-antiquities-1","e": "josephus-antiquities-1-e"},"transSelf": "e","kind": "history"},"text": {"title": "Ἰουδαϊκὴ Ἀρχαιολογία","greek": "ΦΛΑΥΙΟΥ ΙΩΣΗΠΟΥ ΙΟΥΔΑΪΚΗ ΑΡΧΑΙΟΛΟΓΙΑ","translator": "Greek text (Niese)","lang": "grc","short": "Greek","transPair": {"a": "josephus-antiquities-1","e": "josephus-antiquities-1-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "josephus-antiquities-1","reference": {"label": "Book.chapter.section","abbr": "","placeholder": "e.g. 18.3.3"}}},{"meta": {"key": "josephus-antiquities-2","en": "Antiquities of the Jews (Books V–VII)","gr": "ΙΟΥΔΑΪΚΗ ΑΡΧΑΙΟΛΟΓΙΑ","color": "#3d3527","author": "Josephus","form": "HISTORY","pdf": "pdfs/Josephus/josephus-antiquities-2.pdf","blurb": "Books V to VII of the Antiquities carry the narrative from the conquest of Canaan under Joshua through the time of the Judges — Deborah, Gideon, Jephthah, Samson — and the story of Ruth, to Samuel, the choice and fall of Saul, and the whole reign of David down to his death. Josephus follows Joshua, Judges, Ruth and the books of Samuel, with material from Chronicles, adding speeches and explanations for a Gentile audience. William Whiston's translation of 1737 with his notes and chapter headings, and the Greek of Niese's edition as companion; the margin gives book, chapter and section in Whiston's numbering.","kind": "history","transPair": {"a": "josephus-antiquities-2","e": "josephus-antiquities-2-e"},"transSelf": "a"},"text": {"title": "Antiquities of the Jews (Books V–VII)","greek": "ΦΛΑΥΙΟΥ ΙΩΣΗΠΟΥ ΙΟΥΔΑΪΚΗ ΑΡΧΑΙΟΛΟΓΙΑ","subtitle": "Ioudaikē Archaiologia · history of the Jews from the Creation to A.D. 66, in twenty books · Books V–VII · trans. William Whiston","translator": "William Whiston (1737)","lang": "eng","short": "Whiston","transPair": {"a": "josephus-antiquities-2","e": "josephus-antiquities-2-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter.section","abbr": "","placeholder": "e.g. 18.3.3"},"parMirror": "josephus-antiquities-2"}},{"meta": {"key": "josephus-antiquities-2-e","en": "Antiquities of the Jews (Books V–VII)","gr": "ΙΟΥΔΑΪΚΗ ΑΡΧΑΙΟΛΟΓΙΑ","color": "#3d3527","author": "Josephus","hidden": true,"form": "HISTORY","pdf": "pdfs/Josephus/josephus-antiquities-2-Greek.pdf","transPair": {"a": "josephus-antiquities-2","e": "josephus-antiquities-2-e"},"transSelf": "e","kind": "history"},"text": {"title": "Ἰουδαϊκὴ Ἀρχαιολογία","greek": "ΦΛΑΥΙΟΥ ΙΩΣΗΠΟΥ ΙΟΥΔΑΪΚΗ ΑΡΧΑΙΟΛΟΓΙΑ","translator": "Greek text (Niese)","lang": "grc","short": "Greek","transPair": {"a": "josephus-antiquities-2","e": "josephus-antiquities-2-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "josephus-antiquities-2","reference": {"label": "Book.chapter.section","abbr": "","placeholder": "e.g. 18.3.3"}}},{"meta": {"key": "josephus-antiquities-3","en": "Antiquities of the Jews (Books VIII–XI)","gr": "ΙΟΥΔΑΪΚΗ ΑΡΧΑΙΟΛΟΓΙΑ","color": "#3d3527","author": "Josephus","form": "HISTORY","pdf": "pdfs/Josephus/josephus-antiquities-3.pdf","blurb": "Books VIII to XI of the Antiquities run from the accession of Solomon and the building of the Temple through the division of the kingdom, the kings of Israel and Judah, the prophets Elijah and Elisha, the fall of Samaria and of Jerusalem, Daniel at Babylon, the return under Cyrus, Ezra and Nehemiah, and the story of Esther, ending with Alexander the Great at Jerusalem. The sources are Kings, Chronicles, the prophets, 1 Esdras and the Greek Esther. William Whiston's translation of 1737 with his notes and chapter headings, and the Greek of Niese's edition as companion; the margin gives book, chapter and section in Whiston's numbering.","kind": "history","transPair": {"a": "josephus-antiquities-3","e": "josephus-antiquities-3-e"},"transSelf": "a"},"text": {"title": "Antiquities of the Jews (Books VIII–XI)","greek": "ΦΛΑΥΙΟΥ ΙΩΣΗΠΟΥ ΙΟΥΔΑΪΚΗ ΑΡΧΑΙΟΛΟΓΙΑ","subtitle": "Ioudaikē Archaiologia · history of the Jews from the Creation to A.D. 66, in twenty books · Books VIII–XI · trans. William Whiston","translator": "William Whiston (1737)","lang": "eng","short": "Whiston","transPair": {"a": "josephus-antiquities-3","e": "josephus-antiquities-3-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter.section","abbr": "","placeholder": "e.g. 18.3.3"},"parMirror": "josephus-antiquities-3"}},{"meta": {"key": "josephus-antiquities-3-e","en": "Antiquities of the Jews (Books VIII–XI)","gr": "ΙΟΥΔΑΪΚΗ ΑΡΧΑΙΟΛΟΓΙΑ","color": "#3d3527","author": "Josephus","hidden": true,"form": "HISTORY","pdf": "pdfs/Josephus/josephus-antiquities-3-Greek.pdf","transPair": {"a": "josephus-antiquities-3","e": "josephus-antiquities-3-e"},"transSelf": "e","kind": "history"},"text": {"title": "Ἰουδαϊκὴ Ἀρχαιολογία","greek": "ΦΛΑΥΙΟΥ ΙΩΣΗΠΟΥ ΙΟΥΔΑΪΚΗ ΑΡΧΑΙΟΛΟΓΙΑ","translator": "Greek text (Niese)","lang": "grc","short": "Greek","transPair": {"a": "josephus-antiquities-3","e": "josephus-antiquities-3-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "josephus-antiquities-3","reference": {"label": "Book.chapter.section","abbr": "","placeholder": "e.g. 18.3.3"}}},{"meta": {"key": "josephus-antiquities-4","en": "Antiquities of the Jews (Books XII–XIV)","gr": "ΙΟΥΔΑΪΚΗ ΑΡΧΑΙΟΛΟΓΙΑ","color": "#3d3527","author": "Josephus","form": "HISTORY","pdf": "pdfs/Josephus/josephus-antiquities-4.pdf","blurb": "Books XII to XIV of the Antiquities cover the Hellenistic age: the Jews under the Ptolemies and the making of the Greek translation of the law, the Tobiad family, the persecution of Antiochus Epiphanes and the Maccabean revolt, the Hasmonean high priests and kings from Jonathan and Simon to Alexander Jannaeus and Alexandra, the arrival of Pompey, the decrees of Caesar and the Roman magistrates in favour of the Jews, and the rise of Antipater and Herod down to the capture of Jerusalem in 37 B.C. William Whiston's translation of 1737 with his notes and chapter headings, and the Greek of Niese's edition as companion; the margin gives book, chapter and section in Whiston's numbering.","kind": "history","transPair": {"a": "josephus-antiquities-4","e": "josephus-antiquities-4-e"},"transSelf": "a"},"text": {"title": "Antiquities of the Jews (Books XII–XIV)","greek": "ΦΛΑΥΙΟΥ ΙΩΣΗΠΟΥ ΙΟΥΔΑΪΚΗ ΑΡΧΑΙΟΛΟΓΙΑ","subtitle": "Ioudaikē Archaiologia · history of the Jews from the Creation to A.D. 66, in twenty books · Books XII–XIV · trans. William Whiston","translator": "William Whiston (1737)","lang": "eng","short": "Whiston","transPair": {"a": "josephus-antiquities-4","e": "josephus-antiquities-4-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter.section","abbr": "","placeholder": "e.g. 18.3.3"},"parMirror": "josephus-antiquities-4"}},{"meta": {"key": "josephus-antiquities-4-e","en": "Antiquities of the Jews (Books XII–XIV)","gr": "ΙΟΥΔΑΪΚΗ ΑΡΧΑΙΟΛΟΓΙΑ","color": "#3d3527","author": "Josephus","hidden": true,"form": "HISTORY","pdf": "pdfs/Josephus/josephus-antiquities-4-Greek.pdf","transPair": {"a": "josephus-antiquities-4","e": "josephus-antiquities-4-e"},"transSelf": "e","kind": "history"},"text": {"title": "Ἰουδαϊκὴ Ἀρχαιολογία","greek": "ΦΛΑΥΙΟΥ ΙΩΣΗΠΟΥ ΙΟΥΔΑΪΚΗ ΑΡΧΑΙΟΛΟΓΙΑ","translator": "Greek text (Niese)","lang": "grc","short": "Greek","transPair": {"a": "josephus-antiquities-4","e": "josephus-antiquities-4-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "josephus-antiquities-4","reference": {"label": "Book.chapter.section","abbr": "","placeholder": "e.g. 18.3.3"}}},{"meta": {"key": "josephus-antiquities-5","en": "Antiquities of the Jews (Books XV–XVII)","gr": "ΙΟΥΔΑΪΚΗ ΑΡΧΑΙΟΛΟΓΙΑ","color": "#3d3527","author": "Josephus","form": "HISTORY","pdf": "pdfs/Josephus/josephus-antiquities-5.pdf","blurb": "Books XV to XVII of the Antiquities are the fullest ancient account of Herod the Great: his consolidation of power, the deaths of Aristobulus, Hyrcanus and Mariamne, his buildings at Caesarea, Sebaste and the Temple in Jerusalem, the quarrels within his household and the execution of his sons, his last illness and his wills. Book XVII closes with the disturbances after his death, the hearing before Augustus, and the removal of Archelaus in A.D. 6. William Whiston's translation of 1737 with his notes and chapter headings, and the Greek of Niese's edition as companion; the margin gives book, chapter and section in Whiston's numbering.","kind": "history","transPair": {"a": "josephus-antiquities-5","e": "josephus-antiquities-5-e"},"transSelf": "a"},"text": {"title": "Antiquities of the Jews (Books XV–XVII)","greek": "ΦΛΑΥΙΟΥ ΙΩΣΗΠΟΥ ΙΟΥΔΑΪΚΗ ΑΡΧΑΙΟΛΟΓΙΑ","subtitle": "Ioudaikē Archaiologia · history of the Jews from the Creation to A.D. 66, in twenty books · Books XV–XVII · trans. William Whiston","translator": "William Whiston (1737)","lang": "eng","short": "Whiston","transPair": {"a": "josephus-antiquities-5","e": "josephus-antiquities-5-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter.section","abbr": "","placeholder": "e.g. 18.3.3"},"parMirror": "josephus-antiquities-5"}},{"meta": {"key": "josephus-antiquities-5-e","en": "Antiquities of the Jews (Books XV–XVII)","gr": "ΙΟΥΔΑΪΚΗ ΑΡΧΑΙΟΛΟΓΙΑ","color": "#3d3527","author": "Josephus","hidden": true,"form": "HISTORY","pdf": "pdfs/Josephus/josephus-antiquities-5-Greek.pdf","transPair": {"a": "josephus-antiquities-5","e": "josephus-antiquities-5-e"},"transSelf": "e","kind": "history"},"text": {"title": "Ἰουδαϊκὴ Ἀρχαιολογία","greek": "ΦΛΑΥΙΟΥ ΙΩΣΗΠΟΥ ΙΟΥΔΑΪΚΗ ΑΡΧΑΙΟΛΟΓΙΑ","translator": "Greek text (Niese)","lang": "grc","short": "Greek","transPair": {"a": "josephus-antiquities-5","e": "josephus-antiquities-5-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "josephus-antiquities-5","reference": {"label": "Book.chapter.section","abbr": "","placeholder": "e.g. 18.3.3"}}},{"meta": {"key": "josephus-antiquities-6","en": "Antiquities of the Jews (Books XVIII–XX)","gr": "ΙΟΥΔΑΪΚΗ ΑΡΧΑΙΟΛΟΓΙΑ","color": "#3d3527","author": "Josephus","form": "HISTORY","pdf": "pdfs/Josephus/josephus-antiquities-6.pdf","blurb": "Books XVIII to XX, the last of the Antiquities, run from the census of Quirinius and the Roman governors of Judea — among them Pontius Pilate, with the passages on Jesus, John the Baptist and James — through the career of Agrippa I, the assassination of Caligula and the accession of Claudius told at length, the conversion of the royal house of Adiabene, and the procurators down to Gessius Florus and the eve of the revolt of A.D. 66, with a closing list of the high priests. William Whiston's translation of 1737 with his notes and chapter headings, and the Greek of Niese's edition as companion; the margin gives book, chapter and section in Whiston's numbering.","kind": "history","transPair": {"a": "josephus-antiquities-6","e": "josephus-antiquities-6-e"},"transSelf": "a"},"text": {"title": "Antiquities of the Jews (Books XVIII–XX)","greek": "ΦΛΑΥΙΟΥ ΙΩΣΗΠΟΥ ΙΟΥΔΑΪΚΗ ΑΡΧΑΙΟΛΟΓΙΑ","subtitle": "Ioudaikē Archaiologia · history of the Jews from the Creation to A.D. 66, in twenty books · Books XVIII–XX · trans. William Whiston","translator": "William Whiston (1737)","lang": "eng","short": "Whiston","transPair": {"a": "josephus-antiquities-6","e": "josephus-antiquities-6-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter.section","abbr": "","placeholder": "e.g. 18.3.3"},"parMirror": "josephus-antiquities-6"}},{"meta": {"key": "josephus-antiquities-6-e","en": "Antiquities of the Jews (Books XVIII–XX)","gr": "ΙΟΥΔΑΪΚΗ ΑΡΧΑΙΟΛΟΓΙΑ","color": "#3d3527","author": "Josephus","hidden": true,"form": "HISTORY","pdf": "pdfs/Josephus/josephus-antiquities-6-Greek.pdf","transPair": {"a": "josephus-antiquities-6","e": "josephus-antiquities-6-e"},"transSelf": "e","kind": "history"},"text": {"title": "Ἰουδαϊκὴ Ἀρχαιολογία","greek": "ΦΛΑΥΙΟΥ ΙΩΣΗΠΟΥ ΙΟΥΔΑΪΚΗ ΑΡΧΑΙΟΛΟΓΙΑ","translator": "Greek text (Niese)","lang": "grc","short": "Greek","transPair": {"a": "josephus-antiquities-6","e": "josephus-antiquities-6-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "josephus-antiquities-6","reference": {"label": "Book.chapter.section","abbr": "","placeholder": "e.g. 18.3.3"}}},{"meta": {"key": "josephus-war-1","en": "The Wars of the Jews (Books I–II)","gr": "ΙΣΤΟΡΙΑ ΙΟΥΔΑΪΚΟΥ ΠΟΛΕΜΟΥ ΠΡΟΣ ΡΩΜΑΙΟΥΣ","color": "#4a2a26","author": "Josephus","form": "HISTORY","pdf": "pdfs/Josephus/josephus-war-1.pdf","blurb": "Josephus's history of the revolt of Judea against Rome, written in the 70s A.D. by a man who had commanded in Galilee and then watched the siege of Jerusalem from the Roman camp. Books I and II give the background: Antiochus Epiphanes and the Maccabees, the Hasmonean kings, Pompey, the reign and family of Herod the Great, the governors after him, the account of the Pharisees, Sadducees and Essenes, and the outbreak of the war under Florus with the defeat of Cestius Gallus in A.D. 66. William Whiston's translation of 1737 with his notes and chapter headings, and the Greek of Niese's edition as companion; the margin gives book, chapter and section in Whiston's numbering.","kind": "history","transPair": {"a": "josephus-war-1","e": "josephus-war-1-e"},"transSelf": "a"},"text": {"title": "The Wars of the Jews (Books I–II)","greek": "ΦΛΑΥΙΟΥ ΙΩΣΗΠΟΥ ΙΣΤΟΡΙΑ ΙΟΥΔΑΪΚΟΥ ΠΟΛΕΜΟΥ ΠΡΟΣ ΡΩΜΑΙΟΥΣ","subtitle": "Historia Ioudaikou polemou pros Rhōmaious · history of the Jewish War of A.D. 66–73, in seven books · Books I–II · trans. William Whiston","translator": "William Whiston (1737)","lang": "eng","short": "Whiston","transPair": {"a": "josephus-war-1","e": "josephus-war-1-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter.section","abbr": "","placeholder": "e.g. 5.5.1"},"parMirror": "josephus-war-1"}},{"meta": {"key": "josephus-war-1-e","en": "The Wars of the Jews (Books I–II)","gr": "ΙΣΤΟΡΙΑ ΙΟΥΔΑΪΚΟΥ ΠΟΛΕΜΟΥ ΠΡΟΣ ΡΩΜΑΙΟΥΣ","color": "#4a2a26","author": "Josephus","hidden": true,"form": "HISTORY","pdf": "pdfs/Josephus/josephus-war-1-Greek.pdf","transPair": {"a": "josephus-war-1","e": "josephus-war-1-e"},"transSelf": "e","kind": "history"},"text": {"title": "Ἱστορία Ἰουδαϊκοῦ πολέμου πρὸς Ῥωμαίους","greek": "ΦΛΑΥΙΟΥ ΙΩΣΗΠΟΥ ΙΣΤΟΡΙΑ ΙΟΥΔΑΪΚΟΥ ΠΟΛΕΜΟΥ ΠΡΟΣ ΡΩΜΑΙΟΥΣ","translator": "Greek text (Niese)","lang": "grc","short": "Greek","transPair": {"a": "josephus-war-1","e": "josephus-war-1-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "josephus-war-1","reference": {"label": "Book.chapter.section","abbr": "","placeholder": "e.g. 5.5.1"}}},{"meta": {"key": "josephus-war-2","en": "The Wars of the Jews (Books III–IV)","gr": "ΙΣΤΟΡΙΑ ΙΟΥΔΑΪΚΟΥ ΠΟΛΕΜΟΥ ΠΡΟΣ ΡΩΜΑΙΟΥΣ","color": "#4a2a26","author": "Josephus","form": "HISTORY","pdf": "pdfs/Josephus/josephus-war-2.pdf","blurb": "Books III and IV of the Jewish War cover the campaign of Vespasian in A.D. 67–69: the description of Galilee and of the Roman army, the siege of Jotapata and the surrender of Josephus himself, the taking of Tarichaeae, Gamala and Gischala, the factions of the Zealots and the Idumeans in Jerusalem and the murder of the high priests, the description of the Dead Sea, and the civil war at Rome that ends with Vespasian proclaimed emperor. William Whiston's translation of 1737 with his notes and chapter headings, and the Greek of Niese's edition as companion; the margin gives book, chapter and section in Whiston's numbering.","kind": "history","transPair": {"a": "josephus-war-2","e": "josephus-war-2-e"},"transSelf": "a"},"text": {"title": "The Wars of the Jews (Books III–IV)","greek": "ΦΛΑΥΙΟΥ ΙΩΣΗΠΟΥ ΙΣΤΟΡΙΑ ΙΟΥΔΑΪΚΟΥ ΠΟΛΕΜΟΥ ΠΡΟΣ ΡΩΜΑΙΟΥΣ","subtitle": "Historia Ioudaikou polemou pros Rhōmaious · history of the Jewish War of A.D. 66–73, in seven books · Books III–IV · trans. William Whiston","translator": "William Whiston (1737)","lang": "eng","short": "Whiston","transPair": {"a": "josephus-war-2","e": "josephus-war-2-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.chapter.section","abb s-life","e": "josephus-life-e"},"transSelf": "a"},"text": {"title": "The Life of Flavius Josephus","greek": "ΦΛΑΥΙΟΥ ΙΩΣΗΠΟΥ ΒΙΟΣ","subtitle": "Iōsēpou bios · autobiography · trans. William Whiston","translator": "William Whiston (1737)","lang": "eng","short": "Whiston","transPair": {"a": "josephus-life","e": "josephus-life-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Section","abbr": "","placeholder": "e.g. 12"},"parMirror": "josephus-life"}},{"meta": {"key": "josephus-life-e","en": "The Life of Flavius Josephus","gr": "ΙΩΣΗΠΟΥ ΒΙΟΣ","color": "#2f3a3d","author": "Josephus","hidden": true,"form": "BIOGRAPHY","pdf": "pdfs/Josephus/josephus-life-Greek.pdf","transPair": {"a": "josephus-life","e": "josephus-life-e"},"transSelf": "e","kind": "history"},"text": {"title": "Ἰωσήπου βίος","greek": "ΦΛΑΥΙΟΥ ΙΩΣΗΠΟΥ ΒΙΟΣ","translator": "Greek text (Niese)","lang": "grc","short": "Greek","transPair": {"a": "josephus-life","e": "josephus-life-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "josephus-life","reference": {"label": "Section","abbr": "","placeholder": "e.g. 12"}}},{"meta": {"key": "josephus-against-apion","en": "Against Apion","gr": "ΠΕΡΙ ΑΡΧΑΙΟΤΗΤΟΣ ΙΟΥΔΑΙΩΝ","color": "#35402e","author": "Josephus","form": "TREATISE","pdf": "pdfs/Josephus/josephus-against-apion.pdf","blurb": "A defence of the antiquity of the Jewish people and of their law, in two books, written after the Antiquities. The first book sets the records of the Egyptians, Phoenicians and Chaldeans against the silence of the Greek historians, quoting Manetho, Berosus, Menander of Ephesus and others, and answers the hostile accounts of the Exodus. The second replies to the Alexandrian grammarian Apion and to Apollonius Molon, and ends with an exposition of the Mosaic constitution. William Whiston's translation of 1737 with his notes, and the Greek of Niese's edition as companion; where the Greek is lost (2.5–10) the old Latin version stands in the companion's notes. The margin gives book and Whiston's section.","kind": "treatise","transPair": {"a": "josephus-against-apion","e": "josephus-against-apion-e"},"transSelf": "a"},"text": {"title": "Against Apion","greek": "ΦΛΑΥΙΟΥ ΙΩΣΗΠΟΥ ΠΕΡΙ ΑΡΧΑΙΟΤΗΤΟΣ ΙΟΥΔΑΙΩΝ","subtitle": "Peri archaiotētos Ioudaiōn (Contra Apionem) · apologetic treatise in two books · trans. William Whiston","translator": "William Whiston (1737)","lang": "eng","short": "Whiston","transPair": {"a": "josephus-against-apion","e": "josephus-against-apion-e"},"transSelf": "a","noSpeakerLabels": true,"reference": {"label": "Book.section","abbr": "","placeholder": "e.g. 2.17"},"parMirror": "josephus-against-apion"}},{"meta": {"key": "josephus-against-apion-e","en": "Against Apion","gr": "ΠΕΡΙ ΑΡΧΑΙΟΤΗΤΟΣ ΙΟΥΔΑΙΩΝ","color": "#35402e","author": "Josephus","hidden": true,"form": "TREATISE","pdf": "pdfs/Josephus/josephus-against-apion-Greek.pdf","transPair": {"a": "josephus-against-apion","e": "josephus-against-apion-e"},"transSelf": "e","kind": "treatise"},"text": {"title": "Περὶ ἀρχαιότητος Ἰουδαίων","greek": "ΦΛΑΥΙΟΥ ΙΩΣΗΠΟΥ ΠΕΡΙ ΑΡΧΑΙΟΤΗΤΟΣ ΙΟΥΔΑΙΩΝ","translator": "Greek text (Niese)","lang": "grc","short": "Greek","transPair": {"a": "josephus-against-apion","e": "josephus-against-apion-e"},"transSelf": "e","noSpeakerLabels": true,"parMirror": "josephus-against-apion","reference": {"label": "Book.section","abbr": "","placeholder": "e.g. 2.17"}}},{"meta": {"key": "sindibad-persian","en": "The Book of Sindibad (Persian version)","gr": "سندبادنامه","color": "#274a6e","author": "The Book of Sindibad","kind": "prose","form": "TALES","blurb": "The tale of the prince, the seven viziers and the king’s wicked consort, whose stories against and for the wiles of women hold off an execution for seven days. W. A. Clouston’s account and translation of the Persian Sindibād-nāma (1884)."},"text": {"title": "The Book of Sindibad (Persian version)","greek": "سندبادنامه","translator": "W. A. Clouston (1884)","noSpeakerLabels": true,"reference": {"label": "Tale.paragraph","abbr": "","placeholder": "e.g. 1.1"},"lang": "eng","short": "Clouston"}},{"meta": {"key": "sindibad-arabic","en": "The Book of Sindibad (Arabic version)","gr": "","color": "#274a6e","author": "The Book of Sindibad","kind": "prose","form": "TALES","blurb": "The Arabic telling of the Seven Viziers, as it stands in the Thousand and One Nights, in Jonathan Scott’s translation, edited by W. A. Clouston in 1884."},"text": {"title": "The Book of Sindibad (Arabic version)","greek": "","translator": "Jonathan Scott (1800; ed. Clouston 1884)","noSpeakerLabels": true,"reference": {"label": "Tale.paragraph","abbr": "","placeholder": "e.g. 1.1"},"lang": "eng","short": "Scott"}},{"meta": {"key": "izdubar-epic","en": "The Epic of Izdubar (Gilgamesh)","color": "#8a6a2a","author": "Ancient Babylon","form": "EPIC","kind": "verse","blurb": "The oldest epic of the world as the nineteenth century first read it from the Nineveh tablets: the hero Izdubar — Gilgamesh — king of Erech, the goddess Ishtar, the wild man Heabani (Enkidu), the journey to the sage of the Flood. Hamilton’s verse reconstruction, from the fragments then known, in twelve tablets."},"text": {"title": "The Epic of Izdubar (Gilgamesh)","translator": "Leonidas Le Cenci Hamilton (1884)","lang": "eng","short": "Hamilton","noSpeakerLabels": true}},{"meta": {"key": "babylonian-tablets","en": "Tablets and Cuneiform Inscriptions","color": "#7a5a2a","author": "Ancient Babylon","form": "SCRIPTURE","kind": "prose","blurb": "The voice of Babylon and Assyria in their own inscriptions: exorcisms and incantations, penitential psalms, hymns to the Moon-god and the Sun-god, the Descent of Ishtar into the underworld, the creation tablets, the annals of Assyrian kings, and the Behistun inscription of Darius — as translated by the first Assyriologists (Wilson ed., 1901)."},"text": {"title": "Tablets and Cuneiform Inscriptions","translator": "Sayce, Talbot, Rawlinson, Boscawen, Lenormant, Oppert and others","lang": "eng","short": "Various"}},{"meta": {"key": "budge-creation-tablets","en": "The Seven Tablets of Creation","color": "#6a4a2a","author": "Ancient Babylon","form": "SCRIPTURE","kind": "verse","blurb": "Enuma elish, “When on high”: the Babylonian epic of creation, the birth of the gods from Apsu and Tiamat, Marduk’s battle with the dragon of chaos, and the making of heaven, earth and mankind from her body. Budge’s translation of the seven tablets."},"text": {"title": "The Seven Tablets of Creation","translator": "E. A. Wallis Budge (1921)","lang": "eng","short": "Budge","noSpeakerLabels": true}},{"meta": {"key": "budge-deluge","en": "The Babylonian Story of the Deluge","color": "#5a4a3a","author": "Ancient Babylon","form": "HISTORY","kind": "prose","blurb": "How the flood legend was found on the tablets of Ashurbanipal’s library at Nineveh, the version of Berosus, and Budge’s account of the twelve tablets of the Gilgamesh epic, culminating in Uta-napishtim’s story of the Flood."},"text": {"title": "The Babylonian Story of the Deluge","translator": "E. A. Wallis Budge (1920)","lang": "eng","short": "Budge"}},{"meta": {"key": "code-of-hammurabi","en": "The Code of Hammurabi","color": "#6a5a3a","author": "Hammurabi","form": "TREATISE","kind": "prose","blurb": "The laws of Hammurabi, king of Babylon, cut on a stele of black diorite: justice for the widow and orphan, an eye for an eye, the laws of trade, marriage, inheritance, wages and slaves. Johns’s translation, cited by section."},"text": {"title": "The Code of Hammurabi","translator": "C. H. W. Johns (1903)","lang": "eng","short": "Johns","reference": {"label": "Section","abbr": "","placeholder": "e.g. 196"}}},{"meta": {"key": "amarna-letters","en": "The Tell el-Amarna Letters","color": "#7a6a4a","author": "The Amarna Archive","form": "LETTERS","kind": "prose","blurb": "The clay-tablet letters of the kings and governors of Canaan and Syria to Pharaoh, found at Amarna: Ribadda of Gebal pleading for help, the treachery of Aziru the Amorite, the Hittite advance — the Near East of the fourteenth century BC in its own correspondence."},"text": {"title": "The Tell el-Amarna Letters","translator": "C. R. Conder (1893)","lang": "eng","short": "Conder"}},{"meta": {"key": "shahnameh","en": "The Shahnameh (The Book of Kings)","color": "#5a3a6a","author": "Ferdowsi","form": "EPIC","kind": "verse","blurb": "Ferdowsi’s epic of the kings of Persia, from Kaiúmers, the first king, through Kavah the blacksmith, the Seven Labors of Rustem, Sohrab and Rustem, to Sikander and the poet’s satire on Mahmud. James Atkinson’s abridged verse-and-prose translation."},"text": {"title": "The Shahnameh (The Book of Kings)","translator": "James Atkinson (1832)","lang": "eng","short": "Atkinson","noSpeakerLabels": true}},{"meta": {"key": "rubaiyat-fitzgerald","en": "The Rubaiyat of Omar Khayyam","color": "#6a4a7a","author": "Omar Khayyam","form": "POETRY","kind": "verse","blurb": "“A Book of Verses underneath the Bough, a Jug of Wine, a Loaf of Bread — and Thou.” The quatrains of the Persian astronomer-poet in Edward FitzGerald’s famous English, cited by quatrain."},"text": {"title": "The Rubaiyat of Omar Khayyam","translator": "Edward FitzGerald","lang": "eng","short": "FitzGerald","noSpeakerLabels": true,"reference": {"label": "Quatrain","abbr": "","placeholder": "e.g. XII"}}},{"meta": {"key": "hafiz-divan","en": "Poems from the Divan of Hafiz","color": "#7a3a5a","author": "Hafiz","form": "POETRY","kind": "verse","blurb": "The ghazals of Hafiz of Shiraz — wine, the beloved, the tavern of ruin and the mystic’s longing — in Gertrude Bell’s translation, the finest Hafiz in English."},"text": {"title": "Poems from the Divan of Hafiz","translator": "Gertrude Lowthian Bell (1897)","lang": "eng","short": "Bell","noSpeakerLabels": true,"reference": {"label": "Poem","abbr": "","placeholder": "e.g. IV"}}},{"meta": {"key": "rumi-mesnevi","en": "The Mesnevi (Book I)","color": "#4a3a6a","author": "Rumi","form": "POETRY","kind": "verse","blurb": "“Hearken to the reed-flute, how it complains, lamenting its banishment from its home.” The first book of Jalal al-Din Rumi’s great mystical poem, its stories, parables and teaching, in Redhouse’s translation."},"text": {"title": "The Mesnevi (Book I)","translator": "James W. Redhouse (1881)","lang": "eng","short": "Redhouse","noSpeakerLabels": true}},{"meta": {"key": "saadi-gulistan","en": "The Gulistan (The Rose Garden)","color": "#3a5a4a","author": "Saadi","form": "ESSAYS","kind": "prose","blurb": "Saadi of Shiraz’s Rose Garden: tales and maxims of kings, dervishes, love, youth and old age, contentment and silence, in prose interwoven with verse — the most beloved book of Persian wisdom. James Ross’s translation."},"text": {"title": "The Gulistan (The Rose Garden)","translator": "James Ross (1823)","lang": "eng","short": "Ross"}},{"meta": {"key": "quran-rodwell","en": "The Qur’an","color": "#2a5a4a","author": "The Qur’an","form": "SCRIPTURE","kind": "prose","blurb": "The scripture of Islam in J. M. Rodwell’s translation, with the suras arranged in the chronological order he proposed, from the first revelation (“Recite in the name of thy Lord”) to the Medinan suras."},"text": {"title": "The Qur’an","translator": "J. M. Rodwell (1861)","lang": "eng","short": "Rodwell"}},{"meta": {"key": "arabian-nights","en": "The Arabian Nights Entertainments","color": "#7a5a2a","author": "The Thousand and One Nights","form": "NOVEL","kind": "prose","blurb": "Scheherazade’s tales told night after night to the Sultan: the Merchant and the Genius, the Fisherman, the Three Calenders, the Voyages of Sindbad the Sailor, Aladdin and the Wonderful Lamp, Ali Baba and the Forty Thieves. Andrew Lang’s selection."},"text": {"title": "The Arabian Nights Entertainments","translator": "Andrew Lang (ed., 1898)","lang": "eng","short": "Lang"}},{"meta": {"key": "bible-kjv-ot","en": "The Old Testament","color": "#3a3a6a","author": "The Bible","form": "SCRIPTURE","kind": "prose","blurb": "The Hebrew scriptures in the King James Version: the Law, the Histories, the Psalms and Wisdom books, and the Prophets, from Genesis to Malachi. Cited by chapter and verse."},"text": {"title": "The Old Testament","translator": "King James Version (1611)","lang": "eng","short": "KJV","reference": {"label": "Chapter:verse","abbr": "","placeholder": "e.g. 1:1"}}},{"meta": {"key": "bible-kjv-nt","en": "The New Testament","color": "#3a3a6a","author": "The Bible","form": "SCRIPTURE","kind": "prose","blurb": "The Gospels, the Acts of the Apostles, the Epistles and the Revelation of St John, in the King James Version. Cited by chapter and verse."},"text": {"title": "The New Testament","translator": "King James Version (1611)","lang": "eng","short": "KJV","reference": {"label": "Chapter:verse","abbr": "","placeholder": "e.g. 3:16"}}},{"meta": {"key": "apocrypha-kjv","en": "The Apocrypha","color": "#4a4a6a","author": "The Apocrypha","form": "SCRIPTURE","kind": "prose","blurb": "The books between the Testaments in the King James Version: Esdras, Tobit, Judith, the Wisdom of Solomon, Ecclesiasticus, Baruch, the Song of the Three Children, Susanna, Bel and the Dragon, the Prayer of Manasses and the Books of the Maccabees — with the Greek of the Septuagint beside it.","gr": "ΤΑ ΑΠΟΚΡΥΦΑ","transPair": {"a": "apocrypha-kjv","b": "apocrypha-kjv-b"},"transSelf": "a"},"text": {"title": "The Apocrypha","translator": "King James Version (1611)","lang": "eng","short": "KJV","reference": {"label": "Book chapter:verse","abbr": "","placeholder": "e.g. Tob 1:1"},"transPair": {"a": "apocrypha-kjv","b": "apocrypha-kjv-b"},"transSelf": "a","noSpeakerLabels": true}},{"meta": {"key": "book-of-enoch","en": "The Book of Enoch","color": "#4a3a5a","author": "Enoch","form": "SCRIPTURE","kind": "prose","blurb": "The visions of Enoch, the seventh from Adam: the fall of the Watchers, the journeys through heaven and Sheol, the Parables of the Elect One, the Book of the Heavenly Luminaries, and the Dream-Visions. R. H. Charles’s translation from the Ethiopic. With Richard Laurence’s earlier translation, and the surviving Greek of chapters 1–32.","gr": "ΒΙΒΛΟΣ ΕΝΩΧ","transPair": {"a": "book-of-enoch","e": "book-of-enoch-e","b": "book-of-enoch-b"},"transSelf": "a"},"text": {"title": "The Book of Enoch","translator": "R. H. Charles (1917)","lang": "eng","short": "Charles","reference": {"label": "Chapter.verse","abbr": "","placeholder": "e.g. 6.1"},"transPair": {"a": "book-of-enoch","e": "book-of-enoch-e","b": "book-of-enoch-b"},"transSelf": "a","noSpeakerLabels": true}},{"meta": {"key": "pistis-sophia","en": "Pistis Sophia","color": "#3a4a5a","author": "The Gnostics","form": "SCRIPTURE","kind": "prose","blurb": "The Gnostic gospel of the risen Jesus teaching his disciples for twelve years on the Mount of Olives: the fall and repentance of Pistis Sophia through the thirteen aeons, the mysteries of light, and the fate of souls. George Horner’s translation from the Coptic."},"text": {"title": "Pistis Sophia","translator": "George Horner (1924)","lang": "eng","short": "Horner"}},{"meta": {"key": "hebraic-literature","en": "Hebraic Literature: Talmud, Midrash and Kabbala","color": "#5a4a4a","author": "The Rabbis","form": "TREATISE","kind": "prose","blurb": "Selections from the Talmud — law, ethics and legend — the Midrashim, the Kabbalah, and the proverbs and traditions of the rabbis."},"text": {"title": "Hebraic Literature: Talmud, Midrash and Kabbala","translator": "Maurice H. Harris (ed., 1901)","lang": "eng","short": "Harris"}},{"meta": {"key": "apocryphal-new-testament","en": "The Apocryphal New Testament","color": "#5a3a4a","author": "The Apocryphal New Testament","form": "SCRIPTURE","kind": "prose","blurb": "The gospels and letters left out of the New Testament: the Birth of Mary, the Protevangelion of James, the two Infancy Gospels, the Gospel of Nicodemus with the descent into hell, the letters of Christ and Abgar, Paul and Thecla, and the Apostolic Fathers — Clement, Barnabas, Ignatius, Polycarp and the Shepherd of Hermas."},"text": {"title": "The Apocryphal New Testament","translator": "Jeremiah Jones and William Wake (ed. William Hone, 1820)","lang": "eng","short": "Jeremiah Jones and Wil"}},{"meta": {"key": "adam-and-eve-1","en": "The First Book of Adam and Eve","color": "#4a5a3a","author": "Adam and Eve","form": "SCRIPTURE","kind": "prose","blurb": "The Conflict of Adam and Eve with Satan: life after Eden in the Cave of Treasures, the grief of the first parents, Satan’s many deceptions, and the story of Cain and Abel."},"text": {"title": "The First Book of Adam and Eve","translator": "S. C. Malan (1882), ed. Rutherford H. Platt","lang": "eng","short": "S. C. Malan"}},{"meta": {"key": "mead-gnostic-crucifixion","en": "The Gnostic Crucifixion","color": "#3a4a5a","author": "The Gnostics","form": "SCRIPTURE","kind": "prose","blurb": "The Vision of the Cross of Light from the Acts of John, in which Christ shows John the mystery of the cross while the crucifixion takes place below — with Mead’s commentary."},"text": {"title": "The Gnostic Crucifixion","translator": "G. R. S. Mead (1907)","lang": "eng","short": "G. R. S. Mead"}},{"meta": {"key": "ginzberg-legends-1","en": "The Legends of the Jews, Volume I","color": "#5a4a3a","author": "Louis Ginzberg","form": "HISTORY","kind": "prose","blurb": "From the Creation to Jacob: the six days, Adam and Eve, the ten generations, Noah, Abraham, Isaac and Jacob, as the rabbis, the apocrypha and the pseudepigrapha tell it."},"text": {"title": "The Legends of the Jews, Volume I","translator": "Henrietta Szold (1909)","lang": "eng","short": "Henrietta Szold"}},{"meta": {"key": "ginzberg-legends-2","en": "The Legends of the Jews, Volume II","color": "#5a4a3a","author": "Louis Ginzberg","form": "HISTORY","kind": "prose","blurb": "Joseph and his brothers, the Testaments of the twelve sons of Jacob, Job, and Moses in Egypt."},"text": {"title": "The Legends of the Jews, Volume
