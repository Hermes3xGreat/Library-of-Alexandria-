ster during King Philip’s War, Mary Rowlandson tells her eleven weeks with the Narragansett and Wampanoag in twenty “removes” — the first American bestseller."},"text": {"title": "The Captivity and Restoration of Mary Rowlandson","translator": "Original text (1682)","lang": "eng","short": "Rowlandson"}},{"meta": {"key": "crevecoeur-american-farmer","en": "Letters from an American Farmer","color": "#4a6a3a","author": "J. Hector St. John de Crèvecoeur","form": "LETTERS","kind": "prose","blurb": "“What then is the American, this new man?” A French-born farmer’s letters on colonial life, Nantucket, Charleston and slavery, and the frontier on the eve of the Revolution."},"text": {"title": "Letters from an American Farmer","translator": "Original text (1782)","lang": "eng","short": "Crèvecoeur"}},{"meta": {"key": "wheatley-poems","en": "Poems on Various Subjects","color": "#5a3a5a","author": "Phillis Wheatley","form": "POETRY","kind": "verse","blurb": "The first book of poems by an African American, written by a young enslaved woman in Boston: elegies, hymns, odes to Maecenas and to King George, and “On being brought from Africa to America.”"},"text": {"title": "Poems on Various Subjects","translator": "Original text (1773)","lang": "eng","short": "Wheatley","noSpeakerLabels": true}},{"meta": {"key": "franklin-autobiography","en": "The Autobiography of Benjamin Franklin","color": "#6a5a2a","author": "Benjamin Franklin","form": "MEMOIR","kind": "prose","blurb": "The printer’s apprentice who ran away to Philadelphia and became its first citizen: his trade, his newspapers, his thirteen virtues and his public projects, in his own words."},"text": {"title": "The Autobiography of Benjamin Franklin","translator": "Original text","lang": "eng","short": "Franklin"}},{"meta": {"key": "paine-common-sense","en": "Common Sense","color": "#7a3a2a","author": "Thomas Paine","form": "TREATISE","kind": "prose","blurb": "The pamphlet that turned the colonies toward independence: government, ": "Democracy in America, Volume I","translator": "Henry Reeve (1835)","lang": "eng","short": "Reeve"}},{"meta": {"key": "tocqueville-democracy-2","en": "Democracy in America, Volume II","color": "#4a3a2a","author": "Alexis de Tocqueville","form": "TREATISE","kind": "prose","blurb": "How equality shapes American thought, feeling and manners: individualism and associations, religion, the arts, the family, ambition — and the soft despotism democracies should fear."},"text": {"title": "Democracy in America, Volume II","translator": "Henry Reeve (1840)","lang": "eng","short": "Reeve"}},{"meta": {"key": "parkman-oregon-trail","en": "The Oregon Trail","color": "#6a4a2a","author": "Francis Parkman","form": "MEMOIR","kind": "prose","blurb": "A young Bostonian’s summer of 1846 on the plains: emigrant trains, Fort Laramie, buffalo hunting, and life in an Oglala Lakota village."},"text": {"title": "The Oregon Trail","translator": "Original text (1849)","lang": "eng","short": "Parkman"}},{"meta": {"key": "turner-frontier","en": "The Frontier in American History","color": "#5a5a3a","author": "Frederick Jackson Turner","form": "HISTORY","kind": "prose","blurb": "Turner’s famous thesis that the moving frontier made American democracy, with his essays on the Old West, the Middle West, the Ohio and Mississippi valleys and pioneer ideals."},"text": {"title": "The Frontier in American History","translator": "Original text (1920)","lang": "eng","short": "Turner"}},{"meta": {"key": "douglass-narrative","en": "Narrative of the Life of Frederick Douglass","color": "#3a2a2a","author": "Frederick Douglass","form": "MEMOIR","kind": "prose","blurb": "Douglass’s own account of his life in slavery in Maryland, how he learned to read, his fight with the slave-breaker Covey, and his escape to freedom."},"text": {"title": "Narrative of the Life of Frederick Douglass","translator": "Original text (1845)","lang": "eng","short": "Douglass"}},{"meta": {"key": "jacobs-incidents","en": "Incidents in the orge Washington","form": "LETTERS","kind": "prose","blurb": "Washington’s letters to and from the lodges and Grand Lodges, from the Washington papers in the Library of Congress, with the editor’s account of each."},"text": {"title": "Washington’s Masonic Correspondence","translator": "Julius F. Sachse (ed., 1915)","lang": "eng","short": "Julius F. Sachse"}},{"meta": {"key": "upham-salem-witchcraft","en": "Salem Witchcraft","color": "#3a2a2a","author": "Charles W. Upham","form": "HISTORY","kind": "prose","blurb": "Salem Village and its people, the history of opinions on witchcraft, and the delusion of 1692 from the first accusations to the executions and the repentance afterwards."},"text": {"title": "Salem Witchcraft","translator": "Original text (1867)","lang": "eng","short": "Original text"}}]}</script>
