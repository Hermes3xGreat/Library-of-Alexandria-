<script id="hermes-manifest" type="application/json">{"type": "hermes-manifest","version": 1,"books": [{"meta": {"key": "equiano-narrative","en": "The Interesting Narrative of Olaudah Equiano","color": "#5a3a2a","author": "Olaudah Equiano","form": "MEMOIR","kind": "prose","blurb": "Kidnapped as a child in what is now Nigeria, carried through the Middle Passage, enslaved in Virginia and at sea, Equiano bought his freedom and became a leader of the movement to abolish the slave trade."},"text": {"title": "The Interesting Narrative of Olaudah Equiano","translator": "Original text (1789)","lang": "eng","short": "Equiano"}},{"meta": {"key": "augustine-confessions","en": "The Confessions","color": "#5a3a2a","author": "Augustine of Hippo","form": "MEMOIR","kind": "prose","blurb": "The first autobiography, by a North African: Augustine’s boyhood at Thagaste, the pears, Carthage and its loves, his mother Monica, the Manichees, Milan and the garden — “our heart is restless, until it repose in Thee” — and the meditations on memory and time."},"text": {"title": "The Confessions","translator": "E. B. Pusey (1838)","lang": "eng","short": "Pusey"}},{"meta": {"key": "west-african-folk-tales","en": "West African Folk-Tales","color": "#7a4a1a","author": "The Akan Storytellers","form": "NOVEL","kind": "prose","blurb": "Anansi the spider and how all stories came to be called his; why the lizard nods, how the tortoise got its shell, the grinding-stone that ground flour by itself — tales gathered on the Gold Coast."},"text": {"title": "West African Folk-Tales","translator": "W. H. Barker and Cecilia Sinclair (1917)","lang": "eng","short": "Barker"}},{"meta": {"key": "dayrell-southern-nigeria","en": "Folk Stories from Southern Nigeria","color": "#6a4a2a","author": "The Efik and Ibibio Storytellers","form": "NOVEL","kind": "prose","blurb": "Forty tales from Calabar and the Cross River: the tortoise with a pretty daughter, the king’s magic drum, why the sun and the moon live in the sky, why the bat flies by night."},"text": {"title": "Folk Stories from Southern Nigeria","translator": "Elphinstone Dayrell (1910)","lang": "eng","short": "Dayrell"}},{"meta": {"key": "nassau-where-animals-talk","en": "Where Animals Talk","color": "#4a5a2a","author": "The Mpongwe, Benga and Fang Storytellers","form": "NOVEL","kind": "prose","blurb": "Animal tales of Gabon and the Ogowe told by Mpongwe, Benga and Fang narrators: Tortoise the trickster, Leopard his dupe, and the palavers of the forest."},"text": {"title": "Where Animals Talk","translator": "Robert H. Nassau (1912)","lang": "eng","short": "Nassau"}},{"meta": {"key": "park-travels-1","en": "Travels in the Interior of Africa, Volume I","color": "#5a5a3a","author": "Mungo Park","form": "HISTORY","kind": "prose","blurb": "The young Scottish surgeon’s journey up the Gambia in 1795 through Woolli, Bondou and Kaarta, his captivity among the Moors of Ludamar, and his escape toward the Niger."},"text": {"title": "Travels in the Interior of Africa, Volume I","translator": "Original text (1799)","lang": "eng","short": "Park"}},{"meta": {"key": "park-travels-2","en": "Travels in the Interior of Africa, Volume II","color": "#5a5a3a","author": "Mungo Park","form": "HISTORY","kind": "prose","blurb": "Park reaches the Niger at Sego — “glittering to the morning sun” — is sheltered by a Bambara woman, and makes the long walk back through Manding and the Jallonka wilderness with a slave coffle."},"text": {"title": "Travels in the Interior of Africa, Volume II","translator": "Original text (1799)","lang": "eng","short": "Park"}},{"meta": {"key": "zanzibar-tales","en": "Zanzibar Tales","color": "#2a5a5a","author": "The Swahili Storytellers","form": "NOVEL","kind": "prose","blurb": "Swahili tales told on the East Coast: the monkey, the shark and the washerman’s donkey; the hare and the lion; Goso the teacher; the magician and the sultan’s son."},"text": {"title": "Zanzibar Tales","translator": "George W. Bateman (1901)","lang": "eng","short": "Bateman"}},{"meta": {"key": "lobo-abyssinia","en": "A Voyage to Abyssinia","color": "#6a3a3a","author": "Jerónimo Lobo","form": "HISTORY","kind": "prose","blurb": "A Portuguese Jesuit’s years in Ethiopia in the 1620s — the Red Sea, the highlands, the court of the Emperor, the source of the Blue Nile — in the translation that was Samuel Johnson’s first book."},"text": {"title": "A Voyage to Abyssinia","translator": "Samuel Johnson (1735)","lang": "eng","short": "Johnson"}},{"meta": {"key": "south-african-folk-tales","en": "South-African Folk-Tales","color": "#6a5a2a","author": "The Khoekhoe and San Storytellers","form": "NOVEL","kind": "prose","blurb": "Jackal, Lion, Tortoise and the Moon’s lost message of immortality: Khoekhoe and San tales, with Zulu stories, gathered from the old collections."},"text": {"title": "South-African Folk-Tales","translator": "James A. Honey (1910)","lang": "eng","short": "Honey"}},{"meta": {"key": "bleek-reynard-south-africa","en": "Reynard the Fox in South Africa","color": "#6a5a2a","author": "The Khoekhoe and San Storytellers","form": "NOVEL","kind": "prose","blurb": "The first collection of Khoekhoe fables and tales in English: the jackal fables, tortoise, baboon and lion fables, Sun and Moon stories, and the legends of Heitsi Eibip."},"text": {"title": "Reynard the Fox in South Africa","translator": "W. H. I. Bleek (1864)","lang": "eng","short": "Bleek"}},{"meta": {"key": "theal-kaffir-folk-lore","en": "Xhosa Folk-Lore","color": "#4a4a5a","author": "The Xhosa Storytellers","form": "NOVEL","kind": "prose","blurb": "Xhosa tales written down from native tellers — the bird that made milk, Five Heads, Hlakanyana the trickster, Demane and Demazana — with Theal’s account of Xhosa life. First published under the colonial title “Kaffir Folk-Lore”; the text keeps the usage of its day."},"text": {"title": "Xhosa Folk-Lore","translator": "George McCall Theal (1886)","lang": "eng","short": "Theal"}},{"meta": {"key": "basutoland-legends","en": "Basutoland: Its Legends and Customs","color": "#3a5a4a","author": "Minnie Martin","form": "HISTORY","kind": "prose","blurb": "The history of the Basotho from Moshoeshoe and Thaba Bosiu, their customs and beliefs, and a group of Sesotho legends as told to a resident in the 1890s."},"text": {"title": "Basutoland: Its Legends and Customs","translator": "Original text (1903)","lang": "eng","short": "Martin"}},{"meta": {"key": "plaatje-native-life","en": "Native Life in South Africa","color": "#3a3a3a","author": "Sol T. Plaatje","form": "HISTORY","kind": "prose","blurb": "“Awaking on Friday morning, June 20, 1913, the South African Native found himself, not actually a slave, but a pariah in the land of his birth.” Plaatje’s eyewitness indictment of the Natives’ Land Act and the deputation to London."},"text": {"title": "Native Life in South Africa","translator": "Original text (1916)","lang": "eng","short": "Plaatje"}},{"meta": {"key": "schreiner-african-farm","en": "The Story of an African Farm","color": "#7a5a3a","author": "Olive Schreiner","form": "NOVEL","kind": "prose","blurb": "On a lonely ostrich farm in the Karoo, Waldo, Em and the fiercely independent Lyndall grow up: the first great South African novel."},"text": {"title": "The Story of an African Farm","translator": "Original text (1883)","lang": "eng","short": "Schreiner"}},{"meta": {"key": "sancho-letters","en": "Letters of Ignatius Sancho","color": "#4a3a5a","author": "Ignatius Sancho","form": "LETTERS","kind": "prose","blurb": "Born on a slave ship, Sancho became a London grocer, composer, and the first Black Briton known to vote. His witty, warm letters — to Sterne, to friends, on the Gordon Riots and the slave trade."},"text": {"title": "Letters of Ignatius Sancho","translator": "Original text (1782)","lang": "eng","short": "Sancho"}},{"meta": {"key": "du-bois-the-negro","en": "The Negro","color": "#2a3a4a","author": "W. E. B. Du Bois","form": "HISTORY","kind": "prose","blurb": "Du Bois’s pioneering history of Africa and its diaspora: Ethiopia and Egypt, Ghana, Mali and Songhay, the Guinea coast and the Congo, the great lakes and Zimbabwe, the slave trade, and the peoples of African descent in the Americas."},"text": {"title": "The Negro","translator": "Original text (1915)","lang": "eng","short": "Du Bois"}},{"meta": {"key": "cronise-cunnie-rabbit","en": "Cunnie Rabbit, Mr. Spider and the Other Beef","color": "#7a4a1a","author": "The Temne and Mende Storytellers","form": "NOVEL","kind": "prose","blurb": "Tales heard at the fireside in Sierra Leone and set down in the storytellers’ own Krio English: Mr. Spider the glutton and trickster, clever little Cunnie Rabbit, Leopard, Elephant and the rest."},"text": {"title": "Cunnie Rabbit, Mr. Spider and the Other Beef","translator": "Florence M. Cronise and Henry W. Ward (1903)","lang": "eng","short": "Florence M. Cronise an"}},{"meta": {"key": "dayrell-ikom-folk-stories","en": "Ikom Folk Stories from Southern Nigeria","color": "#6a4a2a","author": "The Efik and Ibibio Storytellers","form": "NOVEL","kind": "prose","blurb": "Thirty-four stories from Ikom on the upper Cross River: abandoned twins saved by a hawk, the cunning hare, kings, witches and the origins of customs."},"text": {"title": "Ikom Folk Stories from Southern Nigeria","translator": "Elphinstone Dayrell (1913)","lang": "eng","short": "Elphinstone Dayrell"}},{"meta": {"key": "weeks-congo-life-folklore","en": "Congo Life and Folklore","color": "#4a5a2a","author": "John H. Weeks","form": "HISTORY","kind": "prose","blurb": "Part one tells the life of the lower Congo as a brass rod passed from hand to hand might see it; part two gathers thirty-three Bakongo folk tales."},"text": {"title": "Congo Life and Folklore","translator": "John H. Weeks (1911)","lang": "eng","short": "John H. Weeks"}},{"meta": {"key": "kingsley-travels-west-africa","en": "Travels in West Africa","color": "#3a5a5a","author": "Mary H. Kingsley","form": "HISTORY","kind": "prose","blurb": "Mary Kingsley’s journeys of 1893–95 up the Ogowe and Rembwe rivers among the Fang, and her ascent of Mount Cameroon — sharp, funny and unconventional."},"text": {"title": "Travels in West Africa","translator": "Original text (1897)","lang": "eng","short": "Original text"}},{"meta": {"key": "speke-source-of-the-nile","en": "The Discovery of the Source of the Nile","color": "#2a5a5a","author": "John Hanning Speke","form": "HISTORY","kind": "prose","blurb": "From Zanzibar to Karagwe, Buganda and the court of King Mutesa, and on to the outflow of the Nile from Lake Victoria in 1862."},"text": {"title": "The Discovery of the Source of the Nile","translator": "Original text (1863)","lang": "eng","short": "Original text"}},{"meta": {"key": "hobley-bantu-beliefs","en": "Bantu Beliefs and Magic","color": "#5a5a3a","author": "C. W. Hobley","form": "HISTORY","kind": "prose","blurb": "The religion of the Kikuyu and Kamba of Kenya: ancestral spirits, sacrifice, sacred trees, the curse and its removal, medicine men and ceremonial uncleanness."},"text": {"title": "Bantu Beliefs and Magic","translator": "Original text (1922)","lang": "eng","short": "Original text"}},{"meta": {"key": "fitzpatrick-jock-of-the-bushveld","en": "Jock of the Bushveld","color": "#7a5a3a","author": "Percy FitzPatrick","form": "NOVEL","kind": "prose","blurb": "The true story of a transport-rider and his brave bull-terrier in the Transvaal lowveld of the 1880s — a South African classic."},"text": {"title": "Jock of the Bushveld","translator": "Original text (1907)","lang": "eng","short": "Original text"}},{"meta": {"key": "livingstone-missionary-travels","en": "Missionary Travels and Researches in South Africa","color": "#4a5a3a","author": "David Livingstone","form": "HISTORY","kind": "prose","blurb": "Sixteen years in the interior: the Kalahari and Lake Ngami, the Makololo, the journey to Loanda on the west coast, and back across the continent past the Victoria Falls to the Indian Ocean."},"text": {"title": "Missionary Travels and Researches in South Africa","translator": "Original text (1857)","lang": "eng","short": "Original text"}}]}</script>
